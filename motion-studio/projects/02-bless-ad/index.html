<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>BLESS 본부 리크루팅 광고 (15초)</title>
<!--
  방법 ⑤ 광고 만들기 — 가로(1920x1080)/세로(1080x1920) 겸용
  세로로 보기: index.html?w=1080&h=1920   |   세로 렌더: node render.js <이 파일> --vertical

  나레이션(예시, 15초):
   0.0s  "아직도 혼자 영업하세요?"
   3.0s  "DB는 없고, 교육은 없고, 버티는 건 혼자."
   6.5s  "BLESS 본부는 다릅니다. DB 지원, AI 영업 교육, 1:1 팀 코칭까지."
  11.0s  "함께 성장하는 보험설계사 본부, BLESS. 지금 상담 신청하세요."
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg:#0B1020; --ink:#FFFFFF; --sub:#9AA6C3; --gold:#F5C451; --blue:#4D7CFF; --red:#FF5A5F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; height:100%; overflow:hidden; }
  #stage { position:relative; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','WenQuanYi Zen Hei',sans-serif;
    --u: calc(min(var(--W), var(--H)) * 1px / 1080); }   /* 화면 비율과 무관한 기준 단위 */
  .scene { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(36 * var(--u)); }
  .glow { position:absolute; width:calc(1400 * var(--u)); aspect-ratio:1; border-radius:50%; left:50%; top:50%;
    margin:calc(-700 * var(--u)) 0 0 calc(-700 * var(--u)); background:radial-gradient(circle, rgba(77,124,255,.28), transparent 62%); }
  .grid { position:absolute; inset:-200px; background-image:linear-gradient(rgba(255,255,255,.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.04) 2px, transparent 2px); background-size:120px 120px; }

  /* 씬1 */
  .bubble { padding:calc(26 * var(--u)) calc(44 * var(--u)); border-radius:calc(48 * var(--u)) calc(48 * var(--u)) calc(48 * var(--u)) calc(10 * var(--u));
    background:#1B2440; font-size:calc(40 * var(--u)); color:var(--sub); font-weight:600; }
  .big { font-size:calc(120 * var(--u)); font-weight:900; letter-spacing:-0.04em; line-height:1.1; text-align:center; }
  .big span { display:inline-block; }
  .hl { color:var(--gold); }

  /* 씬2 */
  .chips { display:flex; gap:calc(28 * var(--u)); }
  .portrait .chips { flex-direction:column; }
  .chip { position:relative; padding:calc(30 * var(--u)) calc(48 * var(--u)); border-radius:calc(24 * var(--u)); background:#161D33; border:2px solid #2A3557;
    font-size:calc(56 * var(--u)); font-weight:800; white-space:nowrap; text-align:center; }
  .chip .strike { position:absolute; left:6%; top:50%; height:calc(8 * var(--u)); width:88%; background:var(--red); border-radius:4px; transform-origin:left center; }
  .caption { font-size:calc(46 * var(--u)); color:var(--sub); font-weight:600; }

  /* 씬3 */
  .brand-sm { font-size:calc(44 * var(--u)); font-weight:800; letter-spacing:0.3em; color:var(--gold); }
  .cards { display:flex; gap:calc(32 * var(--u)); }
  .portrait .cards { flex-direction:column; }
  .card { width:calc(400 * var(--u)); padding:calc(44 * var(--u)) calc(36 * var(--u)); border-radius:calc(32 * var(--u));
    background:linear-gradient(160deg,#1E2A52,#121A33); border:2px solid #34447A; display:flex; flex-direction:column; align-items:center; gap:calc(22 * var(--u)); }
  .portrait .card { width:calc(760 * var(--u)); flex-direction:row; gap:calc(36 * var(--u)); }
  .icon { width:calc(120 * var(--u)); height:calc(120 * var(--u)); border-radius:50%; display:grid; place-items:center; flex:none; }
  .icon svg { width:55%; height:55%; }
  .card b { font-size:calc(52 * var(--u)); font-weight:900; white-space:nowrap; }
  .card small { display:block; font-size:calc(30 * var(--u)); color:var(--sub); margin-top:calc(8 * var(--u)); }
  .portrait .card .txt { text-align:left; }
  .card .txt { text-align:center; }

  /* 씬4 */
  .logo { font-size:calc(220 * var(--u)); font-weight:900; letter-spacing:-0.02em; line-height:1; }
  .logo span { display:inline-block; }
  .tag { font-size:calc(50 * var(--u)); font-weight:700; color:var(--sub); }
  .cta { position:relative; overflow:hidden; padding:calc(30 * var(--u)) calc(70 * var(--u)); border-radius:999px; background:var(--gold); color:#121212;
    font-size:calc(52 * var(--u)); font-weight:900; }
  .cta .shine { position:absolute; top:0; bottom:0; width:30%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent); }
  .wipe { position:absolute; inset:0; background:var(--gold); z-index:5; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="glow"></div>

  <section class="scene" id="s1">
    <div class="bubble">“팀장님, 이번 달 DB 또 없어요…”</div>
    <div class="big"><span>아직도</span> <span class="hl">혼자</span> <span>영업하세요?</span></div>
  </section>

  <section class="scene" id="s2">
    <div class="chips">
      <div class="chip">DB 없음<div class="strike"></div></div>
      <div class="chip">교육 없음<div class="strike"></div></div>
      <div class="chip">혼자 버티기<div class="strike"></div></div>
    </div>
    <div class="caption">이제 그만 버티세요.</div>
  </section>

  <section class="scene" id="s3">
    <div class="brand-sm">BLESS 본부는 다릅니다</div>
    <div class="cards">
      <div class="card"><div class="icon" style="background:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></div><div class="txt"><b>DB 지원</b><small>고객 만나는 시간부터</small></div></div>
      <div class="card"><div class="icon" style="background:var(--gold)"><svg viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.2L20 9l-4.4 3.8L17 18.5 12 15.6 7 18.5l1.4-5.7L4 9l5.8-.8z"/></svg></div><div class="txt"><b>AI 영업 교육</b><small>스크립트·분석을 AI로</small></div></div>
      <div class="card"><div class="icon" style="background:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.6"/><path d="M2.5 20c.6-3.6 2.9-5.5 5.5-5.5s4.9 1.9 5.5 5.5M14 14.6c2.8-.4 5.6 1.2 6.3 5.4"/></svg></div><div class="txt"><b>1:1 팀 코칭</b><small>혼자 두지 않습니다</small></div></div>
    </div>
  </section>

  <section class="scene" id="s4">
    <div class="wipe"></div>
    <div class="logo"><span>B</span><span>L</span><span>E</span><span>S</span><span>S</span></div>
    <div class="tag">함께 성장하는 보험설계사 본부</div>
    <div class="cta">지금 상담 신청하기 →<div class="shine"></div></div>
  </section>
</div>

<script src="../../engine/motion.js"></script>
<script>
Motion.start({
  width: 1920, height: 1080, duration: 15,
  render(t, M) {
    const { set, prog, key, $, $$, ease } = M;
    const sceneOn = (id, a, b) => set($(id), { o: t >= a && t < b ? 1 : 0 });
    sceneOn('#s1', 0, 3.05); sceneOn('#s2', 3.05, 6.55); sceneOn('#s3', 6.55, 11.05); sceneOn('#s4', 11.05, 99);

    // 배경: 천천히 흐르는 그리드 + 숨쉬는 빛
    set($('.grid'), { x: (t * 30) % 120, y: (t * 18) % 120 });
    set($('.glow'), { s: 1 + Math.sin(t * 1.3) * 0.08 });

    // 씬1: 말풍선 → 단어 하나씩 튀어나오기 → 위로 빠지기
    const b = prog(t, 0.1, 0.6, ease.outBack);
    const b1out = prog(t, 2.5, 2.9, ease.inOutExpo);
    set($('#s1 .bubble'), { s: b, y: (1 - b) * 40 - b1out * 120, o: b ? 1 - b1out : 0 });
    $$('#s1 .big span').forEach((el, i) => {
      const p = prog(t, 0.7 + i * 0.28, 1.2 + i * 0.28, ease.outBack);
      const out = prog(t, 2.6, 3.05, ease.inOutExpo);
      set(el, { y: (1 - p) * 120 - out * 200, s: i === 1 ? 1 + key(t, [[1.6, 0], [1.8, 0.18, 'outQuad'], [2.1, 0]]) : 1, o: p * (1 - out) });
    });

    // 씬2: 고민 칩 3개 등장 → 빨간 줄로 지우기
    $$('#s2 .chip').forEach((el, i) => {
      const p = prog(t, 3.1 + i * 0.3, 3.6 + i * 0.3, ease.outBack);
      const strike = prog(t, 4.6 + i * 0.25, 4.95 + i * 0.25, ease.outExpo);
      const shake = strike > 0 && strike < 1 ? Math.sin(t * 90) * 6 : 0;
      set(el, { s: p, x: shake, o: p ? 1 - strike * 0.55 : 0 });
      set(el.querySelector('.strike'), { sx: strike });
    });
    const c = prog(t, 5.4, 5.9, ease.outCubic);
    set($('#s2 .caption'), { o: c, y: (1 - c) * 30 });

    // 씬3: 브랜드 문구 → 카드 3장 순차 등장 → 아이콘 바운스
    const h = prog(t, 6.6, 7.1, ease.outCubic);
    set($('#s3 .brand-sm'), { o: h, y: (1 - h) * -30, letterSpacing: M.lerp(0.8, 0.3, h) + 'em' });
    $$('#s3 .card').forEach((el, i) => {
      const p = prog(t, 7.3 + i * 0.85, 7.9 + i * 0.85, ease.outBack);
      const out = prog(t, 10.6, 11.05, ease.inOutExpo);
      const dir = M.portrait ? { x: (1 - p) * 500 } : { y: (1 - p) * 300 };
      set(el, { ...dir, s: 1 - out * 0.3, o: p ? Math.min(1, p * 1.5) * (1 - out) : 0 });
      const ip = prog(t, 7.6 + i * 0.85, 8.3 + i * 0.85, ease.outElastic);
      set(el.querySelector('.icon'), { s: ip, r: (1 - ip) * -90 });
    });

    // 씬4: 골드 와이프 → 로고 글자 낙하 → 태그라인 → CTA + 반짝임
    const wipe = key(t, [[11.05, 0], [11.4, 1, 'inOutExpo'], [11.75, 2, 'inOutExpo']]);
    set($('#s4 .wipe'), { clipPath: wipe <= 1 ? `inset(0 ${100 - wipe * 100}% 0 0)` : `inset(0 0 0 ${(wipe - 1) * 100}%)` });
    $$('#s4 .logo span').forEach((el, i) => {
      const p = prog(t, 11.6 + i * 0.07, 12.1 + i * 0.07, ease.outBack);
      set(el, { y: (1 - p) * -260, o: p ? 1 : 0, color: i === 0 ? 'var(--gold)' : '' });
    });
    const tg = prog(t, 12.4, 12.9, ease.outCubic);
    set($('#s4 .tag'), { o: tg, y: (1 - tg) * 24 });
    const ct = prog(t, 12.9, 13.4, ease.outBack);
    set($('#s4 .cta'), { s: ct * (1 + Math.max(0, Math.sin((t - 13.4) * 6)) * 0.04 * (t > 13.4)), o: ct ? 1 : 0 });
    set($('#s4 .shine'), { left: key(t, [[13.6, -40], [14.3, 140, 'inOutQuad']]) + '%' });
  },
});
</script>
</body>
</html>
