completes-takeover-of-li-cycle-battery-recycling-assets/757199/\">Waste Dive<\/a><\/td>\n<\/tr>\n<tr>\n<td>성일하이텍 새만금 공장 블랙매스 습식제련<\/td>\n<td>✅ 보도<\/td>\n<td><a href=\"https://dealsite.co.kr/articles/162957\">딜사이트<\/a><\/td>\n<\/tr>\n<tr>\n<td>재활용 시설 화재 272건(2016)→430건(2024), 2025년 448건<\/td>\n<td>⚠️ 업계 집계(Fire Rover)<\/td>\n<td><a href=\"https://resource-recycling.com/plastics/2025/08/13/fires-at-recycling-sites-on-track-to-reach-record-high/\">Resource Recycling<\/a> — 공개 보도된 건수 기준<\/td>\n<\/tr>\n<tr>\n<td>자기부담금 5만~10만 → 25만 달러 이상<\/td>\n<td>⚠️ 보험 중개사 1인 발언<\/td>\n<td><a href=\"https://www.businessinsurance.com/lithium-batteries-fuel-fires-at-waste-facilities/\">Business Insurance<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025년 화재 피해 약 25억 달러<\/td>\n<td>❓ 컨설턴트 추정<\/td>\n<td>감사된 수치 아님 → 본문 제외<\/td>\n<\/tr>\n<tr>\n<td>성일하이텍·에코프로 회수율<\/td>\n<td>❓ 공개 수치 못 찾음<\/td>\n<td>본문에서 회수율 숫자 없이 서술<\/td>\n<\/tr>\n<tr>\n<td>Redwood Materials 동향<\/td>\n<td>❓ 이번 검색에서 확인 못 함<\/td>\n<td>본문 제외<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용 (8일차 연결 포함)<\/strong>:\n- 국내 폐배터리 발생량은 추정치가 '2만 개'와 '7만 9천 개'로 4배 가까이 달라, 최신 정부 인용 수치를 쓰되 차이를 본문에 밝힘\n- 화재 피해액 25억 달러는 감사된 수치가 아니라 뺌\n- 기업별 회수율은 공개 자료를 못 찾아 숫자를 넣지 않음\n- 8일차의 '자동차 배터리 재활용 시장 262억 달러'는 범위가 넓은 수치라 오늘은 시장 금액 대신 <strong>물량(대수·개수)<\/strong> 중심으로 설명<\/p>"}, {"day": 11, "title": "11일차 — 배터리 재사용(ESS)과 안전: 재사용 배터리는 왜 보험 가입이 어렵나? (2026-10-16)", "md": "<h1>11일차 — 배터리 재사용(ESS)과 안전: 재사용 배터리는 왜 보험 가입이 어렵나? (2026-10-16)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>블랙매스<\/strong>(Black mass).<\/li>\n<li>2027년 말 <strong>50%<\/strong>, 2031년 말 <strong>80%<\/strong>.<\/li>\n<li><strong>Li-Cycle<\/strong>(2025년 5월 파산, 8월 글렌코어 인수).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"보험은 '얼마나 위험한지 알 수 있을 때' 가입이 된다. 재사용 배터리는 '과거를 모르는 중고 배터리'라서 위험을 재기 어렵고, 그래서 보험이 어렵다. 반대로 '배터리 건강 증명'을 해주면 보험이 열린다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>전기차 배터리는 용량이 약 <strong>70~80%<\/strong> 로 떨어지면 차에서는 아쉽지만, <strong>ESS(에너지 저장 장치)<\/strong> 로는 아직 쓸 만하다<\/td>\n<td>달리기 선수는 은퇴해도 걷기 운동은 충분히 할 수 있는 것과 비슷<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>ESS는 <strong>화재 이력<\/strong>이 있다. 한국은 2017년 8월 이후 ESS 화재가 30건 넘게 발생(2022년 1월 기준 33건, 학술 정리). 미국에서도 2025년 1월 대형 ESS 화재<\/td>\n<td>새 배터리로 만든 ESS도 불이 났는데, 중고 배터리라면 걱정이 더 큼<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>한국은 <strong>안전성검사를 통과한 재사용전지만<\/strong> 팔 수 있다. 사용후배터리법은 떼기 전 평가 + <strong>재사용사업자 보험(공제) 의무<\/strong><\/td>\n<td>\"검사받은 중고만 팔아라\" + \"사고 대비 보험 들어라\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 재사용 배터리가 보험에서 어려운 이유 4가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>이유<\/th>\n<th>설명<\/th>\n<th>보험사의 걱정<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 과거를 모른다<\/td>\n<td>그 배터리가 어떻게 충전·방전됐는지, 사고가 있었는지 기록이 흩어져 있음<\/td>\n<td>\"위험을 계산할 데이터가 없다\"<\/td>\n<\/tr>\n<tr>\n<td>② 건강 점수의 기준이 제각각<\/td>\n<td>배터리 건강 점수(SoH)가 같은 80%라도 <strong>측정 방법·기준에 따라 의미가 다름<\/strong><\/td>\n<td>\"80%라는 숫자를 믿어도 되나?\"<\/td>\n<\/tr>\n<tr>\n<td>③ 섞어서 쓴다<\/td>\n<td>서로 다른 차에서 나온, 상태가 다른 배터리를 묶어 ESS를 만듦<\/td>\n<td>약한 하나가 전체를 위험하게 만들 수 있음<\/td>\n<\/tr>\n<tr>\n<td>④ 큰 사고 사례<\/td>\n<td>대형 ESS 화재 한 번에 수천억 원 손해<\/td>\n<td>보험사가 받을 수 있는 한도를 넘을 수 있음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>SoH(State of Health, 배터리 건강 상태)<\/strong> = 새것일 때 대비 지금 저장할 수 있는 양. 100%가 새것, 80%면 처음의 80%만 저장.<\/p>\n<\/blockquote>\n<h2>3. 세계 사례<\/h2>\n<table>\n<thead>\n<tr>\n<th>사례<\/th>\n<th>내용<\/th>\n<th>보험과의 연결<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>미국 모스랜딩 화재<\/strong> (2025년 1월)<\/td>\n<td>캘리포니아 대형 ESS(300MW)에서 화재. 해당 설비 장부가치 약 <strong>4억 달러 전액 손실 처리<\/strong>, 운영사 Vistra는 재산·영업중단 보험 한도 <strong>5억 달러<\/strong>(자기부담금 제외)로 청구<\/td>\n<td>대형 ESS 사고는 <strong>보험 한도를 거의 다 쓰는 규모<\/strong>. 단, 이 설비는 <strong>새 배터리<\/strong>였음 → 재사용 배터리는 더 엄격히 봄<\/td>\n<\/tr>\n<tr>\n<td><strong>영국 Altelium<\/strong><\/td>\n<td>대학 연구에서 출발한 회사. 배터리를 뜯지 않고 상태를 진단하는 도구로 <strong>보험사가 배터리를 보증할 수 있게<\/strong> 해준다고 소개<\/td>\n<td>\"진단 데이터 → 보험 가능\"의 대표 모델 (업체 홍보 자료라 검증 필요)<\/td>\n<\/tr>\n<tr>\n<td><strong>영국 보험사 AXA<\/strong><\/td>\n<td>전기차 배터리에 <strong>'건강 증명서'와 실시간 데이터<\/strong>가 필요하다고 주장<\/td>\n<td>보험사가 원하는 것 = 증거(데이터)<\/td>\n<\/tr>\n<tr>\n<td><strong>국제 기준(UN GTR 22)<\/strong><\/td>\n<td>전기차 배터리는 5년/10만 km까지 80%, 8년/16만 km까지 70% 이상 유지해야 하는 최소 기준<\/td>\n<td>70~80%가 '은퇴 라인'으로 자주 언급되는 근거<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>재사용전지 안전성검사<\/td>\n<td>「전기용품 및 생활용품 안전관리법」 개정으로 <strong>안전성검사를 받은 재사용전지만 판매<\/strong> 가능(2023년 10월 시행으로 보도). 검사기관을 지정해 운영, 제조업체도 요건을 갖추면 검사기관으로 지정 가능<\/td>\n<\/tr>\n<tr>\n<td>ESS 화재 대응<\/td>\n<td>2019년 정부 조사: 배터리 보호 미흡, 운영환경 관리 미흡, 설치 부주의, 통합 보호체계 미흡이 복합 원인. 2022년 안전 강화 대책에서 <strong>사용후 배터리 ESS는 시스템 단위 안전 인증<\/strong>을 요구하는 방향<\/td>\n<\/tr>\n<tr>\n<td>사용후배터리법<\/td>\n<td>떼기 전 성능·안전 평가, 재사용사업자 등록, <strong>보험 또는 공제 가입 의무<\/strong>(6일차). 2027년 시행 예상<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] '어려운 보험'이 '기회'인 이유<\/h2>\n<table>\n<thead>\n<tr>\n<th>기회<\/th>\n<th>설명<\/th>\n<th>설계사가 할 수 있는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 의무보험 시장<\/td>\n<td>재사용사업자는 법으로 보험(공제)에 들어야 함<\/td>\n<td>시행 전 업체 명단 확보, 손보사 상품 출시 동향 파악<\/td>\n<\/tr>\n<tr>\n<td>② '증거' 패키지<\/td>\n<td>보험사는 데이터를 원함<\/td>\n<td>고객사에 <strong>안전성검사 결과, 배터리 건강 이력, 소화 설비, 원격 감시<\/strong> 자료를 정리하게 도와 보험 심사를 통과시킴<\/td>\n<\/tr>\n<tr>\n<td>③ 성능 보증보험<\/td>\n<td>\"이 배터리가 몇 년간 몇 % 이상 유지된다\"는 보증을 보험으로 뒷받침<\/td>\n<td>재사용 배터리 판매업체의 <strong>신뢰 상품<\/strong>으로 제안 (18일차 품질보증보험과 연결)<\/td>\n<\/tr>\n<tr>\n<td>④ 영업중단 손해<\/td>\n<td>모스랜딩처럼 화재로 운영이 멈추면 수익 손실이 큼<\/td>\n<td>재산보험 + <strong>영업중단(휴업)손해<\/strong> 담보를 함께 설계<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"재사용 배터리 ESS를 파는 회사 사장님에게 '보험 가입이 어렵다'는 말 대신 '이 세 가지 자료만 준비하면 보험 심사가 쉬워집니다'라고 말한다면, 그 세 가지는 무엇일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ESS (에너지 저장 장치)<\/td>\n<td>전기를 저장했다가 필요할 때 꺼내 쓰는 대형 배터리 설비<\/td>\n<\/tr>\n<tr>\n<td>SoH (배터리 건강 상태)<\/td>\n<td>새것 대비 지금 저장할 수 있는 양의 비율<\/td>\n<\/tr>\n<tr>\n<td>재사용전지<\/td>\n<td>전기차에서 떼어낸 배터리를 다른 용도로 다시 쓰는 것. 한국은 안전성검사 통과 제품만 판매<\/td>\n<\/tr>\n<tr>\n<td>영업중단(휴업)손해<\/td>\n<td>사고로 영업을 못 해 생긴 수익 손실. 재산 피해와 별도로 보상<\/td>\n<\/tr>\n<tr>\n<td>성능 보증보험<\/td>\n<td>제품이 약속한 성능을 못 내면 보상하는 보험<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>배터리 건강 상태를 뜻하는 영어 약자 3글자는?<\/li>\n<li>재사용 배터리가 보험 가입이 어려운 가장 큰 이유는? (힌트: 과거)<\/li>\n<li>2025년 1월 미국 모스랜딩 ESS 화재 설비는 새 배터리였나, 재사용 배터리였나?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>모스랜딩 2025.1.16 화재, 300MW, 약 4억 달러 손실 처리, 보험 한도 5억 달러(자기부담금 제외)<\/td>\n<td>✅ 회사 공시<\/td>\n<td><a href=\"https://www.sec.gov/Archives/edgar/data/1692819/000169281925000035/vistra-20250331.htm\">Vistra 10-Q(2025.3)<\/a>, <a href=\"https://energy-storage.news/vistra-to-write-off-us400-million-from-moss-landing-bess\">Energy-Storage.news<\/a> — 실제 보험금 지급액은 미공개<\/td>\n<\/tr>\n<tr>\n<td>모스랜딩 설비가 새 배터리(재사용 아님)<\/td>\n<td>⚠️ 간접 확인<\/td>\n<td>공시상 LG 등 제조사 상대 소송, 재사용이라는 언급 없음 → '새 배터리'로 서술하되 퀴즈 정답에 단서<\/td>\n<\/tr>\n<tr>\n<td>한국 ESS 화재 2022년 1월 기준 33건<\/td>\n<td>⚠️ 학술 발표 정리<\/td>\n<td><a href=\"https://www.kais99.org/jkais/springNfall/spring2023/oral/2023_spring_103.pdf\">한국산학기술학회 2023 춘계<\/a> — 2019년 정부 발표는 23건(2019.5 기준)<\/td>\n<\/tr>\n<tr>\n<td>2019년 정부 조사 4대 원인<\/td>\n<td>✅ 보도<\/td>\n<td><a href=\"https://www.metroseoul.co.kr/article/2019061100180\">메트로신문 2019.6<\/a><\/td>\n<\/tr>\n<tr>\n<td>안전성검사 받은 재사용전지만 판매(2023.10 시행)<\/td>\n<td>⚠️ 2022년 사전 보도<\/td>\n<td><a href=\"https://v.daum.net/v/20221011110008211\">다음뉴스 2022.10<\/a>, <a href=\"https://newsseoul.co.kr/news/view/1065585617613826\">뉴스서울<\/a> — 실제 시행일은 법령 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>2022.5 ESS 안전 강화 대책, 사용후 배터리 시스템 단위 인증<\/td>\n<td>✅ 로펌 정리<\/td>\n<td><a href=\"https://www.shinkim.com/kor/media/newsletter/1815?page=129\">법무법인 세종<\/a><\/td>\n<\/tr>\n<tr>\n<td>UN GTR 22: 5년/10만km 80%, 8년/16만km 70%<\/td>\n<td>⚠️ 2차 정리<\/td>\n<td><a href=\"https://evkx.net/de/guides/ev-claims/battery-at-70-to-80-percent-health\">evkx<\/a><\/td>\n<\/tr>\n<tr>\n<td>AXA, 배터리 건강 증명서 요구<\/td>\n<td>⚠️ 과거 보도<\/td>\n<td><a href=\"https://airqualitynews.com/cars-freight-transport/new-research-leads-to-calls-for-ev-battery-health-certificates\">Air Quality News<\/a><\/td>\n<\/tr>\n<tr>\n<td>Altelium, 보험사가 배터리 보증하도록 진단<\/td>\n<td>⚠️ 홍보성 사례<\/td>\n<td><a href=\"https://faraday.ac.uk/success-stories/developing-diagnostic-models-to-warranty-batteries/\">Faraday Institution<\/a><\/td>\n<\/tr>\n<tr>\n<td>ESS 화재보험 손해율·가입률<\/td>\n<td>❓ 공개 자료 못 찾음<\/td>\n<td>본문에서 숫자 없이 서술<\/td>\n<\/tr>\n<tr>\n<td>2027년 7월 관련 제도 시행 언급(2026.10 세미나 보도)<\/td>\n<td>❓ 무슨 제도인지 불명확<\/td>\n<td>본문 제외 (사용후배터리법 시행 시점과 연관 가능, 추후 확인)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 한국 ESS 화재 건수는 집계 시점마다 23건·26건·33건으로 달라, <strong>기준 시점(2022년 1월)을 붙여<\/strong> 33건으로 표기\n- 모스랜딩 사례는 재사용 배터리 사고가 아니므로 \"새 배터리였다\"를 명시해 오해를 막음\n- ESS 화재보험 손해율은 찾지 못해 숫자를 넣지 않음\n- 재사용전지 판매 규제 시행일은 사전 보도 기준이라 ⚠️로 표시<\/p>"}, {"day": 12, "title": "12일차 — 재활용 소재(철·알루미늄·플라스틱): 재생 플라스틱 의무가 왜 중요한가? (2026-10-17)", "md": "<h1>12일차 — 재활용 소재(철·알루미늄·플라스틱): 재생 플라스틱 의무가 왜 중요한가? (2026-10-17)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>SoH<\/strong>(State of Health, 배터리 건강 상태).<\/li>\n<li><strong>과거(사용 이력)를 모른다<\/strong> → 위험을 계산할 데이터가 없다.<\/li>\n<li><strong>새 배터리<\/strong>였다. 재사용 배터리가 아니었는데도 큰 화재가 났기 때문에, 재사용 배터리는 더 엄격하게 봅니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"폐차에서 철은 이미 '돈'이고, 알루미늄은 '큰 돈'이고, 플라스틱은 '골칫거리'였다. 유럽이 재생 플라스틱 사용을 법으로 강제하면서, 골칫거리가 '팔리는 원료'로 바뀌기 시작했다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>철·알루미늄은 <strong>이미 잘 재활용<\/strong>된다. 특히 알루미늄은 새로 만들 때보다 <strong>에너지를 약 90~95% 덜<\/strong> 쓴다<\/td>\n<td>금속은 녹여서 다시 쓰기 쉽고 값도 나간다<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>플라스틱은 종류가 섞이고 값이 싸서 <strong>재활용이 잘 안 됐다<\/strong> → 파쇄잔재물(ASR)로 매립·소각<\/td>\n<td>2일차의 '마지막 5%' 문제의 주범<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>유럽은 새 차에 <strong>재생 플라스틱 15%(2032년 9월~) → 25%(2036년 9월~)<\/strong> 를 의무화. 그중 일부는 <strong>폐차에서 나온 플라스틱<\/strong>이어야 함<\/td>\n<td>\"재활용 플라스틱을 꼭 사서 써라\" → 폐차 플라스틱에 <strong>수요<\/strong>가 생김<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 폐차 소재별 '성적표'<\/h2>\n<table>\n<thead>\n<tr>\n<th>소재<\/th>\n<th>재활용 상태<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>철<\/strong><\/td>\n<td>잘 됨<\/td>\n<td>자석으로 쉽게 골라낼 수 있고, 고철값이 있음. 폐차 보상금의 대부분이 고철값(2일차)<\/td>\n<\/tr>\n<tr>\n<td><strong>알루미늄<\/strong><\/td>\n<td>잘 됨, 값도 높음<\/td>\n<td>새로 만들려면 전기를 엄청 써야 해서, 재활용하면 에너지 약 90~95% 절감<\/td>\n<\/tr>\n<tr>\n<td><strong>구리 등 비철금속<\/strong><\/td>\n<td>잘 됨<\/td>\n<td>값이 비싸서 분리할 이유가 충분<\/td>\n<\/tr>\n<tr>\n<td><strong>플라스틱<\/strong><\/td>\n<td>잘 안 됨<\/td>\n<td>종류가 수십 가지로 섞여 있고, 새 플라스틱이 싸서 재생 플라스틱이 경쟁력이 없었음<\/td>\n<\/tr>\n<tr>\n<td><strong>유리·고무<\/strong><\/td>\n<td>잘 안 됨<\/td>\n<td>값이 낮아 분리 비용이 더 듦(2일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>재생원료(재생 소재)<\/strong> = 버려진 제품에서 회수해 다시 원료로 만든 것. '버려진 뒤'에 나온 것만 인정하는 경우가 많습니다(공장에서 나온 자투리는 제외).<\/p>\n<\/blockquote>\n<h2>3. 세계: 유럽이 판을 바꾸다<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>규정<\/td>\n<td><strong>(EU) 2026/1738<\/strong>, 2026년 7월 관보 게재, <strong>8월 13일 발효<\/strong>(4일차)<\/td>\n<\/tr>\n<tr>\n<td>재생 플라스틱<\/td>\n<td>형식승인 기준 <strong>2032년 9월 1일부터 15%<\/strong>, <strong>2036년 9월 1일부터 25%<\/strong>(무게 기준)<\/td>\n<\/tr>\n<tr>\n<td>폐차 출신 비율<\/td>\n<td>재생 플라스틱 중 <strong>최소 20%<\/strong> 는 폐차·중고 부품에서 회수한 것이어야 한다고 보도 (정확한 문구는 원문 확인 필요)<\/td>\n<\/tr>\n<tr>\n<td>철·알루미늄<\/td>\n<td>유럽 집행위가 <strong>2033년 8월까지<\/strong> 재생 철강·알루미늄 최소 비율을 정하기로 함<\/td>\n<\/tr>\n<tr>\n<td>인정 범위<\/td>\n<td>'소비 후(버려진 뒤)' 재생원료만 인정<\/td>\n<\/tr>\n<tr>\n<td>업계 반응<\/td>\n<td>부품업체들이 재생 플라스틱 확보 경쟁 시작<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 연결 고리: 1일차에서 \"15%(약 6년 후), 25%(약 10년 후)\"라고 배웠는데, 정확히는 <strong>2032년 9월, 2036년 9월<\/strong>부터 새로 승인받는 차종에 적용됩니다.<\/p>\n<\/blockquote>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>자동차 재생원료 의무<\/td>\n<td><strong>아직 확인된 의무 비율 없음<\/strong>(이번 조사 기준)<\/td>\n<\/tr>\n<tr>\n<td>다른 분야<\/td>\n<td>2026년 PET(음료병 등) 재생원료 10% 의무, 화장품 용기 등 PE·PP로 확대 예고. 정부 목표: 2030년 재생원료 200만 톤 사용<\/td>\n<\/tr>\n<tr>\n<td>의미<\/td>\n<td>한국 자동차·부품 회사도 <strong>유럽에 수출하려면<\/strong> 유럽 기준을 맞춰야 함 → 국내 폐차 플라스틱에도 수요가 생길 가능성<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 소재가 '돈'이 되면 위험도 커진다<\/h2>\n<table>\n<thead>\n<tr>\n<th>위험<\/th>\n<th>실제 사례<\/th>\n<th>보험 기회<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 파쇄장 화재<\/td>\n<td>2025년 2월 미국 뉴저지 캠던의 대형 고철 파쇄 시설에서 큰 화재, <strong>리튬이온 배터리<\/strong>가 원인으로 추정. 2026년 5월 또 화재로 운영 중단. 2025년 5월 독일 올덴부르크 고철장 화재에 소방관 230명 이상 투입, 차량 수백 대 소실<\/td>\n<td>파쇄·고철장 <strong>화재보험 + 영업중단손해<\/strong>. 배터리 분리 절차를 갖춘 곳이 보험 조건에서 유리<\/td>\n<\/tr>\n<tr>\n<td>② 주민·환경 피해<\/td>\n<td>캠던 화재 때 검은 연기로 주민 약 100명 대피, 시 의회가 운영 재개 여부 심사<\/td>\n<td><strong>환경오염·제3자 배상책임보험<\/strong>. 사고 후 영업 허가까지 흔들릴 수 있음<\/td>\n<\/tr>\n<tr>\n<td>③ 원료 품질 분쟁<\/td>\n<td>재생 플라스틱이 '폐차 출신'인지, 규격에 맞는지 증명 필요<\/td>\n<td>재생원료 공급업체의 <strong>제품 배상·품질 보증<\/strong> 관련 보험(18일차)<\/td>\n<\/tr>\n<tr>\n<td>④ 가격 변동<\/td>\n<td>고철·알루미늄 시세에 따라 폐차장 수익이 크게 흔들림<\/td>\n<td>보험으로 막기 어려운 위험 → 고객 상담 시 \"보험으로 되는 것/안 되는 것\" 구분이 신뢰를 줌<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"폐차 플라스틱이 '쓰레기'에서 '팔리는 원료'가 되면, 폐차장 사장님의 창고에는 무엇이 더 많이 쌓일까? 그것은 어떤 새로운 위험을 만들까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>재생원료<\/td>\n<td>버려진 제품에서 회수해 다시 만든 원료<\/td>\n<\/tr>\n<tr>\n<td>소비 후(post-consumer)<\/td>\n<td>소비자가 쓰고 버린 뒤 나온 것. 유럽 재생 플라스틱 의무에서 인정하는 기준<\/td>\n<\/tr>\n<tr>\n<td>닫힌 순환(closed loop)<\/td>\n<td>자동차에서 나온 소재를 다시 자동차에 쓰는 것<\/td>\n<\/tr>\n<tr>\n<td>파쇄장(슈레더)<\/td>\n<td>차체를 잘게 부숴 금속을 골라내는 시설. 화재 위험이 큼<\/td>\n<\/tr>\n<tr>\n<td>형식승인<\/td>\n<td>새 차 모델이 판매 전에 받는 정부 승인. 유럽 재생 플라스틱 의무는 이 시점을 기준으로 적용<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>알루미늄을 재활용하면 새로 만들 때보다 에너지를 대략 몇 % 덜 쓰나?<\/li>\n<li>유럽 재생 플라스틱 의무 비율은 2032년 9월부터 몇 %, 2036년 9월부터 몇 %?<\/li>\n<li>고철 파쇄장 화재의 원인으로 자주 지목되는 것은?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>규정 2026/1738, 7월 관보, 8월 13일 발효<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://euromoulders.org/2026/07/eu-elvr-now-published-in-the-eu-official-journal/\">Euromoulders<\/a>, <a href=\"https://just-auto.com/news/eu-end-of-life-vehicle-regulation-takes-effect/\">Just Auto<\/a>, 4일차<\/td>\n<\/tr>\n<tr>\n<td>재생 플라스틱 15%(2032.9.1~), 25%(2036.9.1~) 형식승인 기준<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://just-auto.com/news/eu-end-of-life-vehicle-regulation-takes-effect/\">Just Auto<\/a>, <a href=\"https://www.automotivelogistics.media/sustainability/eu-end-of-life-vehicles-regulation-enters-into-force/2724484\">Automotive Logistics<\/a><\/td>\n<\/tr>\n<tr>\n<td>재생 플라스틱 중 최소 20%는 폐차 출신<\/td>\n<td>⚠️ 보도 간 문구 차이<\/td>\n<td><a href=\"https://bkv-gmbh.de/news-reader-4/eu-end-of-life-vehicles-regulation-adopted-by-plenary.html\">BKV<\/a>, <a href=\"https://www.freemalaysiatoday.com/category/world/2025/12/12/eu-agrees-recycled-plastic-targets-for-cars\">Free Malaysia Today<\/a> — 관보 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>철·알루미늄 재생 비율은 2033년 8월까지 정함<\/td>\n<td>⚠️ 2차 보도<\/td>\n<td>Just Auto<\/td>\n<\/tr>\n<tr>\n<td>소비 후 재생원료만 인정<\/td>\n<td>⚠️ 업계 발표자 인용<\/td>\n<td><a href=\"https://www.plasticstoday.com/automotive-mobility/automotive-suppliers-race-to-meet-eu-recycled-plastics-mandate\">PlasticsToday<\/a><\/td>\n<\/tr>\n<tr>\n<td>알루미늄 재활용 에너지 약 90~95% 절감<\/td>\n<td>✅ 복수 출처(범위)<\/td>\n<td><a href=\"https://www.recycling-magazine.com/?p=34110\">Recycling Magazine<\/a>, <a href=\"https://www.automotiveworld.com/news-releases/novelis-expands-aluminium-recycling-in-the-automotive-industry\">Novelis<\/a> — 기준에 따라 90%/95%로 다름<\/td>\n<\/tr>\n<tr>\n<td>한국 PET 재생원료 10%(2026), 2030년 재생원료 200만 톤<\/td>\n<td>⚠️ 보도<\/td>\n<td><a href=\"https://cosinkorea.com/mobile/article.html?no=57343\">코스인코리아<\/a><\/td>\n<\/tr>\n<tr>\n<td>한국 자동차 재생원료 의무 없음<\/td>\n<td>❓ '못 찾음'이지 '없음' 확인 아님<\/td>\n<td>본문에 \"확인된 의무 없음(이번 조사 기준)\"으로 표현<\/td>\n<\/tr>\n<tr>\n<td>캠던 EMR 2025.2 화재, 리튬이온 배터리 추정, 주민 약 100명 대피, 2026.5 재화재<\/td>\n<td>✅ 복수 보도<\/td>\n<td><a href=\"https://www.argusmedia.com/pt/news-and-insights/latest-market-news/2661286-fire-damages-emr-s-nj-shredding-facility\">Argus<\/a>, <a href=\"https://www.1strespondernews.com/news/031725128/camden-4th-alarm-rages-for-hours-with-smoke-plume-seen-for-miles\">1st Responder News<\/a>, <a href=\"https://whyy.org/articles/camden-emr-scrap-metal-fire-shutdown/\">WHYY<\/a><\/td>\n<\/tr>\n<tr>\n<td>독일 올덴부르크 고철장 화재 소방관 230명+<\/td>\n<td>✅ 보도<\/td>\n<td><a href=\"https://www.wam.ae/en/article/15klcyu-over-230-firefighters-battle-large-fire-german\">WAM<\/a><\/td>\n<\/tr>\n<tr>\n<td>철강 전기로 재활용 에너지·탄소 절감 수치<\/td>\n<td>❓ 이번 검색에서 못 찾음<\/td>\n<td>본문에서 수치 없이 서술<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용 (1·4일차 보완)<\/strong>:\n- 1일차 \"15%(약 6년 후), 25%(약 10년 후)\"를 <strong>2032년 9월 1일, 2036년 9월 1일(형식승인 기준)<\/strong> 으로 구체화\n- '폐차 출신 20%'는 보도마다 '재생 플라스틱의 20%'와 '재생 목표의 20%'로 문구가 달라 ⚠️로 표시\n- 알루미늄 에너지 절감은 단일 수치(95%) 대신 <strong>90~95% 범위<\/strong>로 표기\n- 철강 재활용 효과 수치는 근거를 못 찾아 뺌<\/p>"}, {"day": 13, "title": "13일차 — 탄소·ESG와 자동차 재활용: 보험사 ESG 평가와 어떻게 연결되나? (2026-10-18)", "md": "<h1>13일차 — 탄소·ESG와 자동차 재활용: 보험사 ESG 평가와 어떻게 연결되나? (2026-10-18)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>약 90~95%<\/strong>. 기준에 따라 90%, 95%로 다르게 소개됩니다.<\/li>\n<li>2032년 9월부터 <strong>15%<\/strong>, 2036년 9월부터 <strong>25%<\/strong>.<\/li>\n<li><strong>리튬이온 배터리<\/strong>. 고철 더미에 섞여 들어온 배터리가 찌그러지면서 불이 납니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"보험사가 내는 탄소의 대부분은 사무실이 아니라 '보험금으로 고쳐주는 차'에서 나온다. 그래서 '어떻게 고치느냐(새 부품 vs 수리 vs 재활용 부품)'가 보험사 ESG 성적표가 된다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>ESG<\/strong> = 환경(E)·사회(S)·지배구조(G). 투자자와 정부가 기업을 \"돈만 버는지, 책임 있게 버는지\"로 평가하는 기준<\/td>\n<td>회사의 '착한 정도 성적표'<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>보험사의 탄소는 대부분 <strong>스코프 3<\/strong>(가치사슬, 남이 내지만 내 사업 때문에 생긴 탄소)에 있다. 자동차보험에서는 <strong>사고 수리<\/strong>가 큰 부분<\/td>\n<td>보험사 건물 전기보다, 보험금으로 새 범퍼를 만들고 운송하고 칠하는 탄소가 훨씬 큼<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>탄소 순서: 일반적으로 <strong>수리 &lt; 재활용 부품 &lt; 새 부품<\/strong>. 그래서 해외 보험사는 <strong>중고·재활용 부품 수리<\/strong>를 늘리고, 수리 탄소를 <strong>측정하는 도구<\/strong>까지 쓴다<\/td>\n<td>\"고칠 수 있으면 고치고, 바꿔야 하면 재활용 부품으로\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 스코프 1·2·3 쉽게 보기<\/h2>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>뜻<\/th>\n<th>보험사 예시<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>스코프 1<\/td>\n<td>회사가 <strong>직접<\/strong> 태워서 낸 탄소<\/td>\n<td>회사 차량 기름<\/td>\n<\/tr>\n<tr>\n<td>스코프 2<\/td>\n<td>회사가 <strong>산 전기·열<\/strong>에서 나온 탄소<\/td>\n<td>본사 건물 전기<\/td>\n<\/tr>\n<tr>\n<td>스코프 3<\/td>\n<td>회사 <strong>밖<\/strong>에서 나왔지만 회사 사업과 연결된 탄소<\/td>\n<td><strong>보험금으로 하는 자동차 수리<\/strong>, 투자한 회사의 탄소<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 해외 업계 자료는 보험사 운영 탄소의 <strong>대부분이 보상(클레임) 처리<\/strong> 과정에서 나온다고 설명합니다(업체 자료라 수치는 검증 필요).<\/p>\n<\/blockquote>\n<h2>3. 세계는 어떻게 하나<\/h2>\n<table>\n<thead>\n<tr>\n<th>사례<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>독일 알리안츠<\/strong> (2024년 4월~)<\/td>\n<td>전손차에서 떼어낸 <strong>인증 중고부품<\/strong> 사용을 권장하기 시작<\/td>\n<\/tr>\n<tr>\n<td><strong>수리 탄소 측정 도구<\/strong><\/td>\n<td>Solera의 'Sustainable Estimatics'(보험 수리 견적에 CO2를 함께 계산), 'Eco Repair Score'(수리 탄소 점수) 등 → 보험사가 <strong>스코프 3를 숫자로 관리<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>유럽 '수리 조항'<\/strong>(2024)<\/td>\n<td>범퍼·헤드램프 같은 외관 부품을 순정사가 아닌 회사도 만들 수 있게 열어둠 → 대체·재활용 부품 선택지 확대<\/td>\n<\/tr>\n<tr>\n<td><strong>일본 보험사<\/strong> (5일차)<\/td>\n<td>재활용 부품 권장, 폐차 부품 회수 → 환경성 사례집에 수록<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>친환경 부품 특약<\/td>\n<td>현대해상 법인차 <strong>중고부품 수리 조건 자차 8% 할인<\/strong>(2019), 자차 가입자 특약 인지도 18%(3일차)<\/td>\n<\/tr>\n<tr>\n<td>탄소 감축 효과<\/td>\n<td>국내 보험사가 중고부품 수리로 <strong>CO2를 얼마나 줄였는지 공개한 수치는 찾지 못함<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ESG 공시 의무화<\/td>\n<td>금융위: <strong>2028년부터<\/strong> 자산 10조 원 이상 코스피 상장사부터 사업보고서로 지속가능성 법정 공시, 2029년 5조 원 이상으로 확대 계획, <strong>2030년부터 제3자 인증<\/strong> 의무(2026년 8월 보도 기준)<\/td>\n<\/tr>\n<tr>\n<td>보험사 영향<\/td>\n<td>대형 상장 손보사는 공시 대상에 들어갈 가능성이 큼 → <strong>수리·부품 탄소 관리<\/strong>가 공시 항목과 연결될 수 있음 (보험업 별도 기준은 미확인)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] ESG를 영업 언어로 바꾸기<\/h2>\n<table>\n<thead>\n<tr>\n<th>대상<\/th>\n<th>그들의 ESG 고민<\/th>\n<th>설계사가 줄 수 있는 것<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 보험사(원수사)<\/td>\n<td>스코프 3 탄소를 줄여야 ESG 평가·공시에 유리<\/td>\n<td>재활용 부품 수리를 늘리는 <strong>정비소·폐차장 네트워크<\/strong> 제안 → 보험사가 숫자로 자랑할 수 있는 실적<\/td>\n<\/tr>\n<tr>\n<td>② 법인 고객(렌터카·운수·관공서)<\/td>\n<td>자기 회사 ESG 보고서에 '친환경 차량 관리'를 쓰고 싶음<\/td>\n<td><strong>친환경부품 수리 조건 할인 상품<\/strong> 안내 + \"수리 때 재활용 부품 ○건 사용\" 같은 기록 정리 지원<\/td>\n<\/tr>\n<tr>\n<td>③ 폐차장·재활용 업체<\/td>\n<td>대기업 협력사가 되려면 ESG 증빙 요구받음<\/td>\n<td><strong>환경·안전 보험 가입 증빙<\/strong>이 ESG 평가 자료가 됨 (19일차)<\/td>\n<\/tr>\n<tr>\n<td>④ 개인 고객<\/td>\n<td>\"환경에도 좋고 돈도 돌려받는다\"<\/td>\n<td>대체부품 25% 환급(3일차) + 친환경 특약 → <strong>'착한 선택이 이득'<\/strong> 화법<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"법인 고객(예: 렌터카 회사) 담당자에게 '보험료 할인'과 'ESG 보고서에 쓸 숫자', 둘 중 무엇이 더 설득력 있을까? 회사 규모에 따라 답이 달라질까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ESG<\/td>\n<td>환경·사회·지배구조. 기업의 책임 경영 평가 기준<\/td>\n<\/tr>\n<tr>\n<td>스코프 3<\/td>\n<td>회사 밖 가치사슬에서 나오는 간접 탄소. 보험사는 수리·투자 탄소가 핵심<\/td>\n<\/tr>\n<tr>\n<td>CO2e(이산화탄소 환산량)<\/td>\n<td>여러 온실가스를 이산화탄소 기준으로 바꿔 더한 양<\/td>\n<\/tr>\n<tr>\n<td>지속가능성 공시<\/td>\n<td>기업이 ESG 정보를 공식 보고서로 공개하는 것. 한국은 2028년부터 단계적 의무화 예정<\/td>\n<\/tr>\n<tr>\n<td>그린워싱<\/td>\n<td>실제보다 친환경인 척 부풀리는 것. 공시 의무화의 주요 감시 대상<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>보험사 탄소 배출 중, 보험금으로 하는 자동차 수리는 스코프 몇에 해당하나?<\/li>\n<li>일반적으로 탄소가 가장 적게 나오는 수리 방법은? (새 부품 교체 / 재활용 부품 교체 / 수리)<\/li>\n<li>한국 지속가능성 공시 의무화는 몇 년부터 시작될 예정인가?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>보험사 스코프 3에 차량 수리 포함, 가장 추적이 어려움<\/td>\n<td>⚠️ 업계 매체<\/td>\n<td><a href=\"https://collisionrepairmag.com/carbon-in-claims-crm-23-4\">Collision Repair Mag<\/a><\/td>\n<\/tr>\n<tr>\n<td>보상 처리가 보험사 운영 탄소의 대부분<\/td>\n<td>⚠️ 업체(Guidewire) 블로그<\/td>\n<td><a href=\"https://www.guidewire.com/resources/blog/general-interest/hands-on-sustainability-how-insurers-drive-circularity-in-claims-management\">Guidewire<\/a> — 수치 검증 안 됨, 본문에 '업체 자료' 명시<\/td>\n<\/tr>\n<tr>\n<td>탄소: 수리 &lt; 중고부품 &lt; 새 부품<\/td>\n<td>⚠️ 업체 자료<\/td>\n<td>같은 출처 — \"일반적으로\"로 완화<\/td>\n<\/tr>\n<tr>\n<td>알리안츠 2024.4 인증 중고부품 권장<\/td>\n<td>⚠️ 업체 블로그 인용<\/td>\n<td>같은 출처 — 알리안츠 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>Solera Sustainable Estimatics, 스코프 3 측정<\/td>\n<td>✅ EU 순환경제 플랫폼<\/td>\n<td><a href=\"https://circulareconomy.europa.eu/platform/fr/node/8019\">EU Circular Economy Platform<\/a><\/td>\n<\/tr>\n<tr>\n<td>유럽 2024 수리 조항(외관 부품 개방)<\/td>\n<td>⚠️ 업체 블로그 인용<\/td>\n<td>Guidewire — 법령 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>현대해상 2019 법인차 중고부품 8% 할인<\/td>\n<td>✅ 보도(과거)<\/td>\n<td><a href=\"https://www.sateconomy.co.kr/news/view/179589447115436\">시사경제<\/a> — 현재 판매 여부 미확인(3일차와 동일)<\/td>\n<\/tr>\n<tr>\n<td>국내 보험사 중고부품 CO2 감축량<\/td>\n<td>❓ 공개 자료 못 찾음<\/td>\n<td>본문에 \"찾지 못함\" 명시<\/td>\n<\/tr>\n<tr>\n<td>ESG 공시 2028년 10조 원 이상 코스피, 2029년 5조, 2030 제3자 인증, 초기 3년 면책<\/td>\n<td>⚠️ 언론 보도(2026.8)<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2026082015210336745\">MTN<\/a> — 금융위 보도자료 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>보험업 별도 공시 기준<\/td>\n<td>❓ 미확인<\/td>\n<td>본문에 \"미확인\" 표기<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- \"수리 &lt; 재활용 부품 &lt; 새 부품\" 탄소 순서는 업체 자료라 <strong>\"일반적으로\"<\/strong> 로 표현을 낮춤\n- 보상 처리 탄소 비중은 구체 숫자 없이 \"대부분이라고 설명(업체 자료)\"으로만 표기\n- ESG 공시 대상 기준은 2월 의견안(30조 원)과 7월 최종안(10조 원)이 달라, <strong>최신 보도(10조 원)<\/strong> 기준으로 쓰고 확정 여부는 ⚠️\n- 국내 탄소 감축 수치는 없어서 만들지 않음<\/p>"}, {"day": 14, "title": "14일차 — 2주차 복습 퀴즈: 시장과 플레이어 한 장으로 (2026-10-19)", "md": "<h1>14일차 — 2주차 복습 퀴즈: 시장과 플레이어 한 장으로 (2026-10-19)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>스코프 3<\/strong>(회사 밖 가치사슬에서 나오는 간접 탄소).<\/li>\n<li><strong>수리<\/strong>(고쳐서 쓰기). 일반적으로 수리 &lt; 재활용 부품 &lt; 새 부품 순으로 탄소가 늘어납니다.<\/li>\n<li><strong>2028년<\/strong>(자산 10조 원 이상 코스피 상장사부터, 2026년 8월 보도 기준).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 15분 (퀴즈 포함) · 오늘의 한 줄: <strong>\"2주차의 결론: 폐차 시장은 커지고(숫자는 범위로), 거인들은 보험사 물량으로 자라며, 배터리·재생원료·ESG가 새 시장을 만든다. 그리고 새 시장마다 '새 위험'이 따라온다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 2주차를 3줄로<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>배운 날<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>세계 자동차 재활용 시장은 2025년 <strong>약 890억~1,055억 달러<\/strong>. 숫자는 조사기관마다 다르니 <strong>범위 + 출처<\/strong>로 말하기<\/td>\n<td>8일차<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>미국 거인(Copart·IAA·LKQ)은 <strong>보험사 전손차<\/strong>를 기반으로 성장. 보험사는 사고차를 <strong>파는 쪽<\/strong>이자 부품값을 <strong>내는 쪽<\/strong><\/td>\n<td>9일차<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>새 시장 3개: <strong>폐배터리<\/strong>(재활용·재사용), <strong>재생원료<\/strong>(유럽 플라스틱 의무), <strong>ESG<\/strong>(스코프 3 수리 탄소). 셋 다 <strong>화재·배상·공시<\/strong> 위험을 동반<\/td>\n<td>10~13일차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 한 장 지도: 2주차 시장과 보험 기회<\/h2>\n<table>\n<thead>\n<tr>\n<th>시장<\/th>\n<th>핵심 숫자·사실<\/th>\n<th>생기는 위험<\/th>\n<th>보험 기회<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>차량 재활용 전체<\/td>\n<td>2025년 약 890억~1,055억 달러, 연 6~13% 성장 전망<\/td>\n<td>물량 증가 = 사고 증가<\/td>\n<td>폐차장 패키지 보험<\/td>\n<\/tr>\n<tr>\n<td>사고차 경매·부품<\/td>\n<td>미국 전손 비율 약 24%(2025)<\/td>\n<td>경매·보관 중 파손·화재<\/td>\n<td>보관자 배상, 화재보험<\/td>\n<\/tr>\n<tr>\n<td>폐배터리 재활용<\/td>\n<td>유럽 리튬 회수 2027년 말 50% → 2031년 말 80%<\/td>\n<td>재활용 시설 화재 급증(미국·캐나다 2024년 430건)<\/td>\n<td>화재보험(설비 조건부), 운송 배상<\/td>\n<\/tr>\n<tr>\n<td>배터리 재사용(ESS)<\/td>\n<td>70~80% 건강 상태에서 은퇴 → ESS<\/td>\n<td>과거 이력 불명, 대형 화재(모스랜딩)<\/td>\n<td>재사용사업자 의무보험, 성능 보증, 휴업손해<\/td>\n<\/tr>\n<tr>\n<td>재생 소재<\/td>\n<td>유럽 재생 플라스틱 15%(2032.9) → 25%(2036.9)<\/td>\n<td>파쇄장 화재, 주민 피해<\/td>\n<td>환경·제3자 배상<\/td>\n<\/tr>\n<tr>\n<td>ESG<\/td>\n<td>한국 지속가능성 공시 2028년~<\/td>\n<td>그린워싱 논란<\/td>\n<td>친환경 수리 특약, 법인 ESG 기록 지원<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. 2주차 복습 퀴즈 15문항 (정답은 맨 아래)<\/h2>\n<p><strong>[시장 숫자] 8일차<\/strong>\n1. 시장 규모를 말할 때 가장 안전한 방법은? (숫자 하나 / 범위 + 출처)\n2. 2025년 미국 승용·경차 평균 차령은?\n3. 연 성장률 12%면 시장이 2배가 되는 데 대략 몇 년?<\/p>\n<p><strong>[기업] 9일차<\/strong>\n4. Copart·IAA는 사고차를 직접 사서 파나, 위탁 판매하나?\n5. IAA를 2023년 인수한 회사는?\n6. 2025년 미국 보험 청구 중 전손 비율은 대략 몇 %?<\/p>\n<p><strong>[배터리] 10·11일차<\/strong>\n7. 폐배터리를 부숴 만든 '금속이 섞인 검은 가루'는?\n8. 2025년 파산 후 글렌코어에 인수된 북미 배터리 재활용 회사는?\n9. 배터리 건강 상태를 뜻하는 영어 약자는?\n10. 재사용 배터리가 보험 가입이 어려운 가장 큰 이유는?<\/p>\n<p><strong>[소재·ESG] 12·13일차<\/strong>\n11. 알루미늄 재활용 시 에너지 절감은 대략 몇 %?\n12. 유럽 재생 플라스틱 의무: 2032년 9월 몇 %, 2036년 9월 몇 %?\n13. 고철 파쇄장 화재의 원인으로 자주 지목되는 것은?\n14. 보험금으로 하는 자동차 수리 탄소는 스코프 몇?\n15. 한국 지속가능성 공시 의무화 시작 연도는?<\/p>\n<blockquote>\n<p>채점 기준: 12개 이상 = 3주차(보험 접점)로 진행 / 8~11개 = 틀린 날만 다시 보기 / 7개 이하 = 9일차·11일차부터 다시 보기<\/p>\n<\/blockquote>\n<h2>4. [보험 포인트] 3주차로 가는 다리<\/h2>\n<p>2주차는 \"어떤 시장이 있나\"였고, 3주차는 <strong>\"그 시장에 어떤 보험이 들어가나\"<\/strong> 입니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>3주차 강의<\/th>\n<th>2주차에서 넘어온 질문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>15일차 손해보험 기초<\/td>\n<td>재산·배상·휴업손해는 각각 무엇을 보상하나?<\/td>\n<\/tr>\n<tr>\n<td>16일차 전손·잔존물<\/td>\n<td>미국처럼 잔존물 회수액을 높이려면 한국에선 무엇이 필요할까? (9일차)<\/td>\n<\/tr>\n<tr>\n<td>17일차 친환경부품 특약<\/td>\n<td>스코프 3 탄소를 줄이는 특약을 어떻게 설명할까? (13일차)<\/td>\n<\/tr>\n<tr>\n<td>18일차 재제조 부품 보증보험<\/td>\n<td>재생원료·재사용 배터리의 '품질 증명'을 보험이 어떻게 뒷받침할까? (11·12일차)<\/td>\n<\/tr>\n<tr>\n<td>19일차 폐차장 보험<\/td>\n<td>파쇄장 화재·주민 피해에 맞는 보험 조합은? (12일차)<\/td>\n<\/tr>\n<tr>\n<td>20일차 배터리 위험 보험<\/td>\n<td>재사용사업자 의무보험은 어떤 담보가 핵심일까? (6·11일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"2주차에서 본 6개 시장 중, <strong>내가 이미 아는 고객<\/strong>(개인·법인·사업장)과 가장 가까운 시장은 어디인가? 그 고객에게 첫 질문으로 무엇을 물어볼까?\"<\/p>\n<\/blockquote>\n<h2>5. 꼭 기억할 용어 5개 (2주차 최다 등장)<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CAGR(연평균 성장률)<\/td>\n<td>매년 평균 몇 %씩 커지는지<\/td>\n<\/tr>\n<tr>\n<td>위탁 판매<\/td>\n<td>직접 사지 않고 대신 팔아주고 수수료를 받는 방식(Copart·IAA)<\/td>\n<\/tr>\n<tr>\n<td>블랙매스<\/td>\n<td>폐배터리를 부순 검은 가루. 금속 '광석'<\/td>\n<\/tr>\n<tr>\n<td>SoH<\/td>\n<td>배터리 건강 상태. 재사용 판단의 기준<\/td>\n<\/tr>\n<tr>\n<td>스코프 3<\/td>\n<td>회사 밖 가치사슬 탄소. 보험사는 수리 탄소가 핵심<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6. 1분 퀴즈 (답은 내일 강의 맨 위에) — 3주차 맛보기<\/h2>\n<ol>\n<li>손해보험에서 '재산 피해'와 '남에게 끼친 피해'를 보상하는 보험은 각각 무엇일까?<\/li>\n<li>사고로 문을 닫아 생긴 수익 손실을 보상하는 담보 이름은? (11일차 힌트)<\/li>\n<li>보험금을 준 뒤 보험사 소유가 된 사고차를 무엇이라 하나?<\/li>\n<\/ol>\n<hr />\n<h2>복습 퀴즈 정답<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>정답<\/th>\n<th>배운 날<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>범위 + 출처<\/td>\n<td>8일차<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>12.8년<\/td>\n<td>8일차<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>약 6년 (72 ÷ 12)<\/td>\n<td>8일차<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>위탁 판매(수수료)<\/td>\n<td>9일차<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>RB Global(옛 Ritchie Bros.)<\/td>\n<td>9일차<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>약 24%<\/td>\n<td>9일차<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>블랙매스<\/td>\n<td>10일차<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Li-Cycle<\/td>\n<td>10일차<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>SoH<\/td>\n<td>11일차<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>과거(사용 이력)를 몰라 위험을 계산할 수 없음<\/td>\n<td>11일차<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>약 90~95%<\/td>\n<td>12일차<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>15%, 25%<\/td>\n<td>12일차<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>리튬이온 배터리<\/td>\n<td>12일차<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>스코프 3<\/td>\n<td>13일차<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>2028년<\/td>\n<td>13일차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<p>오늘은 복습이라 새 주장은 거의 없습니다. 대신 <strong>12일차의 ⚠️ 항목을 다시 확인<\/strong>했습니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>유럽 재생 플라스틱 중 20%는 폐차·사용 중 탈거 부품 출신 → <strong>차량 플라스틱 기준 2032년 3%, 2036년 5%에 해당<\/strong><\/td>\n<td>⚠️ 2차 자료(원문 미확인)<\/td>\n<td><a href=\"https://www.rematec.com/news/industry-players-and-markets/regulation-1738\">Rematec<\/a>, <a href=\"https://bkv-gmbh.de/news-reader-4/eu-end-of-life-vehicles-regulation-adopted-by-plenary.html\">BKV<\/a> — 12일차의 \"문구 차이\"는 같은 내용을 다르게 표현한 것으로 보임(15%×20%=3%, 25%×20%=5%)<\/td>\n<\/tr>\n<tr>\n<td>관보 2026년 7월 게재, 8월 13일 발효<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://euromoulders.org/2026/07/eu-elvr-now-published-in-the-eu-official-journal/\">Euromoulders<\/a>, 12일차<\/td>\n<\/tr>\n<tr>\n<td>복습 문제 정답 15개<\/td>\n<td>✅ 8~13일차 본문·자기점검표와 대조<\/td>\n<td>9일차 정정(80% 점유 삭제, 전손 24.2%) 반영<\/td>\n<\/tr>\n<tr>\n<td>2주차 지도 표의 숫자<\/td>\n<td>✅/⚠️<\/td>\n<td>각 일차 자기점검표의 신뢰도 그대로 유지(시장 규모·화재 건수는 ⚠️)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 12일차 '폐차 출신 20%' 문구 차이 해소: \"재생 플라스틱의 20%\" = \"차량 플라스틱의 3%(2032)·5%(2036)\"로 같은 뜻임을 확인(2차 자료 기준)\n- 9일차에서 근거 부족으로 뺀 \"Copart·IAA 80% 점유\"는 복습 퀴즈에서도 제외<\/p>"}, {"day": 15, "title": "15일차 — 손해보험 기초: 보험은 무엇을, 어떻게 갚아주나? (2026-10-20)", "md": "<h1>15일차 — 손해보험 기초: 보험은 무엇을, 어떻게 갚아주나? (2026-10-20)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li>재산 피해 = <strong>재산보험<\/strong>(화재보험 등), 남에게 끼친 피해 = <strong>배상책임보험<\/strong>.<\/li>\n<li><strong>기업휴지(휴업)손해<\/strong> 담보. 사고로 문을 닫아 못 번 돈을 보상합니다.<\/li>\n<li><strong>잔존물<\/strong>. 보험금을 다 준 뒤 보험사 소유가 된 사고차·사고 물건을 말합니다(16일차 주제).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"손해보험은 '생긴 손해만큼' 갚아준다. 그래서 폐차장 사장님에게 필요한 질문은 세 가지다. ① 내 물건이 부서지면? ② 남에게 피해를 주면? ③ 문을 닫게 되면?\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>손해보험은 <strong>실제 손해만큼만<\/strong> 보상한다(실손 보상). 사람의 생명을 다루는 생명보험(정해진 금액 지급)과 다름<\/td>\n<td>1억짜리 창고가 3천만 원어치 타면 3천만 원. 보험으로 돈을 '벌' 수는 없음<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>사업장 보험은 크게 <strong>3개 바구니<\/strong>: ① 재산(내 물건) ② 배상책임(남의 피해) ③ 기업휴지(멈춘 동안의 손실)<\/td>\n<td>2주차에 본 화재·주민 피해·운영 중단이 각각 이 세 바구니에 들어감<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>보험료는 <strong>위험의 크기<\/strong>로 정해진다. 그래서 '위험을 줄이는 증거'(소화설비, 배터리 분리 절차 등)가 보험료와 가입 여부를 바꾼다<\/td>\n<td>10·11일차의 \"보험사가 원하는 것은 증거\"와 같은 이야기<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 보험의 기본 원리 5가지 (용어 풀이)<\/h2>\n<table>\n<thead>\n<tr>\n<th>원리<\/th>\n<th>뜻<\/th>\n<th>폐차장 예시<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>대수의 법칙<\/strong><\/td>\n<td>많은 사람이 모이면 사고 확률을 예측할 수 있다 → 모두가 조금씩 내서 사고 난 사람을 돕는다<\/td>\n<td>폐차장 1,000곳 중 1년에 몇 곳에 불이 나는지 알면 보험료를 계산할 수 있음<\/td>\n<\/tr>\n<tr>\n<td><strong>피보험이익<\/strong><\/td>\n<td>사고가 나면 내가 손해를 보는 관계가 있어야 보험에 들 수 있다<\/td>\n<td>내 창고는 가입 가능, 옆집 창고는 불가<\/td>\n<\/tr>\n<tr>\n<td><strong>보험가액 vs 보험가입금액<\/strong><\/td>\n<td>보험가액 = 물건의 실제 가치 / 가입금액 = 보험으로 정한 한도<\/td>\n<td>창고 가치 10억인데 5억만 가입하면 '일부보험'<\/td>\n<\/tr>\n<tr>\n<td><strong>비례보상<\/strong><\/td>\n<td>일부보험이면 손해도 <strong>가입 비율만큼만<\/strong> 보상하는 것이 원칙<\/td>\n<td>위 예에서 2억 손해 → 약 1억만 보상(5억/10억). 상품·특약에 따라 다를 수 있음<\/td>\n<\/tr>\n<tr>\n<td><strong>자기부담금<\/strong><\/td>\n<td>손해 중 내가 먼저 내야 하는 금액. 높을수록 보험료는 낮아짐<\/td>\n<td>10일차: 미국 재활용 시설 자기부담금이 25만 달러 이상으로 오름<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>손해율<\/strong> = 받은 보험료 대비 지급한 보험금 비율. 100%를 넘으면 보험사가 손해. 보험사가 어떤 업종을 '안 받으려' 할 때는 대개 손해율이 높기 때문입니다.<\/p>\n<\/blockquote>\n<h2>3. 세계는?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>세계 손해보험 시장<\/td>\n<td>스위스리 연구소 전망: 2025년 세계 손해보험료 <strong>약 4.8조 달러<\/strong>(2024년 약 4.6조 달러), 선진국 85% : 신흥국 15%<\/td>\n<\/tr>\n<tr>\n<td>흐름<\/td>\n<td>대형 재해·사고 증가로 보험료가 오른 뒤 성장 속도는 완만해지는 추세(연 2~3%대 실질 성장 전망)<\/td>\n<\/tr>\n<tr>\n<td>의미<\/td>\n<td>2주차의 화재·대형 사고 사례(모스랜딩, 파쇄장 화재)가 쌓이면 → 보험사는 <strong>보험료 인상, 자기부담금 인상, 인수 거절<\/strong>로 대응<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>손해보험 상품 3분류<\/td>\n<td><strong>장기보험<\/strong>(실손·상해 등 여러 해 계약), <strong>자동차보험<\/strong>, <strong>일반보험<\/strong>(화재·배상·해상·기술 등 기업 보험)<\/td>\n<\/tr>\n<tr>\n<td>비중(보도 기준, 2024년으로 추정)<\/td>\n<td>장기인보험 52%, 자동차 20%, 일반 14%, 장기물보험 13% → <strong>기업 위험을 다루는 '일반보험'은 아직 작은 편<\/strong><\/td>\n<\/tr>\n<tr>\n<td>자동차보험 수익성<\/td>\n<td>2025년 손해율 87.5%, 보험손익 약 7,080억 원 적자 전환(보도) → 보험사들이 <strong>부품·수리비 절감<\/strong>(재활용 부품)에 관심을 가질 이유<\/td>\n<\/tr>\n<tr>\n<td>재산종합보험(패키지)<\/td>\n<td>화재·기계·기업휴지·배상책임을 <strong>한 증권<\/strong>에 묶은 상품. 중·대형 사업장용<\/td>\n<\/tr>\n<tr>\n<td>재난배상책임보험(의무)<\/td>\n<td>음식점·숙박업소·물류창고 등 다중이용시설이 의무 가입. 화재·폭발·붕괴로 남에게 준 피해를 보상: 신체 1인당 최대 1.5억 원, 재산 1사고당 10억 원. 미가입 시 과태료 300만 원 이하<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 연결 고리: 폐차장·재활용 사업장이 재난배상책임보험 <strong>의무 대상인지는 이번 조사에서 확인하지 못했습니다<\/strong>(물류창고 등 업종 기준이라 사업장마다 판단 필요). 19일차 폐차장 보험에서 다시 봅니다.<\/p>\n<\/blockquote>\n<h2>5. [보험 포인트] 폐차장 사장님께 던질 '3바구니 질문'<\/h2>\n<table>\n<thead>\n<tr>\n<th>바구니<\/th>\n<th>고객에게 할 질문<\/th>\n<th>연결되는 보험<\/th>\n<th>2주차 사례<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 재산<\/td>\n<td>\"창고·설비·쌓아둔 차량과 배터리가 불타면 얼마를 잃으시나요?\"<\/td>\n<td>화재보험, 기계보험, 재산종합보험<\/td>\n<td>파쇄장 화재(12일차)<\/td>\n<\/tr>\n<tr>\n<td>② 배상책임<\/td>\n<td>\"연기·오염으로 이웃이나 손님이 피해를 보면?\"<\/td>\n<td>영업배상, 환경오염배상, 재난배상책임<\/td>\n<td>캠던 주민 대피(12일차)<\/td>\n<\/tr>\n<tr>\n<td>③ 기업휴지<\/td>\n<td>\"공장이 3개월 멈추면 월급·임대료는 어떻게 내시나요?\"<\/td>\n<td>기업휴지(휴업)손해 담보<\/td>\n<td>모스랜딩 영업중단(11일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>설계사가 꼭 확인할 3가지<\/strong>\n1. <strong>가입금액이 실제 가치와 맞나?<\/strong> → 일부보험이면 비례보상으로 덜 받음\n2. <strong>자기부담금은 감당 가능한가?<\/strong> → 너무 낮으면 보험료가 비싸고, 너무 높으면 작은 사고는 혼자 부담\n3. <strong>빠진 위험은 없나?<\/strong> → 특히 배터리 화재, 오염 사고는 특약이나 별도 보험이 필요한 경우가 많음<\/p>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"폐차장 사장님이 '화재보험은 이미 들었어요'라고 한다면, 3바구니 중 어떤 바구니가 비어 있을 가능성이 가장 클까? 그걸 어떻게 확인할까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>실손 보상<\/td>\n<td>실제로 생긴 손해만큼만 보상하는 손해보험의 원칙<\/td>\n<\/tr>\n<tr>\n<td>보험가액<\/td>\n<td>보험에 든 물건의 실제 가치<\/td>\n<\/tr>\n<tr>\n<td>일부보험·비례보상<\/td>\n<td>가치보다 적게 가입하면 손해도 가입 비율만큼만 보상받는 것(원칙)<\/td>\n<\/tr>\n<tr>\n<td>손해율<\/td>\n<td>보험료 대비 보험금 지급 비율. 보험사의 '수익성 체온계'<\/td>\n<\/tr>\n<tr>\n<td>재산종합보험(패키지)<\/td>\n<td>화재·기계·기업휴지·배상책임을 한 계약으로 묶은 기업용 보험<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>창고 가치가 10억 원인데 5억 원만 가입했다. 2억 원 손해가 나면 원칙적으로 얼마를 받나?<\/li>\n<li>받은 보험료 대비 지급한 보험금 비율을 뭐라고 하나?<\/li>\n<li>사고로 보험금을 다 지급한 뒤, 보험사가 갖게 되는 사고차를 다시 파는 일과 관련된 내일의 주제는? (힌트: 어제 퀴즈 3번)<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>실손 보상·피보험이익·비례보상·자기부담금 개념<\/td>\n<td>✅ 보험 일반 원리<\/td>\n<td>상법·보험 교과서 일반 내용. 비례보상은 상품·특약에 따라 다를 수 있다고 본문에 명시<\/td>\n<\/tr>\n<tr>\n<td>세계 손해보험료 2025년 약 4.8조 달러, 2024년 약 4.6조 달러, 85:15<\/td>\n<td>⚠️ 2차 보도(sigma 원문 미확인)<\/td>\n<td><a href=\"https://www.asiainsurancereview.com/News/View-NewsLetter-Article/id/92182/Type/eDaily\">Asia Insurance Review<\/a>, <a href=\"https://www.captive.com/news/swiss-re-institute-highlights-global-insurance-trends-amid-economic-and-geopolitical-shifts\">Captive.com<\/a><\/td>\n<\/tr>\n<tr>\n<td>실질 성장률 2~3%대<\/td>\n<td>⚠️ 보고서 판마다 다름(2.3%, 2.6%)<\/td>\n<td>같은 출처 — 범위로 표기<\/td>\n<\/tr>\n<tr>\n<td>장기인 52%, 자동차 20%, 일반 14%, 장기물 13%<\/td>\n<td>⚠️ 보도, 기준연도 불명확(2024년 추정)<\/td>\n<td><a href=\"https://www.kukinews.com/article/view/kuk202505260109\">국민일보 쿠키뉴스<\/a> — 금감원 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>2025년 자동차보험 손해율 87.5%, 손익 7,080억 원 적자<\/td>\n<td>⚠️ 보도<\/td>\n<td><a href=\"https://www.heraldk.com/article/2025090619000010673\">헤럴드경제<\/a>, <a href=\"https://www.sidae.com/article/2026032510380644302\">시대일보<\/a> — 금감원 보도자료 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>재산종합보험 = 화재·기계·기업휴지·배상책임 묶음<\/td>\n<td>✅ 보험사 안내<\/td>\n<td><a href=\"https://www.chubb.com/kr-kr/business/package-insurance-policy.html\">Chubb<\/a>, <a href=\"https://www.samsungfire.com/download/product/P_P02_07_02_163_1.pdf\">삼성화재 상품 자료<\/a><\/td>\n<\/tr>\n<tr>\n<td>재난배상책임: 신체 1인 1.5억, 재산 10억, 화재·폭발·붕괴, 과태료 300만 원 이하<\/td>\n<td>✅ 서울시 안내 + 보도<\/td>\n<td><a href=\"https://news.seoul.go.kr/safe/?p=53051\">서울시 안전 누리집<\/a>, <a href=\"https://www.banksalad.com/articles/보험-재난배상책임보험-의무가입대상\">뱅크샐러드<\/a> — 대상 시설 목록은 최신 법령 재확인 필요<\/td>\n<\/tr>\n<tr>\n<td>폐차장이 재난배상책임 의무 대상인지<\/td>\n<td>❓ 확인 못 함<\/td>\n<td>본문에 \"확인하지 못했다\" 명시<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 손보 상품 비중은 2025년 자료를 못 찾아 <strong>보도된 수치(2024년 추정)<\/strong> 로 쓰고 기준연도 불명확을 표시\n- 세계 성장률은 보고서마다 달라 단일 숫자 대신 <strong>\"2~3%대\"<\/strong> 로 표기\n- 비례보상은 특약(실손보상 특약 등)으로 달라질 수 있어 \"원칙\"이라고 한정\n- 폐차장의 재난배상책임 의무 여부는 추측하지 않고 ❓로 남김<\/p>"}, {"day": 16, "title": "16일차 — 전손(全損)과 잔존물 처리: 보험사가 사고차를 '판다'는 게 무슨 뜻? (2026-10-21)", "md": "<h1>16일차 — 전손(全損)과 잔존물 처리: 보험사가 사고차를 '판다'는 게 무슨 뜻? (2026-10-21)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>약 1억 원<\/strong>. 일부보험이라 비례보상 원칙에 따라 2억 × (5억/10억) = 1억 원(상품·특약에 따라 다를 수 있음).<\/li>\n<li><strong>손해율<\/strong>.<\/li>\n<li><strong>전손과 잔존물 처리<\/strong>(오늘 주제).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"차가 '완전히 망가졌다(전손)'고 판정되면 보험사는 차값을 다 주고, 대신 그 사고차(잔존물)의 주인이 된다. 그 차를 어디로 보내느냐(폐차장? 경매? 수출?)가 재활용 시장의 출발점이다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>전손(전부손해)<\/strong> = 차를 고칠 수 없거나, 고치는 비용이 차값(보험가액) 이상인 경우<\/td>\n<td>500만 원짜리 차를 고치는 데 600만 원이 들면 '고치는 것보다 차값을 주는 게 낫다'<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>전손으로 보험금을 다 주면 보험사가 사고차의 권리를 넘겨받는다 = <strong>잔존물 대위<\/strong>(상법 제681조)<\/td>\n<td>보험사가 사고차 주인이 됨 → 팔아서 일부 돈을 돌려받음<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>잔존물은 <strong>폐차 / 부품 재활용 / 경매·수출<\/strong>로 흘러간다. 그래서 보험사는 재활용 산업의 <strong>최대 공급자<\/strong><\/td>\n<td>9일차: 미국 Copart·IAA의 물량 대부분이 보험사 전손차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 전손 판정, 쉽게 보기<\/h2>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>뜻<\/th>\n<th>예시<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>분손(일부 손해)<\/strong><\/td>\n<td>고쳐서 쓰는 것이 이득<\/td>\n<td>범퍼·문짝 교체, 수리비 200만 원 / 차값 1,000만 원<\/td>\n<\/tr>\n<tr>\n<td><strong>전손(전부손해)<\/strong><\/td>\n<td>수리 불가 또는 수리비 ≥ 차값<\/td>\n<td>침수로 엔진·전자장치 모두 고장, 수리비 1,200만 원 / 차값 1,000만 원<\/td>\n<\/tr>\n<tr>\n<td><strong>경제적 수리불능<\/strong><\/td>\n<td>고칠 수는 있지만 돈이 차값보다 훨씬 더 듦<\/td>\n<td>법원도 원칙적으로 '차값 − 고철값'까지만 배상 대상으로 봄(판례)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>차값(보험가액)<\/strong> = 한국 자동차보험은 보통 보험개발원의 <strong>차량기준가액<\/strong>(연식·모델별 시세표)을 기준으로 봅니다.<\/p>\n<p>※ 미국은 주(州)마다 기준이 다릅니다. 차값의 <strong>70~80%<\/strong> 를 넘으면 전손으로 보는 주가 많고, \"수리비 + 잔존물 값 &gt; 차값\"이면 전손으로 보는 주도 있습니다.<\/p>\n<\/blockquote>\n<h2>3. 보험사 입장에서 본 돈의 흐름<\/h2>\n<ol>\n<li>사고 → 전손 판정 → 고객에게 <strong>차값(보험금)<\/strong> 지급<\/li>\n<li>사고차 = 보험사 소유(잔존물)<\/li>\n<li>잔존물 매각 → <strong>회수금<\/strong> (보험금 일부를 돌려받음)<\/li>\n<li>실제 손해 = 보험금 − 회수금<\/li>\n<\/ol>\n<blockquote>\n<p>그래서 <strong>잔존물을 비싸게 팔수록 보험사 손해율이 내려갑니다.<\/strong> 어제 배운 손해율(2025년 자동차보험 87.5%, 적자) 개선의 작은 열쇠입니다.<\/p>\n<\/blockquote>\n<h2>4. 세계는?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>미국 구조<\/td>\n<td>보험사가 전손차를 <strong>Copart·IAA 경매<\/strong>에 위탁 → 전 세계 구매자(부품업체·수리업자·수출업자)가 입찰 → 보험사는 높은 회수금 확보(9일차)<\/td>\n<\/tr>\n<tr>\n<td>전손 비율<\/td>\n<td>미국 보험 청구 중 전손 비율 약 <strong>22~24%<\/strong>(조사 시점·기관에 따라 다름, 9일차 24.2%) — 차가 비싸지고 수리비가 올라 '고치기보다 전손'이 늘어나는 추세<\/td>\n<\/tr>\n<tr>\n<td>핵심 교훈<\/td>\n<td>투명한 <strong>온라인 경매<\/strong> + 넓은 구매자 = 높은 회수금 + 불법 유통 감소<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>처리 경로<\/td>\n<td>보험사 → 잔존물 처리 위탁업체 → <strong>폐차<\/strong> 또는 <strong>경매(수리 후 재판매·수출)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>과거 문제<\/td>\n<td>2016년 보도: 위탁 폐차경매업체 6곳이 보험사에서 받은 전손차 약 1만 1,543대 중 <strong>약 10%만 직접 폐차<\/strong>, 나머지는 시장에 유통. 손보협회도 \"폐차 여부를 서류로만 확인하는 한계\"를 인정<\/td>\n<\/tr>\n<tr>\n<td>침수차 관리<\/td>\n<td>국토교통부: <strong>전손 침수차 폐차 의무화<\/strong>, 폐차이행확인제 운영. 단, '분손' 처리되거나 자차 미가입 침수차는 유통 위험이 남음(2022년 보도)<\/td>\n<\/tr>\n<tr>\n<td>금감원 조치(2022)<\/td>\n<td>폐차증명서 확인 후 보험금 지급, 폐차 진위 사후 점검 요청<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 연결 고리: 9일차의 \"2016년 전손차 일부가 불법 경매로\" 이야기와 같은 사건입니다. 한국은 미국처럼 <strong>투명한 대형 경매 시장<\/strong>이 약해, 잔존물의 '이력 추적'이 숙제입니다.<\/p>\n<\/blockquote>\n<h2>6. [보험 포인트] 잔존물은 '비용'이 아니라 '자원'<\/h2>\n<table>\n<thead>\n<tr>\n<th>기회<\/th>\n<th>설명<\/th>\n<th>설계사·사업자가 할 수 있는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 회수금 높이기<\/td>\n<td>잔존물을 부품·소재로 제대로 쓰면 더 비싸게 팔림<\/td>\n<td>보험사에 <strong>해체·부품 재활용 역량이 있는 폐차장 네트워크<\/strong> 제안<\/td>\n<\/tr>\n<tr>\n<td>② 이력 추적<\/td>\n<td>불법 유통·침수차 둔갑을 막아야 보험사 평판 보호<\/td>\n<td>폐차 인증·사진·위치 기록을 갖춘 업체와 연결 → <strong>신뢰 서비스<\/strong><\/td>\n<\/tr>\n<tr>\n<td>③ 재활용 부품 공급<\/td>\n<td>전손차에서 나온 중고부품 → 다른 사고차 수리(친환경 특약, 17일차)<\/td>\n<td>\"잔존물 → 부품 → 수리비 절감\"의 <strong>순환 고리<\/strong> 설명<\/td>\n<\/tr>\n<tr>\n<td>④ 고객 상담<\/td>\n<td>전손 고객은 차값 산정·잔존물 처리 절차를 잘 모름<\/td>\n<td>차량기준가액 확인, 폐차 절차·세금 환급 안내 → 고객 신뢰 확보<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"보험사가 잔존물을 1대당 50만 원만 더 비싸게 팔 수 있다면, 1년에 전손차가 수만 대 나오는 회사에는 얼마의 차이가 될까? 그 50만 원을 만들 수 있는 사람은 누구일까?\"<\/p>\n<\/blockquote>\n<h2>7. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전손(전부손해)<\/td>\n<td>수리 불가 또는 수리비가 차값 이상인 손해<\/td>\n<\/tr>\n<tr>\n<td>분손<\/td>\n<td>고쳐서 쓰는 일부 손해<\/td>\n<\/tr>\n<tr>\n<td>잔존물<\/td>\n<td>보험금 지급 후 남은 사고차·사고 물건<\/td>\n<\/tr>\n<tr>\n<td>잔존물 대위<\/td>\n<td>보험금을 전부 준 보험사가 잔존물의 권리를 넘겨받는 것(상법 제681조)<\/td>\n<\/tr>\n<tr>\n<td>차량기준가액<\/td>\n<td>보험개발원이 정한 연식·모델별 차값. 전손 보험금 산정의 기준<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>8. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>수리비가 차값보다 많이 나와 고치는 대신 차값을 주는 손해를 무엇이라 하나?<\/li>\n<li>보험금을 다 준 보험사가 사고차의 권리를 넘겨받는 것을 무엇이라 하나?<\/li>\n<li>잔존물을 더 비싸게 팔면 보험사의 어떤 숫자가 좋아지나? (어제 배운 용어)<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전부손해 정의: 수리 불가 또는 손해액+비용 ≥ 보험가액<\/td>\n<td>⚠️ 2차 설명(약관 원문 미확인)<\/td>\n<td><a href=\"https://dnublog.co.kr/2026/07/06/%EC%B9%A8%EC%88%98%EC%B0%A8-%EC%A0%84%EC%86%90-%EC%B2%98%EB%A6%AC-%EA%B8%B0%EC%A4%80%EA%B3%BC-%EC%B0%A8%EB%9F%89%EA%B0%80%EC%95%A1%C2%B7%EB%B3%B4%ED%97%98%EA%B8%88-%ED%99%95%EC%9D%B8-%EB%B0%A9/\">dnublog 침수차 전손 설명<\/a> — 개인 블로그라 표준약관으로 재확인 필요<\/td>\n<\/tr>\n<tr>\n<td>잔존물 대위 = 상법 제681조<\/td>\n<td>✅ 법령<\/td>\n<td>상법 제681조(보험목적에 관한 보험자대위) — 일반 법률 지식<\/td>\n<\/tr>\n<tr>\n<td>경제적 수리불능: 교환가격 − 고철대금 배상(대법원 98다7735)<\/td>\n<td>⚠️ 언론 생활법률 기사 인용<\/td>\n<td><a href=\"https://www.jjan.kr/article/20110718404110\">전북일보<\/a> — 판결 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>미국 전손 기준 70~80%, TLF(수리비+잔존물값&gt;차값) 주 존재<\/td>\n<td>⚠️ 소비자 사이트<\/td>\n<td><a href=\"https://seo-service.chartlocal.com/?p=15556\">ChartLocal 안내<\/a>, <a href=\"https://auctiongate.io/us/news/post/what-is-a-salvage-title-and-how-does-it-affect-the-value-of-a-car-at-copart-or-iaai-auction\">AuctionGate<\/a> — 주별 기준은 법령 재확인 필요<\/td>\n<\/tr>\n<tr>\n<td>미국 전손 비율 약 22~24%<\/td>\n<td>⚠️ 2차 인용<\/td>\n<td><a href=\"https://andvari.substack.com/p/copart-q1-2025-update\">Andvari(Copart 분석)<\/a> 21.7%, 9일차 24.2% — 범위로 표기<\/td>\n<\/tr>\n<tr>\n<td>2016년 위탁업체 6곳, 1만 1,543대 중 10%만 직접 폐차<\/td>\n<td>⚠️ 언론 보도(2016)<\/td>\n<td><a href=\"https://www.newstomato.com/RealTime/RealTimeDetail.aspx?no=699157\">뉴스토마토<\/a> — 과거 자료, 현재 상황과 다를 수 있음<\/td>\n<\/tr>\n<tr>\n<td>국토부 전손 침수차 폐차 의무화·폐차이행확인제, 분손 차량 유통 위험<\/td>\n<td>✅ 정부 발표 보도<\/td>\n<td><a href=\"https://v.daum.net/v/20220825160020656\">다음뉴스(2022.8)<\/a>, <a href=\"https://www.fnnews.com/news/202208261200426657\">파이낸셜뉴스<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025년 자동차보험 손해율 87.5%, 7,080억 원 적자<\/td>\n<td>✅ 복수 보도(금감원 발표)<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2026032512594762058\">MTN<\/a>, <a href=\"https://www.sidae.com/article/2026032510380644302\">시대일보<\/a><\/td>\n<\/tr>\n<tr>\n<td>한국 보험사 잔존물 회수금 규모<\/td>\n<td>❓ 공개 자료 못 찾음<\/td>\n<td>본문에 숫자 넣지 않음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 15일차의 자동차보험 손해율·적자 수치는 이번에 MTN 보도로 <strong>교차 확인<\/strong>되어 ✅로 올림\n- 미국 전손 비율은 출처마다 21.7%·24.2%로 달라 <strong>\"약 22~24%\"<\/strong> 범위로 표기\n- 9일차 \"2016년 전손차 15%가 불법 경매로\"와 오늘 \"10%만 직접 폐차\"는 같은 시기 다른 보도·다른 기준이라, 오늘은 <strong>보도 원문 표현 그대로<\/strong> 쓰고 두 숫자를 섞지 않음\n- 한국 잔존물 회수 금액은 근거가 없어 만들지 않음<\/p>"}, {"day": 17, "title": "17일차 — 친환경 부품 특약 · 품질인증부품: 중고부품 쓰면 보험사도 고객도 이익? (2026-10-22)", "md": "<h1>17일차 — 친환경 부품 특약 · 품질인증부품: 중고부품 쓰면 보험사도 고객도 이익? (2026-10-22)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>전손(전부손해)<\/strong>.<\/li>\n<li><strong>잔존물 대위<\/strong>(상법 제681조).<\/li>\n<li><strong>손해율<\/strong>. 잔존물을 비싸게 팔면 실제 손해가 줄어 손해율이 내려갑니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"제도는 이미 있다. 중고·재제조 부품으로 고치면 새 부품값의 일부를, 인증 대체부품으로 고치면 순정값의 25%를 돌려준다. 그런데 거의 아무도 쓰지 않는다. 그 '빈칸'이 설계사의 기회다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>보험 수리에 쓰는 '대안 부품' 제도는 <strong>두 종류<\/strong>: ① <strong>친환경부품 특약<\/strong>(중고·재제조 부품) ② <strong>품질인증 대체부품<\/strong>(다른 회사가 만든 인증된 새 부품)<\/td>\n<td>3일차의 3R 부품 중 중고·재제조 = ①, 대체부품 = ②<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>돌려받는 돈: ① 일부 보험사 특약은 <strong>새 부품값의 20%<\/strong> 지급(AXA 사례) ② 대체부품은 <strong>순정값의 25%<\/strong> 현금 지급<\/td>\n<td>고객 입장: \"이렇게 고치면 현금이 생긴다\"<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>그런데 실제 사용은 <strong>거의 0<\/strong>: 대형 5개 손보사의 품질인증부품 수리는 1년간 <strong>0.019%<\/strong>(1만 건당 2건)<\/td>\n<td>제도가 있는데 안 쓰인다 = 안내만 잘해도 차별화<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 두 제도 비교<\/h2>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>친환경부품 특약<\/th>\n<th>품질인증 대체부품<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>쓰는 부품<\/td>\n<td>중고부품, 재제조부품(보험개발원·보험사가 인정한 업체 공급)<\/td>\n<td>정부 지정기관이 성능을 인증한 <strong>새<\/strong> 비순정 부품<\/td>\n<\/tr>\n<tr>\n<td>돌려받는 돈<\/td>\n<td>새 부품값의 일정 비율(예: AXA <strong>20%<\/strong>) — 보험사마다 다름<\/td>\n<td>순정(OEM) 부품값의 <strong>25%<\/strong> 현금<\/td>\n<\/tr>\n<tr>\n<td>적용 범위<\/td>\n<td>주로 외장 부품(범퍼·펜더·도어 등), 보험사·차량 연식 조건 있음<\/td>\n<td>단독사고·가해자 불명·일방과실 등. <strong>쌍방과실·대물사고 제외<\/strong>(보도 기준)<\/td>\n<\/tr>\n<tr>\n<td>친환경<\/td>\n<td>✅ 부품 재사용 → 탄소 감축(13일차)<\/td>\n<td>△ 새 부품이라 재활용 효과는 적음, 가격만 저렴<\/td>\n<\/tr>\n<tr>\n<td>고객 걱정<\/td>\n<td>\"중고는 불안하다\"<\/td>\n<td>\"중국산 아니냐\", \"정품 선택권은?\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 2025년 7월 금융당국이 \"외장부품은 대체부품 우선 적용\"으로 약관을 바꾸려 했으나 소비자 반발로 <strong>정품 선택권을 유지<\/strong>하고 '쓰면 혜택' 방식으로 물러섰습니다(3일차).<\/p>\n<\/blockquote>\n<h2>3. 세계는?<\/h2>\n<table>\n<thead>\n<tr>\n<th>지역<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>영국<\/strong><\/td>\n<td>보험 약관상 비순정·중고(그린) 부품 사용이 <strong>일반적 관행<\/strong>. Allianz Commercial은 법인 차량(플릿) 약관에 <strong>그린 부품 장착을 명시<\/strong>. 단, 일부 보험사(Chubb)는 순정 부품 보장을 차별점으로 내세움<\/td>\n<\/tr>\n<tr>\n<td><strong>독일<\/strong><\/td>\n<td>알리안츠가 2024년 4월부터 인증 중고부품 사용 권장(13일차)<\/td>\n<\/tr>\n<tr>\n<td><strong>네덜란드<\/strong><\/td>\n<td>2025년 보고서: 품질 좋은 중고부품 재사용 시 부품당 <strong>CO2 50~90% 감축<\/strong> 추정. 그러나 보험사가 '통제·예측 가능성'을 걱정해 실제 사용은 아직 적음<\/td>\n<\/tr>\n<tr>\n<td><strong>미국<\/strong><\/td>\n<td>주마다 규제가 다름. 일부 주는 신차·저주행 차량에 순정 부품을 요구하고, 오하이오주는 보험 약관에 순정 부품 선택권을 의무화하는 법안을 추진(통과 여부 미확인)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 공통점: <strong>\"싸고 친환경인 부품\"과 \"고객의 품질 불안·순정 선택권\"<\/strong> 사이의 줄다리기는 세계 어디나 같습니다.<\/p>\n<\/blockquote>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>대체부품 25% 환급<\/td>\n<td>운영 중, 2025년 8월 개편 때도 유지(3일차)<\/td>\n<\/tr>\n<tr>\n<td>실제 사용률<\/td>\n<td>2025년 8월~2026년 7월, 대형 5개 손보사 자동차 수리 약 <strong>360만 9,600건 중 714건(0.019%)<\/strong>. 금액 기준 부품비의 <strong>0.013%<\/strong>. 보험사 중 메리츠화재가 0.109%로 가장 높음(2026년 9월 보도)<\/td>\n<\/tr>\n<tr>\n<td>친환경부품 특약<\/td>\n<td>일부 보험사가 운영(예: AXA다이렉트 새 부품값 20% 지급). 2020년 조사에서 자차 가입자 중 특약을 아는 사람은 <strong>18%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>법인차 사례<\/td>\n<td>현대해상 '에코부품' 상품: 법인 업무용·등록 4년 경과 차량, 17개 외장 부품, 수리 후 1년 품질보증(2019년 보도, 현재 판매 여부 미확인)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 왜 안 쓰일까? → 그게 기회<\/h2>\n<table>\n<thead>\n<tr>\n<th>막힘<\/th>\n<th>이유<\/th>\n<th>설계사·사업자가 할 수 있는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 몰라서<\/td>\n<td>특약 인지도 18%, 사고 순간엔 정비소 말이 전부<\/td>\n<td>가입 때와 <strong>사고 직후<\/strong> 두 번 안내: \"외장 부품은 이렇게 고치면 현금을 돌려받습니다\"<\/td>\n<\/tr>\n<tr>\n<td>② 불안해서<\/td>\n<td>중고·비순정 = 품질 의심<\/td>\n<td><strong>품질보증<\/strong>(현대해상 1년 보증 사례)과 인증 마크를 보여주기 → 18일차 '품질보증보험'으로 연결<\/td>\n<\/tr>\n<tr>\n<td>③ 정비소가 안 권해서<\/td>\n<td>순정 부품이 정비소 마진·작업 편의에 유리<\/td>\n<td>재활용 부품을 쉽게 조달하는 <strong>폐차장·부품 유통 네트워크<\/strong>와 정비소 연결<\/td>\n<\/tr>\n<tr>\n<td>④ 부품이 없어서<\/td>\n<td>필요한 중고부품을 제때 구하기 어려움<\/td>\n<td>16일차 잔존물 → 부품 회수 → 재고 시스템. <strong>잔존물이 부품 공급원<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>30초 안내 문장(예시)<\/strong><\/p>\n<blockquote>\n<p>\"사장님, 범퍼나 문짝처럼 겉에 있는 부품은 인증 부품이나 재활용 부품으로 고치면 보험사에서 부품값 일부를 현금으로 돌려드립니다. 성능 인증이 된 부품이고, 회사 ESG 보고서에도 '친환경 수리'로 쓸 수 있어요.\"<\/p>\n<p>▶ 오늘의 생각거리: \"사용률이 0.019%인 제도를 1%로만 올려도 50배다. 그렇게 만들려면 고객·정비소·보험사 중 <strong>누구의 마음을 먼저<\/strong> 바꿔야 할까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>친환경부품 특약<\/td>\n<td>중고·재제조 부품으로 수리하면 새 부품값의 일정 비율을 주는 자동차보험 특약<\/td>\n<\/tr>\n<tr>\n<td>품질인증 대체부품<\/td>\n<td>정부 지정기관이 순정품과 성능이 같다고 인증한 비순정 새 부품<\/td>\n<\/tr>\n<tr>\n<td>OEM(순정) 부품<\/td>\n<td>자동차 제조사가 공급하는 원래 부품<\/td>\n<\/tr>\n<tr>\n<td>그린 부품(green parts)<\/td>\n<td>영국 등에서 쓰는 말. 폐차에서 회수한 재사용 부품<\/td>\n<\/tr>\n<tr>\n<td>정품 선택권<\/td>\n<td>고객이 순정 부품 수리를 고를 수 있는 권리. 2025년 개편 때 유지됨<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>품질인증 대체부품으로 외장 부품을 고치면 순정 부품값의 몇 %를 돌려받나?<\/li>\n<li>대형 5개 손보사의 1년간 품질인증부품 수리 비율은 대략 몇 %였나? (힌트: 1만 건당 2건)<\/li>\n<li>중고·재제조 부품으로 고칠 때 고객이 가장 걱정하는 것은? 그 걱정을 덜어주는 보험은 내일 주제다.<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AXA 친환경부품사용 특약: 새 부품값 20%, 인정 업체 공급 중고·재제조 부품<\/td>\n<td>⚠️ 언론 보도(시점 불명확)<\/td>\n<td><a href=\"https://www.smarttoday.co.kr/ko-kr/articles/50945\">스마트투데이<\/a> — 현재 판매·지급률은 약관 재확인 필요<\/td>\n<\/tr>\n<tr>\n<td>대체부품 사용 시 순정값 25% 현금, 쌍방과실·대물 제외<\/td>\n<td>✅ 복수 보도<\/td>\n<td><a href=\"https://m.dailian.co.kr/news/view/688312\">데일리안<\/a>, <a href=\"https://news.mtn.co.kr/news-detail/2025080514464847870\">MTN 2025.8.5<\/a>, 3일차<\/td>\n<\/tr>\n<tr>\n<td>5개 손보사 360만 9,600건 중 714건(0.019%), 금액 0.013%, 메리츠 0.109%<\/td>\n<td>⚠️ 단독 보도(국회 자료 인용)<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2026090317164593081\">MTN 2026.9.3<\/a> — 원자료 미확인, 5개사 한정<\/td>\n<\/tr>\n<tr>\n<td>2025년 '대체부품 우선' 약관 개정 → 정품 선택권 유지로 선회<\/td>\n<td>✅ 복수 보도<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2025072115243343990\">MTN 2025.7.21<\/a>, <a href=\"https://news.mtn.co.kr/news-detail/2025080514464847870\">MTN 2025.8.5<\/a>, <a href=\"https://www.khan.co.kr/article/202508052019035/\">경향신문<\/a><\/td>\n<\/tr>\n<tr>\n<td>특약 인지도 18%(2020년 조사)<\/td>\n<td>⚠️ 과거 조사<\/td>\n<td><a href=\"https://kyeonggi.com/article/202010211142413\">경기일보<\/a><\/td>\n<\/tr>\n<tr>\n<td>현대해상 에코부품: 법인·4년 경과·17개 외장·1년 보증<\/td>\n<td>⚠️ 과거 보도<\/td>\n<td>3일차 출처(시사경제 2019), 스마트투데이 — 현재 판매 여부 미확인<\/td>\n<\/tr>\n<tr>\n<td>영국 그린 부품 관행, Allianz Commercial 플릿 약관<\/td>\n<td>⚠️ 업계 매체<\/td>\n<td><a href=\"https://www.nimblefins.co.uk/node/1578\">NimbleFins<\/a>, <a href=\"https://insuranceage.co.uk/node/7952629\">Insurance Age<\/a><\/td>\n<\/tr>\n<tr>\n<td>네덜란드 보고서 CO2 50~90% 감축<\/td>\n<td>⚠️ 업계 보고서 인용<\/td>\n<td><a href=\"https://autorecyclingworld.com/dutch-insurers-urged-to-unlock-the-full-potential-of-green-parts/\">Auto Recycling World<\/a><\/td>\n<\/tr>\n<tr>\n<td>미국 오하이오 순정 부품 선택권 법안<\/td>\n<td>❓ 통과 여부 미확인<\/td>\n<td><a href=\"https://www.repairerdrivennews.com/2025/12/30/new-ohio-bill-would-require-oem-parts-option-in-insurance-policies/\">Repairer Driven News<\/a> — 본문에 \"통과 여부 미확인\" 명시<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 3일차에서 \"친환경부품 특약은 일정 금액 지급\"이라고만 썼던 부분을 <strong>\"보험사마다 다름, 예: AXA 20%\"<\/strong> 로 구체화하되 ⚠️ 표시\n- 대체부품 사용률 0.019%는 <strong>5개사·특정 기간<\/strong> 수치임을 본문에 명시(업계 전체로 일반화하지 않음)\n- 오래된 영국 시범사업(2000년대 후반) 기사는 현재 상황이 아니라서 본문에서 제외\n- 미국 주별 순정 부품 규제는 오래된 자료가 섞여 있어 구체적 주 이름(뉴햄프셔·웨스트버지니아)은 빼고 \"일부 주\"로 표현<\/p>"}, {"day": 18, "title": "18일차 — 재제조 부품 품질보증 보험: 부품 하자 책임은 누가 지나? (2026-10-23)", "md": "<h1>18일차 — 재제조 부품 품질보증 보험: 부품 하자 책임은 누가 지나? (2026-10-23)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>25%<\/strong> (품질인증 대체부품 사용 시 순정 부품 공시가격의 25%).<\/li>\n<li><strong>약 0.019%<\/strong> (대형 5개 손보사, 2025년 8월~2026년 7월 보도 기준).<\/li>\n<li><strong>품질(하자)에 대한 걱정<\/strong>. \"중고·재제조 부품이 고장 나면 누가 책임지나?\" → 오늘 주제.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"재제조 부품이 안 팔리는 진짜 이유는 가격이 아니라 '불안'이다. 불안을 없애는 도구는 두 가지다. ① 인증(믿을 만하다는 증명) ② 보증 + 보험(문제가 생겨도 책임진다는 약속).\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>부품 하자 책임은 <strong>3층 구조<\/strong>: ① 만든 회사(재제조사) ② 판 회사·고친 곳(유통·정비소) ③ 보험(위 회사들이 책임질 돈을 대신 냄)<\/td>\n<td>\"누가 잘못했나\"와 \"누가 돈을 내나\"는 다를 수 있음<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>부품 결함으로 <strong>사람이 다치거나 남의 물건이 부서지면<\/strong> → 제조물책임(PL) → <strong>생산물배상책임보험<\/strong><\/td>\n<td>브레이크 재제조품 결함으로 사고 → 피해자에게 배상<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>그런데 생산물배상책임보험은 <strong>불량 부품 자체의 교체·회수 비용은 보통 보상하지 않는다<\/strong> → 그 빈칸을 메우는 것이 <strong>품질보증(워런티) + 보증·리콜 보험<\/strong><\/td>\n<td>\"부품값 다시 물어주기\"와 \"남에게 준 피해 물어주기\"는 다른 보험<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 하자가 생겼을 때 돈의 흐름<\/h2>\n<table>\n<thead>\n<tr>\n<th>상황<\/th>\n<th>누가 책임?<\/th>\n<th>어떤 보험?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>재제조 발전기가 6개월 만에 고장(사고 없음)<\/td>\n<td>재제조사·판매자의 <strong>품질보증<\/strong> 약속<\/td>\n<td>보증 비용을 덜어주는 <strong>품질보증(워런티) 보험<\/strong> 계열<\/td>\n<\/tr>\n<tr>\n<td>재제조 브레이크 결함으로 사고, 운전자 부상<\/td>\n<td>제조업자(제조물책임법상 <strong>결함 기준 무과실 책임<\/strong>)<\/td>\n<td><strong>생산물배상책임보험(PL보험)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>정비소가 부품을 잘못 장착해 사고<\/td>\n<td>정비소(작업 과실)<\/td>\n<td>정비업자 배상책임보험·완성작업 위험 담보(약관 확인 필요)<\/td>\n<\/tr>\n<tr>\n<td>같은 로트 부품에서 결함 발견, 대량 회수<\/td>\n<td>재제조사<\/td>\n<td><strong>리콜(회수) 비용 보험<\/strong>(별도 상품)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>제조물책임법<\/strong>: 제품 결함으로 피해가 나면, 피해자가 '회사의 잘못(과실)'을 증명하지 않아도 <strong>'결함'만 입증하면<\/strong> 배상받을 수 있게 한 법. 완성품뿐 아니라 <strong>부품<\/strong>도 대상입니다.<\/p>\n<p>※ 제조물책임법은 보험 가입을 <strong>의무화하지 않았다<\/strong>고 알려져 있습니다(2002년 자료 기준, 현행 재확인 필요). 그래서 작은 재제조 업체는 무보험인 경우가 있을 수 있습니다.<\/p>\n<\/blockquote>\n<h2>3. 세계는?<\/h2>\n<table>\n<thead>\n<tr>\n<th>지역<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>유럽(업계 정의)<\/strong><\/td>\n<td>유럽 재제조 업계는 재제조 부품이 <strong>새 부품과 같은 보증과 제조물책임<\/strong>을 진다고 정의. 재제조품임을 표시하고 재제조사 이름을 밝히도록 함<\/td>\n<\/tr>\n<tr>\n<td><strong>미국<\/strong><\/td>\n<td>자동차재활용협회(ARA)는 \"재활용 순정 부품을 썼다는 이유만으로 제조사 보증을 거부하는 것은 불법\"이라는 FTC(연방거래위원회) 소비자 안내를 근거로 제조사들의 보증 제한 움직임에 반발(협회 측 주장)<\/td>\n<\/tr>\n<tr>\n<td><strong>미국 주 법안<\/strong><\/td>\n<td>뉴욕주는 사고 수리에 쓴 부품 종류(순정·비순정 등)를 차주에게 <strong>공개<\/strong>하도록 하는 법안을 2025~2026 회기에 추진(통과 여부 미확인)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 교훈: 해외에서 재제조·재활용 부품이 자리 잡은 비결은 <strong>\"새것과 똑같이 책임진다\"는 약속 + 투명한 표시<\/strong>입니다.<\/p>\n<\/blockquote>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>재제조 법적 정의<\/td>\n<td>「환경친화적 산업구조로의 전환촉진에 관한 법률」: 분해·세척·검사·보수·조정·재조립으로 <strong>원래 성능을 유지<\/strong>하는 상태로 만드는 것(3일차)<\/td>\n<\/tr>\n<tr>\n<td>재제조 인증<\/td>\n<td>국가기술표준원이 지정한 평가기관이 재제조 품질을 평가·인증하는 제도 운영(지정 공고 기준). 현행 인증 품목·기준은 추가 확인 필요<\/td>\n<\/tr>\n<tr>\n<td>품질인증 대체부품(참고)<\/td>\n<td>시험기관 시험 → 국토부 지정 <strong>한국자동차부품협회 인증<\/strong> → 교통안전공단 사후 안전검사의 3단계(2025년 8월 금융위 보도자료)<\/td>\n<\/tr>\n<tr>\n<td>소비자 인식<\/td>\n<td>언론 보도: \"재제조 = 중고, 싼 게 비지떡\"이라는 선입견과 순정 부품 고정관념이 시장 활성화를 막는다(과거 보도)<\/td>\n<\/tr>\n<tr>\n<td>보증 사례<\/td>\n<td>현대해상 '에코부품' 상품은 수리 후 <strong>1년 품질보증<\/strong>을 내세움(2019년 보도, 17일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] '불안'을 '보험'으로 바꾸는 3단 패키지<\/h2>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>고객(재제조·재활용 부품 업체)의 고민<\/th>\n<th>설계사가 제안할 것<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 사고 대비<\/td>\n<td>\"우리 부품 때문에 사고 나면 회사가 망한다\"<\/td>\n<td><strong>생산물배상책임보험(PL)<\/strong> — 부품 제조·공급업체도 가입 대상. 수출한다면 해외 PL도 검토<\/td>\n<\/tr>\n<tr>\n<td>② 보증 비용 대비<\/td>\n<td>\"보증해주고 싶은데 고장 나면 교체비가 감당 안 된다\"<\/td>\n<td><strong>품질보증(워런티) 비용을 보험으로 뒷받침<\/strong>하는 구조 → \"1년 보증\"을 자신 있게 내걸 수 있음<\/td>\n<\/tr>\n<tr>\n<td>③ 대량 하자 대비<\/td>\n<td>\"한 로트가 불량이면 전부 회수해야 한다\"<\/td>\n<td><strong>리콜(회수) 비용 보험<\/strong> 검토<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>설계사가 꼭 확인할 3가지<\/strong>\n1. <strong>PL보험에서 빠지는 것<\/strong>: 불량 부품 자체의 교체·회수·검사 비용은 보통 제외 → 별도 대비 필요\n2. <strong>정비소의 위치<\/strong>: 부품을 '장착'한 정비소의 작업 과실은 정비소 배상책임으로 갈 수 있음 → 정비소 보험도 함께 점검\n3. <strong>인증 여부<\/strong>: 인증 받은 재제조품은 보험 심사에서도 유리할 가능성 → 인증 + 보험을 <strong>세트로<\/strong> 영업<\/p>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"재제조 발전기 업체 사장님이 '보증 1년'을 내걸고 싶어 한다. 고장률이 2%라면 1,000개를 팔 때 몇 개가 돌아올까? 그 비용을 보험으로 넘기면 사장님이 얻는 것은 무엇일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>제조물책임(PL)<\/td>\n<td>제품 결함으로 생긴 피해를 제조업자가 과실 여부와 관계없이 배상하는 책임<\/td>\n<\/tr>\n<tr>\n<td>생산물배상책임보험<\/td>\n<td>제조·판매·공급한 제품(부품 포함)의 결함으로 남에게 준 피해를 보상하는 보험<\/td>\n<\/tr>\n<tr>\n<td>품질보증(워런티)<\/td>\n<td>\"일정 기간 고장 나면 고쳐주거나 바꿔준다\"는 판매자·제조사의 약속<\/td>\n<\/tr>\n<tr>\n<td>리콜(회수) 비용 보험<\/td>\n<td>결함 제품을 대량으로 회수할 때 드는 비용을 보상하는 보험<\/td>\n<\/tr>\n<tr>\n<td>재제조 인증<\/td>\n<td>재제조품이 정해진 품질 기준을 충족한다고 지정 기관이 확인해주는 제도<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>부품 결함으로 남이 다쳤을 때 제조업자를 위해 배상금을 내주는 보험은?<\/li>\n<li>생산물배상책임보험이 보통 보상하지 <strong>않는<\/strong> 비용은? (힌트: 불량 부품 자체)<\/li>\n<li>내일 배울 폐차장·재활용 사업장 보험의 '3바구니'는? (15일차 복습)<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>제조물책임법: 과실책임 → 결함 기준 무과실책임 전환<\/td>\n<td>✅ 정부 자료(입법 당시)<\/td>\n<td><a href=\"https://eiec.kdi.re.kr/epic_txt/1999/R9907135.HWP\">KDI 경제정보센터(1999)<\/a> — 현행 조문 재확인 권장<\/td>\n<\/tr>\n<tr>\n<td>제조물책임법은 보험 가입 의무화 안 함<\/td>\n<td>⚠️ 2002년 금감원 자료<\/td>\n<td><a href=\"https://eiec.kdi.re.kr/epic_txt/2002/R0206156.HWP\">KDI 경제정보센터(2002)<\/a> — 현재도 같은지 미확인, 본문에 표시<\/td>\n<\/tr>\n<tr>\n<td>생산물에 부품·원자재 포함, 부품 공급업체 가입 대상<\/td>\n<td>✅ 학술 자료 + 보험사 안내<\/td>\n<td><a href=\"https://koreascience.or.kr/article/JAKO200657710246744.pdf\">한국과학기술정보 논문<\/a>, <a href=\"https://www.chubb.com/kr-kr/business/products-completed-operations-liability-insurance-policy.html\">Chubb 생산물배상<\/a><\/td>\n<\/tr>\n<tr>\n<td>결함 제품 자체의 회수·수리·교체 비용은 보통 면책<\/td>\n<td>✅ 보험사 약관 안내<\/td>\n<td><a href=\"https://www.chubb.com/kr-kr/business/manufacturers-liability-insurance.html\">Chubb 제조물책임<\/a> — 상품별 약관 확인 필요<\/td>\n<\/tr>\n<tr>\n<td>정비소 장착 과실 → 정비업자 배상책임<\/td>\n<td>❓ 직접 자료 못 찾음<\/td>\n<td>일반 원리로 서술하고 \"약관 확인 필요\" 표시<\/td>\n<\/tr>\n<tr>\n<td>재제조 법적 정의<\/td>\n<td>✅ 법령(과거 개정본)<\/td>\n<td><a href=\"https://ko.wikisource.org/wiki/%ED%99%98%EA%B2%BD%EC%B9%9C%ED%99%94%EC%A0%81_%EC%82%B0%EC%97%85%EA%B5%AC%EC%A1%B0%EB%A1%9C%EC%9D%98_%EC%A0%84%ED%99%98%EC%B4%89%EC%A7%84%EC%97%90_%EA%B4%80%ED%95%9C_%EB%B2%95%EB%A5%A0\">위키문헌 법령<\/a> — 현행 조문 재확인 필요<\/td>\n<\/tr>\n<tr>\n<td>국가기술표준원 지정 평가기관의 재제조 인증<\/td>\n<td>⚠️ 정부 공고 문서<\/td>\n<td><a href=\"https://www.motir.go.kr/kor/article/ATCLa6723dc7b/500/view\">산업통상자원부<\/a> — 현행 인증 품목·기준 미확인<\/td>\n<\/tr>\n<tr>\n<td>품질인증부품 3단계 인증 체계<\/td>\n<td>✅ 금융위 보도자료(2025.8)<\/td>\n<td><a href=\"https://www.fsc.go.kr/no010101/85055?curPage=9\">금융위원회<\/a><\/td>\n<\/tr>\n<tr>\n<td>\"재제조 = 중고\" 선입견<\/td>\n<td>⚠️ 과거 언론 보도<\/td>\n<td><a href=\"https://newstomato.com/ReadNews.aspx?no=400931\">뉴스토마토<\/a><\/td>\n<\/tr>\n<tr>\n<td>유럽 업계: 재제조품 = 새 부품과 같은 보증·PL<\/td>\n<td>⚠️ 업계 단체 자료(날짜 미상)<\/td>\n<td><a href=\"https://exhibitorsearch.messefrankfurt.com/images/original/mics/10000007202401/0015055733/1651134983181_APRA_Flyer_2021_EN.pdf\">APRA Europe 소개 자료<\/a><\/td>\n<\/tr>\n<tr>\n<td>ARA·FTC: 재활용 순정 부품 사용만으로 보증 거부 불법<\/td>\n<td>⚠️ 협회 측 주장 인용<\/td>\n<td><a href=\"https://www.bodyshopbusiness.com/automotive-recyclers-association-blasts-toyota-position-statement-on-recycled-parts/\">BodyShop Business<\/a><\/td>\n<\/tr>\n<tr>\n<td>뉴욕주 부품 종류 공개 법안<\/td>\n<td>❓ 통과 여부 미확인<\/td>\n<td><a href=\"https://legislation.nysenate.gov/pdf/bills/2025/A75\">뉴욕주 상원<\/a><\/td>\n<\/tr>\n<tr>\n<td>재제조 부품 보증기간 국내 기준<\/td>\n<td>❓ 못 찾음<\/td>\n<td>본문에 기간 숫자 넣지 않음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 처음엔 \"재제조 부품 보증기간은 보통 1년\"이라고 쓰려 했으나 근거가 현대해상 '에코부품' 한 사례뿐이라 <strong>일반화하지 않고 사례로만<\/strong> 표기\n- 2010년 기준 재제조 시장 규모(7,500억 원)는 너무 오래된 수치라 본문에서 제외\n- '품질보증보험'은 국내에 재제조 부품 전용 상품이 있는지 확인하지 못해 <strong>\"워런티 비용을 보험으로 뒷받침하는 구조\"<\/strong> 라는 개념으로만 설명\n- 생각거리의 고장률 2%는 실제 통계가 아닌 <strong>계산 연습용 가정<\/strong>임 (실제 재제조품 고장률 자료는 못 찾음)<\/p>"}, {"day": 19, "title": "19일차 — 폐차장·재활용 사업장 보험 (화재·배상·환경): 재활용 현장의 위험은? (2026-10-24)", "md": "<h1>19일차 — 폐차장·재활용 사업장 보험 (화재·배상·환경): 재활용 현장의 위험은? (2026-10-24)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>생산물배상책임보험(PL보험)<\/strong>.<\/li>\n<li><strong>불량 부품 자체의 교체·회수·검사 비용<\/strong>(결함 제품 자체 손해).<\/li>\n<li><strong>① 재산(내 물건) ② 배상책임(남의 피해) ③ 기업휴지(멈춘 동안의 손실)<\/strong>.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"폐차장은 '기름·배터리·고철·사람·이웃'이 한 마당에 모인 곳이다. 그래서 보험도 한 장이 아니라 '세트'여야 한다. 그리고 지금 세계 보험시장은 이 업종을 '받기 어려운 위험'으로 본다. 위험 관리를 증명하는 업체만 좋은 조건을 받는다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>폐차장의 3대 위험: <strong>화재<\/strong>(기름·배터리), <strong>사람<\/strong>(해체 작업 중 사고), <strong>환경<\/strong>(기름·냉매·폐액 유출)<\/td>\n<td>15일차 '3바구니' + 사람·환경<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>세계 재활용·폐기물 보험시장은 <strong>'하드 마켓'<\/strong>(보험료↑·자기부담금↑·보험사 수↓). 주원인은 <strong>리튬이온 배터리 화재<\/strong><\/td>\n<td>10일차: 재활용 시설 화재 272건(2016) → 430건(2024)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>보험사는 이제 <strong>\"화재 설비·대응 매뉴얼·직원 교육 증거\"<\/strong> 를 요구 → 설계사의 역할은 <strong>보험 판매 + 위험관리 자료 정리<\/strong><\/td>\n<td>11일차 \"보험사가 원하는 것은 증거\"의 현장 버전<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 폐차장 하루를 따라가며 보는 위험 지도<\/h2>\n<table>\n<thead>\n<tr>\n<th>작업 단계<\/th>\n<th>무슨 일이?<\/th>\n<th>생기는 위험<\/th>\n<th>맞는 보험<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 입고·보관<\/td>\n<td>사고차·폐차·전기차 입고, 야적<\/td>\n<td>보관 중 화재·도난, 고객 차량 파손<\/td>\n<td>화재보험, <strong>보관자(수탁자) 배상책임<\/strong><\/td>\n<\/tr>\n<tr>\n<td>② 폐액 제거<\/td>\n<td>연료·엔진오일·냉각수·냉매 빼기<\/td>\n<td><strong>화재<\/strong>(작업 중 발화), 토양·수질 오염<\/td>\n<td>화재보험, <strong>환경오염배상책임<\/strong><\/td>\n<\/tr>\n<tr>\n<td>③ 배터리 분리<\/td>\n<td>납축·리튬이온 배터리 분리·보관<\/td>\n<td>열폭주 화재(20일차)<\/td>\n<td>화재보험(설비 조건), 휴업손해<\/td>\n<\/tr>\n<tr>\n<td>④ 해체·부품 회수<\/td>\n<td>부품 떼기, 중고부품 판매<\/td>\n<td>작업자 부상, 판매 부품 하자<\/td>\n<td><strong>산재보험<\/strong>·근로자재해보장, <strong>생산물배상(18일차)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>⑤ 압축·운송<\/td>\n<td>차체 압축, 고철 운반<\/td>\n<td>운송 중 사고·적재물 낙하<\/td>\n<td>자동차보험(업무용), 적재물배상<\/td>\n<\/tr>\n<tr>\n<td>⑥ 이웃<\/td>\n<td>연기·소음·악취<\/td>\n<td>주민 피해, 영업 허가 문제<\/td>\n<td><strong>영업배상·환경오염배상<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 실제 사례(2026년 6월 보도): 경기 양주 폐차장 화재로 차량 <strong>20대 전소<\/strong>. <strong>차량 기름 제거 작업 중<\/strong> 불이 시작됐을 가능성으로 조사.<\/p>\n<p>※ 폐차 더미는 차체가 여러 겹으로 쌓여 있어 <strong>안쪽에서 시작된 열이 겉으로 드러나기까지 오래 걸릴 수 있다<\/strong>는 업체 설명도 있습니다(마케팅 자료라 참고만).<\/p>\n<\/blockquote>\n<h2>3. 세계는? — \"받기 어려운 업종\"<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>시장 상황<\/td>\n<td>미국 보험 중개사 보고서: 폐기물·재활용 업종은 대부분 보험 종목에서 <strong>하드 마켓<\/strong>. 리튬이온 화재, 업무용 차량 사고, 거액 배상 판결이 주원인<\/td>\n<\/tr>\n<tr>\n<td>보험료<\/td>\n<td>2025년 이 업종 재산보험료 <strong>10~75% 인상<\/strong> 전망(중개사 전망)<\/td>\n<\/tr>\n<tr>\n<td>자기부담금<\/td>\n<td>예전 5만~10만 달러 → 이제 <strong>25만 달러 이상<\/strong>이 보통(10일차와 같은 출처 계열)<\/td>\n<\/tr>\n<tr>\n<td>보험사 수<\/td>\n<td>재활용 선별시설(MRF)을 받는 보험사가 <strong>약 20곳 → 약 10곳<\/strong>으로 줄었다는 보도<\/td>\n<\/tr>\n<tr>\n<td>심사 요구<\/td>\n<td>공학적 <strong>화재 제어 설비<\/strong>, 문서화된 <strong>대응 절차<\/strong>, <strong>직원 교육<\/strong> 증거<\/td>\n<\/tr>\n<tr>\n<td>영국<\/td>\n<td>폐기물·재활용 차량(플릿)은 일반 시장에서 가장 보험 넣기 어려운 업무용 자동차 위험이라는 조사(2026년 8월 보도)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 위 자료는 폐차장만이 아니라 <strong>폐기물·재활용 시설 전체<\/strong> 기준입니다. 폐차장도 비슷한 흐름일 가능성이 크지만, 폐차장만 따로 본 통계는 찾지 못했습니다.<\/p>\n<\/blockquote>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>폐차장 화재 통계<\/td>\n<td><strong>전국 폐차장 화재만 따로 집계한 공개 통계는 이번 조사에서 찾지 못함<\/strong><\/td>\n<\/tr>\n<tr>\n<td>배터리 화재 증가<\/td>\n<td>한국화재보험협회: 특수건물 화재 2,868건 중 <strong>7.5%(215건)<\/strong> 가 배터리 원인(2025년 발표, 폐차장 제외 통계)<\/td>\n<\/tr>\n<tr>\n<td>환경책임보험(의무)<\/td>\n<td>「환경오염피해 배상책임 및 구제에 관한 법률」에 따라 대기·수질 배출시설, 폐기물처리시설, 일정 규모 이상 석유류 저장시설 등이 <strong>의무 가입<\/strong>. 보장 한도는 위험도에 따라 가군 300억 원, 나군 100억 원(소기업 80억), 다군 50억 원(소기업 30억)(입법 당시 기준)<\/td>\n<\/tr>\n<tr>\n<td>폐차장이 의무 대상인가?<\/td>\n<td><strong>확인 못 함<\/strong>. 사업장의 배출시설·저장시설 규모에 따라 달라질 수 있어 <strong>사업장별로 시행령 별표를 확인<\/strong>해야 함<\/td>\n<\/tr>\n<tr>\n<td>재난배상책임보험<\/td>\n<td>15일차: 물류창고 등 다중이용시설 의무. 폐차장 해당 여부는 역시 미확인<\/td>\n<\/tr>\n<tr>\n<td>산재보험<\/td>\n<td>근로자를 고용한 사업장은 원칙적으로 산재보험 적용(일반 원칙). 해체 작업이 많은 폐차장은 <strong>민간 근로자재해보장보험<\/strong>으로 보완 검토<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 폐차장 '보험 세트' 설계 순서<\/h2>\n<table>\n<thead>\n<tr>\n<th>순서<\/th>\n<th>할 일<\/th>\n<th>핵심 질문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 의무부터<\/td>\n<td>환경책임·재난배상·산재 등 <strong>의무 보험 해당 여부<\/strong> 확인<\/td>\n<td>\"과태료·영업정지 위험은 없나?\"<\/td>\n<\/tr>\n<tr>\n<td>② 화재<\/td>\n<td>건물·설비·<strong>야적 차량·부품 재고<\/strong>까지 가입금액 산정(15일차: 일부보험 주의)<\/td>\n<td>\"다 타면 얼마를 잃나?\"<\/td>\n<\/tr>\n<tr>\n<td>③ 배상<\/td>\n<td>영업배상 + 보관자 배상(고객 차) + 환경오염배상<\/td>\n<td>\"이웃·고객에게 피해를 주면?\"<\/td>\n<\/tr>\n<tr>\n<td>④ 휴업<\/td>\n<td>기업휴지(휴업)손해<\/td>\n<td>\"3개월 멈추면 월급·임대료는?\"<\/td>\n<\/tr>\n<tr>\n<td>⑤ 사람·차<\/td>\n<td>산재 보완, 업무용 자동차·적재물<\/td>\n<td>\"해체 작업 중 다치면?\"<\/td>\n<\/tr>\n<tr>\n<td>⑥ 증거 패키지<\/td>\n<td>소화설비·열감지·배터리 분리 보관 절차·교육 기록 정리<\/td>\n<td>\"보험사가 '받고 싶은' 업체인가?\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>한 줄 영업 화법<\/strong><\/p>\n<blockquote>\n<p>\"사장님, 요즘 보험사들이 재활용 업종을 잘 안 받으려 합니다. 그런데 <strong>배터리 따로 보관, 열감지기, 교육 기록<\/strong>만 갖춰도 조건이 달라집니다. 서류 정리는 제가 도와드릴게요.\"<\/p>\n<p>▶ 오늘의 생각거리: \"폐차장 사장님이 '보험료가 너무 올랐다'고 한다. 보험료를 깎아달라고 보험사와 싸우는 것과, 위험관리 증거를 만들어 '좋은 위험'으로 바꾸는 것 중 어느 쪽이 오래가는 해법일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>하드 마켓<\/td>\n<td>보험사가 위험을 덜 받으려 해서 보험료·자기부담금이 오르고 조건이 까다로워진 시장<\/td>\n<\/tr>\n<tr>\n<td>환경책임보험<\/td>\n<td>환경오염 피해를 배상하기 위해 일정 시설이 의무로 가입하는 보험<\/td>\n<\/tr>\n<tr>\n<td>보관자(수탁자) 배상책임<\/td>\n<td>남의 물건(고객 차량)을 맡아 보관하다 생긴 손해를 보상<\/td>\n<\/tr>\n<tr>\n<td>야적<\/td>\n<td>물건을 건물 밖 마당에 쌓아두는 것. 폐차장 화재의 주요 장소<\/td>\n<\/tr>\n<tr>\n<td>위험관리(리스크 관리)<\/td>\n<td>사고 가능성과 피해 규모를 줄이는 활동. 보험 조건을 좋게 만드는 '증거'가 됨<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>보험료·자기부담금이 오르고 보험사가 위험을 덜 받으려는 시장을 무엇이라 하나?<\/li>\n<li>2026년 6월 양주 폐차장 화재는 어떤 작업 중에 시작됐을 가능성이 거론됐나?<\/li>\n<li>재활용 업종 보험 심사에서 보험사가 요구하는 '증거' 3가지는?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>양주 폐차장 화재(2026.6), 차량 20대 전소, 기름 제거 작업 중 발화 가능성<\/td>\n<td>✅ 언론 보도<\/td>\n<td><a href=\"https://www.segye.com/newsView/20260602515958\">세계일보 2026.6<\/a> — 원인은 조사 중<\/td>\n<\/tr>\n<tr>\n<td>폐차 더미 내부 열이 늦게 드러남<\/td>\n<td>⚠️ 업체 블로그(마케팅)<\/td>\n<td><a href=\"https://www.alchera.ai/resource/blog/fs-junkyard-site-ai-fire-detection-system-introduction\">Alchera 블로그<\/a><\/td>\n<\/tr>\n<tr>\n<td>특수건물 화재 2,868건 중 배터리 215건(7.5%)<\/td>\n<td>⚠️ 보도(화재보험협회 인용)<\/td>\n<td><a href=\"https://v.daum.net/v/20250829103613646\">다음뉴스 2025.8<\/a> — 폐차장 제외<\/td>\n<\/tr>\n<tr>\n<td>전국 폐차장 화재 통계<\/td>\n<td>❓ 못 찾음<\/td>\n<td>본문에 \"찾지 못함\" 명시<\/td>\n<\/tr>\n<tr>\n<td>폐기물·재활용 하드 마켓, 재산 10~75% 인상 전망, 자기부담금 25만 달러+<\/td>\n<td>⚠️ 보험 중개사 보고서<\/td>\n<td><a href=\"https://www.risk-strategies.com/state-of-the-insurance-market-2025-outlook-waste-and-recycling\">Risk Strategies 2025<\/a>, <a href=\"https://www.businessinsurance.com/lithium-batteries-fuel-fires-at-waste-facilities/\">Business Insurance<\/a> — 중개사 시각<\/td>\n<\/tr>\n<tr>\n<td>MRF 보험사 약 20곳 → 약 10곳<\/td>\n<td>⚠️ 업계지<\/td>\n<td><a href=\"https://resource-recycling.com/recycling/?p=16056\">Resource Recycling<\/a> — 폐차장이 아닌 선별시설 기준<\/td>\n<\/tr>\n<tr>\n<td>재활용 시설 화재 272건 → 430건<\/td>\n<td>⚠️ 업체 집계(Fire Rover)<\/td>\n<td>10일차와 동일<\/td>\n<\/tr>\n<tr>\n<td>영국 폐기물·재활용 플릿 보험 가장 어려움(2026.8)<\/td>\n<td>⚠️ 업계지(MGA 조사)<\/td>\n<td><a href=\"https://www.insurancebusinessmag.com/uk/news/breaking-news/waste-hazardous-and-recycling-fleets-remain-the-hardest-commercial-motor-risks-to-place-586425.aspx\">Insurance Business<\/a><\/td>\n<\/tr>\n<tr>\n<td>환경책임보험 법적 근거·의무 시설 유형·가입금액(가 300억/나 100억/다 50억)<\/td>\n<td>⚠️ 입법 당시 보도·지자체 자료<\/td>\n<td><a href=\"https://m.go.seoul.co.kr/news/2014/12/31/20141231024009\">서울신문 2014<\/a>, <a href=\"https://www.incheon.go.kr/media/4/7394\">인천시<\/a>, <a href=\"https://www.jjan.kr/article/20160616584279\">전북일보 2016<\/a> — 현행 시행령 재확인 필요<\/td>\n<\/tr>\n<tr>\n<td>폐차장(자동차해체재활용업)의 환경책임보험 의무 여부<\/td>\n<td>❓ 확인 못 함<\/td>\n<td>본문에 \"사업장별 확인 필요\" 명시<\/td>\n<\/tr>\n<tr>\n<td>근로자 고용 사업장 산재보험 적용<\/td>\n<td>✅ 일반 원칙<\/td>\n<td>산업재해보상보험법 일반 원칙 — 예외 조항은 별도 확인<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- \"폐차장 화재가 매년 늘고 있다\"는 문장을 쓰려 했으나 <strong>폐차장만의 통계가 없어<\/strong> 삭제하고, 대신 '재활용 시설 전체'와 '특수건물 배터리 화재' 통계임을 명확히 구분\n- 해외 하드 마켓 수치는 <strong>폐기물·재활용 업종 전체<\/strong> 기준임을 본문 박스에 명시\n- 환경책임보험 가입금액은 <strong>입법 당시(2014~2016년) 기준<\/strong>이라 ⚠️ 표시, 폐차장 의무 대상 여부는 추측하지 않음\n- 15일차의 \"폐차장 재난배상책임 의무 여부 ❓\"는 오늘도 확인하지 못해 그대로 ❓ 유지<\/p>"}, {"day": 20, "title": "20일차 — 폐배터리 리스크와 보험 (보관·운송·화재): 신규 의무보험은 어디에 생기나? (2026-10-25)", "md": "<h1>20일차 — 폐배터리 리스크와 보험 (보관·운송·화재): 신규 의무보험은 어디에 생기나? (2026-10-25)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>하드 마켓<\/strong>.<\/li>\n<li><strong>차량 기름(연료) 제거 작업<\/strong> 중 발화 가능성(2026년 6월 양주 폐차장 화재, 원인 조사 중).<\/li>\n<li><strong>화재 제어 설비, 문서화된 대응 절차, 직원 교육 기록<\/strong>.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"폐배터리는 '보관 → 운송 → 처리' 세 곳에서 불이 날 수 있다. 그리고 2027년부터 한국에는 '재사용 배터리 사업자는 보험(공제)에 꼭 들어야 한다'는 법이 시작될 예정이다. 새 의무보험 시장이 바로 여기다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>폐배터리 위험은 <strong>3단계<\/strong>: ① 보관(폐차장·창고) ② 운송(트럭·배·비행기) ③ 처리(재활용·재사용 공장)<\/td>\n<td>각 단계마다 필요한 보험이 다름<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>사용후배터리법<\/strong>(2026년 4월 23일 국회 통과): 재사용사업자 <strong>등록 + 보험 또는 공제 가입 의무<\/strong>. 시행은 <strong>2027년 7월<\/strong> 예정(하위 법령 정비 중)<\/td>\n<td>\"보험이 없으면 사업을 못 한다\" = 의무보험 시장 탄생<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>손상된 리튬 배터리는 <strong>위험물<\/strong>이라 운송 규칙이 엄격하고(2025년 국제 규정 강화), 보험사는 <strong>분리 보관·감지 설비<\/strong> 증거를 요구<\/td>\n<td>19일차 '증거 패키지'의 배터리 버전<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 폐배터리 3단계 위험 지도<\/h2>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>어디서?<\/th>\n<th>왜 위험?<\/th>\n<th>맞는 보험<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 보관<\/td>\n<td>폐차장, 정비소, 배터리 회수 창고<\/td>\n<td>찌그러지거나 침수된 배터리가 <strong>열폭주<\/strong>(스스로 뜨거워져 불이 번지는 현상)<\/td>\n<td>화재보험(설비 조건), 휴업손해, 보관자 배상<\/td>\n<\/tr>\n<tr>\n<td>② 운송<\/td>\n<td>트럭(국내), 컨테이너선·항공(수출)<\/td>\n<td>위험물 규정 위반·포장 불량 시 운송 중 화재<\/td>\n<td>적재물·화물보험, 운송업자 배상책임<\/td>\n<\/tr>\n<tr>\n<td>③ 처리<\/td>\n<td>재활용 공장(블랙매스), 재사용 업체(ESS)<\/td>\n<td>파쇄·저장 중 화재, 재사용 제품의 성능·안전 문제<\/td>\n<td>재산·휴업, 환경오염배상, 생산물배상(18일차), <strong>재사용사업자 의무보험<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 6일차 복습: 2021년 이후 등록 전기차는 배터리 반납 의무가 없어 <strong>폐차장에 배터리가 쌓이는 중<\/strong> → ① 보관 위험이 커지는 이유.<\/p>\n<\/blockquote>\n<h2>3. 세계는?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>운송 규정 강화<\/td>\n<td>2025년 1월 1일부터 개정 위험물 규정 시행: 리튬·나트륨 배터리의 <strong>포장·표시·서류 요건<\/strong> 강화. 도로·철도는 2025년 6월 30일까지 전환기간, 항공은 즉시 적용<\/td>\n<\/tr>\n<tr>\n<td>손상 배터리<\/td>\n<td>국제 특송사(DHL 등)는 <strong>손상·결함 의심 리튬 배터리 운송 불가<\/strong> → 폐배터리는 일반 택배로 못 보냄, 전문 위험물 운송 필요<\/td>\n<\/tr>\n<tr>\n<td>해상 운송<\/td>\n<td>세계선사협의회(WSC): 면제 기준을 충족한 소형 배터리를 한 컨테이너에 무제한으로 실을 수 있는 <strong>규정 허점<\/strong> 지적. 알리안츠 통계로 <strong>컨테이너선 화재가 약 17일에 1번<\/strong><\/td>\n<\/tr>\n<tr>\n<td>재활용 시설 보험<\/td>\n<td>하드 마켓 지속(19일차). 일부 운영자는 <strong>화재 피해를 줄이는 설비 + 검증 가능한 사고 데이터<\/strong>로 보험료 인하를 협상했다는 업계 보고<\/td>\n<\/tr>\n<tr>\n<td>유럽<\/td>\n<td>유럽보험협회: 모범 관행을 따른다고 <strong>보험 가입이 보장되지는 않는다<\/strong>는 문제를 지적, 2025년 폐리튬배터리 취급 업계 지침 언급<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사용후배터리법<\/td>\n<td>2026년 4월 23일 국회 본회의 통과(6일차). 재사용사업자 <strong>등록 의무 + 보험 또는 공제 가입 의무<\/strong><\/td>\n<\/tr>\n<tr>\n<td>시행 시기<\/td>\n<td><strong>2027년 7월 시행 예정<\/strong>, 기후에너지환경부·국토교통부·산업통상부가 하위 법령(시행령) 기준을 조율 중(2026년 10월 보도)<\/td>\n<\/tr>\n<tr>\n<td>보험 세부 기준<\/td>\n<td>가입 금액·대상 범위·담보 내용은 <strong>시행령이 나와야 확정<\/strong> → 아직 미확인<\/td>\n<\/tr>\n<tr>\n<td>과거 문제<\/td>\n<td>2023년 보도: 재사용에 대한 <strong>책임보험 제도가 없어<\/strong> 기업들이 사업에 나서기 어렵다는 지적 → 법이 이 빈칸을 채우는 셈<\/td>\n<\/tr>\n<tr>\n<td>재사용전지 안전검사<\/td>\n<td>안전성검사를 받은 재사용전지만 판매(11일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 2027년 7월까지 설계사가 할 일<\/h2>\n<table>\n<thead>\n<tr>\n<th>시기<\/th>\n<th>할 일<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>지금 ~ 시행령 발표<\/td>\n<td>재사용·재활용·배터리 회수 업체 <strong>목록 만들기<\/strong>, 관계 쌓기<\/td>\n<td>의무화되면 모든 업체가 한꺼번에 보험을 찾음<\/td>\n<\/tr>\n<tr>\n<td>시행령 발표 후<\/td>\n<td>보험 가입 금액·담보 기준 확인 → 손보사 상품 비교<\/td>\n<td>\"법 기준을 충족하는 상품\"을 가장 먼저 설명할 수 있어야 함<\/td>\n<\/tr>\n<tr>\n<td>상시<\/td>\n<td>폐차장·정비소에 <strong>배터리 분리 보관 구역, 열감지, 소화 설비<\/strong> 점검 제안<\/td>\n<td>의무보험 외 화재보험 인수 조건 개선<\/td>\n<\/tr>\n<tr>\n<td>수출 업체<\/td>\n<td>위험물 운송 규정 준수 여부 + 적재물·화물보험 확인<\/td>\n<td>운송 중 사고는 화주·운송사 모두 책임 가능<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>영업 한 줄<\/strong><\/p>\n<blockquote>\n<p>\"사장님, 내년 7월부터 재사용 배터리 사업은 보험 없이는 등록이 안 될 예정입니다. 기준이 나오는 대로 바로 맞는 상품을 비교해 드릴게요. 그 전에 지금 창고 화재 위험부터 같이 점검해 보시죠.\"<\/p>\n<p>▶ 오늘의 생각거리: \"의무보험이 생기면 모든 업체가 '가장 싼 보험'을 찾을까, '가장 잘 보장하는 보험'을 찾을까? 내가 차별화할 수 있는 지점은 어디일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>열폭주<\/td>\n<td>배터리 내부 온도가 스스로 계속 올라가 불이 번지는 현상<\/td>\n<\/tr>\n<tr>\n<td>위험물 운송 규정<\/td>\n<td>화재·폭발 위험 물질의 포장·표시·서류를 정한 국제·국내 규칙<\/td>\n<\/tr>\n<tr>\n<td>재사용사업자<\/td>\n<td>다 쓴 전기차 배터리를 ESS 등 다른 용도로 다시 쓰는 사업자. 보험(공제) 가입 의무<\/td>\n<\/tr>\n<tr>\n<td>공제<\/td>\n<td>보험과 비슷하게 회원들이 돈을 모아 사고 시 보상하는 제도(협회·조합 등이 운영)<\/td>\n<\/tr>\n<tr>\n<td>하위 법령(시행령)<\/td>\n<td>법률의 세부 기준(금액·대상·절차)을 정하는 규정. 의무보험의 '진짜 내용'이 여기서 정해짐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에) — 내일은 3주차 복습!<\/h2>\n<ol>\n<li>사용후배터리법에서 재사용사업자가 꼭 가입해야 하는 것은?<\/li>\n<li>사용후배터리법은 언제 시행될 예정인가? (2026년 10월 보도 기준)<\/li>\n<li>폐배터리 위험 3단계는?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사용후배터리법 2026.4.23 국회 본회의 통과<\/td>\n<td>✅ 보도(6일차와 일치)<\/td>\n<td><a href=\"https://www.heraldk.com/article/2026042302202453419\">헤럴드경제<\/a><\/td>\n<\/tr>\n<tr>\n<td>재사용사업자 등록 + 보험 또는 공제 가입 의무<\/td>\n<td>⚠️ 법무법인 입법 분석<\/td>\n<td><a href=\"https://www.daeryunlaw.com/trend/11883\">법무법인 대륜<\/a> — 공포 법률 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>2027년 7월 시행 예정, 3개 부처 하위 법령 조율<\/td>\n<td>⚠️ 언론 보도(2026.10)<\/td>\n<td><a href=\"https://www.metroseoul.co.kr/article/20261001500365\">메트로서울<\/a> — 정확한 시행일은 공포본 확인 필요<\/td>\n<\/tr>\n<tr>\n<td>보험 가입 금액·대상 세부 기준<\/td>\n<td>❓ 미확정<\/td>\n<td>시행령 미발표 — 본문에 \"미확인\" 명시<\/td>\n<\/tr>\n<tr>\n<td>2023년 재사용 책임보험 부재 지적<\/td>\n<td>⚠️ 과거 보도<\/td>\n<td><a href=\"https://newstomato.com/ReadNews.aspx?no=1213154\">뉴스토마토<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025.1.1 위험물 규정 개정(리튬·나트륨), 도로·철도 6.30까지 전환<\/td>\n<td>⚠️ 인증기관 안내<\/td>\n<td><a href=\"https://www.dekra.nl/en/new-regulations-transporting-batteries/\">DEKRA<\/a> — 유럽 ADR 기준, 한국 국내 운송 기준은 미확인<\/td>\n<\/tr>\n<tr>\n<td>손상·결함 의심 리튬 배터리 운송 불가(DHL)<\/td>\n<td>✅ 운송사 공식 안내<\/td>\n<td><a href=\"https://mydhl.express.dhl/kr/ko/help-and-support/shipping-advice/what-can-i-ship/lithium-batteries.html\">DHL<\/a><\/td>\n<\/tr>\n<tr>\n<td>WSC 규정 허점 지적, 컨테이너선 화재 약 17일에 1번(알리안츠)<\/td>\n<td>⚠️ 업계지 인용<\/td>\n<td><a href=\"https://www.marineinsight.com/world-shipping-council-calls-on-governments-to-close-battery-cargo-safety-gap/\">Marine Insight<\/a>, <a href=\"https://www.dcvelocity.com/transportation/regulation-government/wsc-calls-on-governments-to-put-tighter-cap-on-shipping-lithium-batteries-in-cargo-containers\">DC Velocity<\/a><\/td>\n<\/tr>\n<tr>\n<td>화재 저감 설비로 보험료 인하 협상 사례<\/td>\n<td>⚠️ 업체(Fire Rover) 보고<\/td>\n<td><a href=\"https://resource-recycling.com/plastics/2025/08/13/fires-at-recycling-sites-on-track-to-reach-record-high/\">Resource Recycling<\/a
