> — 이해관계 있는 업체 자료<\/td>\n<\/tr>\n<tr>\n<td>유럽보험협회: 모범 관행 ≠ 보험 가입 보장<\/td>\n<td>✅ 협회 연차보고서<\/td>\n<td><a href=\"https://reports.insuranceeurope.eu/annual-report-2024-2025/s/83/battery-fire-risks\">Insurance Europe<\/a><\/td>\n<\/tr>\n<tr>\n<td>한국 폐배터리 국내 운송 기준·적재물보험 약관<\/td>\n<td>❓ 못 찾음<\/td>\n<td>본문에서 국내 기준 숫자 없이 서술<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 6일차의 \"공포 후 1년 뒤 시행 예정\"을 <strong>\"2027년 7월 시행 예정(2026년 10월 보도)\"<\/strong> 으로 구체화하되, 공포본 미확인이라 ⚠️ 유지\n- 의무보험의 가입 금액·담보 범위는 시행령이 없어 <strong>숫자를 만들지 않음<\/strong>\n- 2025년 위험물 운송 규정 개정은 <strong>유럽(ADR) 기준<\/strong>이라 한국 국내 운송에 그대로 적용된다고 쓰지 않음\n- 생각거리의 \"의무보험 = 가격 경쟁\" 여부는 근거 자료가 없어 <strong>질문 형태로만<\/strong> 제시<\/p>"}, {"day": 21, "title": "21일차 — 3주차 복습 퀴즈: 보험이 들어가는 자리 한 장으로 (2026-10-26)", "md": "<h1>21일차 — 3주차 복습 퀴즈: 보험이 들어가는 자리 한 장으로 (2026-10-26)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>보험 또는 공제<\/strong> 가입(+ 재사용사업자 등록).<\/li>\n<li><strong>2027년 7월<\/strong> 시행 예정(2026년 10월 보도 기준, 하위 법령 정비 중).<\/li>\n<li><strong>① 보관 ② 운송 ③ 처리(재활용·재사용)<\/strong>.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 15분 (퀴즈 포함) · 오늘의 한 줄: <strong>\"3주차의 결론: 보험은 자동차 재활용의 '입구(전손·잔존물)', '중간(부품 수리·품질)', '현장(폐차장·배터리)' 세 곳에 들어간다. 그리고 어디서든 보험사가 원하는 것은 '위험을 줄였다는 증거'다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 3주차를 3줄로<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>배운 날<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>손해보험은 <strong>실제 손해만큼<\/strong>(실손 보상). 사업장 보험은 <strong>재산·배상·휴업<\/strong> 3바구니<\/td>\n<td>15일차<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>전손차는 보험사 소유(잔존물 대위) → 잔존물이 <strong>재활용의 출발점<\/strong>, 수리용 중고부품의 공급원. 그런데 대체부품 사용률은 <strong>0.019%<\/strong><\/td>\n<td>16·17일차<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>재제조 부품(PL보험), 폐차장(하드 마켓), 폐배터리(2027년 의무보험) 모두 <strong>\"증거를 갖춘 업체만 좋은 조건\"<\/strong><\/td>\n<td>18~20일차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 한 장 지도: 자동차 재활용 흐름 위의 보험<\/h2>\n<table>\n<thead>\n<tr>\n<th>흐름 단계<\/th>\n<th>일어나는 일<\/th>\n<th>들어가는 보험<\/th>\n<th>배운 날<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 사고<\/td>\n<td>전손 판정 → 보험금 지급<\/td>\n<td>자동차보험(자차)<\/td>\n<td>16일차<\/td>\n<\/tr>\n<tr>\n<td>② 잔존물<\/td>\n<td>보험사가 사고차 권리 취득 → 매각<\/td>\n<td>(보험사 회수금 → 손해율 개선)<\/td>\n<td>16일차<\/td>\n<\/tr>\n<tr>\n<td>③ 부품 재사용<\/td>\n<td>중고·재제조·대체부품으로 수리<\/td>\n<td>친환경부품 특약, 대체부품 25% 환급<\/td>\n<td>17일차<\/td>\n<\/tr>\n<tr>\n<td>④ 부품 품질<\/td>\n<td>하자·사고 시 책임<\/td>\n<td>생산물배상(PL), 품질보증·리콜 보험<\/td>\n<td>18일차<\/td>\n<\/tr>\n<tr>\n<td>⑤ 폐차장 현장<\/td>\n<td>화재·오염·작업자 사고<\/td>\n<td>화재·영업배상·환경오염배상·산재 보완<\/td>\n<td>19일차<\/td>\n<\/tr>\n<tr>\n<td>⑥ 배터리<\/td>\n<td>보관·운송·처리 중 화재<\/td>\n<td>화재·적재물·<strong>재사용사업자 의무보험(2027.7 예정)<\/strong><\/td>\n<td>20일차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. 3주차 복습 퀴즈 15문항 (정답은 맨 아래)<\/h2>\n<p><strong>[손해보험 기초] 15일차<\/strong>\n1. 손해보험이 실제 생긴 손해만큼만 보상하는 원칙을 무엇이라 하나?\n2. 가치 10억 원 창고를 5억 원만 가입했고 2억 원 손해가 났다. 원칙적으로 얼마를 받나?\n3. 받은 보험료 대비 지급한 보험금 비율은?<\/p>\n<p><strong>[전손·잔존물] 16일차<\/strong>\n4. 수리 불가이거나 수리비가 차값 이상인 손해는?\n5. 보험금을 전부 준 보험사가 사고차 권리를 넘겨받는 것은? (상법 몇 조?)\n6. 한국 자동차보험 전손 보험금의 차값 기준표는?<\/p>\n<p><strong>[부품] 17·18일차<\/strong>\n7. 품질인증 대체부품으로 외장 부품을 고치면 순정값의 몇 %를 돌려받나?\n8. 대형 5개 손보사의 1년간 품질인증부품 수리 비율은 대략?\n9. 부품 결함으로 남이 다쳤을 때 제조업자 대신 배상하는 보험은?\n10. 9번 보험이 보통 보상하지 <strong>않는<\/strong> 비용은?<\/p>\n<p><strong>[현장·배터리] 19·20일차<\/strong>\n11. 보험료·자기부담금이 오르고 보험사가 위험을 덜 받는 시장은?\n12. 재활용 업종 보험 심사에서 요구하는 증거 3가지는?\n13. 배터리가 스스로 계속 뜨거워져 불이 번지는 현상은?\n14. 사용후배터리법에서 재사용사업자의 의무는?\n15. 사용후배터리법 시행 예정 시기는? (2026년 10월 보도 기준)<\/p>\n<blockquote>\n<p>채점 기준: 12개 이상 = 4주차(내 사업 모델)로 진행 / 8~11개 = 틀린 날만 다시 보기 / 7개 이하 = 15·16일차부터 다시 보기<\/p>\n<\/blockquote>\n<h2>4. [보험 포인트] 4주차로 가는 다리<\/h2>\n<p>3주차는 \"어떤 보험이 들어가나\"였고, 4주차는 <strong>\"그럼 나는 무엇을, 누구에게, 어떻게 팔까\"<\/strong> 입니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>4주차 강의<\/th>\n<th>3주차에서 넘어온 질문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22일차 해외 보험사 사례<\/td>\n<td>알리안츠·영국 보험사처럼 그린 부품·잔존물을 활용하는 모델을 한국에서 할 수 있을까? (16·17일차)<\/td>\n<\/tr>\n<tr>\n<td>23일차 데이터의 힘<\/td>\n<td>보험사가 원하는 '증거'를 데이터로 만들면? (19·20일차)<\/td>\n<\/tr>\n<tr>\n<td>24일차 GA로 참여하기<\/td>\n<td>폐차장 보험 세트를 여러 보험사 상품으로 비교·설계하려면? (19일차)<\/td>\n<\/tr>\n<tr>\n<td>25일차 B2B 패키지<\/td>\n<td>재활용 사업장 패키지에 무엇을 넣을까? (15·19일차)<\/td>\n<\/tr>\n<tr>\n<td>26일차 파트너십<\/td>\n<td>정비소·폐차장·배터리 업체 중 누구와 먼저? (17·20일차)<\/td>\n<\/tr>\n<tr>\n<td>28일차 규제 체크<\/td>\n<td>의무보험 시행령 기준을 어떻게 챙길까? (20일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"3주차에서 본 보험 중 <strong>내가 내일 당장 한 명의 고객에게 제안할 수 있는 것<\/strong> 하나를 고른다면? 그 고객은 누구이고, 첫 문장은 무엇일까?\"<\/p>\n<\/blockquote>\n<h2>5. 꼭 기억할 용어 5개 (3주차 최다 등장)<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>실손 보상<\/td>\n<td>실제로 생긴 손해만큼만 보상<\/td>\n<\/tr>\n<tr>\n<td>잔존물 대위<\/td>\n<td>보험금을 전부 준 보험사가 사고 물건의 권리를 취득(상법 제681조)<\/td>\n<\/tr>\n<tr>\n<td>생산물배상책임(PL)<\/td>\n<td>제품·부품 결함으로 남에게 준 피해 보상<\/td>\n<\/tr>\n<tr>\n<td>하드 마켓<\/td>\n<td>보험사가 위험을 덜 받아 조건이 까다로워진 시장<\/td>\n<\/tr>\n<tr>\n<td>의무보험<\/td>\n<td>법으로 가입이 강제된 보험(예: 재사용사업자 보험·공제, 환경책임보험)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6. 1분 퀴즈 (답은 내일 강의 맨 위에) — 4주차 맛보기<\/h2>\n<ol>\n<li>독일에서 2024년 4월부터 인증 중고부품 사용을 권장한 보험사는? (13일차 힌트)<\/li>\n<li>미국에서 보험사 전손차를 경매로 파는 대표 기업 두 곳은? (9일차 힌트)<\/li>\n<li>일본 보험사들이 환경 사례로 소개된 활동은? (5일차 힌트: 재활용 부품)<\/li>\n<\/ol>\n<hr />\n<h2>복습 퀴즈 정답<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>정답<\/th>\n<th>배운 날<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>실손 보상<\/td>\n<td>15일차<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>약 1억 원 (비례보상 원칙, 특약에 따라 다를 수 있음)<\/td>\n<td>15일차<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>손해율<\/td>\n<td>15일차<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>전손(전부손해)<\/td>\n<td>16일차<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>잔존물 대위, 상법 제681조<\/td>\n<td>16일차<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>보험개발원 차량기준가액<\/td>\n<td>16일차<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>25%<\/td>\n<td>17일차<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>약 0.019%<\/td>\n<td>17일차<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>생산물배상책임보험(PL)<\/td>\n<td>18일차<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>불량 부품 자체의 교체·회수·검사 비용<\/td>\n<td>18일차<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>하드 마켓<\/td>\n<td>19일차<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>화재 제어 설비, 대응 절차 문서, 직원 교육 기록<\/td>\n<td>19일차<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>열폭주<\/td>\n<td>20일차<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>등록 + 보험 또는 공제 가입<\/td>\n<td>20일차<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>2027년 7월<\/td>\n<td>20일차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<p>오늘은 복습이라 새 주장은 거의 없습니다. 대신 <strong>16일차의 '잔존물 대위' 설명을 법 해설로 다시 확인<\/strong>했습니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>상법 제681조: 보험목적 <strong>전부 멸실<\/strong> + 보험금액 <strong>전부 지급<\/strong> 시 보험자가 권리 취득. <strong>일부보험이면 보험금액/보험가액 비율만큼<\/strong> 취득<\/td>\n<td>✅ 법 조문 해설(2곳)<\/td>\n<td><a href=\"https://korea.legal/wiki/%ec%83%81%eb%b2%95-%ec%a0%9c681%ec%a1%b0/\">korea.legal 제681조<\/a>, <a href=\"https://www.nepla.ai/wiki/금융-투자-외국환/은행-보험/보험의-목적에-대한-보험자대위—잔존물대위-e3j915347n2q\">nepla 잔존물대위<\/a> — 국가법령정보센터 원문 대조 권장<\/td>\n<\/tr>\n<tr>\n<td>권리는 보험금 전액 지급 시 <strong>별도 의사표시 없이<\/strong> 이전<\/td>\n<td>⚠️ 법률 해설 사이트<\/td>\n<td>같은 출처 — 판례 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>복습 문제 정답 15개<\/td>\n<td>✅ 15~20일차 본문·자기점검표와 대조<\/td>\n<td>각 일차 신뢰도 그대로 유지(0.019%·2027년 7월은 ⚠️ 보도 기준)<\/td>\n<\/tr>\n<tr>\n<td>폐차장의 재난배상책임·환경책임보험 의무 여부<\/td>\n<td>❓ 여전히 미확인<\/td>\n<td>15·19일차와 같음 — 28일차 '규제 체크'에서 다시 확인 예정<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 16일차의 잔존물 대위 설명에 <strong>\"일부보험이면 가입 비율만큼만 권리 취득\"<\/strong> 이라는 조건을 보충(15일차 비례보상과 같은 논리)\n- 복습 2번 정답에 \"특약에 따라 다를 수 있음\"을 다시 붙여 단정하지 않음\n- 15·19일차의 ❓ 항목(폐차장 의무보험 해당 여부)은 이번에도 확인 못 해 <strong>28일차 과제로 이월<\/strong><\/p>"}, {"day": 22, "title": "22일차 — 해외 보험사 사례 (영국·일본·미국): 누가 이미 하고 있나? (2026-10-27)", "md": "<h1>22일차 — 해외 보험사 사례 (영국·일본·미국): 누가 이미 하고 있나? (2026-10-27)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>알리안츠<\/strong>(Allianz, 독일). 2024년 4월부터 인증 중고부품 사용 권장(13일차).<\/li>\n<li><strong>Copart, IAA<\/strong>(9일차).<\/li>\n<li><strong>재활용 부품 수리 권장 + 보험금으로 넘겨받은 폐차에서 부품 회수·소재 재생<\/strong>(도쿄해상·손보재팬, 5일차).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"해외 보험사들은 이미 사고차를 '쓰레기'가 아니라 '부품 창고'로 쓴다. 영국은 '그린 부품', 일본은 '리사이클 부품', 미국은 '대체부품'. 이름은 달라도 공통점은 하나다. 보험사가 직접 잔존물과 부품 흐름을 연결했다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>영국<\/strong>: 보험사가 <strong>잔존물(사고차) 처리 + 그린 부품 공급<\/strong>을 한 회사로 묶음(Ageas 사례)<\/td>\n<td>\"내가 받은 사고차에서 뗀 부품을 내 고객 차 수리에 쓴다\"<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>일본<\/strong>: 도쿄해상 계열은 <strong>보험금과 맞바꾼 폐차에서 부품을 회수<\/strong>하고 화학회사와 <strong>소재까지 재생<\/strong>. 손보재팬은 <strong>재활용 부품 수리 권장<\/strong><\/td>\n<td>보험사가 '순환'의 앞뒤를 모두 챙김<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>미국<\/strong>: 대형 보험사가 비순정(대체) 부품 사용을 넓히는 중. 단, 주(州)별 규제와 <strong>품질 인증(CAPA)<\/strong> 이 조건<\/td>\n<td>\"싸게 고치되, 인증된 부품만\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 나라별 사례 한눈에<\/h2>\n<table>\n<thead>\n<tr>\n<th>나라<\/th>\n<th>보험사<\/th>\n<th>하는 일<\/th>\n<th>핵심 숫자·시점<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>영국<\/td>\n<td><strong>Ageas UK<\/strong><\/td>\n<td>2019년 '그린 부품' 시작, 2020년 <strong>잔존물 처리 사업과 그린 부품 사업 통합<\/strong>. 승인 정비소의 그린 부품 사용을 2023년까지 <strong>3배<\/strong>로 늘리는 목표<\/td>\n<td>2024년 영국 환경 시상(edie) '순환경제 혁신상'<\/td>\n<\/tr>\n<tr>\n<td>영국<\/td>\n<td><strong>Allianz UK<\/strong><\/td>\n<td>과거 시범사업 후 전국 단위로 재활용 부품 제공. 일부 지역 사용률 약 40%, <strong>전손 가능성이 있는 차는 약 80%<\/strong><\/td>\n<td>2007~2008년경 자료(오래됨)<\/td>\n<\/tr>\n<tr>\n<td>영국<\/td>\n<td><strong>Aviva<\/strong><\/td>\n<td>운전자 설문: <strong>58%<\/strong> 가 재활용 부품 사용 의향<\/td>\n<td>2023년 설문(실제 사용률 아님)<\/td>\n<\/tr>\n<tr>\n<td>영국<\/td>\n<td>Allianz Commercial<\/td>\n<td>법인 차량(플릿) 약관에 그린 부품 장착 명시(17일차)<\/td>\n<td>2025년경 보도<\/td>\n<\/tr>\n<tr>\n<td>일본<\/td>\n<td><strong>도쿄해상(Tokio Marine)<\/strong> 계열 3사<\/td>\n<td>보험금 지급과 맞바꿔 폐차 인수 → 해체업체 네트워크로 <strong>램프·에어백<\/strong> 등 회수 → <strong>화학회사와 원료 재생<\/strong><\/td>\n<td>일본 환경성 사례집<\/td>\n<\/tr>\n<tr>\n<td>일본<\/td>\n<td><strong>손보재팬(Sompo)<\/strong><\/td>\n<td>'에콜로지 프로젝트': 사고 수리 시 <strong>재활용 부품 권장<\/strong>, 떼어낸 부품 재활용<\/td>\n<td>일본 환경성 사례집(날짜 미상)<\/td>\n<\/tr>\n<tr>\n<td>일본<\/td>\n<td>(업계 전체)<\/td>\n<td>2026년 6월 보도: 재활용 자동차 부품의 <strong>탄소 감축량 산정 방법론<\/strong>을 담은 민간 자율 기준 발표<\/td>\n<td>해당 기준에 보험사 참여 여부 미확인<\/td>\n<\/tr>\n<tr>\n<td>미국<\/td>\n<td><strong>State Farm<\/strong><\/td>\n<td>2022년 12월 비순정 범퍼커버·헤드램프·테일램프 사용을 <strong>하와이·오하이오·와이오밍 제외 전 주<\/strong>로 확대, 2023년 6월 캘리포니아·애리조나 추가 확대. <strong>CAPA 인증<\/strong> 부품 요구<\/td>\n<td>부품 공급난 대응 명분<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ CAPA = 미국의 비순정 자동차 부품 <strong>품질 인증 기관<\/strong>. 한국의 '품질인증부품' 제도와 비슷한 역할(17일차).<\/p>\n<\/blockquote>\n<h2>3. 세 나라에서 배우는 3가지 모델<\/h2>\n<table>\n<thead>\n<tr>\n<th>모델<\/th>\n<th>대표<\/th>\n<th>구조<\/th>\n<th>한국에 적용하면?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① <strong>잔존물 + 부품 통합형<\/strong><\/td>\n<td>Ageas UK<\/td>\n<td>사고차 처리 회사 = 부품 공급 회사<\/td>\n<td>보험사가 폐차장·부품업체와 <strong>전속 계약<\/strong> → 잔존물 회수금↑ + 수리비↓ (16일차)<\/td>\n<\/tr>\n<tr>\n<td>② <strong>순환 완결형<\/strong><\/td>\n<td>도쿄해상<\/td>\n<td>폐차 → 부품 → 소재 재생까지<\/td>\n<td>재활용 소재 의무(12일차) 시대에 <strong>소재 업체까지 연결<\/strong>하는 파트너십(26일차)<\/td>\n<\/tr>\n<tr>\n<td>③ <strong>인증 조건 확대형<\/strong><\/td>\n<td>State Farm<\/td>\n<td>인증 부품만 허용, 지역 단위로 확대<\/td>\n<td>한국 품질인증부품(사용률 0.019%) 확대 시 <strong>인증 + 품질보증보험<\/strong> 세트(18일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 한국과 비교<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>해외<\/th>\n<th>한국<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>잔존물 처리<\/td>\n<td>대형 온라인 경매(미국), 보험사 자회사 통합(영국)<\/td>\n<td>위탁업체 중심, 이력 추적 과제(16일차)<\/td>\n<\/tr>\n<tr>\n<td>재활용 부품 수리<\/td>\n<td>영국·일본 보험사가 적극 권장<\/td>\n<td>친환경부품 특약 있으나 인지도 18%(2020)<\/td>\n<\/tr>\n<tr>\n<td>대체부품<\/td>\n<td>미국 State Farm 전국 확대<\/td>\n<td>사용률 <strong>0.019%<\/strong>(2026년 9월 보도)<\/td>\n<\/tr>\n<tr>\n<td>탄소 측정<\/td>\n<td>일본 자율 기준(2026), Solera 도구(13일차)<\/td>\n<td>국내 보험사 감축량 공개 자료 못 찾음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 결론: <strong>한국은 제도는 비슷하게 있는데 '연결'이 약하다.<\/strong> 사고차 → 부품 → 수리 → 소재를 잇는 사람이 없다. 그 연결자가 설계사·GA·중개사의 기회.<\/p>\n<\/blockquote>\n<h2>5. [보험 포인트] 해외 사례를 한국 영업 언어로<\/h2>\n<table>\n<thead>\n<tr>\n<th>해외 사례<\/th>\n<th>한국 고객에게 하는 말<\/th>\n<th>대상<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ageas 그린 부품 3배 목표<\/td>\n<td>\"영국 보험사는 사고차 부품을 다시 써서 수리비를 줄입니다. 우리도 정비소·폐차장을 연결하면 같은 효과를 낼 수 있습니다\"<\/td>\n<td>손보사·GA 담당자<\/td>\n<\/tr>\n<tr>\n<td>도쿄해상 소재 재생<\/td>\n<td>\"일본 보험사는 폐차에서 소재까지 재생합니다. 재활용 소재가 의무화되면(유럽 2032년~) 이 연결이 돈이 됩니다\"<\/td>\n<td>폐차장·소재 업체<\/td>\n<\/tr>\n<tr>\n<td>State Farm 인증 조건<\/td>\n<td>\"미국도 '인증 부품만' 씁니다. 인증 + 보증이 붙으면 고객 불안이 줄어듭니다\"<\/td>\n<td>정비소·부품 유통업체<\/td>\n<\/tr>\n<tr>\n<td>Aviva 58% 설문<\/td>\n<td>\"운전자 절반 이상이 재활용 부품에 열려 있습니다. 안내만 하면 됩니다\"<\/td>\n<td>개인·법인 고객<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"세 모델(통합형·순환 완결형·인증 확대형) 중 <strong>보험사가 아닌 내가<\/strong> 지금 시작할 수 있는 것은 무엇일까? 그때 내가 맡는 역할은 '판매자'일까, '연결자'일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>그린 부품(green parts)<\/td>\n<td>사고·폐차에서 회수해 다시 쓰는 순정 중고부품(영국 용어)<\/td>\n<\/tr>\n<tr>\n<td>CAPA<\/td>\n<td>미국의 비순정 자동차 부품 품질 인증 기관<\/td>\n<\/tr>\n<tr>\n<td>승인 정비소(approved repairer)<\/td>\n<td>보험사와 계약한 정비소 네트워크. 부품 정책이 여기서 실행됨<\/td>\n<\/tr>\n<tr>\n<td>잔존물 사업 통합<\/td>\n<td>사고차 처리와 부품 공급을 한 조직에서 하는 구조(Ageas)<\/td>\n<\/tr>\n<tr>\n<td>순환 완결형<\/td>\n<td>폐차 → 부품 → 소재 재생까지 이어지는 구조(도쿄해상)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>잔존물 처리 사업과 그린 부품 사업을 통합한 영국 보험사는?<\/li>\n<li>미국 State Farm이 비순정 부품에 요구하는 품질 인증 이름은?<\/li>\n<li>보험사가 \"위험을 줄였다는 증거\"를 숫자로 만드는 것과 관련된 내일의 주제는? (힌트: 보험개발원)<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>도쿄해상 계열 3사(도쿄해상일동·E.design·닛신화재): 보험금과 폐차 교환, 램프·에어백 회수, 화학회사와 원료 재생<\/td>\n<td>✅ 일본 정부(환경성) 사례집<\/td>\n<td><a href=\"https://j4ce.env.go.jp/en/casestudy/210\">J-4CE 사례 210<\/a> — 5일차 내용과 일치<\/td>\n<\/tr>\n<tr>\n<td>손보재팬 에콜로지 프로젝트: 재활용 부품 권장·회수 부품 재활용<\/td>\n<td>⚠️ 정부 사례집(날짜 미상, 2019년 이전 추정)<\/td>\n<td><a href=\"https://j4ce.env.go.jp/en/casestudy/112\">J-4CE 사례 112<\/a> — 현재 운영 여부 미확인<\/td>\n<\/tr>\n<tr>\n<td>일본 재활용 부품 탄소 방법론 자율 기준(2026.6)<\/td>\n<td>⚠️ 유료 기사 요약<\/td>\n<td><a href=\"https://carbon-pulse.com/?p=524850\">Carbon Pulse<\/a> — 보험사 관여 여부 미확인<\/td>\n<\/tr>\n<tr>\n<td>Ageas: 2019 그린 부품 시작, 2020 잔존물·그린 부품 통합, 2023년까지 3배 목표, 2024 edie 수상<\/td>\n<td>⚠️ 시상 사례·업계지<\/td>\n<td><a href=\"https://www.edie.net/case-study/ageas-uk-circular-economy-innovation-of-the-year/\">edie<\/a>, <a href=\"https://www.bodyshopmag.com/?p=31434\">Bodyshop Mag<\/a> — 3배 달성 여부 미확인<\/td>\n<\/tr>\n<tr>\n<td>Allianz UK 전국 재활용 부품, 사용률 약 40%·전손 가능 차 약 80%<\/td>\n<td>⚠️ 과거 보도(2007~2008년경)<\/td>\n<td><a href=\"https://www.insurancetimes.co.uk/allianz-goes-green/1368473.article\">Insurance Times<\/a>, <a href=\"https://www.collisionrepairmag.com/news/recycling/article/15765212/allianz-pushes-forward-with-first-uk-wide-recycled-parts-program\">Collision Repair Mag<\/a> — 오래된 수치임을 본문에 표시<\/td>\n<\/tr>\n<tr>\n<td>Aviva 설문 58% 재활용 부품 사용 의향(2023)<\/td>\n<td>⚠️ 업계 보도 인용<\/td>\n<td><a href=\"https://seib.co.uk/2025/02/19/the-rise-of-green-parts-in-the-motor-trade-industry-and-what-it-means-for-classic-and-modern-vehicles\">SEIB<\/a> — 의향이지 실제 사용률 아님<\/td>\n<\/tr>\n<tr>\n<td>State Farm 2022.12 비순정 부품 3개 주 제외 확대, 2023.6 CA·AZ 확대, CAPA 요구<\/td>\n<td>✅ 업계지(보험사 발표 인용)<\/td>\n<td><a href=\"https://www.repairerdrivennews.com/2022/12/08/state-farm-expands-use-of-aftermarket-parts-in-its-network-to-all-but-3-states/\">Repairer Driven News<\/a><\/td>\n<\/tr>\n<tr>\n<td>Direct Line·LV=의 현재 재활용 부품 정책<\/td>\n<td>❓ 못 찾음<\/td>\n<td>본문에서 제외<\/td>\n<\/tr>\n<tr>\n<td>미국 보험 수리에서 대체부품 비용 비중(2025)<\/td>\n<td>❓ 못 찾음<\/td>\n<td>5일차 \"사상 최고\"는 출처 재확인 필요 → 오늘은 숫자 쓰지 않음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- Allianz UK의 40%·80% 수치는 <strong>2007~2008년경 자료<\/strong>라 \"오래됨\"을 명시하고 핵심 근거로 쓰지 않음\n- Aviva 58%는 <strong>'사용 의향' 설문<\/strong>임을 분명히 함(실제 사용률로 오해 방지)\n- 영국 국기 이모지 대신 글자로 표기(구글 문서 호환)\n- 5일차 \"미국 대체부품 비중 사상 최고\"는 이번 검색에서 뒷받침 자료를 못 찾아 <strong>오늘 강의에서 반복하지 않음<\/strong>(23일차 데이터 편에서 재확인)<\/p>"}, {"day": 23, "title": "23일차 — 데이터의 힘 (보험개발원·사고이력): 보험사는 무엇을 보고 값을 매기나? (2026-10-28)", "md": "<h1>23일차 — 데이터의 힘 (보험개발원·사고이력): 보험사는 무엇을 보고 값을 매기나? (2026-10-28)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>Ageas UK<\/strong>(2020년 잔존물 처리 + 그린 부품 사업 통합).<\/li>\n<li><strong>CAPA<\/strong> 인증(미국 비순정 부품 품질 인증 기관).<\/li>\n<li><strong>데이터의 힘<\/strong>(보험개발원·사고이력) — 바로 오늘!<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"보험은 결국 '숫자 장사'다. 사고차가 어디로 갔는지, 어떤 부품으로 고쳤는지, 그 사업장이 사고를 얼마나 냈는지 — 이 기록이 쌓일수록 보험료는 정확해지고, 기록을 가진 사람이 협상력을 가진다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>한국 <strong>보험개발원<\/strong>은 보험사들이 낸 사고·보험금 자료를 모아 <strong>통계·요율 기준<\/strong>을 만들고, <strong>카히스토리<\/strong>로 중고차 사고·침수 이력을 공개<\/td>\n<td>보험업계 공동 '데이터 창고'<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>미국은 보험사가 전손·잔존물 차량을 <strong>매달 정부 시스템(NMVTIS)<\/strong> 에 신고해야 함(위반 시 건당 벌금)<\/td>\n<td>사고차가 '세탁'되어 몰래 팔리는 것을 막는 장치<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>데이터는 <strong>\"위험을 줄였다는 증거\"<\/strong> 가 됨. 재활용 사업장도 사고·점검 기록이 있어야 좋은 보험 조건을 받음(19·20일차)<\/td>\n<td>기록 = 보험료 협상 카드<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 쉬운 설명: 보험 데이터는 어떻게 흐르나?<\/h2>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>일어나는 일<\/th>\n<th>데이터가 쌓이는 곳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 사고<\/td>\n<td>보험금 청구, 수리비 산정<\/td>\n<td>각 보험사 → <strong>보험개발원<\/strong>에 제출<\/td>\n<\/tr>\n<tr>\n<td>② 판정<\/td>\n<td>수리 vs 전손(16일차)<\/td>\n<td>차량기준가액, 수리비 통계<\/td>\n<\/tr>\n<tr>\n<td>③ 잔존물<\/td>\n<td>전손차 매각·폐차<\/td>\n<td>한국: 카히스토리 전손·침수 이력 / 미국: <strong>NMVTIS<\/strong> 신고<\/td>\n<\/tr>\n<tr>\n<td>④ 수리<\/td>\n<td>어떤 부품(순정·대체·중고)으로 고쳤나<\/td>\n<td>수리비 데이터 → 부품 정책(17·22일차)<\/td>\n<\/tr>\n<tr>\n<td>⑤ 요율<\/td>\n<td>다음 해 보험료 계산<\/td>\n<td>통계를 바탕으로 보험사별 요율 결정<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 요율 = 보험료를 계산하는 기준 가격표. \"이런 차, 이런 사람, 이런 사업장은 얼마\" 하는 표.<\/p>\n<\/blockquote>\n<h2>3. 세계는?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>미국 NMVTIS(국가 자동차 이력 시스템)<\/td>\n<td>보험사는 <strong>당해 연식 + 직전 4개 연식<\/strong> 차량 중 전손·잔존물로 판정한 차를 <strong>최소 매달<\/strong> 신고. 차대번호(VIN), 판정 날짜, 인수처 등을 보고. 위반 시 <strong>건당 1,000달러<\/strong> 민사 벌금(2026년 연방관보 공지)<\/td>\n<\/tr>\n<tr>\n<td>미국 CCC 보고서(2026)<\/td>\n<td>2025년 수리 1건당 평균 수리비 <strong>4,818달러<\/strong>(+1.7%), 전손 비율 <strong>23.1%로 사상 최고<\/strong><\/td>\n<\/tr>\n<tr>\n<td>대체부품 비중<\/td>\n<td>2025년 교체 부품 금액 중 <strong>비순정(대체) 부품 22.7%로 역대 최고<\/strong>, 순정(OEM) 63.5% (CCC)<\/td>\n<\/tr>\n<tr>\n<td>텔레매틱스(주행 데이터)<\/td>\n<td>속도·급제동·주행거리 같은 운전 데이터로 보험료를 매기는 방식 확산. 북미 시장 2026년 약 1.4억 달러 → 2031년 약 4.7억 달러 전망(시장조사기관 추정)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 5일차·22일차의 숙제 해결: \"미국 대체부품 비중 사상 최고\"는 <strong>CCC 2026 보고서의 22.7%<\/strong> 로 확인됨. 단, <strong>중고(재활용) 부품 비중<\/strong>은 이번에도 찾지 못함.<\/p>\n<\/blockquote>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>보험개발원 역할<\/td>\n<td>보험사가 제출한 사고 정보로 통계를 만들고, 카히스토리(중고차 사고이력) 운영<\/td>\n<\/tr>\n<tr>\n<td>카히스토리<\/td>\n<td><strong>침수차 조회 무료<\/strong>(차량번호·차대번호). 사고·소유 변경 등 종합 이력은 유료<\/td>\n<\/tr>\n<tr>\n<td>침수 통계<\/td>\n<td>최근 5년(2020~2024) 차량 침수 <strong>3만6,214건<\/strong>, 이 중 <strong>전손 2만6,799건(74.0%)<\/strong>. 7~10월에 95.6% 집중<\/td>\n<\/tr>\n<tr>\n<td>한계<\/td>\n<td><strong>자비로 수리한 사고는 기록에 없음<\/strong> → 국토교통부 '자동차365'(등록·검사·정비 이력)와 함께 보기 권장<\/td>\n<\/tr>\n<tr>\n<td>해외 연계<\/td>\n<td>2023년 보도: 중동 수출 중고차에 사고이력 정보 제공 시작<\/td>\n<\/tr>\n<tr>\n<td>주행 데이터 특약<\/td>\n<td>티맵·카카오내비 안전운전 점수 할인(UBI), 커넥티드카 할인 특약 등 운영 — 할인율은 보험사마다 다름<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 재활용 사업에서 '데이터'로 돈 버는 법<\/h2>\n<table>\n<thead>\n<tr>\n<th>데이터<\/th>\n<th>누가 원하나<\/th>\n<th>내가 할 수 있는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사업장 사고·점검 기록(화재 감지, 교육, 배터리 보관)<\/td>\n<td>보험사 인수 심사자<\/td>\n<td>폐차장 고객에게 <strong>\"기록 노트\"<\/strong> 를 만들어 주고 갱신 때 제출 → 보험료 협상(19일차)<\/td>\n<\/tr>\n<tr>\n<td>잔존물 이력(전손차가 어디로 갔나)<\/td>\n<td>보험사, 중고차 구매자<\/td>\n<td>전손차가 정식 폐차·재활용으로 갔다는 <strong>추적 자료<\/strong> = 신뢰 상품<\/td>\n<\/tr>\n<tr>\n<td>부품 사용 기록(중고·대체·재제조)<\/td>\n<td>보험사 손해율 담당<\/td>\n<td>정비소의 친환경 부품 사용 실적 → <strong>탄소 감축·수리비 절감 증거<\/strong>(13·22일차)<\/td>\n<\/tr>\n<tr>\n<td>침수·전손 이력<\/td>\n<td>중고차 수출업체, 소비자<\/td>\n<td>카히스토리 조회를 영업 도구로: \"이 차는 이력 깨끗합니다\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>영업 한 줄<\/strong><\/p>\n<blockquote>\n<p>\"사장님, 보험사는 '말'보다 '기록'을 믿습니다. 지난 1년 사고 0건, 화재 점검 12회 기록이 있으면 갱신 때 조건을 다시 협상할 수 있습니다. 기록 정리는 제가 도와드릴게요.\"<\/p>\n<p>▶ 오늘의 생각거리: \"내 첫 고객(폐차장·정비소)에게 <strong>어떤 기록 3가지<\/strong>를 모으자고 하면, 보험사도 고객도 둘 다 이득일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>보험개발원<\/td>\n<td>보험사 자료를 모아 통계·요율 기준을 만드는 기관. 카히스토리 운영<\/td>\n<\/tr>\n<tr>\n<td>카히스토리<\/td>\n<td>보험 처리된 사고·침수·전손 이력을 조회하는 서비스<\/td>\n<\/tr>\n<tr>\n<td>요율<\/td>\n<td>보험료를 계산하는 기준 가격표<\/td>\n<\/tr>\n<tr>\n<td>NMVTIS<\/td>\n<td>미국 국가 자동차 이력 시스템. 보험사의 전손·잔존물 신고 의무<\/td>\n<\/tr>\n<tr>\n<td>텔레매틱스(UBI)<\/td>\n<td>운전 데이터(속도·제동·거리)로 보험료를 매기는 방식<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>한국에서 중고차의 보험 사고·침수 이력을 조회하는 보험개발원 서비스 이름은?<\/li>\n<li>미국에서 보험사가 전손·잔존물 차량을 매달 신고해야 하는 정부 시스템은?<\/li>\n<li>카히스토리에 <strong>나오지 않는<\/strong> 사고는 어떤 사고일까?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NMVTIS: 보험사 최소 월 1회 신고, 당해+직전 4개 연식, VIN 등 보고<\/td>\n<td>✅ 미국 법무부 공식 안내<\/td>\n<td><a href=\"https://vehiclehistory.bja.ojp.gov/nmvtis_insurance\">NMVTIS 보험사 안내<\/a>, <a href=\"https://vehiclehistory.bja.ojp.gov/nmvtis/nmvtis_who_report\">신고 대상<\/a><\/td>\n<\/tr>\n<tr>\n<td>미신고 시 건당 1,000달러 민사 벌금<\/td>\n<td>⚠️ 연방관보 공지(2026) 요약<\/td>\n<td><a href=\"https://public-inspection.federalregister.gov/2026-07895.pdf\">Federal Register 2026-07895<\/a> — 원문 조항(28 CFR Part 25) 미대조<\/td>\n<\/tr>\n<tr>\n<td>CCC 2025년 평균 수리비 4,818달러(+1.7%), 전손 비율 23.1% 최고<\/td>\n<td>✅ CCC 보도자료·업계지 2곳<\/td>\n<td><a href=\"https://www.cccis.com/reports/crash-course-2026\">CCC 2026 보고서<\/a>, <a href=\"https://www.fenderbender.com/news/latest-news/news/55368724/ccc-crash-course-2026-analyzes-how-to-navigate-industry-complexity\">FenderBender<\/a> — 16일차 '약 22~24%'와 일치<\/td>\n<\/tr>\n<tr>\n<td>2025년 대체부품 22.7%(최고)·순정 63.5%<\/td>\n<td>⚠️ 업계지 인용(CCC 원문 미열람)<\/td>\n<td><a href=\"https://www.repairerdrivennews.com/2026/04/08/ccc-crash-course-looks-at-changing-consumer-claims-practices/\">Repairer Driven News<\/a><\/td>\n<\/tr>\n<tr>\n<td>침수 5년 3만6,214건, 전손 74.0%, 7~10월 95.6%<\/td>\n<td>✅ 보험개발원 집계, 언론 2곳<\/td>\n<td><a href=\"https://www.khan.co.kr/article/202508052017045/\">경향신문<\/a>, <a href=\"https://www.imaeil.com/page/view/2026101518432053697\">매일신문<\/a><\/td>\n<\/tr>\n<tr>\n<td>카히스토리 침수 조회 무료, 자비 수리 사고는 미기록<\/td>\n<td>⚠️ 언론·해설 자료<\/td>\n<td><a href=\"https://m.dailian.co.kr/news/view/729799\">데일리안<\/a>, <a href=\"https://tilnote.io/books/6a57e36ec86a386bf049581c/6a722ba7dc356629a8a034f1\">tilnote<\/a><\/td>\n<\/tr>\n<tr>\n<td>중동 수출 중고차 사고이력 제공(2023)<\/td>\n<td>⚠️ 과거 보도<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2023101910493573609\">MTN<\/a><\/td>\n<\/tr>\n<tr>\n<td>북미 텔레매틱스 시장 2026→2031 전망<\/td>\n<td>⚠️ 시장조사기관 추정<\/td>\n<td><a href=\"https://www.researchandmarkets.com/report/north-america-insurance-telematics-market\">Research and Markets<\/a><\/td>\n<\/tr>\n<tr>\n<td>카히스토리 현재 유료 조회 수수료<\/td>\n<td>❓ 최신 자료 못 찾음<\/td>\n<td>2017년 인하 기사만 있음 → 본문에서 금액 생략<\/td>\n<\/tr>\n<tr>\n<td>국내 UBI 특약 보험사별 할인율<\/td>\n<td>❓ 공식 자료 못 찾음<\/td>\n<td>블로그 자료뿐 → 본문에서 숫자 생략<\/td>\n<\/tr>\n<tr>\n<td>미국 중고(재활용) 부품 비중<\/td>\n<td>❓ 못 찾음<\/td>\n<td>CCC 요약에 미포함<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 5일차·22일차 ❓ \"미국 대체부품 비중 사상 최고\" → <strong>CCC 2026 보고서 22.7%(2025년)<\/strong> 로 근거 보충. 단 원문 미열람이라 ⚠️\n- 침수 전손 차량 폐차 기한 과태료는 자료마다 금액이 달라(1,000만 원 vs 2,000만 원) <strong>본문에서 금액을 쓰지 않음<\/strong>\n- 카히스토리 수수료(2017년 700원 등)는 오래된 자료라 제외\n- '참조순율'(보험개발원이 만드는 요율 기준) 용어는 공식 설명 자료를 이번에 확인하지 못해 <strong>'통계·요율 기준'<\/strong> 이라는 쉬운 말로만 표기<\/p>"}, {"day": 24, "title": "24일차 — 보험대리점/GA로 참여하는 방법: 나는 어떤 '자리'에서 팔까? (2026-10-29)", "md": "<h1>24일차 — 보험대리점/GA로 참여하는 방법: 나는 어떤 '자리'에서 팔까? (2026-10-29)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>카히스토리<\/strong>(보험개발원).<\/li>\n<li><strong>NMVTIS<\/strong>(미국 국가 자동차 이력 시스템).<\/li>\n<li><strong>보험 처리 없이 자비로 수리한 사고<\/strong>.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"재활용 사업장은 한 보험사 상품만으로는 다 지킬 수 없다(화재·배상·환경·배터리). 그래서 여러 보험사 상품을 비교해 묶어 주는 GA(법인보험대리점)가 가장 자연스러운 자리다. 해외에서는 아예 '재활용 전문 중개사·인수대행사'가 생겼다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>판매 자리는 크게 <strong>전속 설계사 / GA 소속 설계사 / 대리점 / 중개사<\/strong><\/td>\n<td>한 가게 직원이냐, 여러 브랜드를 파는 편집숍이냐의 차이<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>한국 GA 소속 설계사는 약 <strong>31만9천 명, 전체의 44.8%<\/strong>(2026년 10월 보도). 손보사는 계약 절반 이상을 GA로 판매<\/td>\n<td>이미 GA가 보험 판매의 중심<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>2026년 7월부터 GA 설계사에게도 <strong>'1200%룰'<\/strong>(첫해 수수료 = 월 보험료의 12배 이내) 적용<\/td>\n<td>\"많이 팔고 끝\"보다 <strong>오래 유지되는 계약<\/strong>이 돈이 되는 구조로 변화<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 쉬운 설명: 판매 자리 4가지 비교<\/h2>\n<table>\n<thead>\n<tr>\n<th>자리<\/th>\n<th>누구를 대신하나<\/th>\n<th>장점<\/th>\n<th>재활용 사업장 영업에 맞나?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전속 설계사<\/td>\n<td>한 보험사<\/td>\n<td>교육·지원 탄탄<\/td>\n<td>△ 그 회사가 재활용 업종을 안 받으면 끝<\/td>\n<\/tr>\n<tr>\n<td><strong>GA 소속 설계사<\/strong><\/td>\n<td>여러 보험사(GA가 계약)<\/td>\n<td>여러 상품 비교·묶음 설계<\/td>\n<td>◎ 화재는 A사, 배상은 B사처럼 조합 가능<\/td>\n<\/tr>\n<tr>\n<td>개인/법인 보험대리점<\/td>\n<td>여러 보험사<\/td>\n<td>내 사업체로 운영<\/td>\n<td>○ 규모가 커지면 고려(등록·내부통제 부담)<\/td>\n<\/tr>\n<tr>\n<td>보험중개사<\/td>\n<td><strong>고객<\/strong>(사업장) 편<\/td>\n<td>고객 대신 조건 협상<\/td>\n<td>○ 대형 사업장·해외 보험 연결에 유리, 요건 까다로움<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 보험 판매를 하려면 먼저 <strong>설계사 자격시험 합격 + 등록 교육<\/strong> → 보험협회 등록이 기본. 대리점·중개사는 별도 등록 요건이 있음(자세한 숫자는 아래 자기점검 참조).<\/p>\n<\/blockquote>\n<h2>3. 세계는?<\/h2>\n<table>\n<thead>\n<tr>\n<th>사례<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>영국 <strong>Criterion<\/strong>(MGA, 2024 출범)<\/td>\n<td>보험 플랫폼 OneAdvent가 \"보험이 제대로 공급되지 않는\" <strong>재활용·폐기물 업종 전용 인수대행사(MGA)<\/strong> 를 세움. A등급 보험사(Bridgehaven) 자본으로 인수<\/td>\n<\/tr>\n<tr>\n<td>영국 <strong>DILM<\/strong>(로이즈 전문 중개사)<\/td>\n<td>재활용·폐기물 사업장용 <strong>재산·설비·휴업 패키지<\/strong>를 Hiscox 단독 인수로 출시(Waste Insure, Recyclesure 브랜드)<\/td>\n<\/tr>\n<tr>\n<td>영국 <strong>GM Insurance Brokers<\/strong><\/td>\n<td>재활용 전문 중개사. 대형 중개 그룹(AssuredPartners)이 인수 → 전문성이 '값'이 됨<\/td>\n<\/tr>\n<tr>\n<td>중개사 설문(Corin)<\/td>\n<td>중개사 <strong>62%<\/strong> 가 \"폐기물·재활용 같은 고위험 업종용 맞춤 상품\"이 <strong>매우 중요<\/strong>하다고 응답<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ MGA(인수대행사) = 보험사 대신 특정 업종 보험을 <strong>심사·가격 결정<\/strong>까지 맡는 전문 회사. 한국에는 아직 같은 형태가 일반적이지 않음.<\/p>\n<\/blockquote>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GA 규모<\/td>\n<td>GA 설계사 약 31만9천 명(전체 44.8%, 2026년 10월 보도)<\/td>\n<\/tr>\n<tr>\n<td>수수료 규제<\/td>\n<td>2026년 7월 1일부터 GA 설계사에도 1200%룰. 정착지원금·시책도 한도에 포함<\/td>\n<\/tr>\n<tr>\n<td>수수료 분급<\/td>\n<td>수수료를 여러 해에 나눠 주고(최대 7년), <strong>유지 수수료<\/strong> 신설 방향(2025년 6월 발표안)<\/td>\n<\/tr>\n<tr>\n<td>소비자 설명<\/td>\n<td>설계사 500명 이상 대형 GA는 비슷한 상품의 <strong>수수료 수준·추천 이유<\/strong>를 설명해야 함<\/td>\n<\/tr>\n<tr>\n<td>감독 강화<\/td>\n<td>2024~2026년 대형 GA 32곳 제재 42건(명의 도용 모집·부당 승환 등)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 내가 GA로 재활용 시장에 들어가는 4단계<\/h2>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>할 일<\/th>\n<th>관련 강의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 자리 정하기<\/td>\n<td>손해보험 <strong>기업성 상품(화재·배상·환경책임)<\/strong> 을 다룰 수 있는 GA 선택. 손보사 제휴가 넓은지 확인<\/td>\n<td>15·19일차<\/td>\n<\/tr>\n<tr>\n<td>② 전문 분야 선언<\/td>\n<td>\"폐차장·재활용·배터리 사업장 전문\" — 영국 Criterion·GM처럼 <strong>좁고 깊게<\/strong><\/td>\n<td>22일차<\/td>\n<\/tr>\n<tr>\n<td>③ 묶음 설계<\/td>\n<td>화재+영업배상+환경오염+휴업+(2027년) 배터리 의무보험을 <strong>한 장 견적표<\/strong>로<\/td>\n<td>19·20·25일차<\/td>\n<\/tr>\n<tr>\n<td>④ 오래 유지<\/td>\n<td>1200%룰 시대엔 <strong>유지율<\/strong>이 수입. 매년 '기록 노트' 갱신 관리<\/td>\n<td>23일차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>영업 한 줄<\/strong><\/p>\n<blockquote>\n<p>\"사장님, 저는 한 보험사 직원이 아니라 여러 보험사 상품을 비교해 드리는 GA 소속입니다. 화재는 조건 좋은 곳, 배상은 보장 넓은 곳으로 나눠서 묶어 드릴 수 있습니다.\"<\/p>\n<p>▶ 오늘의 생각거리: \"1200%룰로 '첫해 큰 수수료'가 줄었다면, 재활용 사업장처럼 <strong>매년 갱신하는 기업 보험<\/strong>은 나에게 불리할까, 유리할까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GA(법인보험대리점)<\/td>\n<td>여러 보험사와 계약해 상품을 비교·판매하는 독립 판매 회사<\/td>\n<\/tr>\n<tr>\n<td>전속 설계사<\/td>\n<td>한 보험사 상품만 파는 설계사<\/td>\n<\/tr>\n<tr>\n<td>보험중개사<\/td>\n<td>보험사가 아니라 고객 편에서 보험을 찾아 주고 조건을 협상하는 사업자<\/td>\n<\/tr>\n<tr>\n<td>MGA(인수대행사)<\/td>\n<td>보험사 대신 특정 업종 보험을 심사·가격 결정까지 하는 전문 회사<\/td>\n<\/tr>\n<tr>\n<td>1200%룰<\/td>\n<td>첫해 판매 수수료를 월 보험료의 12배 이내로 묶는 규제<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>여러 보험사 상품을 비교해 파는 '편집숍' 같은 판매 회사는?<\/li>\n<li>2026년 7월부터 GA 설계사에게도 적용된 수수료 규제 이름은?<\/li>\n<li>영국에서 재활용·폐기물 업종 전용으로 세워진 인수대행사(MGA) 이름은?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GA 설계사 약 31만9천 명, 전체 44.8%<\/td>\n<td>⚠️ 언론 보도(2026.10, 기준 시점 미상)<\/td>\n<td><a href=\"https://www.dailian.co.kr/news/view/1701040/\">데일리안<\/a> — GA협회 공시 원문 미대조<\/td>\n<\/tr>\n<tr>\n<td>손보사 계약 절반 이상 GA 판매<\/td>\n<td>⚠️ 언론 보도(날짜 불명확)<\/td>\n<td><a href=\"https://www.kukinews.com/article/view/kuk202502130213\">쿠키뉴스<\/a> — 정확한 비율 미확인<\/td>\n<\/tr>\n<tr>\n<td>1200%룰 GA 적용 2026.7.1 시행, 정착지원금·시책 포함<\/td>\n<td>✅ 언론 2곳 이상<\/td>\n<td><a href=\"https://biz.newdaily.co.kr/site/data/html/2026/07/02/2026070200135.amp.html\">뉴데일리<\/a>, <a href=\"https://biz.sbs.co.kr/amp/article/20000319687\">SBS Biz<\/a><\/td>\n<\/tr>\n<tr>\n<td>수수료 최대 7년 분급·유지 수수료 신설<\/td>\n<td>⚠️ 2025.6 발표안<\/td>\n<td><a href=\"https://v.daum.net/v/20250601134714403\">다음 뉴스<\/a> — 전면 시행 시점(2029년 설) 자료마다 다름<\/td>\n<\/tr>\n<tr>\n<td>설계사 500명 이상 대형 GA 수수료 비교 설명 의무<\/td>\n<td>⚠️ 언론 보도<\/td>\n<td><a href=\"https://biz.sbs.co.kr/amp/article/20000319687\">SBS Biz<\/a><\/td>\n<\/tr>\n<tr>\n<td>대형 GA 32곳 제재 42건(2024~2026)<\/td>\n<td>⚠️ 국정감사 관련 보도<\/td>\n<td><a href=\"https://www.dailian.co.kr/news/view/1701040/\">데일리안<\/a><\/td>\n<\/tr>\n<tr>\n<td>Criterion(OneAdvent) 2024 출범, Bridgehaven 자본<\/td>\n<td>✅ 업계지 2곳 이상<\/td>\n<td><a href=\"https://www.commercialriskonline.com/oneadvent-launches-mga-focused-on-recycling-sector/\">Commercial Risk<\/a>, <a href=\"https://www.reinsurancene.ws/oneadvent-fills-gap-in-under-served-recycling-sector-with-criterion-launch/\">Reinsurance News<\/a><\/td>\n<\/tr>\n<tr>\n<td>DILM 재활용·폐기물 패키지(Hiscox)<\/td>\n<td>⚠️ 업계지(날짜 미확인)<\/td>\n<td><a href=\"https://www.insuranceage.co.uk/node/2398328\">Insurance Age<\/a><\/td>\n<\/tr>\n<tr>\n<td>GM Insurance Brokers 인수(AssuredPartners)<\/td>\n<td>⚠️ 업계지(날짜 미확인)<\/td>\n<td><a href=\"https://insuranceage.co.uk/node/7953138\">Insurance Age<\/a><\/td>\n<\/tr>\n<tr>\n<td>중개사 62% \"고위험 업종 맞춤 상품 매우 중요\"<\/td>\n<td>⚠️ 업체(Corin) 설문<\/td>\n<td><a href=\"https://www.insurancebusinessmag.com/uk/news/breaking-news/brokers-prefer-bespoke-mga-offerings-over-general-market-products--report-536134.aspx\">Insurance Business<\/a><\/td>\n<\/tr>\n<tr>\n<td>설계사: 시험 합격 + 등록 교육 → 협회 등록<\/td>\n<td>⚠️ 강의·해설 자료<\/td>\n<td><a href=\"https://www.sidae.com/article/2025052109284733921\">시대에듀 보도<\/a> — 교육 시간 미확인<\/td>\n<\/tr>\n<tr>\n<td>법인대리점 자본금·인력 요건(1억/3억/5억 등)<\/td>\n<td>❓ 공식 자료 못 찾음<\/td>\n<td>블로그마다 숫자가 달라 <strong>본문에서 숫자 생략<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 법인보험대리점 등록 자본금은 자료마다 달라(5천만 원~5억 원) <strong>숫자를 쓰지 않고<\/strong> \"별도 등록 요건\"으로만 표기\n- 수수료 분급의 전면 시행 시점(2029년 설)은 해석이 갈려 본문에 넣지 않음\n- 영국 DILM·GM 사례는 기사 날짜를 확인하지 못해 '최근'이라는 표현을 쓰지 않음\n- '손보사 절반 이상 GA 판매'는 정확한 비율 대신 보도 표현 그대로 사용<\/p>"}]};
const nav = document.getElementById('nav'), view = document.getElementById('view');
const items = [
  ...DATA.lessons.slice().reverse().map(l => ({id:'day'+String(l.day).padStart(2,'0'), label:l.title.replace(/^[^\w가-힣]*/,''), md:l.md, group:'강의'})),

function render(id){
  const it = items.find(i => i.id === id) || items[0];
  let html = it.md;
  html = html.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  view.innerHTML = html;
  view.querySelectorAll('a[href^="./"]').forEach(a => a.removeAttribute('href'));
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.id === it.id));
  try { localStorage.setItem('last', it.id); } catch(e) {}
  window.scrollTo({top:0});
}
const done = DATA.lessons.length;
nav.innerHTML = `<div class="progress">진도 ${done} / 30일<div class="bar"><i style="width:${Math.min(100,done/30*100)}%"></i></div></div>`;
let g = '';
items.forEach(it => {
  if (it.group !== g) { g = it.group; nav.insertAdjacentHTML('beforeend', `<div class="label">${g}</div>`); }
  const b = document.createElement('button'); b.textContent = it.label; b.dataset.id = it.id;
  b.onclick = () => render(it.id); nav.appendChild(b);
});
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem('last'); } catch(e) {} }
render(start || items[0].id);
</script>
