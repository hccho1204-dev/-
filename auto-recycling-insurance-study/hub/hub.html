completes-takeover-of-li-cycle-battery-recycling-assets/757199/\">Waste Dive<\/a><\/td>\n<\/tr>\n<tr>\n<td>성일하이텍 새만금 공장 블랙매스 습식제련<\/td>\n<td>✅ 보도<\/td>\n<td><a href=\"https://dealsite.co.kr/articles/162957\">딜사이트<\/a><\/td>\n<\/tr>\n<tr>\n<td>재활용 시설 화재 272건(2016)→430건(2024), 2025년 448건<\/td>\n<td>⚠️ 업계 집계(Fire Rover)<\/td>\n<td><a href=\"https://resource-recycling.com/plastics/2025/08/13/fires-at-recycling-sites-on-track-to-reach-record-high/\">Resource Recycling<\/a> — 공개 보도된 건수 기준<\/td>\n<\/tr>\n<tr>\n<td>자기부담금 5만~10만 → 25만 달러 이상<\/td>\n<td>⚠️ 보험 중개사 1인 발언<\/td>\n<td><a href=\"https://www.businessinsurance.com/lithium-batteries-fuel-fires-at-waste-facilities/\">Business Insurance<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025년 화재 피해 약 25억 달러<\/td>\n<td>❓ 컨설턴트 추정<\/td>\n<td>감사된 수치 아님 → 본문 제외<\/td>\n<\/tr>\n<tr>\n<td>성일하이텍·에코프로 회수율<\/td>\n<td>❓ 공개 수치 못 찾음<\/td>\n<td>본문에서 회수율 숫자 없이 서술<\/td>\n<\/tr>\n<tr>\n<td>Redwood Materials 동향<\/td>\n<td>❓ 이번 검색에서 확인 못 함<\/td>\n<td>본문 제외<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용 (8일차 연결 포함)<\/strong>:\n- 국내 폐배터리 발생량은 추정치가 '2만 개'와 '7만 9천 개'로 4배 가까이 달라, 최신 정부 인용 수치를 쓰되 차이를 본문에 밝힘\n- 화재 피해액 25억 달러는 감사된 수치가 아니라 뺌\n- 기업별 회수율은 공개 자료를 못 찾아 숫자를 넣지 않음\n- 8일차의 '자동차 배터리 재활용 시장 262억 달러'는 범위가 넓은 수치라 오늘은 시장 금액 대신 <strong>물량(대수·개수)<\/strong> 중심으로 설명<\/p>"}, {"day": 11, "title": "11일차 — 배터리 재사용(ESS)과 안전: 재사용 배터리는 왜 보험 가입이 어렵나? (2026-10-16)", "md": "<h1>11일차 — 배터리 재사용(ESS)과 안전: 재사용 배터리는 왜 보험 가입이 어렵나? (2026-10-16)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>블랙매스<\/strong>(Black mass).<\/li>\n<li>2027년 말 <strong>50%<\/strong>, 2031년 말 <strong>80%<\/strong>.<\/li>\n<li><strong>Li-Cycle<\/strong>(2025년 5월 파산, 8월 글렌코어 인수).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"보험은 '얼마나 위험한지 알 수 있을 때' 가입이 된다. 재사용 배터리는 '과거를 모르는 중고 배터리'라서 위험을 재기 어렵고, 그래서 보험이 어렵다. 반대로 '배터리 건강 증명'을 해주면 보험이 열린다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>전기차 배터리는 용량이 약 <strong>70~80%<\/strong> 로 떨어지면 차에서는 아쉽지만, <strong>ESS(에너지 저장 장치)<\/strong> 로는 아직 쓸 만하다<\/td>\n<td>달리기 선수는 은퇴해도 걷기 운동은 충분히 할 수 있는 것과 비슷<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>ESS는 <strong>화재 이력<\/strong>이 있다. 한국은 2017년 8월 이후 ESS 화재가 30건 넘게 발생(2022년 1월 기준 33건, 학술 정리). 미국에서도 2025년 1월 대형 ESS 화재<\/td>\n<td>새 배터리로 만든 ESS도 불이 났는데, 중고 배터리라면 걱정이 더 큼<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>한국은 <strong>안전성검사를 통과한 재사용전지만<\/strong> 팔 수 있다. 사용후배터리법은 떼기 전 평가 + <strong>재사용사업자 보험(공제) 의무<\/strong><\/td>\n<td>\"검사받은 중고만 팔아라\" + \"사고 대비 보험 들어라\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 재사용 배터리가 보험에서 어려운 이유 4가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>이유<\/th>\n<th>설명<\/th>\n<th>보험사의 걱정<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 과거를 모른다<\/td>\n<td>그 배터리가 어떻게 충전·방전됐는지, 사고가 있었는지 기록이 흩어져 있음<\/td>\n<td>\"위험을 계산할 데이터가 없다\"<\/td>\n<\/tr>\n<tr>\n<td>② 건강 점수의 기준이 제각각<\/td>\n<td>배터리 건강 점수(SoH)가 같은 80%라도 <strong>측정 방법·기준에 따라 의미가 다름<\/strong><\/td>\n<td>\"80%라는 숫자를 믿어도 되나?\"<\/td>\n<\/tr>\n<tr>\n<td>③ 섞어서 쓴다<\/td>\n<td>서로 다른 차에서 나온, 상태가 다른 배터리를 묶어 ESS를 만듦<\/td>\n<td>약한 하나가 전체를 위험하게 만들 수 있음<\/td>\n<\/tr>\n<tr>\n<td>④ 큰 사고 사례<\/td>\n<td>대형 ESS 화재 한 번에 수천억 원 손해<\/td>\n<td>보험사가 받을 수 있는 한도를 넘을 수 있음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>SoH(State of Health, 배터리 건강 상태)<\/strong> = 새것일 때 대비 지금 저장할 수 있는 양. 100%가 새것, 80%면 처음의 80%만 저장.<\/p>\n<\/blockquote>\n<h2>3. 세계 사례<\/h2>\n<table>\n<thead>\n<tr>\n<th>사례<\/th>\n<th>내용<\/th>\n<th>보험과의 연결<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>미국 모스랜딩 화재<\/strong> (2025년 1월)<\/td>\n<td>캘리포니아 대형 ESS(300MW)에서 화재. 해당 설비 장부가치 약 <strong>4억 달러 전액 손실 처리<\/strong>, 운영사 Vistra는 재산·영업중단 보험 한도 <strong>5억 달러<\/strong>(자기부담금 제외)로 청구<\/td>\n<td>대형 ESS 사고는 <strong>보험 한도를 거의 다 쓰는 규모<\/strong>. 단, 이 설비는 <strong>새 배터리<\/strong>였음 → 재사용 배터리는 더 엄격히 봄<\/td>\n<\/tr>\n<tr>\n<td><strong>영국 Altelium<\/strong><\/td>\n<td>대학 연구에서 출발한 회사. 배터리를 뜯지 않고 상태를 진단하는 도구로 <strong>보험사가 배터리를 보증할 수 있게<\/strong> 해준다고 소개<\/td>\n<td>\"진단 데이터 → 보험 가능\"의 대표 모델 (업체 홍보 자료라 검증 필요)<\/td>\n<\/tr>\n<tr>\n<td><strong>영국 보험사 AXA<\/strong><\/td>\n<td>전기차 배터리에 <strong>'건강 증명서'와 실시간 데이터<\/strong>가 필요하다고 주장<\/td>\n<td>보험사가 원하는 것 = 증거(데이터)<\/td>\n<\/tr>\n<tr>\n<td><strong>국제 기준(UN GTR 22)<\/strong><\/td>\n<td>전기차 배터리는 5년/10만 km까지 80%, 8년/16만 km까지 70% 이상 유지해야 하는 최소 기준<\/td>\n<td>70~80%가 '은퇴 라인'으로 자주 언급되는 근거<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>재사용전지 안전성검사<\/td>\n<td>「전기용품 및 생활용품 안전관리법」 개정으로 <strong>안전성검사를 받은 재사용전지만 판매<\/strong> 가능(2023년 10월 시행으로 보도). 검사기관을 지정해 운영, 제조업체도 요건을 갖추면 검사기관으로 지정 가능<\/td>\n<\/tr>\n<tr>\n<td>ESS 화재 대응<\/td>\n<td>2019년 정부 조사: 배터리 보호 미흡, 운영환경 관리 미흡, 설치 부주의, 통합 보호체계 미흡이 복합 원인. 2022년 안전 강화 대책에서 <strong>사용후 배터리 ESS는 시스템 단위 안전 인증<\/strong>을 요구하는 방향<\/td>\n<\/tr>\n<tr>\n<td>사용후배터리법<\/td>\n<td>떼기 전 성능·안전 평가, 재사용사업자 등록, <strong>보험 또는 공제 가입 의무<\/strong>(6일차). 2027년 시행 예상<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] '어려운 보험'이 '기회'인 이유<\/h2>\n<table>\n<thead>\n<tr>\n<th>기회<\/th>\n<th>설명<\/th>\n<th>설계사가 할 수 있는 일<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 의무보험 시장<\/td>\n<td>재사용사업자는 법으로 보험(공제)에 들어야 함<\/td>\n<td>시행 전 업체 명단 확보, 손보사 상품 출시 동향 파악<\/td>\n<\/tr>\n<tr>\n<td>② '증거' 패키지<\/td>\n<td>보험사는 데이터를 원함<\/td>\n<td>고객사에 <strong>안전성검사 결과, 배터리 건강 이력, 소화 설비, 원격 감시<\/strong> 자료를 정리하게 도와 보험 심사를 통과시킴<\/td>\n<\/tr>\n<tr>\n<td>③ 성능 보증보험<\/td>\n<td>\"이 배터리가 몇 년간 몇 % 이상 유지된다\"는 보증을 보험으로 뒷받침<\/td>\n<td>재사용 배터리 판매업체의 <strong>신뢰 상품<\/strong>으로 제안 (18일차 품질보증보험과 연결)<\/td>\n<\/tr>\n<tr>\n<td>④ 영업중단 손해<\/td>\n<td>모스랜딩처럼 화재로 운영이 멈추면 수익 손실이 큼<\/td>\n<td>재산보험 + <strong>영업중단(휴업)손해<\/strong> 담보를 함께 설계<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"재사용 배터리 ESS를 파는 회사 사장님에게 '보험 가입이 어렵다'는 말 대신 '이 세 가지 자료만 준비하면 보험 심사가 쉬워집니다'라고 말한다면, 그 세 가지는 무엇일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ESS (에너지 저장 장치)<\/td>\n<td>전기를 저장했다가 필요할 때 꺼내 쓰는 대형 배터리 설비<\/td>\n<\/tr>\n<tr>\n<td>SoH (배터리 건강 상태)<\/td>\n<td>새것 대비 지금 저장할 수 있는 양의 비율<\/td>\n<\/tr>\n<tr>\n<td>재사용전지<\/td>\n<td>전기차에서 떼어낸 배터리를 다른 용도로 다시 쓰는 것. 한국은 안전성검사 통과 제품만 판매<\/td>\n<\/tr>\n<tr>\n<td>영업중단(휴업)손해<\/td>\n<td>사고로 영업을 못 해 생긴 수익 손실. 재산 피해와 별도로 보상<\/td>\n<\/tr>\n<tr>\n<td>성능 보증보험<\/td>\n<td>제품이 약속한 성능을 못 내면 보상하는 보험<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>배터리 건강 상태를 뜻하는 영어 약자 3글자는?<\/li>\n<li>재사용 배터리가 보험 가입이 어려운 가장 큰 이유는? (힌트: 과거)<\/li>\n<li>2025년 1월 미국 모스랜딩 ESS 화재 설비는 새 배터리였나, 재사용 배터리였나?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>모스랜딩 2025.1.16 화재, 300MW, 약 4억 달러 손실 처리, 보험 한도 5억 달러(자기부담금 제외)<\/td>\n<td>✅ 회사 공시<\/td>\n<td><a href=\"https://www.sec.gov/Archives/edgar/data/1692819/000169281925000035/vistra-20250331.htm\">Vistra 10-Q(2025.3)<\/a>, <a href=\"https://energy-storage.news/vistra-to-write-off-us400-million-from-moss-landing-bess\">Energy-Storage.news<\/a> — 실제 보험금 지급액은 미공개<\/td>\n<\/tr>\n<tr>\n<td>모스랜딩 설비가 새 배터리(재사용 아님)<\/td>\n<td>⚠️ 간접 확인<\/td>\n<td>공시상 LG 등 제조사 상대 소송, 재사용이라는 언급 없음 → '새 배터리'로 서술하되 퀴즈 정답에 단서<\/td>\n<\/tr>\n<tr>\n<td>한국 ESS 화재 2022년 1월 기준 33건<\/td>\n<td>⚠️ 학술 발표 정리<\/td>\n<td><a href=\"https://www.kais99.org/jkais/springNfall/spring2023/oral/2023_spring_103.pdf\">한국산학기술학회 2023 춘계<\/a> — 2019년 정부 발표는 23건(2019.5 기준)<\/td>\n<\/tr>\n<tr>\n<td>2019년 정부 조사 4대 원인<\/td>\n<td>✅ 보도<\/td>\n<td><a href=\"https://www.metroseoul.co.kr/article/2019061100180\">메트로신문 2019.6<\/a><\/td>\n<\/tr>\n<tr>\n<td>안전성검사 받은 재사용전지만 판매(2023.10 시행)<\/td>\n<td>⚠️ 2022년 사전 보도<\/td>\n<td><a href=\"https://v.daum.net/v/20221011110008211\">다음뉴스 2022.10<\/a>, <a href=\"https://newsseoul.co.kr/news/view/1065585617613826\">뉴스서울<\/a> — 실제 시행일은 법령 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>2022.5 ESS 안전 강화 대책, 사용후 배터리 시스템 단위 인증<\/td>\n<td>✅ 로펌 정리<\/td>\n<td><a href=\"https://www.shinkim.com/kor/media/newsletter/1815?page=129\">법무법인 세종<\/a><\/td>\n<\/tr>\n<tr>\n<td>UN GTR 22: 5년/10만km 80%, 8년/16만km 70%<\/td>\n<td>⚠️ 2차 정리<\/td>\n<td><a href=\"https://evkx.net/de/guides/ev-claims/battery-at-70-to-80-percent-health\">evkx<\/a><\/td>\n<\/tr>\n<tr>\n<td>AXA, 배터리 건강 증명서 요구<\/td>\n<td>⚠️ 과거 보도<\/td>\n<td><a href=\"https://airqualitynews.com/cars-freight-transport/new-research-leads-to-calls-for-ev-battery-health-certificates\">Air Quality News<\/a><\/td>\n<\/tr>\n<tr>\n<td>Altelium, 보험사가 배터리 보증하도록 진단<\/td>\n<td>⚠️ 홍보성 사례<\/td>\n<td><a href=\"https://faraday.ac.uk/success-stories/developing-diagnostic-models-to-warranty-batteries/\">Faraday Institution<\/a><\/td>\n<\/tr>\n<tr>\n<td>ESS 화재보험 손해율·가입률<\/td>\n<td>❓ 공개 자료 못 찾음<\/td>\n<td>본문에서 숫자 없이 서술<\/td>\n<\/tr>\n<tr>\n<td>2027년 7월 관련 제도 시행 언급(2026.10 세미나 보도)<\/td>\n<td>❓ 무슨 제도인지 불명확<\/td>\n<td>본문 제외 (사용후배터리법 시행 시점과 연관 가능, 추후 확인)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 한국 ESS 화재 건수는 집계 시점마다 23건·26건·33건으로 달라, <strong>기준 시점(2022년 1월)을 붙여<\/strong> 33건으로 표기\n- 모스랜딩 사례는 재사용 배터리 사고가 아니므로 \"새 배터리였다\"를 명시해 오해를 막음\n- ESS 화재보험 손해율은 찾지 못해 숫자를 넣지 않음\n- 재사용전지 판매 규제 시행일은 사전 보도 기준이라 ⚠️로 표시<\/p>"}, {"day": 12, "title": "12일차 — 재활용 소재(철·알루미늄·플라스틱): 재생 플라스틱 의무가 왜 중요한가? (2026-10-17)", "md": "<h1>12일차 — 재활용 소재(철·알루미늄·플라스틱): 재생 플라스틱 의무가 왜 중요한가? (2026-10-17)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>SoH<\/strong>(State of Health, 배터리 건강 상태).<\/li>\n<li><strong>과거(사용 이력)를 모른다<\/strong> → 위험을 계산할 데이터가 없다.<\/li>\n<li><strong>새 배터리<\/strong>였다. 재사용 배터리가 아니었는데도 큰 화재가 났기 때문에, 재사용 배터리는 더 엄격하게 봅니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"폐차에서 철은 이미 '돈'이고, 알루미늄은 '큰 돈'이고, 플라스틱은 '골칫거리'였다. 유럽이 재생 플라스틱 사용을 법으로 강제하면서, 골칫거리가 '팔리는 원료'로 바뀌기 시작했다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>철·알루미늄은 <strong>이미 잘 재활용<\/strong>된다. 특히 알루미늄은 새로 만들 때보다 <strong>에너지를 약 90~95% 덜<\/strong> 쓴다<\/td>\n<td>금속은 녹여서 다시 쓰기 쉽고 값도 나간다<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>플라스틱은 종류가 섞이고 값이 싸서 <strong>재활용이 잘 안 됐다<\/strong> → 파쇄잔재물(ASR)로 매립·소각<\/td>\n<td>2일차의 '마지막 5%' 문제의 주범<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>유럽은 새 차에 <strong>재생 플라스틱 15%(2032년 9월~) → 25%(2036년 9월~)<\/strong> 를 의무화. 그중 일부는 <strong>폐차에서 나온 플라스틱<\/strong>이어야 함<\/td>\n<td>\"재활용 플라스틱을 꼭 사서 써라\" → 폐차 플라스틱에 <strong>수요<\/strong>가 생김<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 폐차 소재별 '성적표'<\/h2>\n<table>\n<thead>\n<tr>\n<th>소재<\/th>\n<th>재활용 상태<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>철<\/strong><\/td>\n<td>잘 됨<\/td>\n<td>자석으로 쉽게 골라낼 수 있고, 고철값이 있음. 폐차 보상금의 대부분이 고철값(2일차)<\/td>\n<\/tr>\n<tr>\n<td><strong>알루미늄<\/strong><\/td>\n<td>잘 됨, 값도 높음<\/td>\n<td>새로 만들려면 전기를 엄청 써야 해서, 재활용하면 에너지 약 90~95% 절감<\/td>\n<\/tr>\n<tr>\n<td><strong>구리 등 비철금속<\/strong><\/td>\n<td>잘 됨<\/td>\n<td>값이 비싸서 분리할 이유가 충분<\/td>\n<\/tr>\n<tr>\n<td><strong>플라스틱<\/strong><\/td>\n<td>잘 안 됨<\/td>\n<td>종류가 수십 가지로 섞여 있고, 새 플라스틱이 싸서 재생 플라스틱이 경쟁력이 없었음<\/td>\n<\/tr>\n<tr>\n<td><strong>유리·고무<\/strong><\/td>\n<td>잘 안 됨<\/td>\n<td>값이 낮아 분리 비용이 더 듦(2일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>재생원료(재생 소재)<\/strong> = 버려진 제품에서 회수해 다시 원료로 만든 것. '버려진 뒤'에 나온 것만 인정하는 경우가 많습니다(공장에서 나온 자투리는 제외).<\/p>\n<\/blockquote>\n<h2>3. 세계: 유럽이 판을 바꾸다<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>규정<\/td>\n<td><strong>(EU) 2026/1738<\/strong>, 2026년 7월 관보 게재, <strong>8월 13일 발효<\/strong>(4일차)<\/td>\n<\/tr>\n<tr>\n<td>재생 플라스틱<\/td>\n<td>형식승인 기준 <strong>2032년 9월 1일부터 15%<\/strong>, <strong>2036년 9월 1일부터 25%<\/strong>(무게 기준)<\/td>\n<\/tr>\n<tr>\n<td>폐차 출신 비율<\/td>\n<td>재생 플라스틱 중 <strong>최소 20%<\/strong> 는 폐차·중고 부품에서 회수한 것이어야 한다고 보도 (정확한 문구는 원문 확인 필요)<\/td>\n<\/tr>\n<tr>\n<td>철·알루미늄<\/td>\n<td>유럽 집행위가 <strong>2033년 8월까지<\/strong> 재생 철강·알루미늄 최소 비율을 정하기로 함<\/td>\n<\/tr>\n<tr>\n<td>인정 범위<\/td>\n<td>'소비 후(버려진 뒤)' 재생원료만 인정<\/td>\n<\/tr>\n<tr>\n<td>업계 반응<\/td>\n<td>부품업체들이 재생 플라스틱 확보 경쟁 시작<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 연결 고리: 1일차에서 \"15%(약 6년 후), 25%(약 10년 후)\"라고 배웠는데, 정확히는 <strong>2032년 9월, 2036년 9월<\/strong>부터 새로 승인받는 차종에 적용됩니다.<\/p>\n<\/blockquote>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>자동차 재생원료 의무<\/td>\n<td><strong>아직 확인된 의무 비율 없음<\/strong>(이번 조사 기준)<\/td>\n<\/tr>\n<tr>\n<td>다른 분야<\/td>\n<td>2026년 PET(음료병 등) 재생원료 10% 의무, 화장품 용기 등 PE·PP로 확대 예고. 정부 목표: 2030년 재생원료 200만 톤 사용<\/td>\n<\/tr>\n<tr>\n<td>의미<\/td>\n<td>한국 자동차·부품 회사도 <strong>유럽에 수출하려면<\/strong> 유럽 기준을 맞춰야 함 → 국내 폐차 플라스틱에도 수요가 생길 가능성<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 소재가 '돈'이 되면 위험도 커진다<\/h2>\n<table>\n<thead>\n<tr>\n<th>위험<\/th>\n<th>실제 사례<\/th>\n<th>보험 기회<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 파쇄장 화재<\/td>\n<td>2025년 2월 미국 뉴저지 캠던의 대형 고철 파쇄 시설에서 큰 화재, <strong>리튬이온 배터리<\/strong>가 원인으로 추정. 2026년 5월 또 화재로 운영 중단. 2025년 5월 독일 올덴부르크 고철장 화재에 소방관 230명 이상 투입, 차량 수백 대 소실<\/td>\n<td>파쇄·고철장 <strong>화재보험 + 영업중단손해<\/strong>. 배터리 분리 절차를 갖춘 곳이 보험 조건에서 유리<\/td>\n<\/tr>\n<tr>\n<td>② 주민·환경 피해<\/td>\n<td>캠던 화재 때 검은 연기로 주민 약 100명 대피, 시 의회가 운영 재개 여부 심사<\/td>\n<td><strong>환경오염·제3자 배상책임보험<\/strong>. 사고 후 영업 허가까지 흔들릴 수 있음<\/td>\n<\/tr>\n<tr>\n<td>③ 원료 품질 분쟁<\/td>\n<td>재생 플라스틱이 '폐차 출신'인지, 규격에 맞는지 증명 필요<\/td>\n<td>재생원료 공급업체의 <strong>제품 배상·품질 보증<\/strong> 관련 보험(18일차)<\/td>\n<\/tr>\n<tr>\n<td>④ 가격 변동<\/td>\n<td>고철·알루미늄 시세에 따라 폐차장 수익이 크게 흔들림<\/td>\n<td>보험으로 막기 어려운 위험 → 고객 상담 시 \"보험으로 되는 것/안 되는 것\" 구분이 신뢰를 줌<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"폐차 플라스틱이 '쓰레기'에서 '팔리는 원료'가 되면, 폐차장 사장님의 창고에는 무엇이 더 많이 쌓일까? 그것은 어떤 새로운 위험을 만들까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>재생원료<\/td>\n<td>버려진 제품에서 회수해 다시 만든 원료<\/td>\n<\/tr>\n<tr>\n<td>소비 후(post-consumer)<\/td>\n<td>소비자가 쓰고 버린 뒤 나온 것. 유럽 재생 플라스틱 의무에서 인정하는 기준<\/td>\n<\/tr>\n<tr>\n<td>닫힌 순환(closed loop)<\/td>\n<td>자동차에서 나온 소재를 다시 자동차에 쓰는 것<\/td>\n<\/tr>\n<tr>\n<td>파쇄장(슈레더)<\/td>\n<td>차체를 잘게 부숴 금속을 골라내는 시설. 화재 위험이 큼<\/td>\n<\/tr>\n<tr>\n<td>형식승인<\/td>\n<td>새 차 모델이 판매 전에 받는 정부 승인. 유럽 재생 플라스틱 의무는 이 시점을 기준으로 적용<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>알루미늄을 재활용하면 새로 만들 때보다 에너지를 대략 몇 % 덜 쓰나?<\/li>\n<li>유럽 재생 플라스틱 의무 비율은 2032년 9월부터 몇 %, 2036년 9월부터 몇 %?<\/li>\n<li>고철 파쇄장 화재의 원인으로 자주 지목되는 것은?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>규정 2026/1738, 7월 관보, 8월 13일 발효<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://euromoulders.org/2026/07/eu-elvr-now-published-in-the-eu-official-journal/\">Euromoulders<\/a>, <a href=\"https://just-auto.com/news/eu-end-of-life-vehicle-regulation-takes-effect/\">Just Auto<\/a>, 4일차<\/td>\n<\/tr>\n<tr>\n<td>재생 플라스틱 15%(2032.9.1~), 25%(2036.9.1~) 형식승인 기준<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://just-auto.com/news/eu-end-of-life-vehicle-regulation-takes-effect/\">Just Auto<\/a>, <a href=\"https://www.automotivelogistics.media/sustainability/eu-end-of-life-vehicles-regulation-enters-into-force/2724484\">Automotive Logistics<\/a><\/td>\n<\/tr>\n<tr>\n<td>재생 플라스틱 중 최소 20%는 폐차 출신<\/td>\n<td>⚠️ 보도 간 문구 차이<\/td>\n<td><a href=\"https://bkv-gmbh.de/news-reader-4/eu-end-of-life-vehicles-regulation-adopted-by-plenary.html\">BKV<\/a>, <a href=\"https://www.freemalaysiatoday.com/category/world/2025/12/12/eu-agrees-recycled-plastic-targets-for-cars\">Free Malaysia Today<\/a> — 관보 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>철·알루미늄 재생 비율은 2033년 8월까지 정함<\/td>\n<td>⚠️ 2차 보도<\/td>\n<td>Just Auto<\/td>\n<\/tr>\n<tr>\n<td>소비 후 재생원료만 인정<\/td>\n<td>⚠️ 업계 발표자 인용<\/td>\n<td><a href=\"https://www.plasticstoday.com/automotive-mobility/automotive-suppliers-race-to-meet-eu-recycled-plastics-mandate\">PlasticsToday<\/a><\/td>\n<\/tr>\n<tr>\n<td>알루미늄 재활용 에너지 약 90~95% 절감<\/td>\n<td>✅ 복수 출처(범위)<\/td>\n<td><a href=\"https://www.recycling-magazine.com/?p=34110\">Recycling Magazine<\/a>, <a href=\"https://www.automotiveworld.com/news-releases/novelis-expands-aluminium-recycling-in-the-automotive-industry\">Novelis<\/a> — 기준에 따라 90%/95%로 다름<\/td>\n<\/tr>\n<tr>\n<td>한국 PET 재생원료 10%(2026), 2030년 재생원료 200만 톤<\/td>\n<td>⚠️ 보도<\/td>\n<td><a href=\"https://cosinkorea.com/mobile/article.html?no=57343\">코스인코리아<\/a><\/td>\n<\/tr>\n<tr>\n<td>한국 자동차 재생원료 의무 없음<\/td>\n<td>❓ '못 찾음'이지 '없음' 확인 아님<\/td>\n<td>본문에 \"확인된 의무 없음(이번 조사 기준)\"으로 표현<\/td>\n<\/tr>\n<tr>\n<td>캠던 EMR 2025.2 화재, 리튬이온 배터리 추정, 주민 약 100명 대피, 2026.5 재화재<\/td>\n<td>✅ 복수 보도<\/td>\n<td><a href=\"https://www.argusmedia.com/pt/news-and-insights/latest-market-news/2661286-fire-damages-emr-s-nj-shredding-facility\">Argus<\/a>, <a href=\"https://www.1strespondernews.com/news/031725128/camden-4th-alarm-rages-for-hours-with-smoke-plume-seen-for-miles\">1st Responder News<\/a>, <a href=\"https://whyy.org/articles/camden-emr-scrap-metal-fire-shutdown/\">WHYY<\/a><\/td>\n<\/tr>\n<tr>\n<td>독일 올덴부르크 고철장 화재 소방관 230명+<\/td>\n<td>✅ 보도<\/td>\n<td><a href=\"https://www.wam.ae/en/article/15klcyu-over-230-firefighters-battle-large-fire-german\">WAM<\/a><\/td>\n<\/tr>\n<tr>\n<td>철강 전기로 재활용 에너지·탄소 절감 수치<\/td>\n<td>❓ 이번 검색에서 못 찾음<\/td>\n<td>본문에서 수치 없이 서술<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용 (1·4일차 보완)<\/strong>:\n- 1일차 \"15%(약 6년 후), 25%(약 10년 후)\"를 <strong>2032년 9월 1일, 2036년 9월 1일(형식승인 기준)<\/strong> 으로 구체화\n- '폐차 출신 20%'는 보도마다 '재생 플라스틱의 20%'와 '재생 목표의 20%'로 문구가 달라 ⚠️로 표시\n- 알루미늄 에너지 절감은 단일 수치(95%) 대신 <strong>90~95% 범위<\/strong>로 표기\n- 철강 재활용 효과 수치는 근거를 못 찾아 뺌<\/p>"}, {"day": 13, "title": "13일차 — 탄소·ESG와 자동차 재활용: 보험사 ESG 평가와 어떻게 연결되나? (2026-10-18)", "md": "<h1>13일차 — 탄소·ESG와 자동차 재활용: 보험사 ESG 평가와 어떻게 연결되나? (2026-10-18)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>약 90~95%<\/strong>. 기준에 따라 90%, 95%로 다르게 소개됩니다.<\/li>\n<li>2032년 9월부터 <strong>15%<\/strong>, 2036년 9월부터 <strong>25%<\/strong>.<\/li>\n<li><strong>리튬이온 배터리<\/strong>. 고철 더미에 섞여 들어온 배터리가 찌그러지면서 불이 납니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"보험사가 내는 탄소의 대부분은 사무실이 아니라 '보험금으로 고쳐주는 차'에서 나온다. 그래서 '어떻게 고치느냐(새 부품 vs 수리 vs 재활용 부품)'가 보험사 ESG 성적표가 된다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>ESG<\/strong> = 환경(E)·사회(S)·지배구조(G). 투자자와 정부가 기업을 \"돈만 버는지, 책임 있게 버는지\"로 평가하는 기준<\/td>\n<td>회사의 '착한 정도 성적표'<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>보험사의 탄소는 대부분 <strong>스코프 3<\/strong>(가치사슬, 남이 내지만 내 사업 때문에 생긴 탄소)에 있다. 자동차보험에서는 <strong>사고 수리<\/strong>가 큰 부분<\/td>\n<td>보험사 건물 전기보다, 보험금으로 새 범퍼를 만들고 운송하고 칠하는 탄소가 훨씬 큼<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>탄소 순서: 일반적으로 <strong>수리 &lt; 재활용 부품 &lt; 새 부품<\/strong>. 그래서 해외 보험사는 <strong>중고·재활용 부품 수리<\/strong>를 늘리고, 수리 탄소를 <strong>측정하는 도구<\/strong>까지 쓴다<\/td>\n<td>\"고칠 수 있으면 고치고, 바꿔야 하면 재활용 부품으로\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 스코프 1·2·3 쉽게 보기<\/h2>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>뜻<\/th>\n<th>보험사 예시<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>스코프 1<\/td>\n<td>회사가 <strong>직접<\/strong> 태워서 낸 탄소<\/td>\n<td>회사 차량 기름<\/td>\n<\/tr>\n<tr>\n<td>스코프 2<\/td>\n<td>회사가 <strong>산 전기·열<\/strong>에서 나온 탄소<\/td>\n<td>본사 건물 전기<\/td>\n<\/tr>\n<tr>\n<td>스코프 3<\/td>\n<td>회사 <strong>밖<\/strong>에서 나왔지만 회사 사업과 연결된 탄소<\/td>\n<td><strong>보험금으로 하는 자동차 수리<\/strong>, 투자한 회사의 탄소<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 해외 업계 자료는 보험사 운영 탄소의 <strong>대부분이 보상(클레임) 처리<\/strong> 과정에서 나온다고 설명합니다(업체 자료라 수치는 검증 필요).<\/p>\n<\/blockquote>\n<h2>3. 세계는 어떻게 하나<\/h2>\n<table>\n<thead>\n<tr>\n<th>사례<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>독일 알리안츠<\/strong> (2024년 4월~)<\/td>\n<td>전손차에서 떼어낸 <strong>인증 중고부품<\/strong> 사용을 권장하기 시작<\/td>\n<\/tr>\n<tr>\n<td><strong>수리 탄소 측정 도구<\/strong><\/td>\n<td>Solera의 'Sustainable Estimatics'(보험 수리 견적에 CO2를 함께 계산), 'Eco Repair Score'(수리 탄소 점수) 등 → 보험사가 <strong>스코프 3를 숫자로 관리<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>유럽 '수리 조항'<\/strong>(2024)<\/td>\n<td>범퍼·헤드램프 같은 외관 부품을 순정사가 아닌 회사도 만들 수 있게 열어둠 → 대체·재활용 부품 선택지 확대<\/td>\n<\/tr>\n<tr>\n<td><strong>일본 보험사<\/strong> (5일차)<\/td>\n<td>재활용 부품 권장, 폐차 부품 회수 → 환경성 사례집에 수록<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>친환경 부품 특약<\/td>\n<td>현대해상 법인차 <strong>중고부품 수리 조건 자차 8% 할인<\/strong>(2019), 자차 가입자 특약 인지도 18%(3일차)<\/td>\n<\/tr>\n<tr>\n<td>탄소 감축 효과<\/td>\n<td>국내 보험사가 중고부품 수리로 <strong>CO2를 얼마나 줄였는지 공개한 수치는 찾지 못함<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ESG 공시 의무화<\/td>\n<td>금융위: <strong>2028년부터<\/strong> 자산 10조 원 이상 코스피 상장사부터 사업보고서로 지속가능성 법정 공시, 2029년 5조 원 이상으로 확대 계획, <strong>2030년부터 제3자 인증<\/strong> 의무(2026년 8월 보도 기준)<\/td>\n<\/tr>\n<tr>\n<td>보험사 영향<\/td>\n<td>대형 상장 손보사는 공시 대상에 들어갈 가능성이 큼 → <strong>수리·부품 탄소 관리<\/strong>가 공시 항목과 연결될 수 있음 (보험업 별도 기준은 미확인)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] ESG를 영업 언어로 바꾸기<\/h2>\n<table>\n<thead>\n<tr>\n<th>대상<\/th>\n<th>그들의 ESG 고민<\/th>\n<th>설계사가 줄 수 있는 것<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 보험사(원수사)<\/td>\n<td>스코프 3 탄소를 줄여야 ESG 평가·공시에 유리<\/td>\n<td>재활용 부품 수리를 늘리는 <strong>정비소·폐차장 네트워크<\/strong> 제안 → 보험사가 숫자로 자랑할 수 있는 실적<\/td>\n<\/tr>\n<tr>\n<td>② 법인 고객(렌터카·운수·관공서)<\/td>\n<td>자기 회사 ESG 보고서에 '친환경 차량 관리'를 쓰고 싶음<\/td>\n<td><strong>친환경부품 수리 조건 할인 상품<\/strong> 안내 + \"수리 때 재활용 부품 ○건 사용\" 같은 기록 정리 지원<\/td>\n<\/tr>\n<tr>\n<td>③ 폐차장·재활용 업체<\/td>\n<td>대기업 협력사가 되려면 ESG 증빙 요구받음<\/td>\n<td><strong>환경·안전 보험 가입 증빙<\/strong>이 ESG 평가 자료가 됨 (19일차)<\/td>\n<\/tr>\n<tr>\n<td>④ 개인 고객<\/td>\n<td>\"환경에도 좋고 돈도 돌려받는다\"<\/td>\n<td>대체부품 25% 환급(3일차) + 친환경 특약 → <strong>'착한 선택이 이득'<\/strong> 화법<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"법인 고객(예: 렌터카 회사) 담당자에게 '보험료 할인'과 'ESG 보고서에 쓸 숫자', 둘 중 무엇이 더 설득력 있을까? 회사 규모에 따라 답이 달라질까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ESG<\/td>\n<td>환경·사회·지배구조. 기업의 책임 경영 평가 기준<\/td>\n<\/tr>\n<tr>\n<td>스코프 3<\/td>\n<td>회사 밖 가치사슬에서 나오는 간접 탄소. 보험사는 수리·투자 탄소가 핵심<\/td>\n<\/tr>\n<tr>\n<td>CO2e(이산화탄소 환산량)<\/td>\n<td>여러 온실가스를 이산화탄소 기준으로 바꿔 더한 양<\/td>\n<\/tr>\n<tr>\n<td>지속가능성 공시<\/td>\n<td>기업이 ESG 정보를 공식 보고서로 공개하는 것. 한국은 2028년부터 단계적 의무화 예정<\/td>\n<\/tr>\n<tr>\n<td>그린워싱<\/td>\n<td>실제보다 친환경인 척 부풀리는 것. 공시 의무화의 주요 감시 대상<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>보험사 탄소 배출 중, 보험금으로 하는 자동차 수리는 스코프 몇에 해당하나?<\/li>\n<li>일반적으로 탄소가 가장 적게 나오는 수리 방법은? (새 부품 교체 / 재활용 부품 교체 / 수리)<\/li>\n<li>한국 지속가능성 공시 의무화는 몇 년부터 시작될 예정인가?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>보험사 스코프 3에 차량 수리 포함, 가장 추적이 어려움<\/td>\n<td>⚠️ 업계 매체<\/td>\n<td><a href=\"https://collisionrepairmag.com/carbon-in-claims-crm-23-4\">Collision Repair Mag<\/a><\/td>\n<\/tr>\n<tr>\n<td>보상 처리가 보험사 운영 탄소의 대부분<\/td>\n<td>⚠️ 업체(Guidewire) 블로그<\/td>\n<td><a href=\"https://www.guidewire.com/resources/blog/general-interest/hands-on-sustainability-how-insurers-drive-circularity-in-claims-management\">Guidewire<\/a> — 수치 검증 안 됨, 본문에 '업체 자료' 명시<\/td>\n<\/tr>\n<tr>\n<td>탄소: 수리 &lt; 중고부품 &lt; 새 부품<\/td>\n<td>⚠️ 업체 자료<\/td>\n<td>같은 출처 — \"일반적으로\"로 완화<\/td>\n<\/tr>\n<tr>\n<td>알리안츠 2024.4 인증 중고부품 권장<\/td>\n<td>⚠️ 업체 블로그 인용<\/td>\n<td>같은 출처 — 알리안츠 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>Solera Sustainable Estimatics, 스코프 3 측정<\/td>\n<td>✅ EU 순환경제 플랫폼<\/td>\n<td><a href=\"https://circulareconomy.europa.eu/platform/fr/node/8019\">EU Circular Economy Platform<\/a><\/td>\n<\/tr>\n<tr>\n<td>유럽 2024 수리 조항(외관 부품 개방)<\/td>\n<td>⚠️ 업체 블로그 인용<\/td>\n<td>Guidewire — 법령 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>현대해상 2019 법인차 중고부품 8% 할인<\/td>\n<td>✅ 보도(과거)<\/td>\n<td><a href=\"https://www.sateconomy.co.kr/news/view/179589447115436\">시사경제<\/a> — 현재 판매 여부 미확인(3일차와 동일)<\/td>\n<\/tr>\n<tr>\n<td>국내 보험사 중고부품 CO2 감축량<\/td>\n<td>❓ 공개 자료 못 찾음<\/td>\n<td>본문에 \"찾지 못함\" 명시<\/td>\n<\/tr>\n<tr>\n<td>ESG 공시 2028년 10조 원 이상 코스피, 2029년 5조, 2030 제3자 인증, 초기 3년 면책<\/td>\n<td>⚠️ 언론 보도(2026.8)<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2026082015210336745\">MTN<\/a> — 금융위 보도자료 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>보험업 별도 공시 기준<\/td>\n<td>❓ 미확인<\/td>\n<td>본문에 \"미확인\" 표기<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- \"수리 &lt; 재활용 부품 &lt; 새 부품\" 탄소 순서는 업체 자료라 <strong>\"일반적으로\"<\/strong> 로 표현을 낮춤\n- 보상 처리 탄소 비중은 구체 숫자 없이 \"대부분이라고 설명(업체 자료)\"으로만 표기\n- ESG 공시 대상 기준은 2월 의견안(30조 원)과 7월 최종안(10조 원)이 달라, <strong>최신 보도(10조 원)<\/strong> 기준으로 쓰고 확정 여부는 ⚠️\n- 국내 탄소 감축 수치는 없어서 만들지 않음<\/p>"}]};
const nav = document.getElementById('nav'), view = document.getElementById('view');
const items = [
  ...DATA.lessons.slice().reverse().map(l => ({id:'day'+String(l.day).padStart(2,'0'), label:l.title.replace(/^[^\w가-힣]*/,''), md:l.md, group:'강의'})),
  {id:'curriculum', label:'30일 커리큘럼', md:DATA.curriculum, group:'안내'},
  {id:'selfcheck', label:'자기점검 원칙', md:DATA.selfcheck, group:'안내'}
];
function render(id){
  const it = items.find(i => i.id === id) || items[0];
  let html = it.md;
  html = html.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  view.innerHTML = html;
  view.querySelectorAll('a[href^="./"]').forEach(a => a.removeAttribute('href'));
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.id === it.id));
  try { localStorage.setItem('last', it.id); } catch(e) {}
  window.scrollTo({top:0});
}
const done = DATA.lessons.length;
nav.innerHTML = `<div class="progress">진도 ${done} / 30일<div class="bar"><i style="width:${Math.min(100,done/30*100)}%"></i></div></div>`;
let g = '';
items.forEach(it => {
  if (it.group !== g) { g = it.group; nav.insertAdjacentHTML('beforeend', `<div class="label">${g}</div>`); }
  const b = document.createElement('button'); b.textContent = it.label; b.dataset.id = it.id;
  b.onclick = () => render(it.id); nav.appendChild(b);
});
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem('last'); } catch(e) {} }
render(start || items[0].id);
</script>
