자·법·날짜마다 출처가 있는가? | 출처 링크 1개 이상 |\n| 2. 교차 확인 | 중요한 숫자는 2곳 이상에서 확인했는가? | 기관마다 다르면 \"범위\"로 표기 |\n| 3. 최신성 | 법·제도가 지금도 유효한가? (개정·시행일) | 시행일/발표일 명시 |\n| 4. 쉬운 말 | 비개발자·비전문가가 이해할 수 있는가? | 전문용어는 괄호로 풀이 |\n| 5. 보험 연결 | 오늘 내용이 '보험 참여'와 연결되는가? | \"보험 포인트\" 섹션 필수 |\n\n## 신뢰도 표시\n- ✅ **확인됨**: 공식 기관·법령·원문 또는 2개 이상 출처 일치\n- ⚠️ **추정/범위**: 시장조사기관 추정치, 출처마다 차이 있음\n- ❓ **추가 확인 필요**: 보도만 있고 원문 미확인 → 실제 사업 결정 전 재확인\n", "lessons": [{"day": 1, "title": "📘 1일차 — 큰 그림: 자동차 재활용이란? (2026-10-06)", "md": "# 📘 1일차 — 큰 그림: 자동차 재활용이란? (2026-10-06)\n\n> ⏱ 읽는 시간 10분 · 오늘의 한 줄: **\"폐차는 쓰레기가 아니라 '자원 + 돈 + 위험'이 모인 덩어리이고, 보험은 그 세 가지 모두에 이미 관여하고 있다.\"**\n\n---\n\n## 1. 오늘 꼭 알아야 할 3가지\n\n| # | 핵심 | 쉬운 설명 |\n|---|---|---|\n| 1 | 매년 전 세계에서 **약 3,500만~4,000만 대**의 차가 수명을 다한다 | 한국 인구 수의 70% 정도 되는 차가 매년 버려지는 셈 |\n| 2 | 차 한 대의 **약 95%는 다시 쓸 수 있다** | 철·알루미늄·부품·플라스틱을 다시 쓰는 것. 한국도 법으로 95% 재활용을 목표로 정함 |\n| 3 | **보험사는 폐차 산업의 '최대 공급자' 중 하나** | 사고로 고칠 수 없는 차(전손차)를 보험사가 넘겨받아 팔기 때문 |\n\n---\n\n## 2. 자동차 재활용, 그림으로 보기\n\n```\n[차량 사고 / 노후]\n      │\n      ├─ 고칠 수 있음 → 정비소 수리  ← (여기서 '중고·재제조 부품'이 쓰임) ★보험 접점 ①\n      │\n      └─ 고칠 수 없음/수리비 > 차값 → '전손(全損)' 처리 ★보험 접점 ②\n                 │\n                 ▼\n          [폐차장 / 경매]\n                 │\n     ┌───────────┼─────────────┐\n     ▼           ▼             ▼\n 부품 떼어 재판매  배터리 회수      몸체 파쇄\n (재사용·재제조)  (재사용·재활용)  (철·알루미늄·플라스틱 원료)\n     │           │ ★보험 접점 ③(화재·보관 위험)\n     ▼           ▼\n  정비소로      ESS·소재회사로\n```\n\n> 💡 **전손(全損)** = 차가 완전히 망가졌거나, 수리비가 차값보다 비싸서 \"고치지 말고 차값을 보상하자\"고 결정한 상태.\n> 💡 **재제조(再製造)** = 헌 부품을 분해·세척·교체해서 새것 수준으로 되살린 부품.\n\n---\n\n## 3. 세계는 지금 어디로 가고 있나?\n\n| 지역 | 무엇이 바뀌었나 | 의미 |\n|---|---|---|\n| 🇪🇺 유럽 | 2025년 12월 새 「폐차(ELV) 규정」 합의 → 새 차에 **재생 플라스틱 15%(약 6년 후)**, **25%(약 10년 후)** 의무, 이 중 일부는 폐차에서 나온 플라스틱이어야 함. 트럭·버스·오토바이까지 확대 | 폐차가 '원료 공급원'으로 격상됨 |\n| 🇺🇸 미국 | 평균 차량 나이 **약 14년** → 매년 400만 대 이상 재활용 처리. 사고차 경매는 Copart·IAA 두 회사가 약 80% 장악 | 보험사 물량이 이 회사들의 생명줄 |\n| 🇰🇷 한국 | 매년 **70만~90만 대** 폐차. 재활용률 95% 목표. 2026년 3월 「사용후배터리법」 국회 법사위 통과 | 전기차 폐배터리가 새 산업으로 |\n\n**시장 크기**: 전 세계 자동차 재활용 시장은 2025년 기준 **약 890억~1,055억 달러(약 120조~145조 원)**, 연 6~13% 성장 예상. (조사기관마다 기준이 달라 범위로 기억하세요)\n\n---\n\n## 4. 🛡 오늘의 보험 포인트 — 보험은 이미 3곳에 들어가 있다\n\n| 접점 | 지금 일어나는 일 | 사업 기회 힌트 |\n|---|---|---|\n| ① 수리 단계 | 한국 보험사들은 중고·재제조 부품(=친환경 부품)으로 수리하면 새 부품 값의 일부를 고객에게 돌려주는 특약 운영. 정부는 **품질인증부품** 사용 시 순정부품 가격의 **25%** 지급 방안 추진 | 부품 업체 ↔ 정비소 ↔ 보험사 연결 |\n| ② 전손·잔존물 | 보험사가 전손차를 넘겨받아 폐차장·경매로 판매 → 보험금 일부 회수. 미국은 이게 거대 산업 | 잔존물 처리의 투명성·가격 개선 |\n| ③ 사업장 위험 | 폐배터리 화재 청구가 늘고 있음(해외 일부 보험사 화재 청구 +17%). 한국 사용후배터리법에는 **안전검사기관 배상책임보험 의무화** 포함 | 재활용 사업장 전용 보험 패키지 |\n\n> 🎯 **내 사업과 연결하는 질문**: \"나는 ①②③ 중 어디에 가장 먼저 들어가고 싶은가?\" — 4주차에 답을 정리합니다. 지금은 머릿속에만 담아두세요.\n\n---\n\n## 5. 오늘의 용어 5개\n\n| 용어 | 뜻 |\n|---|---|\n| ELV (End-of-Life Vehicle) | 수명을 다한 차량, 폐차 |\n| 전손 | 수리 불가 또는 수리비 > 차값 → 차값으로 보상 |\n| 잔존물 | 보험금 지급 후 남은 사고차(보험사가 소유권을 넘겨받음) |\n| 재제조부품 | 헌 부품을 새것 수준으로 되살린 부품 |\n| 순환경제 | 버리지 않고 계속 돌려쓰는 경제 구조 |\n\n## 6. 1분 퀴즈 (답은 내일 강의 맨 위에)\n1. 차 한 대 중 다시 쓸 수 있는 비율은 대략 몇 %?\n2. 보험사가 폐차 산업의 '공급자'가 되는 이유는?\n3. 유럽이 새 차에 의무화하려는 재생 플라스틱 비율 2단계는?\n\n---\n\n## ✅ 자기점검 결과 (발송 전 확인)\n\n| 주장 | 신뢰도 | 출처 / 비고 |\n|---|---|---|\n| 연간 폐차 3,500만~4,000만 대 | ⚠️ 추정 | [IMARC](https://www.imarcgroup.com/vehicle-recycling-market-statistics) |\n| 시장 규모 890억~1,055억 달러(2025) | ⚠️ 범위 | [GMI](https://www.gminsights.com/industry-analysis/vehicle-recycling-market) 888억 / [IMARC](https://imarcgroup.com/global-vehicle-recycling-market) 1,055억 → 기관별 차이로 범위 표기 |\n| 미국 평균 차령 14.1년, 연 400만 대+ | ⚠️ 시장조사 인용 | IMARC 인용 수치. 원 출처(S&P Global Mobility) 추가 확인 예정 |\n| EU 재생플라스틱 15%/25%, 2025.12 합의 | ✅ 복수 출처 일치 | [CDX](https://public.cdxsystem.com/web/cdx/w/council-and-parliament-strike-deal-on-end-of-life-vehicles-regulation), [SCI](https://soci.org/news/2025/12/europe-wants-more-recycling-from-end-of-life-vehicles) |\n| EU 규정 2026.8.13 발효 | ❓ 추가 확인 | [just-auto](https://just-auto.com/news/eu-end-of-life-vehicle-regulation-takes-effect/) 보도. EU 관보 원문 확인 전이라 강의 본문에서는 날짜 언급 생략 |\n| Copart·IAA 미국 시장 약 80% | ✅ 복수 출처 | [Columbia Business School 보고서](https://business.columbia.edu/sites/default/files-efs/imce-uploads/Zou_Carlson_CPRT%20vF.pdf), [Simply Wall St](https://simplywall.st/stocks/us/commercial-services/nasdaq-cprt/copart/news/how-investors-may-respond-to-copart-cprt-losing-insurance-vo/amp) |\n| 한국 폐차 연 70만~97만 대, 재활용률 95% | ✅ | [비즈한국](https://www.bizhankook.com/bk/article/25822), [다음 칼럼](https://v.daum.net/v/20251010162747000) |\n| 품질인증부품 사용 시 25% 지급 방안 | ✅ 금융위 자료 | [금융위원회](https://www.fsc.go.kr/edu/news/85087) — \"방안\" 단계이므로 실제 약관 반영 여부는 15~17일차에 재확인 |\n| 친환경부품 특약 운영 | ✅ | [스마트투데이(AXA)](https://www.smarttoday.co.kr/ko-kr/articles/50945), [현대해상 사례](https://www.sateconomy.co.kr/news/view/179589447115436) |\n| 사용후배터리법 2026.3 법사위 통과, 배상책임보험 의무 | ❓ 추가 확인 | [아이뉴스24](https://www.inews24.com/view/1782011) 보도. 본회의 통과·시행일은 20일차에 재확인 |\n| 배터리 화재 청구 +17% | ⚠️ 해외 단일 보험사(뉴질랜드 AMI) 수치 | [Insurance Business NZ](https://www.insurancebusinessmag.com/nz/news/technology/auckland-blaze-ignites-push-for-electric-vehicle-battery-regulation-537253.aspx) — 전 세계 수치로 일반화 금지 |\n\n**수정한 내용**: 시장 규모를 단일 숫자 → 범위로 변경 / EU 발효일·배터리법 시행일은 원문 미확인이라 '추가 확인' 표시 / 화재 청구 증가율은 특정 국가 보험사 수치임을 명시.\n"}, {"day": 2, "title": "2일차 — 폐차의 일생: 돈은 어디서 생기나? (2026-10-08)", "md": "# 2일차 — 폐차의 일생: 돈은 어디서 생기나? (2026-10-08)\n\n## 어제 퀴즈 정답\n1. **약 95%**. 철·알루미늄·부품·플라스틱을 다시 쓰는 비율이고, 한국은 법으로 95%를 목표로 합니다.\n2. 고칠 수 없는 사고차(전손차)에 보험금을 주고 나면 **그 차의 소유권이 보험사로 넘어오기** 때문입니다. 보험사는 이 차를 폐차장이나 경매에 팝니다.\n3. **15% → 25%**. 유럽 새 규정에서 새 차에 넣어야 하는 재생 플라스틱 비율입니다.\n\n> ⏱ 읽는 시간 10분 · 오늘의 한 줄: **\"폐차장은 차를 '무게'로 사고, '부품'과 '고철'로 나눠 판다. 그 사이의 비용과 위험이 보험이 들어갈 자리다.\"**\n\n## 1. 오늘 꼭 알아야 할 3가지\n\n| # | 핵심 | 쉬운 설명 |\n|---|---|---|\n| 1 | 폐차는 **5단계**를 거친다: 입고 → 유해물질 제거 → 부품 떼기 → 파쇄 → 소재 분리 | 사람으로 치면 \"장기 기증 → 화장\" 순서와 비슷합니다 |\n| 2 | 폐차장 돈은 **고철 + 중고부품** 두 곳에서 나온다 | 고철값은 차 무게와 철 시세가 결정. 그래서 큰 차일수록 보상금이 많습니다 |\n| 3 | 한국은 **등록된 폐차장(자동차해체재활용업)** 에서만 폐차해야 말소가 된다 | 무등록 업체에 넘기면 차가 서류상 살아있어 세금·보험 문제가 계속 따라옵니다 |\n\n## 2. 폐차의 5단계\n\n1. **입고·말소**: 차주(또는 보험사)가 등록 폐차장에 차를 넘김 → 폐차장이 '폐차인수증명서' 발급 → 자동차 등록 말소(차가 서류상 사라짐)\n2. **유해물질 제거**: 에어백 처리, 배터리 분리, 엔진오일·브레이크액·냉각수·에어컨 냉매·연료 빼기. 이 단계를 대충 하면 땅과 물이 오염됩니다\n3. **부품 떼기**: 엔진, 문짝, 범퍼, 램프 등 아직 쓸 만한 부품을 떼어 중고부품이나 재제조부품 원료로 판매\n4. **파쇄**: 남은 차체(껍데기)를 파쇄기(슈레더)에 넣어 잘게 부숨\n5. **소재 분리**: 자석으로 철을 골라내고, 다른 기술로 알루미늄·구리 등을 분리. 끝까지 남는 찌꺼기(파쇄잔재물, ASR)는 소각·매립\n\n> ※ **말소등록** = 자동차 등록원부에서 차를 지우는 것. 이게 돼야 자동차세와 의무보험이 끝납니다.\n>\n> ※ **ASR(Automotive Shredder Residue)** = 파쇄 후 남는 플라스틱·고무·먼지 찌꺼기. 재활용률 95%를 막는 마지막 5%가 대부분 여기서 나옵니다.\n\n## 3. 돈의 흐름: 폐차 한 대로 누가 얼마를 버나\n\n| 누가 | 받는 돈 | 대략 규모(한국, 승용차) |\n|---|---|---|\n| 차주 | **폐차 보상금**(고철·부품 값 일부) | 보통 30만~60만 원. 법정 요율은 없고 업체마다 다름 |\n| 차주 | 자동차세·보험료 **남은 기간분 환급** | 말소일 기준으로 정산 |\n| 차주(노후 경유차) | **조기폐차 보조금**(정부·지자체) | 등급·중량별로 다름. 5등급 차량 지원은 **2026년이 마지막 해**라고 여러 지자체가 안내 |\n| 폐차장 | 고철 판매 + 중고부품 판매 − 해체·폐기물 처리비 | 고철 가치의 약 35%가 처리비·마진으로 빠진다는 추정이 있음 |\n| 파쇄·소재 업체 | 철·비철금속 판매 | 철 시세에 따라 크게 출렁임 |\n\n**보상금 계산 감 잡기 (추정식)**: 차 무게 × 고철 단가 × 실수령 비율\n예) 1,500kg × kg당 350원 × 0.65 ≈ **약 34만 원**\n※ 공식 요금표가 아니라 민간 계산기가 쓰는 가정입니다. 감만 잡으세요.\n\n## 4. 세계는 어떻게 하나\n\n| 지역 | 특징 |\n|---|---|\n| 네덜란드 | 새 차를 살 때 재활용 분담금(2020년 대당 35유로)을 냄 → 이 돈으로 재활용 체계(ARN)를 운영. 2020년 무게 기준 **98.3%** 재활용 |\n| 독일 | 불법 해체가 큰 문제. 독일 환경청 연구는 연 약 36만 대가 불법 해체된다고 추정. 불법 업체는 유해물질 처리비를 안 내서 가격 경쟁에서 유리 |\n| 미국 | 사고차 중 전손 처리 비율이 높아지는 추세. 한 업계 집계(CCC)는 보험 청구의 약 23%가 전손이라고 발표 |\n| 한국 | 연 80만 대 안팎 폐차. 업계는 전국 해체재활용업체를 약 530곳으로 언급. 플라스틱·유리·고무는 돈이 안 돼 실제로는 재활용이 덜 되는 문제가 지적됨 |\n\n## 5. [보험 포인트] 폐차의 일생에서 보험이 닿는 곳\n\n| 단계 | 보험과의 연결 | 사업 기회 힌트 |\n|---|---|---|\n| ① 입고 | **전손차의 주인은 보험사**. 보험사가 어느 폐차장·경매에 넘기느냐가 물량을 좌우. 과거 일부 전손차가 무등록 경매업체로 흘러간 사례(2016년 상반기 약 15%)가 보도됨 | 보험사 잔존물을 **등록 폐차장으로 투명하게 연결**하는 중개·관리 서비스 |\n| ① 말소 | 말소가 늦어지면 의무보험·세금이 계속 붙음. 말소 후 **보험료 환급** 발생 | 고객에게 폐차-말소-환급을 한 번에 안내하는 설계사 서비스 |\n| ② 유해물질 | 오일·냉매 누출, 토양오염 위험 | 폐차장 **환경오염 배상책임보험** (가입 의무 대상인지는 확인 필요 → 19일차) |\n| ③~④ 해체·파쇄 | 중장비 사고, 화재(특히 전기차 배터리), 근로자 산재 | 폐차장 **화재보험·영업배상·근재보험 패키지** |\n| ③ 부품 판매 | 중고부품 하자 → 수리한 정비소·고객 분쟁 | 중고·재제조부품 **품질보증보험** (18일차) |\n\n> ▶ 오늘의 생각거리: \"폐차장 사장님은 지금 어떤 보험에 들어 있을까? 무엇이 빠져 있을까?\" — 실제 폐차장 한 곳에 물어볼 질문 리스트를 4주차에 만듭니다.\n\n## 6. 오늘의 용어 5개\n\n| 용어 | 뜻 |\n|---|---|\n| 자동차해체재활용업 | 법적으로 등록된 폐차장. 여기서만 폐차·말소 가능 |\n| 폐차인수증명서 | 폐차장이 차를 받았다는 증명서. 말소등록에 필요 |\n| 유해물질 제거(탈오염) | 오일·냉매·배터리·에어백 등을 먼저 빼는 작업 |\n| 파쇄잔재물(ASR) | 파쇄 후 남는 찌꺼기. 재활용률의 마지막 숙제 |\n| 조기폐차 보조금 | 오래된 경유차를 일찍 폐차하면 정부가 주는 지원금 |\n\n## 7. 1분 퀴즈 (답은 내일 강의 맨 위에)\n1. 폐차 보상금을 가장 크게 좌우하는 것은? (차 색깔 / 차 무게 / 주행거리)\n2. 무등록 업체에 폐차를 맡기면 어떤 문제가 생기나?\n3. 폐차의 5단계 중 환경오염 위험이 가장 큰 단계는?\n\n---\n\n## ✅ 자기점검 결과 (발송 전 확인)\n\n| 주장 | 신뢰도 | 출처 / 비고 |\n|---|---|---|\n| 등록 폐차장만 폐차인수증명서 발급, 말소 가능 | ✅ | [헤이딜러 폐차 주의사항](https://www.heydealer.com/blog/car-scrapping-precautions-guide), [글래스월렛 폐차 가이드](https://glasswallet.com/blog/scrap-car-disposal-guide) |\n| 폐차 5단계(탈오염→부품→파쇄→분리→ASR) | ✅ 복수 출처 | [독일 환경청 보고서](https://www.umweltbundesamt.de/sites/default/files/medien/479/publikationen/texte_130-2022_illegal_treatment_of_end-of-life_vehicles_0.pdf), [Hosoda(IIOA)](https://www.iioa.org/conferences/14th/files/HosodaMFP-014.pdf) |\n| 폐차 보상금 30만~60만 원 | ⚠️ 민간 추정 | [글래스월렛 보상금 가이드](https://glasswallet.com/calculate/car-scrap-subsidy/scrap-compensation-guide) — 법정 요율 없음 |\n| 추정식(무게×고철단가×0.65), 고철단가 kg당 330~400원 | ⚠️ 민간 계산기 가정 | 같은 출처. 공식 시세 아님을 본문에 명시 |\n| 5등급 조기폐차 지원 2026년이 마지막 | ✅ 복수 지자체 | [서울시](https://mediahub.seoul.go.kr/archives/2017302), [부산시](https://www.busan.go.kr/nhot/1721534), [경기신문(광명시)](https://www.kgnews.co.kr/mobile/article.html?no=896194) |\n| 5등급 지원금 최대 300만 원 | ❓ 블로그 출처뿐 | 본문에서 금액 삭제, \"등급·중량별로 다름\"으로 대체 |\n| 네덜란드 98.3%, 분담금 35유로(2020) | ✅ 운영기관 보고서 | [ARN 2020](https://duurzaamheidsverslag2020.arn.nl/?p=1706) — 2020년 수치임을 명시 |\n| 독일 불법 해체 연 약 36만 대 | ⚠️ 연구 추정치 | [독일 환경청(2022)](https://www.umweltbundesamt.de/sites/default/files/medien/479/publikationen/texte_130-2022_illegal_treatment_of_end-of-life_vehicles_0.pdf) |\n| 미국 청구의 약 23% 전손(CCC) | ⚠️ 업계 집계, 미국 한정 | [Axios](https://www.axios.com/2025/03/03/auto-insurance-vehicles-cars-trucks-suvs), [Auto123](https://www.auto123.com/en/news/one-in-four-cars-total-loss-accident/73532) — 한국에 적용 금지 |\n| 한국 연 80만 대 안팎 폐차 | ✅ | [머니투데이 폐차 백서](https://www.mt.co.kr/mtreport/212) (2017년 88만 대), 1일차 자료(70만~97만 대) |\n| 해체재활용업체 약 530곳 | ⚠️ 업계 관계자 발언(2021) | [머니투데이 2021](https://www.mt.co.kr/policy/2021/03/15/2021031506008220889) — 공식 통계 아님 |\n| 전손차 약 15% 무등록 경매 유통(2016 상반기) | ⚠️ 과거 보도 | 1일차 검색 자료(뉴스토마토 보도 인용). 현재 상황과 다를 수 있음 |\n| 폐차장 환경오염 배상책임보험 의무 여부 | ❓ 미확인 | 본문에서 \"확인 필요\"로 표시, 19일차에 법령 확인 |\n\n**수정한 내용**: 영국 탈오염 비용(150파운드)은 오래된 자료라 삭제 / 5등급 지원금 '최대 300만 원'은 블로그 출처뿐이라 삭제 / 폐차 보상금 계산식은 \"공식 아님, 감만 잡기\"로 명시 / 미국 전손 비율은 한국과 다르다고 명시 / 환경책임보험 의무 여부는 단정하지 않고 '확인 필요'로 표시.\n"}]};
const nav = document.getElementById('nav'), view = document.getElementById('view');
const items = [
  ...DATA.lessons.slice().reverse().map(l => ({id:'day'+String(l.day).padStart(2,'0'), label:l.title.replace(/^[^\w가-힣]*/,''), md:l.md, group:'강의'})),
  {id:'curriculum', label:'30일 커리큘럼', md:DATA.curriculum, group:'안내'},
  {id:'selfcheck', label:'자기점검 원칙', md:DATA.selfcheck, group:'안내'}
];
function render(id){
  const it = items.find(i => i.id === id) || items[0];
  let html = window.marked ? marked.parse(it.md) : '<pre>'+it.md.replace(/</g,'&lt;')+'</pre>';
  html = html.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  view.innerHTML = html;
  view.querySelectorAll('a[href^="./"]').forEach(a => a.removeAttribute('href'));
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.id === it.id));
  try { localStorage.setItem('last', it.id); } catch(e) {}
  window.scrollTo({top:0});
}
const done = DATA.lessons.length;
nav.innerHTML = `<div class="progress">진도 ${done} / 30일<div class="bar"><i style="width:${Math.min(100,done/30*100)}%"></i></div></div>`;
let g = '';
items.forEach(it => {
  if (it.group !== g) { g = it.group; nav.insertAdjacentHTML('beforeend', `<div class="label">${g}</div>`); }
  const b = document.createElement('button'); b.textContent = it.label; b.dataset.id = it.id;
  b.onclick = () => render(it.id); nav.appendChild(b);
});
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem('last'); } catch(e) {} }
render(start || items[0].id);
</script>
