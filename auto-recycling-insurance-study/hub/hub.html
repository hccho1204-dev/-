td>\n<td>전손(全損)과 잔존물 처리<\/td>\n<td>보험사가 사고차를 '판다'는 게 무슨 뜻?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>17<\/td>\n<td>친환경 부품 특약 · 품질인증부품<\/td>\n<td>중고부품 쓰면 보험사도 고객도 이익?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>18<\/td>\n<td>재제조 부품 품질보증 보험<\/td>\n<td>부품 하자 책임은 누가 지나?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>19<\/td>\n<td>폐차장·재활용 사업장 보험 (화재·배상·환경)<\/td>\n<td>재활용 현장의 위험은?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>20<\/td>\n<td>폐배터리 리스크와 보험 (보관·운송·화재)<\/td>\n<td>신규 의무보험은 어디에 생기나?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>21<\/td>\n<td>3주차 복습 퀴즈<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>4주: 내 사업 모델<\/strong><\/td>\n<td>22<\/td>\n<td>해외 보험사 사례 (영국·일본·미국)<\/td>\n<td>누가 이미 하고 있나?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>23<\/td>\n<td>데이터의 힘 (보험개발원·사고이력)<\/td>\n<td>데이터가 왜 경쟁력인가?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>24<\/td>\n<td>보험대리점/GA로 참여하는 방법<\/td>\n<td>내가 할 수 있는 역할은?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>25<\/td>\n<td>B2B 상품 기획: 재활용 사업장 패키지<\/td>\n<td>어떤 고객에게 무엇을 팔까?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>26<\/td>\n<td>파트너십 구조 (폐차장·정비소·배터리업체)<\/td>\n<td>누구와 손잡을까?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>27<\/td>\n<td>수익 구조와 숫자 감각<\/td>\n<td>수수료는 어떻게 생기나?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>28<\/td>\n<td>규제·법적 체크포인트<\/td>\n<td>하면 안 되는 것은?<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>29<\/td>\n<td>내 사업 1장 요약 만들기<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>30<\/td>\n<td>최종 정리 &amp; 다음 단계<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>진행 기록<\/h2>\n<ul>\n<li>진행 상황: <a href=\"./progress.md\"><code>progress.md<\/code><\/a><\/li>\n<li>강의 파일: <a href=\"./lessons/\"><code>lessons/<\/code><\/a><\/li>\n<\/ul>", "selfcheck": "<h1>✅ 자기점검(팩트체크) 원칙 — 강의 발송 전 반드시 수행<\/h1>\n<p>매 강의는 아래 5단계를 통과한 뒤에만 보낸다. 강의 맨 끝에 <strong>자기점검 결과표<\/strong>를 반드시 붙인다.<\/p>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>점검 내용<\/th>\n<th>통과 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. 출처 확인<\/td>\n<td>숫자·법·날짜마다 출처가 있는가?<\/td>\n<td>출처 링크 1개 이상<\/td>\n<\/tr>\n<tr>\n<td>2. 교차 확인<\/td>\n<td>중요한 숫자는 2곳 이상에서 확인했는가?<\/td>\n<td>기관마다 다르면 \"범위\"로 표기<\/td>\n<\/tr>\n<tr>\n<td>3. 최신성<\/td>\n<td>법·제도가 지금도 유효한가? (개정·시행일)<\/td>\n<td>시행일/발표일 명시<\/td>\n<\/tr>\n<tr>\n<td>4. 쉬운 말<\/td>\n<td>비개발자·비전문가가 이해할 수 있는가?<\/td>\n<td>전문용어는 괄호로 풀이<\/td>\n<\/tr>\n<tr>\n<td>5. 보험 연결<\/td>\n<td>오늘 내용이 '보험 참여'와 연결되는가?<\/td>\n<td>\"보험 포인트\" 섹션 필수<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>신뢰도 표시<\/h2>\n<ul>\n<li>✅ <strong>확인됨<\/strong>: 공식 기관·법령·원문 또는 2개 이상 출처 일치<\/li>\n<li>⚠️ <strong>추정/범위<\/strong>: 시장조사기관 추정치, 출처마다 차이 있음<\/li>\n<li>❓ <strong>추가 확인 필요<\/strong>: 보도만 있고 원문 미확인 → 실제 사업 결정 전 재확인<\/li>\n<\/ul>", "lessons": [{"day": 1, "title": "📘 1일차 — 큰 그림: 자동차 재활용이란? (2026-10-06)", "md": "<h1>📘 1일차 — 큰 그림: 자동차 재활용이란? (2026-10-06)<\/h1>\n<blockquote>\n<p>⏱ 읽는 시간 10분 · 오늘의 한 줄: <strong>\"폐차는 쓰레기가 아니라 '자원 + 돈 + 위험'이 모인 덩어리이고, 보험은 그 세 가지 모두에 이미 관여하고 있다.\"<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>매년 전 세계에서 <strong>약 3,500만~4,000만 대<\/strong>의 차가 수명을 다한다<\/td>\n<td>한국 인구 수의 70% 정도 되는 차가 매년 버려지는 셈<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>차 한 대의 <strong>약 95%는 다시 쓸 수 있다<\/strong><\/td>\n<td>철·알루미늄·부품·플라스틱을 다시 쓰는 것. 한국도 법으로 95% 재활용을 목표로 정함<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>보험사는 폐차 산업의 '최대 공급자' 중 하나<\/strong><\/td>\n<td>사고로 고칠 수 없는 차(전손차)를 보험사가 넘겨받아 팔기 때문<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>2. 자동차 재활용, 그림으로 보기<\/h2>\n<pre><code>[차량 사고 / 노후]\n      │\n      ├─ 고칠 수 있음 → 정비소 수리  ← (여기서 '중고·재제조 부품'이 쓰임) ★보험 접점 ①\n      │\n      └─ 고칠 수 없음/수리비 &gt; 차값 → '전손(全損)' 처리 ★보험 접점 ②\n                 │\n                 ▼\n          [폐차장 / 경매]\n                 │\n     ┌───────────┼─────────────┐\n     ▼           ▼             ▼\n 부품 떼어 재판매  배터리 회수      몸체 파쇄\n (재사용·재제조)  (재사용·재활용)  (철·알루미늄·플라스틱 원료)\n     │           │ ★보험 접점 ③(화재·보관 위험)\n     ▼           ▼\n  정비소로      ESS·소재회사로\n<\/code><\/pre>\n<blockquote>\n<p>💡 <strong>전손(全損)<\/strong> = 차가 완전히 망가졌거나, 수리비가 차값보다 비싸서 \"고치지 말고 차값을 보상하자\"고 결정한 상태.\n💡 <strong>재제조(再製造)<\/strong> = 헌 부품을 분해·세척·교체해서 새것 수준으로 되살린 부품.<\/p>\n<\/blockquote>\n<hr />\n<h2>3. 세계는 지금 어디로 가고 있나?<\/h2>\n<table>\n<thead>\n<tr>\n<th>지역<\/th>\n<th>무엇이 바뀌었나<\/th>\n<th>의미<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>🇪🇺 유럽<\/td>\n<td>2025년 12월 새 「폐차(ELV) 규정」 합의 → 새 차에 <strong>재생 플라스틱 15%(약 6년 후)<\/strong>, <strong>25%(약 10년 후)<\/strong> 의무, 이 중 일부는 폐차에서 나온 플라스틱이어야 함. 트럭·버스·오토바이까지 확대<\/td>\n<td>폐차가 '원료 공급원'으로 격상됨<\/td>\n<\/tr>\n<tr>\n<td>🇺🇸 미국<\/td>\n<td>평균 차량 나이 <strong>약 14년<\/strong> → 매년 400만 대 이상 재활용 처리. 사고차 경매는 Copart·IAA 두 회사가 약 80% 장악<\/td>\n<td>보험사 물량이 이 회사들의 생명줄<\/td>\n<\/tr>\n<tr>\n<td>🇰🇷 한국<\/td>\n<td>매년 <strong>70만~90만 대<\/strong> 폐차. 재활용률 95% 목표. 2026년 3월 「사용후배터리법」 국회 법사위 통과<\/td>\n<td>전기차 폐배터리가 새 산업으로<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>시장 크기<\/strong>: 전 세계 자동차 재활용 시장은 2025년 기준 <strong>약 890억~1,055억 달러(약 120조~145조 원)<\/strong>, 연 6~13% 성장 예상. (조사기관마다 기준이 달라 범위로 기억하세요)<\/p>\n<hr />\n<h2>4. 🛡 오늘의 보험 포인트 — 보험은 이미 3곳에 들어가 있다<\/h2>\n<table>\n<thead>\n<tr>\n<th>접점<\/th>\n<th>지금 일어나는 일<\/th>\n<th>사업 기회 힌트<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 수리 단계<\/td>\n<td>한국 보험사들은 중고·재제조 부품(=친환경 부품)으로 수리하면 새 부품 값의 일부를 고객에게 돌려주는 특약 운영. 정부는 <strong>품질인증부품<\/strong> 사용 시 순정부품 가격의 <strong>25%<\/strong> 지급 방안 추진<\/td>\n<td>부품 업체 ↔ 정비소 ↔ 보험사 연결<\/td>\n<\/tr>\n<tr>\n<td>② 전손·잔존물<\/td>\n<td>보험사가 전손차를 넘겨받아 폐차장·경매로 판매 → 보험금 일부 회수. 미국은 이게 거대 산업<\/td>\n<td>잔존물 처리의 투명성·가격 개선<\/td>\n<\/tr>\n<tr>\n<td>③ 사업장 위험<\/td>\n<td>폐배터리 화재 청구가 늘고 있음(해외 일부 보험사 화재 청구 +17%). 한국 사용후배터리법에는 <strong>안전검사기관 배상책임보험 의무화<\/strong> 포함<\/td>\n<td>재활용 사업장 전용 보험 패키지<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>🎯 <strong>내 사업과 연결하는 질문<\/strong>: \"나는 ①②③ 중 어디에 가장 먼저 들어가고 싶은가?\" — 4주차에 답을 정리합니다. 지금은 머릿속에만 담아두세요.<\/p>\n<\/blockquote>\n<hr />\n<h2>5. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ELV (End-of-Life Vehicle)<\/td>\n<td>수명을 다한 차량, 폐차<\/td>\n<\/tr>\n<tr>\n<td>전손<\/td>\n<td>수리 불가 또는 수리비 &gt; 차값 → 차값으로 보상<\/td>\n<\/tr>\n<tr>\n<td>잔존물<\/td>\n<td>보험금 지급 후 남은 사고차(보험사가 소유권을 넘겨받음)<\/td>\n<\/tr>\n<tr>\n<td>재제조부품<\/td>\n<td>헌 부품을 새것 수준으로 되살린 부품<\/td>\n<\/tr>\n<tr>\n<td>순환경제<\/td>\n<td>버리지 않고 계속 돌려쓰는 경제 구조<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>차 한 대 중 다시 쓸 수 있는 비율은 대략 몇 %?<\/li>\n<li>보험사가 폐차 산업의 '공급자'가 되는 이유는?<\/li>\n<li>유럽이 새 차에 의무화하려는 재생 플라스틱 비율 2단계는?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>연간 폐차 3,500만~4,000만 대<\/td>\n<td>⚠️ 추정<\/td>\n<td><a href=\"https://www.imarcgroup.com/vehicle-recycling-market-statistics\">IMARC<\/a><\/td>\n<\/tr>\n<tr>\n<td>시장 규모 890억~1,055억 달러(2025)<\/td>\n<td>⚠️ 범위<\/td>\n<td><a href=\"https://www.gminsights.com/industry-analysis/vehicle-recycling-market\">GMI<\/a> 888억 / <a href=\"https://imarcgroup.com/global-vehicle-recycling-market\">IMARC<\/a> 1,055억 → 기관별 차이로 범위 표기<\/td>\n<\/tr>\n<tr>\n<td>미국 평균 차령 14.1년, 연 400만 대+<\/td>\n<td>⚠️ 시장조사 인용<\/td>\n<td>IMARC 인용 수치. 원 출처(S&amp;P Global Mobility) 추가 확인 예정<\/td>\n<\/tr>\n<tr>\n<td>EU 재생플라스틱 15%/25%, 2025.12 합의<\/td>\n<td>✅ 복수 출처 일치<\/td>\n<td><a href=\"https://public.cdxsystem.com/web/cdx/w/council-and-parliament-strike-deal-on-end-of-life-vehicles-regulation\">CDX<\/a>, <a href=\"https://soci.org/news/2025/12/europe-wants-more-recycling-from-end-of-life-vehicles\">SCI<\/a><\/td>\n<\/tr>\n<tr>\n<td>EU 규정 2026.8.13 발효<\/td>\n<td>❓ 추가 확인<\/td>\n<td><a href=\"https://just-auto.com/news/eu-end-of-life-vehicle-regulation-takes-effect/\">just-auto<\/a> 보도. EU 관보 원문 확인 전이라 강의 본문에서는 날짜 언급 생략<\/td>\n<\/tr>\n<tr>\n<td>Copart·IAA 미국 시장 약 80%<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://business.columbia.edu/sites/default/files-efs/imce-uploads/Zou_Carlson_CPRT%20vF.pdf\">Columbia Business School 보고서<\/a>, <a href=\"https://simplywall.st/stocks/us/commercial-services/nasdaq-cprt/copart/news/how-investors-may-respond-to-copart-cprt-losing-insurance-vo/amp\">Simply Wall St<\/a><\/td>\n<\/tr>\n<tr>\n<td>한국 폐차 연 70만~97만 대, 재활용률 95%<\/td>\n<td>✅<\/td>\n<td><a href=\"https://www.bizhankook.com/bk/article/25822\">비즈한국<\/a>, <a href=\"https://v.daum.net/v/20251010162747000\">다음 칼럼<\/a><\/td>\n<\/tr>\n<tr>\n<td>품질인증부품 사용 시 25% 지급 방안<\/td>\n<td>✅ 금융위 자료<\/td>\n<td><a href=\"https://www.fsc.go.kr/edu/news/85087\">금융위원회<\/a> — \"방안\" 단계이므로 실제 약관 반영 여부는 15~17일차에 재확인<\/td>\n<\/tr>\n<tr>\n<td>친환경부품 특약 운영<\/td>\n<td>✅<\/td>\n<td><a href=\"https://www.smarttoday.co.kr/ko-kr/articles/50945\">스마트투데이(AXA)<\/a>, <a href=\"https://www.sateconomy.co.kr/news/view/179589447115436\">현대해상 사례<\/a><\/td>\n<\/tr>\n<tr>\n<td>사용후배터리법 2026.3 법사위 통과, 배상책임보험 의무<\/td>\n<td>❓ 추가 확인<\/td>\n<td><a href=\"https://www.inews24.com/view/1782011\">아이뉴스24<\/a> 보도. 본회의 통과·시행일은 20일차에 재확인<\/td>\n<\/tr>\n<tr>\n<td>배터리 화재 청구 +17%<\/td>\n<td>⚠️ 해외 단일 보험사(뉴질랜드 AMI) 수치<\/td>\n<td><a href=\"https://www.insurancebusinessmag.com/nz/news/technology/auckland-blaze-ignites-push-for-electric-vehicle-battery-regulation-537253.aspx\">Insurance Business NZ<\/a> — 전 세계 수치로 일반화 금지<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>: 시장 규모를 단일 숫자 → 범위로 변경 / EU 발효일·배터리법 시행일은 원문 미확인이라 '추가 확인' 표시 / 화재 청구 증가율은 특정 국가 보험사 수치임을 명시.<\/p>"}, {"day": 2, "title": "2일차 — 폐차의 일생: 돈은 어디서 생기나? (2026-10-08)", "md": "<h1>2일차 — 폐차의 일생: 돈은 어디서 생기나? (2026-10-08)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>약 95%<\/strong>. 철·알루미늄·부품·플라스틱을 다시 쓰는 비율이고, 한국은 법으로 95%를 목표로 합니다.<\/li>\n<li>고칠 수 없는 사고차(전손차)에 보험금을 주고 나면 <strong>그 차의 소유권이 보험사로 넘어오기<\/strong> 때문입니다. 보험사는 이 차를 폐차장이나 경매에 팝니다.<\/li>\n<li><strong>15% → 25%<\/strong>. 유럽 새 규정에서 새 차에 넣어야 하는 재생 플라스틱 비율입니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 10분 · 오늘의 한 줄: <strong>\"폐차장은 차를 '무게'로 사고, '부품'과 '고철'로 나눠 판다. 그 사이의 비용과 위험이 보험이 들어갈 자리다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>폐차는 <strong>5단계<\/strong>를 거친다: 입고 → 유해물질 제거 → 부품 떼기 → 파쇄 → 소재 분리<\/td>\n<td>사람으로 치면 \"장기 기증 → 화장\" 순서와 비슷합니다<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>폐차장 돈은 <strong>고철 + 중고부품<\/strong> 두 곳에서 나온다<\/td>\n<td>고철값은 차 무게와 철 시세가 결정. 그래서 큰 차일수록 보상금이 많습니다<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>한국은 <strong>등록된 폐차장(자동차해체재활용업)<\/strong> 에서만 폐차해야 말소가 된다<\/td>\n<td>무등록 업체에 넘기면 차가 서류상 살아있어 세금·보험 문제가 계속 따라옵니다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 폐차의 5단계<\/h2>\n<ol>\n<li><strong>입고·말소<\/strong>: 차주(또는 보험사)가 등록 폐차장에 차를 넘김 → 폐차장이 '폐차인수증명서' 발급 → 자동차 등록 말소(차가 서류상 사라짐)<\/li>\n<li><strong>유해물질 제거<\/strong>: 에어백 처리, 배터리 분리, 엔진오일·브레이크액·냉각수·에어컨 냉매·연료 빼기. 이 단계를 대충 하면 땅과 물이 오염됩니다<\/li>\n<li><strong>부품 떼기<\/strong>: 엔진, 문짝, 범퍼, 램프 등 아직 쓸 만한 부품을 떼어 중고부품이나 재제조부품 원료로 판매<\/li>\n<li><strong>파쇄<\/strong>: 남은 차체(껍데기)를 파쇄기(슈레더)에 넣어 잘게 부숨<\/li>\n<li><strong>소재 분리<\/strong>: 자석으로 철을 골라내고, 다른 기술로 알루미늄·구리 등을 분리. 끝까지 남는 찌꺼기(파쇄잔재물, ASR)는 소각·매립<\/li>\n<\/ol>\n<blockquote>\n<p>※ <strong>말소등록<\/strong> = 자동차 등록원부에서 차를 지우는 것. 이게 돼야 자동차세와 의무보험이 끝납니다.<\/p>\n<p>※ <strong>ASR(Automotive Shredder Residue)<\/strong> = 파쇄 후 남는 플라스틱·고무·먼지 찌꺼기. 재활용률 95%를 막는 마지막 5%가 대부분 여기서 나옵니다.<\/p>\n<\/blockquote>\n<h2>3. 돈의 흐름: 폐차 한 대로 누가 얼마를 버나<\/h2>\n<table>\n<thead>\n<tr>\n<th>누가<\/th>\n<th>받는 돈<\/th>\n<th>대략 규모(한국, 승용차)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>차주<\/td>\n<td><strong>폐차 보상금<\/strong>(고철·부품 값 일부)<\/td>\n<td>보통 30만~60만 원. 법정 요율은 없고 업체마다 다름<\/td>\n<\/tr>\n<tr>\n<td>차주<\/td>\n<td>자동차세·보험료 <strong>남은 기간분 환급<\/strong><\/td>\n<td>말소일 기준으로 정산<\/td>\n<\/tr>\n<tr>\n<td>차주(노후 경유차)<\/td>\n<td><strong>조기폐차 보조금<\/strong>(정부·지자체)<\/td>\n<td>등급·중량별로 다름. 5등급 차량 지원은 <strong>2026년이 마지막 해<\/strong>라고 여러 지자체가 안내<\/td>\n<\/tr>\n<tr>\n<td>폐차장<\/td>\n<td>고철 판매 + 중고부품 판매 − 해체·폐기물 처리비<\/td>\n<td>고철 가치의 약 35%가 처리비·마진으로 빠진다는 추정이 있음<\/td>\n<\/tr>\n<tr>\n<td>파쇄·소재 업체<\/td>\n<td>철·비철금속 판매<\/td>\n<td>철 시세에 따라 크게 출렁임<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>보상금 계산 감 잡기 (추정식)<\/strong>: 차 무게 × 고철 단가 × 실수령 비율\n예) 1,500kg × kg당 350원 × 0.65 ≈ <strong>약 34만 원<\/strong>\n※ 공식 요금표가 아니라 민간 계산기가 쓰는 가정입니다. 감만 잡으세요.<\/p>\n<h2>4. 세계는 어떻게 하나<\/h2>\n<table>\n<thead>\n<tr>\n<th>지역<\/th>\n<th>특징<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>네덜란드<\/td>\n<td>새 차를 살 때 재활용 분담금(2020년 대당 35유로)을 냄 → 이 돈으로 재활용 체계(ARN)를 운영. 2020년 무게 기준 <strong>98.3%<\/strong> 재활용<\/td>\n<\/tr>\n<tr>\n<td>독일<\/td>\n<td>불법 해체가 큰 문제. 독일 환경청 연구는 연 약 36만 대가 불법 해체된다고 추정. 불법 업체는 유해물질 처리비를 안 내서 가격 경쟁에서 유리<\/td>\n<\/tr>\n<tr>\n<td>미국<\/td>\n<td>사고차 중 전손 처리 비율이 높아지는 추세. 한 업계 집계(CCC)는 보험 청구의 약 23%가 전손이라고 발표<\/td>\n<\/tr>\n<tr>\n<td>한국<\/td>\n<td>연 80만 대 안팎 폐차. 업계는 전국 해체재활용업체를 약 530곳으로 언급. 플라스틱·유리·고무는 돈이 안 돼 실제로는 재활용이 덜 되는 문제가 지적됨<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 폐차의 일생에서 보험이 닿는 곳<\/h2>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>보험과의 연결<\/th>\n<th>사업 기회 힌트<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 입고<\/td>\n<td><strong>전손차의 주인은 보험사<\/strong>. 보험사가 어느 폐차장·경매에 넘기느냐가 물량을 좌우. 과거 일부 전손차가 무등록 경매업체로 흘러간 사례(2016년 상반기 약 15%)가 보도됨<\/td>\n<td>보험사 잔존물을 <strong>등록 폐차장으로 투명하게 연결<\/strong>하는 중개·관리 서비스<\/td>\n<\/tr>\n<tr>\n<td>① 말소<\/td>\n<td>말소가 늦어지면 의무보험·세금이 계속 붙음. 말소 후 <strong>보험료 환급<\/strong> 발생<\/td>\n<td>고객에게 폐차-말소-환급을 한 번에 안내하는 설계사 서비스<\/td>\n<\/tr>\n<tr>\n<td>② 유해물질<\/td>\n<td>오일·냉매 누출, 토양오염 위험<\/td>\n<td>폐차장 <strong>환경오염 배상책임보험<\/strong> (가입 의무 대상인지는 확인 필요 → 19일차)<\/td>\n<\/tr>\n<tr>\n<td>③~④ 해체·파쇄<\/td>\n<td>중장비 사고, 화재(특히 전기차 배터리), 근로자 산재<\/td>\n<td>폐차장 <strong>화재보험·영업배상·근재보험 패키지<\/strong><\/td>\n<\/tr>\n<tr>\n<td>③ 부품 판매<\/td>\n<td>중고부품 하자 → 수리한 정비소·고객 분쟁<\/td>\n<td>중고·재제조부품 <strong>품질보증보험<\/strong> (18일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"폐차장 사장님은 지금 어떤 보험에 들어 있을까? 무엇이 빠져 있을까?\" — 실제 폐차장 한 곳에 물어볼 질문 리스트를 4주차에 만듭니다.<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>자동차해체재활용업<\/td>\n<td>법적으로 등록된 폐차장. 여기서만 폐차·말소 가능<\/td>\n<\/tr>\n<tr>\n<td>폐차인수증명서<\/td>\n<td>폐차장이 차를 받았다는 증명서. 말소등록에 필요<\/td>\n<\/tr>\n<tr>\n<td>유해물질 제거(탈오염)<\/td>\n<td>오일·냉매·배터리·에어백 등을 먼저 빼는 작업<\/td>\n<\/tr>\n<tr>\n<td>파쇄잔재물(ASR)<\/td>\n<td>파쇄 후 남는 찌꺼기. 재활용률의 마지막 숙제<\/td>\n<\/tr>\n<tr>\n<td>조기폐차 보조금<\/td>\n<td>오래된 경유차를 일찍 폐차하면 정부가 주는 지원금<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>폐차 보상금을 가장 크게 좌우하는 것은? (차 색깔 / 차 무게 / 주행거리)<\/li>\n<li>무등록 업체에 폐차를 맡기면 어떤 문제가 생기나?<\/li>\n<li>폐차의 5단계 중 환경오염 위험이 가장 큰 단계는?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>등록 폐차장만 폐차인수증명서 발급, 말소 가능<\/td>\n<td>✅<\/td>\n<td><a href=\"https://www.heydealer.com/blog/car-scrapping-precautions-guide\">헤이딜러 폐차 주의사항<\/a>, <a href=\"https://glasswallet.com/blog/scrap-car-disposal-guide\">글래스월렛 폐차 가이드<\/a><\/td>\n<\/tr>\n<tr>\n<td>폐차 5단계(탈오염→부품→파쇄→분리→ASR)<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://www.umweltbundesamt.de/sites/default/files/medien/479/publikationen/texte_130-2022_illegal_treatment_of_end-of-life_vehicles_0.pdf\">독일 환경청 보고서<\/a>, <a href=\"https://www.iioa.org/conferences/14th/files/HosodaMFP-014.pdf\">Hosoda(IIOA)<\/a><\/td>\n<\/tr>\n<tr>\n<td>폐차 보상금 30만~60만 원<\/td>\n<td>⚠️ 민간 추정<\/td>\n<td><a href=\"https://glasswallet.com/calculate/car-scrap-subsidy/scrap-compensation-guide\">글래스월렛 보상금 가이드<\/a> — 법정 요율 없음<\/td>\n<\/tr>\n<tr>\n<td>추정식(무게×고철단가×0.65), 고철단가 kg당 330~400원<\/td>\n<td>⚠️ 민간 계산기 가정<\/td>\n<td>같은 출처. 공식 시세 아님을 본문에 명시<\/td>\n<\/tr>\n<tr>\n<td>5등급 조기폐차 지원 2026년이 마지막<\/td>\n<td>✅ 복수 지자체<\/td>\n<td><a href=\"https://mediahub.seoul.go.kr/archives/2017302\">서울시<\/a>, <a href=\"https://www.busan.go.kr/nhot/1721534\">부산시<\/a>, <a href=\"https://www.kgnews.co.kr/mobile/article.html?no=896194\">경기신문(광명시)<\/a><\/td>\n<\/tr>\n<tr>\n<td>5등급 지원금 최대 300만 원<\/td>\n<td>❓ 블로그 출처뿐<\/td>\n<td>본문에서 금액 삭제, \"등급·중량별로 다름\"으로 대체<\/td>\n<\/tr>\n<tr>\n<td>네덜란드 98.3%, 분담금 35유로(2020)<\/td>\n<td>✅ 운영기관 보고서<\/td>\n<td><a href=\"https://duurzaamheidsverslag2020.arn.nl/?p=1706\">ARN 2020<\/a> — 2020년 수치임을 명시<\/td>\n<\/tr>\n<tr>\n<td>독일 불법 해체 연 약 36만 대<\/td>\n<td>⚠️ 연구 추정치<\/td>\n<td><a href=\"https://www.umweltbundesamt.de/sites/default/files/medien/479/publikationen/texte_130-2022_illegal_treatment_of_end-of-life_vehicles_0.pdf\">독일 환경청(2022)<\/a><\/td>\n<\/tr>\n<tr>\n<td>미국 청구의 약 23% 전손(CCC)<\/td>\n<td>⚠️ 업계 집계, 미국 한정<\/td>\n<td><a href=\"https://www.axios.com/2025/03/03/auto-insurance-vehicles-cars-trucks-suvs\">Axios<\/a>, <a href=\"https://www.auto123.com/en/news/one-in-four-cars-total-loss-accident/73532\">Auto123<\/a> — 한국에 적용 금지<\/td>\n<\/tr>\n<tr>\n<td>한국 연 80만 대 안팎 폐차<\/td>\n<td>✅<\/td>\n<td><a href=\"https://www.mt.co.kr/mtreport/212\">머니투데이 폐차 백서<\/a> (2017년 88만 대), 1일차 자료(70만~97만 대)<\/td>\n<\/tr>\n<tr>\n<td>해체재활용업체 약 530곳<\/td>\n<td>⚠️ 업계 관계자 발언(2021)<\/td>\n<td><a href=\"https://www.mt.co.kr/policy/2021/03/15/2021031506008220889\">머니투데이 2021<\/a> — 공식 통계 아님<\/td>\n<\/tr>\n<tr>\n<td>전손차 약 15% 무등록 경매 유통(2016 상반기)<\/td>\n<td>⚠️ 과거 보도<\/td>\n<td>1일차 검색 자료(뉴스토마토 보도 인용). 현재 상황과 다를 수 있음<\/td>\n<\/tr>\n<tr>\n<td>폐차장 환경오염 배상책임보험 의무 여부<\/td>\n<td>❓ 미확인<\/td>\n<td>본문에서 \"확인 필요\"로 표시, 19일차에 법령 확인<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>: 영국 탈오염 비용(150파운드)은 오래된 자료라 삭제 / 5등급 지원금 '최대 300만 원'은 블로그 출처뿐이라 삭제 / 폐차 보상금 계산식은 \"공식 아님, 감만 잡기\"로 명시 / 미국 전손 비율은 한국과 다르다고 명시 / 환경책임보험 의무 여부는 단정하지 않고 '확인 필요'로 표시.<\/p>"}, {"day": 3, "title": "3일차 — 3R 부품: 중고·재제조·대체부품은 뭐가 다른가? (2026-10-09)", "md": "<h1>3일차 — 3R 부품: 중고·재제조·대체부품은 뭐가 다른가? (2026-10-09)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>차 무게<\/strong>. 폐차 보상금은 대부분 고철 값이라 무게에 따라 달라집니다.<\/li>\n<li><strong>말소등록이 안 됩니다.<\/strong> 무등록 업체는 폐차인수증명서를 발급할 수 없어서, 차가 서류상 살아 있고 자동차세와 의무보험이 계속 붙습니다.<\/li>\n<li><strong>유해물질 제거 단계.<\/strong> 오일·냉매·배터리를 제대로 빼지 않으면 땅과 물이 오염됩니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 10분 · 오늘의 한 줄: <strong>\"수리할 때 쓰는 부품은 '새 정품'만 있는 게 아니다. 어떤 부품을 쓰느냐가 수리비, 보험금, 환경을 동시에 바꾼다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>수리 부품은 크게 <strong>4가지<\/strong>: 순정(OEM) 새 부품 / 대체(품질인증) 새 부품 / 중고부품 / 재제조부품<\/td>\n<td>옷으로 치면 명품 새 옷 / 같은 품질의 다른 브랜드 새 옷 / 깨끗한 중고 옷 / 수선해서 새것처럼 만든 옷<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>중고·재제조는 '재활용 부품'<\/strong>, 품질인증부품은 <strong>'새 부품'<\/strong> 이다<\/td>\n<td>이름이 비슷해서 자주 헷갈립니다. 품질인증부품은 재활용이 아니라 순정품보다 싼 새 부품입니다<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>보험은 이미 이 부품들과 연결돼 있다<\/td>\n<td>범퍼·펜더 같은 외장 부품을 품질인증부품으로 고치면 <strong>순정부품 가격의 25%를 고객에게 돌려주는 제도<\/strong>가 운영 중<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 1일차 강의 정정: 1일차에서 품질인증부품을 '친환경 부품'과 같은 줄에 소개했는데, 품질인증부품은 재활용 부품이 아니라 <strong>새 부품<\/strong>입니다. 25% 지급은 '추진 중인 방안'이 아니라 <strong>이미 운영 중이고 2025년 8월 개편 때도 유지된 제도<\/strong>입니다.<\/p>\n<\/blockquote>\n<h2>2. 4가지 부품 한눈에 비교<\/h2>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>무엇인가<\/th>\n<th>가격(순정 대비)<\/th>\n<th>친환경<\/th>\n<th>품질 보증<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>순정(OEM) 부품<\/strong><\/td>\n<td>자동차 회사가 공급하는 새 부품<\/td>\n<td>기준(100%)<\/td>\n<td>낮음<\/td>\n<td>제조사 보증<\/td>\n<\/tr>\n<tr>\n<td><strong>품질인증(대체) 부품<\/strong><\/td>\n<td>다른 회사가 만든 새 부품. 정부 지정기관(한국자동차부품협회)이 성능을 인증<\/td>\n<td>약 35~40% 저렴하다는 보도<\/td>\n<td>보통 (새로 만듦)<\/td>\n<td>인증 + 한국교통안전공단 사후 검사<\/td>\n<\/tr>\n<tr>\n<td><strong>중고부품<\/strong><\/td>\n<td>폐차에서 떼어낸 부품을 그대로 사용<\/td>\n<td>가장 저렴한 편<\/td>\n<td>높음<\/td>\n<td>업체별 상이. 보험개발원 인정 '에코부품'은 1년 보증 사례<\/td>\n<\/tr>\n<tr>\n<td><strong>재제조부품<\/strong><\/td>\n<td>헌 부품을 분해·세척·검사·보수·재조립해 원래 성능으로 되살린 부품<\/td>\n<td>신품보다 저렴 (정확한 비율은 품목마다 다름)<\/td>\n<td>높음<\/td>\n<td>국가기술표준원 재제조 품질인증 제도<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>재제조(再製造)<\/strong> = 법(환경친화적 산업구조로의 전환촉진에 관한 법률)에서 \"분해·세척·검사·보수·조정·재조립을 거쳐 원래 성능을 유지하도록 만드는 것\"으로 정의합니다. 엔진, 변속기, 발전기(알터네이터), 시동모터가 대표 품목입니다.<\/p>\n<\/blockquote>\n<h2>3. 세계는 어떻게 하나<\/h2>\n<table>\n<thead>\n<tr>\n<th>지역<\/th>\n<th>특징<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>세계 시장<\/td>\n<td>재제조 자동차 부품 시장은 2025년 약 <strong>200억~660억 달러<\/strong>로 조사기관마다 3배 넘게 차이. 연 3~8% 성장 전망<\/td>\n<\/tr>\n<tr>\n<td>북미<\/td>\n<td>재제조 시장의 약 44%를 차지한다는 조사(Technavio). 미국은 폐차 부품을 대량으로 유통하는 대형 회사(LKQ 등)가 있어 보험 수리에 중고·재제조 부품이 널리 쓰임<\/td>\n<\/tr>\n<tr>\n<td>유럽<\/td>\n<td>공급망 전체의 탄소 배출을 따지는 방향으로 규제가 바뀌는 중 → 재제조의 '탄소 절감 효과'를 숫자로 증명하는 일이 중요해짐<\/td>\n<\/tr>\n<tr>\n<td>한국<\/td>\n<td>2024년 2월 자동차관리법 개정으로 품질인증부품도 '신부품'으로 인정. 그래도 보험 수리에서는 여전히 순정품 위주라는 것이 금융위원회 진단<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 한국의 2025년 '부품 소동' — 꼭 알아둘 사례<\/h2>\n<ol>\n<li><strong>2025년 7월<\/strong>: 금융당국이 보험 수리비 기준을 '순정부품 가격' → '품질인증부품 가격'으로 바꾸는 약관 개정을 추진. 순정품을 원하면 차액을 고객이 내야 하는 구조<\/li>\n<li><strong>반발<\/strong>: 소비자단체와 정치권이 \"사실상 강제\"라고 비판<\/li>\n<li><strong>2025년 8월 5일 수정 발표<\/strong>:<\/li>\n<li>고객이 원하면 순정부품으로 수리하고 보험이 전액 보상<\/li>\n<li>출고 5년 이내 새 차와 안전 부품(브레이크·휠·조향장치 등)은 순정품만 사용<\/li>\n<li>외장 부품(범퍼·보닛·펜더 등)은 대체부품 우선 적용 원칙 유지 + 쓰면 <strong>순정 가격의 25% 환급<\/strong> 유지<\/li>\n<\/ol>\n<p><strong>교훈<\/strong>: 보험에서 부품 선택은 <strong>고객의 선택권<\/strong>과 <strong>보험료 절감<\/strong> 사이의 줄다리기입니다. 고객이 스스로 고르도록 도와주는 사람이 필요합니다.<\/p>\n<h2>5. [보험 포인트] 부품 선택에서 보험이 닿는 곳<\/h2>\n<table>\n<thead>\n<tr>\n<th>접점<\/th>\n<th>지금 일어나는 일<\/th>\n<th>사업 기회 힌트<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 대체부품 25% 환급<\/td>\n<td>외장 부품을 품질인증부품으로 고치면 고객이 현금을 돌려받음<\/td>\n<td>사고 고객에게 \"이렇게 고치면 돈을 돌려받는다\"를 안내하는 설계사 = 고객 만족<\/td>\n<\/tr>\n<tr>\n<td>② 친환경부품 특약<\/td>\n<td>일부 보험사가 중고·재제조 부품 수리 시 일정 금액을 지급하는 특약 운영. 그런데 자차보험 가입자의 <strong>18%만 이 특약을 안다<\/strong>는 조사<\/td>\n<td>인지도가 낮다 = <strong>안내만 잘해도 차별화<\/strong><\/td>\n<\/tr>\n<tr>\n<td>③ 법인차 보험료 할인<\/td>\n<td>현대해상이 법인 업무용 차에 중고부품 수리 조건으로 자차보험료 8% 할인 상품을 낸 사례(2019)<\/td>\n<td>법인 차량(렌터카·운수회사) 대상 <strong>친환경 수리 조건부 할인<\/strong> 영업<\/td>\n<\/tr>\n<tr>\n<td>④ 부품 하자 책임<\/td>\n<td>중고·재제조 부품이 고장 나면 정비소·부품업체·고객 간 분쟁<\/td>\n<td>재제조·중고부품 <strong>품질보증보험<\/strong> (18일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"내 고객이 사고 났을 때, 순정품·대체부품·중고부품 중 무엇을 권하겠는가? 그 이유를 고객에게 30초 안에 설명할 수 있나?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>순정(OEM) 부품<\/td>\n<td>자동차 회사가 공급하는 새 부품<\/td>\n<\/tr>\n<tr>\n<td>품질인증부품(대체부품)<\/td>\n<td>다른 회사가 만들고 정부 지정기관이 성능을 인증한 새 부품<\/td>\n<\/tr>\n<tr>\n<td>중고부품<\/td>\n<td>폐차에서 떼어낸 부품을 그대로 다시 쓰는 것<\/td>\n<\/tr>\n<tr>\n<td>재제조부품<\/td>\n<td>헌 부품을 분해·수리·재조립해 원래 성능으로 되살린 부품<\/td>\n<\/tr>\n<tr>\n<td>친환경부품 특약<\/td>\n<td>중고·재제조 부품으로 수리하면 보험사가 일정 금액을 주는 특약<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>품질인증부품은 재활용 부품일까, 새 부품일까?<\/li>\n<li>2025년 8월 개편 후에도 순정부품만 쓰도록 정한 경우 2가지는?<\/li>\n<li>외장 부품을 대체부품으로 수리하면 순정 가격의 몇 %를 돌려받나?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>품질인증부품 정의, 인증기관(한국자동차부품협회), 사후검사(교통안전공단)<\/td>\n<td>✅ 금융위 자료<\/td>\n<td><a href=\"https://www.fsc.go.kr/edu/news/85087\">금융위원회<\/a><\/td>\n<\/tr>\n<tr>\n<td>2024.2 자동차관리법 개정으로 품질인증부품도 신부품 범위 포함<\/td>\n<td>✅ 금융위 자료<\/td>\n<td>같은 출처<\/td>\n<\/tr>\n<tr>\n<td>2025.8.5 수정: 순정 선택 시 전액 보상, 5년 이내 신차·안전부품은 순정만<\/td>\n<td>✅ 복수 보도<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2025080514464847870\">MTN 8/5<\/a>, <a href=\"https://www.khan.co.kr/article/202508052019035/\">경향신문<\/a>, <a href=\"https://www.wikitree.co.kr/articles/1071156\">위키트리<\/a><\/td>\n<\/tr>\n<tr>\n<td>외장부품 대체부품 사용 시 순정 공시가 25% 환급 유지<\/td>\n<td>✅ 복수 보도<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2025080514464847870\">MTN 8/5<\/a>, <a href=\"https://thecheck.co.kr/?p=704\">더체크<\/a> — 2026년 현재 약관 원문은 미확인<\/td>\n<\/tr>\n<tr>\n<td>대체부품이 순정보다 35~40% 저렴<\/td>\n<td>⚠️ 보도 인용<\/td>\n<td><a href=\"https://news.mtn.co.kr/news-detail/2025072115243343990\">MTN 7/21<\/a> — 품목별 차이 큼<\/td>\n<\/tr>\n<tr>\n<td>재제조 법적 정의(분해·세척·검사·보수·조정·재조립)<\/td>\n<td>✅ 법령<\/td>\n<td><a href=\"https://ko.wikisource.org/wiki/%ED%99%98%EA%B2%BD%EC%B9%9C%ED%99%94%EC%A0%81_%EC%82%B0%EC%97%85%EA%B5%AC%EC%A1%B0%EB%A1%9C%EC%9D%98_%EC%A0%84%ED%99%98%EC%B4%89%EC%A7%84%EC%97%90_%EA%B4%80%ED%95%9C_%EB%B2%95%EB%A5%A0\">환경친화적 산업구조 전환촉진법<\/a> — 과거 개정본 기준, 현행 조문 재확인 필요<\/td>\n<\/tr>\n<tr>\n<td>재제조 품질인증(국가기술표준원), 2026 개정 예고<\/td>\n<td>✅ 정부 사이트<\/td>\n<td><a href=\"https://www.motir.go.kr/kor/article/ATCLc01b2801b/70711/view\">산업통상부<\/a><\/td>\n<\/tr>\n<tr>\n<td>재제조 시장 2025년 200억~660억 달러<\/td>\n<td>⚠️ 범위(조사기관별 3배 차이)<\/td>\n<td><a href=\"https://www.globenewswire.com/news-release/2026/01/06/3213820/0/en/Remanufactured-Automotive-Parts-Global-Market-Report-2025-2029-and-2034-Featuring-Prominent-Players-Robert-Bosch-BorgWarner-ZF-Friedrichshafen-and-Denso.html\">GlobeNewswire<\/a>, <a href=\"https://technavio.com/report/remanufactured-automotive-parts-market-industry-analysis\">Technavio<\/a>, <a href=\"https://www.bolsamania.com/nota-de-prensa/mercados/automotive-parts-remanufacturing-market-is-projected-to-reach-us1142-billion-by-2033-expands-on-sustainability-and-cost-optimization---persistence-market-research--21657074.html\">Persistence<\/a><\/td>\n<\/tr>\n<tr>\n<td>북미 점유율 약 44%<\/td>\n<td>⚠️ 단일 조사기관<\/td>\n<td>Technavio<\/td>\n<\/tr>\n<tr>\n<td>친환경부품 특약 인지도 18%<\/td>\n<td>⚠️ 과거 조사(시점 불명확)<\/td>\n<td><a href=\"https://kyeonggi.com/article/202010211142413\">경기일보<\/a> 등 보도 — 2020년경 수치로 추정<\/td>\n<\/tr>\n<tr>\n<td>현대해상 법인차 중고부품 8% 할인, 에코부품 17개 외장 품목·1년 보증<\/td>\n<td>✅ 보도(2019)<\/td>\n<td><a href=\"https://www.sateconomy.co.kr/news/view/179589447115436\">시사경제<\/a> — 현재 판매 여부 미확인<\/td>\n<\/tr>\n<tr>\n<td>재제조부품 가격 비율·탄소 절감률<\/td>\n<td>❓ 신뢰할 수치 못 찾음<\/td>\n<td>본문에서 숫자 없이 \"저렴\", \"높음\"으로만 표기<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>: 1일차의 '품질인증부품 = 친환경 부품' 혼동과 '25% 지급 방안 추진 중' 표현을 정정 / 재제조부품 '신품의 30~60%' 수치는 프린터 카트리지 자료라 삭제 / 시장 규모는 단일 숫자 대신 범위로 / 특약 인지도 18%는 과거 조사임을 표시.<\/p>"}, {"day": 4, "title": "4일차 — 유럽 EU 폐차 규정: 왜 유럽이 규칙을 만드는가? (2026-10-10)", "md": "<h1>4일차 — 유럽 EU 폐차 규정: 왜 유럽이 규칙을 만드는가? (2026-10-10)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>새 부품<\/strong>. 품질인증부품은 재활용이 아니라 순정품보다 싼 새 부품입니다.<\/li>\n<li><strong>출고 5년 이내 새 차<\/strong>, 그리고 <strong>안전 부품<\/strong>(브레이크·휠·조향장치 등).<\/li>\n<li><strong>25%<\/strong>. 외장 부품을 대체부품으로 고치면 순정 가격의 25%를 돌려받습니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"유럽의 새 폐차 규정은 '차를 만들 때부터 버릴 때까지' 전부를 묶는다. 그리고 보험사에게 '이 사고차는 폐차인가, 중고차인가'를 판단하는 무거운 숙제를 줬다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>유럽은 25년 된 '폐차 지침'을 버리고 <strong>더 강한 '규정'<\/strong>(Regulation (EU) 2026/1738)을 만들었다. 2026년 8월 13일 발효<\/td>\n<td>'지침'은 나라마다 법을 따로 만들어야 하지만, '규정'은 유럽 전체에 그대로 바로 적용됩니다<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>핵심은 <strong>설계부터 재활용까지 한 번에<\/strong> 관리하는 것<\/td>\n<td>재생 플라스틱 의무, 차량 디지털 여권, 자동차 회사 책임 확대, 고장 난 차 수출 금지<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>'사라지는 차'<\/strong> 문제를 막으려는 법이다<\/td>\n<td>유럽에서 매년 약 340만~470만 대가 등록 말소된 뒤 어디로 갔는지 알 수 없음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 왜 이런 법이 생겼나: '사라지는 차' 문제<\/h2>\n<ol>\n<li>차주가 차 등록을 지움(말소)<\/li>\n<li>그런데 그 차가 <strong>정식 폐차장에서 처리됐다는 기록이 없음<\/strong><\/li>\n<li>어디로 갔나? → 불법 해체장, 또는 <strong>아프리카·중동 등으로 '중고차'라는 이름으로 수출<\/strong><\/li>\n<li>결과: 유해물질이 제대로 처리되지 않고, 유럽은 철·알루미늄·희귀금속 같은 자원을 잃음<\/li>\n<\/ol>\n<blockquote>\n<p>※ 2일차에 배운 독일의 불법 해체(연 약 36만 대)도 이 문제의 일부입니다.<\/p>\n<\/blockquote>\n<h2>3. 새 규정의 주요 내용과 시간표<\/h2>\n<table>\n<thead>\n<tr>\n<th>내용<\/th>\n<th>무엇이 바뀌나<\/th>\n<th>언제부터 (발효일 2026.8.13 기준)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전반 적용<\/td>\n<td>대부분의 의무 시작<\/td>\n<td>발효 후 약 <strong>2년<\/strong> (보도마다 표현이 달라 확인 필요)<\/td>\n<\/tr>\n<tr>\n<td>자동차 회사의 순환 전략<\/td>\n<td>각 회사가 재활용 계획을 공개<\/td>\n<td>발효 후 <strong>3년<\/strong> 이내<\/td>\n<\/tr>\n<tr>\n<td>생산자 책임 확대(EPR)<\/td>\n<td>자동차 회사가 폐차 처리 비용·체계에 책임. 차가 <strong>어느 나라에서 폐차되든<\/strong> 적용<\/td>\n<td>시작 시점은 자료마다 달라 확인 필요<\/td>\n<\/tr>\n<tr>\n<td>고장 난 중고차 수출 금지<\/td>\n<td><strong>도로를 달릴 수 있는 차만<\/strong> 유럽 밖으로 수출 가능<\/td>\n<td>발효 후 <strong>5년<\/strong><\/td>\n<\/tr>\n<tr>\n<td>재생 플라스틱<\/td>\n<td>새 차에 15% → 25%, 그중 일부는 폐차에서 나온 플라스틱<\/td>\n<td>약 <strong>6년 / 10년<\/strong> 후 (2032년 / 2036년)<\/td>\n<\/tr>\n<tr>\n<td>디지털 순환 여권<\/td>\n<td>모든 새 차에 '디지털 여권'(어떤 소재·부품이 들어갔는지 기록). 차주·정비소·재활용업체는 무료로 열람<\/td>\n<td><strong>2032년 9월 1일<\/strong><\/td>\n<\/tr>\n<tr>\n<td>적용 차종 확대<\/td>\n<td>승용차·소형 화물차 → 트럭·버스·오토바이까지<\/td>\n<td>단계적<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>디지털 순환 여권<\/strong> = 차의 '성분표'를 디지털로 담은 것. 재활용업체가 이걸 보면 어떤 부품을 떼어 다시 쓸 수 있는지 바로 압니다.<\/p>\n<\/blockquote>\n<h2>4. [보험 포인트] 유럽 보험업계가 걱정하는 것<\/h2>\n<p>새 규정은 <strong>\"이 차는 폐차(=쓰레기)인가, 고칠 수 있는 중고차인가\"<\/strong> 를 가르는 기준을 정합니다. 폐차로 판정되면 <strong>반드시 정식 폐차장으로 가야 하고, 중고차로 팔거나 수출할 수 없습니다.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>뜻<\/th>\n<th>보험업계 입장<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>기술적 전손<\/strong><\/td>\n<td>물리적으로 고칠 수 없음 (예: 차체가 완전히 찌그러짐)<\/td>\n<td>\"이것만 폐차로 봐야 한다\"<\/td>\n<\/tr>\n<tr>\n<td><strong>경제적 전손<\/strong><\/td>\n<td>고칠 수는 있지만 수리비가 차값보다 비쌈<\/td>\n<td>\"폐차로 자동 분류하면 안 된다. 수리비는 정비소·부품·차 나이에 따라 달라지는 숫자일 뿐\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>유럽 보험업계(Insurance Europe, 독일 GDV)의 3가지 우려<\/strong>\n1. <strong>판단 책임<\/strong>: 보험사(또는 보험사가 고용한 손해사정인)가 \"이 차는 폐차\"라고 판정해야 하는 부담. 독일 GDV는 \"보험금 심사를 넘어서는 일이다. 차주·정부·정식 폐차장이 정해야 한다\"고 주장\n2. <strong>사고차 활용 제한<\/strong>: 지금은 보험사가 사고차(잔존물)를 경매로 팔아 보험금 일부를 회수하는데, 폐차로 분류되면 그 길이 막힐 수 있음\n3. <strong>해결책 제안<\/strong>: 수리비를 계산할 때 <strong>중고·재활용 부품 가격도 넣을 수 있게<\/strong> 해달라 → 그러면 수리비가 내려가서 '경제적 전손'이 줄어듦<\/p>\n<blockquote>\n<p>▶ 연결 고리: 3일차에 배운 \"어떤 부품을 쓰느냐가 수리비를 바꾼다\"가 여기서 <strong>'폐차냐 아니냐'까지 바꾸는 문제<\/strong>로 커집니다.<\/p>\n<\/blockquote>\n<p><strong>한국에 주는 힌트<\/strong>\n- 한국도 2일차에서 본 것처럼 전손차 일부가 불법 경로로 흘러간 과거가 있습니다\n- 유럽처럼 <strong>\"전손 판정 → 폐차장 연결 → 기록\"<\/strong> 이 규칙으로 묶이면, 그 과정을 <strong>투명하게 관리·증명해주는 서비스<\/strong>의 가치가 커집니다\n- 단, 2일차 Q&amp;A에서 확인했듯 한국에서 <strong>무등록 중개는 불법<\/strong>이므로, 등록 폐차장·보험사와 손잡는 형태여야 합니다<\/p>\n<h2>5. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>지침(Directive) vs 규정(Regulation)<\/td>\n<td>지침은 각 나라가 자기 법으로 옮겨야 하고, 규정은 유럽 전체에 그대로 바로 적용<\/td>\n<\/tr>\n<tr>\n<td>생산자 책임 확대(EPR)<\/td>\n<td>물건을 만든 회사가 버려질 때의 처리까지 책임지는 제도<\/td>\n<\/tr>\n<tr>\n<td>디지털 순환 여권<\/td>\n<td>차에 들어간 소재·부품 정보를 담은 디지털 기록<\/td>\n<\/tr>\n<tr>\n<td>기술적 전손<\/td>\n<td>물리적으로 고칠 수 없는 상태<\/td>\n<\/tr>\n<tr>\n<td>경제적 전손<\/td>\n<td>고칠 수는 있지만 수리비가 차값보다 비싼 상태<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>유럽에서 매년 등록 말소 후 행방을 알 수 없는 차는 대략 몇 대?<\/li>\n<li>유럽 보험업계는 '기술적 전손'과 '경제적 전손' 중 어느 것만 폐차로 봐야 한다고 주장했나?<\/li>\n<li>모든 새 차에 디지털 순환 여권이 의무화되는 해는?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>규정 번호 (EU) 2026/1738, 2026.8.13 발효, 기존 지침 2000/53/EC 폐지<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://public.cdxsystem.com/web/cdx/w/eu-elv-regulation-officially-published-what-changed-since-council-adoption\">CDX(관보 게재)<\/a>, <a href=\"https://www.rematec.com/news/industry-players-and-markets/regulation-1738\">Rematec<\/a>, <a href=\"https://www.automotivelogistics.media/sustainability/eu-end-of-life-vehicles-regulation-enters-into-force/2724484\">Automotive Logistics<\/a> — 1일차의 ❓(발효일)을 ✅로 확인<\/td>\n<\/tr>\n<tr>\n<td>이사회 채택일, 관보 게재일<\/td>\n<td>❓ 자료마다 다름<\/td>\n<td>6/18·6/29·7/8, 7/24·7/27로 제각각 → 본문에서 날짜 생략<\/td>\n<\/tr>\n<tr>\n<td>전반 적용 발효 후 2년<\/td>\n<td>⚠️ 표현 차이<\/td>\n<td>CDX: \"발효 후 2년\" / 다른 자료: \"의회 최종 표결 후 24개월\" → 본문에 '확인 필요' 표시<\/td>\n<\/tr>\n<tr>\n<td>EPR 시작 시점<\/td>\n<td>❓ 자료마다 다름<\/td>\n<td>본문에서 시점 생략<\/td>\n<\/tr>\n<tr>\n<td>수출 금지 발효 후 5년, 순환 전략 3년, 재생 플라스틱 6·10년<\/td>\n<td>✅ 복수 출처<\/td>\n<td>CDX, <a href=\"https://transconnect.com/de/blog/elv-verordnung-altfahrzeuge-autohaendler?hsLang=en\">Transconnect<\/a><\/td>\n<\/tr>\n<tr>\n<td>디지털 순환 여권 2032.9.1<\/td>\n<td>⚠️ 단일 보도<\/td>\n<td><a href=\"https://www.automotivelogistics.media/sustainability/eu-end-of-life-vehicles-regulation-enters-into-force/2724484\">Automotive Logistics<\/a><\/td>\n<\/tr>\n<tr>\n<td>행방불명 차량 연 340만~470만 대<\/td>\n<td>✅ 연구 범위<\/td>\n<td><a href=\"https://www.euwid-recycling.com/news/business/eu-study-enforcement-of-elv-directive-impossible-with-current-instruments-160518/\">EUWID<\/a>, <a href=\"https://en.wikipedia.org/wiki/End_of_Life_Vehicles_Directive\">위키백과<\/a> — 집행위 평가는 350만~450만<\/td>\n<\/tr>\n<tr>\n<td>보험업계: 기술적 전손만 폐차로 봐야 / 수리비에 중고부품 반영 요구<\/td>\n<td>✅ 단체 원문<\/td>\n<td><a href=\"https://www.insuranceeurope.eu/mediaitem/6dd5452c-5dbc-4585-b7f9-40ba1b69bfdc/Insurance+Europe+key+messages+on+the+draft+ELVs+regulation.pdf?inline=1\">Insurance Europe 핵심 메시지<\/a>, <a href=\"https://www.insuranceeurope.eu/news/3031/reduce-reuse-recycle-clarity-needed-to-deliver-eu-environmental-rules-for-vehicles\">Insurance Europe 뉴스<\/a><\/td>\n<\/tr>\n<tr>\n<td>독일 GDV: 판정 책임은 보험사 몫이 아니다<\/td>\n<td>✅ 보도<\/td>\n<td><a href=\"https://www.xprimm.com/EU%E2%80%99s-new-End--of--Life-Vehicle-rules-raise-concerns-among-insurers-says-GDV-articol-124-23402.htm\">XPRIMM<\/a><\/td>\n<\/tr>\n<tr>\n<td>최종 규정에 '경제적 전손' 기준이 그대로 남았는지<\/td>\n<td>❓ 미확인<\/td>\n<td>보험업계 자료는 초안(2023~2025) 기준 → 본문에서 \"판정 기준을 정한다\"까지만 서술<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>: 채택일·관보 게재일은 자료마다 달라 본문에서 뺌 / EPR 시작 시점도 뺌 / 보험업계 우려는 \"초안 기준\"이라 최종 규정 내용으로 단정하지 않음 / 1일차의 \"EU 규정 2026.8.13 발효 ❓\"를 오늘 복수 출처로 ✅ 확인.<\/p>"}, {"day": 5, "title": "5일차 — 일본·미국 사례: 일본은 왜 재활용비를 차 살 때 미리 내나? (2026-10-10)", "md": "<h1>5일차 — 일본·미국 사례: 일본은 왜 재활용비를 차 살 때 미리 내나? (2026-10-10)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>약 340만~470만 대<\/strong>. 등록을 지운 뒤 정식 폐차 기록이 없는 차입니다.<\/li>\n<li><strong>기술적 전손<\/strong>. 물리적으로 고칠 수 없는 차만 폐차로 봐야 한다고 주장했습니다.<\/li>\n<li><strong>2032년<\/strong> (9월 1일부터).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"일본은 '돈을 먼저 걷어' 폐차를 관리하고, 미국은 '기록을 남겨' 사고차를 관리한다. 두 나라 모두 보험사가 그 한가운데 있다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>일본<\/strong>: 2005년 1월부터 「자동차 리사이클법」 시행. 차 주인이 <strong>새 차를 살 때 재활용 요금을 미리 맡긴다<\/strong><\/td>\n<td>차를 버릴 때 돈 내라고 하면 몰래 버리니까, 처음부터 돈을 받아두는 방식<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>미국<\/strong>: 전국 단위 폐차법은 따로 없고, <strong>사고차 기록 시스템(NMVTIS)<\/strong> 으로 관리. 보험사는 전손 차량을 <strong>반드시 보고<\/strong>해야 함<\/td>\n<td>사고차를 다른 주로 옮겨 '깨끗한 차'로 속여 파는 사기를 막는 장치<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>두 나라 모두 <strong>보험사가 재활용 부품 사용을 이끄는 주체<\/strong><\/td>\n<td>일본 보험사는 재활용 부품 수리를 권하고, 미국은 보험 수리에서 대체부품 비중이 사상 최고<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 일본: \"버릴 때가 아니라 살 때 낸다\"<\/h2>\n<p><strong>순서<\/strong>\n1. 새 차 구매 → 재활용 요금을 <strong>미리 맡김(예탁)<\/strong>\n2. 이 돈은 <strong>자동차 리사이클 촉진센터(JARC)<\/strong> 가 차가 폐차될 때까지 보관\n3. 차가 폐차되면 → 그 돈으로 자동차 회사가 <strong>3가지 골칫거리<\/strong>를 처리<\/p>\n<table>\n<thead>\n<tr>\n<th>처리 대상<\/th>\n<th>왜 골칫거리인가<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>파쇄잔재물(ASR)<\/td>\n<td>2일차에 배운 '마지막 5%' 찌꺼기. 돈이 안 되고 처리비만 듦<\/td>\n<\/tr>\n<tr>\n<td>에어백<\/td>\n<td>터지지 않은 채 버려지면 위험<\/td>\n<\/tr>\n<tr>\n<td>프레온 가스(에어컨 냉매)<\/td>\n<td>대기에 새면 지구 온난화·오존층 파괴<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>요금은 차종마다 다르며, 보통 <strong>수천 엔~1만 엔대<\/strong> 수준이 소개됩니다 (예: 닛산 페어레이디Z 약 1만 엔)<\/li>\n<li>차를 팔면 다음 주인이 그 예탁금을 넘겨받습니다<\/li>\n<li><strong>성과 예시<\/strong>: 스즈키의 2023년도 보고서에서 ASR 재활용률 96.5%(법정 목표 70%), 에어백 97.3%(목표 85%)<\/li>\n<\/ul>\n<blockquote>\n<p>※ <strong>왜 미리 받나?<\/strong> 폐차할 때 돈을 받으면 사람들이 돈을 안 내려고 산이나 공터에 차를 몰래 버립니다. 미리 받아두면 그럴 이유가 사라집니다.<\/p>\n<\/blockquote>\n<h2>3. 미국: \"기록이 곧 관리\"<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전국 폐차법<\/td>\n<td>유럽·일본 같은 전국 단위 폐차법은 없음. 주(州)마다 관리<\/td>\n<\/tr>\n<tr>\n<td>사고차 등록<\/td>\n<td>주마다 '사고차 등록증(salvage title)' 또는 '수리 불가 증명서'를 발급<\/td>\n<\/tr>\n<tr>\n<td><strong>NMVTIS<\/strong> (전국 차량 이력 시스템)<\/td>\n<td>2009년부터 <strong>보험사·폐차장·경매업체<\/strong> 모두 전손·사고차 정보를 보고해야 함. 법무부는 보험사에게 <strong>24시간 이내<\/strong> 보고를 권장<\/td>\n<\/tr>\n<tr>\n<td>왜 필요한가<\/td>\n<td>사고 이력을 지우려고 다른 주에서 다시 등록하는 사기, 고장 난 차의 차대번호(VIN)를 훔친 차에 붙이는 사기를 막으려고<\/td>\n<\/tr>\n<tr>\n<td>부품 시장<\/td>\n<td>2025년 보험 수리에서 순정부품 63.5%, <strong>대체부품 22.7%(사상 최고)<\/strong>. 나머지는 중고·재제조 부품 등<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 2일차에서 배운 Copart·IAA(미국 사고차 경매 회사 두 곳, 약 80% 점유)가 바로 이 시스템 위에서 보험사 물량을 처리합니다.<\/p>\n<\/blockquote>\n<h2>4. 한·일·미·유럽 한눈에 비교<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>한국<\/th>\n<th>일본<\/th>\n<th>미국<\/th>\n<th>유럽<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>핵심 방식<\/td>\n<td>등록 폐차장 + 재활용률 95% 목표<\/td>\n<td><strong>재활용 요금 선납<\/strong><\/td>\n<td><strong>사고차 기록 보고<\/strong><\/td>\n<td>설계~폐차 전체 규정<\/td>\n<\/tr>\n<tr>\n<td>비용 부담<\/td>\n<td>별도 요금 없음 (폐차장이 고철값으로 운영)<\/td>\n<td>차 주인이 미리 납부<\/td>\n<td>시장에 맡김<\/td>\n<td>자동차 회사 책임 확대<\/td>\n<\/tr>\n<tr>\n<td>보험사 역할<\/td>\n<td>전손차 처리, 친환경부품 특약<\/td>\n<td>재활용 부품 권장, 부품 재활용<\/td>\n<td>전손 보고 의무, 경매 공급<\/td>\n<td>폐차 판정 부담 논쟁<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 일본·미국 보험사가 하는 일<\/h2>\n<table>\n<thead>\n<tr>\n<th>나라<\/th>\n<th>보험사가 하는 일<\/th>\n<th>한국 사업에 주는 힌트<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>일본<\/td>\n<td><strong>도쿄해상<\/strong> 계열 보험사: 보험금으로 넘겨받은 폐차에서 램프·에어백 등을 회수하고 화학회사와 함께 소재를 재생<\/td>\n<td>보험사가 <strong>사고차를 '자원'으로 보는 시각<\/strong>. 한국 보험사에 같은 모델을 제안할 수 있음<\/td>\n<\/tr>\n<tr>\n<td>일본<\/td>\n<td><strong>손해보험재팬(Sompo)<\/strong>: 수리할 때 재활용 부품을 권장하고, 떼어낸 부품도 재활용<\/td>\n<td>3일차의 친환경부품 특약과 같은 방향<\/td>\n<\/tr>\n<tr>\n<td>미국<\/td>\n<td>보험사가 전손 차량을 <strong>전국 시스템에 보고<\/strong> → 사고차 이력이 투명해짐<\/td>\n<td>한국에서도 \"이 차는 전손 이력이 있다\"를 투명하게 보여주는 서비스의 가치<\/td>\n<\/tr>\n<tr>\n<td>미국<\/td>\n<td>보험 수리에서 <strong>대체·재활용 부품 비중이 커지는 중<\/strong><\/td>\n<td>부품 비용 관리가 보험료와 직결<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"일본처럼 '미리 돈을 걷는' 방식과 미국처럼 '기록을 남기는' 방식 중, 보험설계사인 나에게 사업 기회가 더 많은 쪽은 어디일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>자동차 리사이클법 (일본)<\/td>\n<td>2005년 시행. 재활용 요금 선납과 자동차 회사의 처리 의무를 정한 법<\/td>\n<\/tr>\n<tr>\n<td>예탁<\/td>\n<td>돈을 미리 맡겨두는 것<\/td>\n<\/tr>\n<tr>\n<td>JARC<\/td>\n<td>일본 자동차 리사이클 촉진센터. 예탁금을 보관하고 차량 이력을 관리<\/td>\n<\/tr>\n<tr>\n<td>Salvage title (사고차 등록증)<\/td>\n<td>미국에서 전손 처리된 차에 붙는 등록 표시<\/td>\n<\/tr>\n<tr>\n<td>NMVTIS<\/td>\n<td>미국 전국 차량 이력 시스템. 보험사·폐차장이 전손·사고차 정보를 보고<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>일본은 재활용 요금을 언제 내나?<\/li>\n<li>일본 재활용 요금으로 처리하는 '3가지 골칫거리'는?<\/li>\n<li>미국에서 보험사가 전손 차량 정보를 보고하는 전국 시스템의 이름은?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>일본 자동차 리사이클법 2005년 1월 시행, ASR·에어백·프레온 처리 의무<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://www.env.go.jp/content/900481048.pdf\">환경성 자료<\/a>, <a href=\"https://japanfs.org/en/news/archives/news_id027816.html\">Japan for Sustainability<\/a>, <a href=\"https://www.honda.co.jp/auto-recycle/recycle_06_2005.html\">혼다<\/a><\/td>\n<\/tr>\n<tr>\n<td>재활용 요금은 JARC가 폐차 때까지 보관<\/td>\n<td>✅ 정부 자료<\/td>\n<td><a href=\"https://www.env.go.jp/content/900481048.pdf\">환경성 자료<\/a><\/td>\n<\/tr>\n<tr>\n<td>요금 수천 엔~1만 엔대, 페어레이디Z 약 1만 엔<\/td>\n<td>⚠️ 언론·과거 자료<\/td>\n<td><a href=\"https://bestcarweb.jp/?p=585264\">Best Car Web<\/a>, 과거 범위 6,000~18,000엔(JFS, 2006) — 현행 요금표 미확인<\/td>\n<\/tr>\n<tr>\n<td>환경성 자료의 \"380엔/480엔\"<\/td>\n<td>❓ 성격 불명<\/td>\n<td>재활용 요금 본체가 아니라 관리 수수료일 가능성 → 본문에서 제외<\/td>\n<\/tr>\n<tr>\n<td>스즈키 ASR 96.5%, 에어백 97.3% (2023년도)<\/td>\n<td>✅ 회사 공시<\/td>\n<td><a href=\"https://www.globalsuzuki.com/globalnews/2024/0620.html\">스즈키 2024 발표<\/a><\/td>\n<\/tr>\n<tr>\n<td>미국 NMVTIS 2009년부터 보험사·폐차장 보고 의무, 보험사 24시간 권장<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://recyclingtoday.com/article/scrap-industry-news-2009-05-22\">Recycling Today<\/a>, <a href=\"https://www.fenderbender.com/news/article/55044080/salvage-companies-insurers-must-report-to-national-title-database\">FenderBender<\/a> — 2009~2018 자료, 이후 변경 여부 미확인<\/td>\n<\/tr>\n<tr>\n<td>미국에 전국 단위 폐차법 없음<\/td>\n<td>⚠️ 직접 확인 자료 없음<\/td>\n<td>주별 salvage title 체계 자료로 간접 확인. \"유럽·일본 같은 전국 폐차법은 없다\"로 표현<\/td>\n<\/tr>\n<tr>\n<td>2025년 미국 보험 수리 순정 63.5%, 대체부품 22.7%(사상 최고)<\/td>\n<td>✅ 업계 보고서 보도<\/td>\n<td><a href=\"https://www.repairerdrivennews.com/2026/04/10/ccc-report-shows-shift-to-drp-and-ai-appraisals/\">Repairer Driven News 2026.4<\/a><\/td>\n<\/tr>\n<tr>\n<td>미국 중고(재활용) 부품 비중<\/td>\n<td>❓ 수치 못 찾음<\/td>\n<td>본문에서 \"나머지는 중고·재제조 등\"으로만 표기<\/td>\n<\/tr>\n<tr>\n<td>도쿄해상 계열: 폐차에서 램프·에어백 회수, 소재 재생<\/td>\n<td>✅ 일본 정부 사례집<\/td>\n<td><a href=\"https://j4ce.env.go.jp/en/member/301\">환경성 J4CE<\/a><\/td>\n<\/tr>\n<tr>\n<td>손보재팬: 재활용 부품 권장<\/td>\n<td>✅ 일본 정부 사례집<\/td>\n<td><a href=\"https://j4ce.env.go.jp/en/casestudy/210\">환경성 J4CE<\/a><\/td>\n<\/tr>\n<tr>\n<td>일본 재활용 부품 특약 보험료 5% 할인<\/td>\n<td>❓ 특허 문서 예시일 뿐<\/td>\n<td>실제 상품 확인 안 됨 → 본문에서 제외<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>: 일본 요금 '380엔/480엔'은 성격이 불분명해 뺌 / 일본 '재활용 부품 특약 5% 할인'은 특허 문서 예시라 뺌 / 미국 '전국 폐차법 없음'은 직접 근거가 약해 \"유럽·일본 같은 전국 법은 없다\"로 완화 / 미국 중고부품 비중은 수치를 못 찾아 생략.<\/p>"}, {"day": 6, "title": "6일차 — 한국 제도: 한국 폐차장은 어떻게 돌아가나? (2026-10-11)", "md": "<h1>6일차 — 한국 제도: 한국 폐차장은 어떻게 돌아가나? (2026-10-11)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>새 차를 살 때<\/strong> 미리 맡깁니다(예탁).<\/li>\n<li><strong>파쇄잔재물(ASR), 에어백, 프레온 가스(에어컨 냉매)<\/strong>.<\/li>\n<li><strong>NMVTIS<\/strong>(미국 전국 차량 이력 시스템).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"한국의 폐차는 법 3개가 나눠 맡는다. 차는 국토교통부, 재활용은 기후에너지환경부, 배터리는 새 '사용후배터리법'. 보험은 이 셋의 이음매에 있다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>자동차관리법<\/strong>(국토교통부): 누가 폐차할 수 있는지, 말소를 어떻게 하는지 정함<\/td>\n<td>\"차의 출생·사망 신고\" 담당<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>전기·전자제품 및 자동차의 자원순환에 관한 법률<\/strong>(기후에너지환경부): 폐차를 얼마나 재활용해야 하는지 정함<\/td>\n<td>\"차를 얼마나 알뜰하게 분해하나\" 담당. 재활용률 95%가 목표<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>사용후배터리법<\/strong>: 2026년 4월 23일 국회 본회의 통과. 전기차 배터리를 '자원'으로 관리<\/td>\n<td>공포 후 1년 뒤 시행 예정. <strong>재사용사업자에게 보험(또는 공제) 가입 의무<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 환경부는 2025년 10월 조직개편으로 <strong>기후에너지환경부<\/strong>가 되었습니다. 기사에서 '기후부'라고 나오면 같은 곳입니다.<\/p>\n<\/blockquote>\n<h2>2. 법 3개, 누가 무엇을 하나<\/h2>\n<table>\n<thead>\n<tr>\n<th>법<\/th>\n<th>담당<\/th>\n<th>핵심 내용<\/th>\n<th>보험과의 연결<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>자동차관리법<\/td>\n<td>국토교통부<\/td>\n<td>등록된 해체재활용업자(폐차장)만 폐차·말소 가능. <strong>침수로 전손 처리된 차는 폐차 의무<\/strong><\/td>\n<td>보험사가 전손 판정한 침수차는 중고차로 팔 수 없음<\/td>\n<\/tr>\n<tr>\n<td>자원순환법<\/td>\n<td>기후에너지환경부, 한국환경공단<\/td>\n<td>자동차 재활용률 95% 목표. 재활용 실적을 전산 시스템(EcoAS)으로 관리<\/td>\n<td>폐차장의 환경 관리 책임 → 환경 관련 보험 수요<\/td>\n<\/tr>\n<tr>\n<td>사용후배터리법 (2026 통과)<\/td>\n<td>산업통상부·기후에너지환경부<\/td>\n<td>배터리를 떼기 전 <strong>성능·안전 평가<\/strong> 의무. 재사용사업자 등록, <strong>보험 또는 공제 가입 의무<\/strong><\/td>\n<td><strong>새로운 의무보험 시장이 생김<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. 침수차 폐차 의무 — 보험과 가장 직접 연결된 규칙<\/h2>\n<ol>\n<li>장마·태풍으로 차가 물에 잠김<\/li>\n<li>보험사가 <strong>전손<\/strong>(수리비 &gt; 차값)으로 판정하고 보험금 지급<\/li>\n<li>차주는 <strong>정해진 기간 안에 폐차장에 폐차를 요청<\/strong>해야 함 (자동차관리법)<\/li>\n<li>늦으면 과태료: <strong>10일 이내 지연 200만 원<\/strong>, 이후 하루 20만 원씩 추가 (2024년 7월 31일부터)<\/li>\n<\/ol>\n<p><strong>왜 생겼나?<\/strong> 침수차를 고쳐서 '무사고 중고차'처럼 속여 파는 일이 많았기 때문입니다.<\/p>\n<p><strong>남은 빈틈<\/strong> (2022년 정부 방안 당시 지적)\n- 수리비가 적어 <strong>일부 손해(분손)<\/strong> 로 처리된 차\n- <strong>자기차량손해(자차) 보험이 없어<\/strong> 보험 처리를 안 한 차\n- 이런 차는 폐차 의무 대상이 아니라 중고차로 나올 수 있음<\/p>\n<blockquote>\n<p>▶ 보험설계사 관점: <strong>자차 보험이 없으면 침수 이력이 기록에 남지 않을 수 있습니다.<\/strong> 고객에게 자차 가입을 권할 때 \"내 차의 이력을 지켜준다\"는 설명도 할 수 있습니다.<\/p>\n<\/blockquote>\n<h2>4. 전기차 폐배터리, 지금 어떻게 처리되나<\/h2>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2021년 이전 보조금 받은 전기차<\/td>\n<td>폐차 시 배터리를 <strong>국가·지자체에 반납<\/strong> 의무 → 한국환경공단의 '미래폐자원 거점수거센터'가 회수·보관<\/td>\n<\/tr>\n<tr>\n<td>2021년 이후 등록 전기차<\/td>\n<td>반납 의무 없음 → 폐차장에 배터리가 쌓이는 문제<\/td>\n<\/tr>\n<tr>\n<td>2026년 1월 시범사업<\/td>\n<td>반납 의무 없는 배터리(현대·기아 일부 차종)를 성능 평가 후 민간에 공급 시작<\/td>\n<\/tr>\n<tr>\n<td>폐차장 협약<\/td>\n<td>기후부·환경공단·해체재활용협회가 폐차장 보관 배터리 처리 체계 협약<\/td>\n<\/tr>\n<tr>\n<td>사용후배터리법 시행 후<\/td>\n<td>성능 평가 → 재사용(ESS 등) 또는 재활용으로 체계화<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 한국 제도에서 보험이 들어갈 자리<\/h2>\n<table>\n<thead>\n<tr>\n<th>기회<\/th>\n<th>근거<\/th>\n<th>사업 아이디어<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 배터리 재사용사업자 의무보험<\/td>\n<td>사용후배터리법: 재사용사업자 <strong>보험 또는 공제 가입 의무<\/strong><\/td>\n<td>법 시행(공포 후 1년) 전에 <strong>재사용 업체 목록을 미리 확보<\/strong>하고 상품을 준비<\/td>\n<\/tr>\n<tr>\n<td>② 폐차장 보관 배터리 화재<\/td>\n<td>반납 의무 없는 배터리가 폐차장에 쌓이는 중<\/td>\n<td>폐차장 <strong>화재보험 + 배터리 보관 위험<\/strong> 점검 영업<\/td>\n<\/tr>\n<tr>\n<td>③ 침수 전손차<\/td>\n<td>폐차 의무 + 과태료<\/td>\n<td>침수 피해 고객에게 \"폐차 기한·과태료·보상\"을 한 번에 안내<\/td>\n<\/tr>\n<tr>\n<td>④ 자차 보험 가입 권유<\/td>\n<td>자차가 없으면 침수 이력 관리에서 빠질 수 있음<\/td>\n<td>중고차 구매 고객·신차 고객 상담 포인트<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"사용후배터리법이 시행되면 '재사용사업자'는 어떤 회사들일까? 그 회사 사장님이 가장 걱정하는 사고는 무엇일까?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>해체재활용업자<\/td>\n<td>법적으로 등록된 폐차장<\/td>\n<\/tr>\n<tr>\n<td>자원순환법<\/td>\n<td>전기·전자제품 및 자동차의 자원순환에 관한 법률. 재활용률을 관리<\/td>\n<\/tr>\n<tr>\n<td>EcoAS<\/td>\n<td>폐차·폐전자제품 재활용 실적을 관리하는 전산 시스템<\/td>\n<\/tr>\n<tr>\n<td>침수 전손차 폐차 의무<\/td>\n<td>물에 잠겨 전손 처리된 차는 반드시 폐차해야 하는 규칙<\/td>\n<\/tr>\n<tr>\n<td>재사용사업자<\/td>\n<td>다 쓴 전기차 배터리를 다른 용도(ESS 등)로 다시 쓰는 사업자. 보험 가입 의무<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>침수 전손차의 폐차를 10일 이내로 늦추면 과태료는 얼마?<\/li>\n<li>사용후배터리법은 언제 국회 본회의를 통과했나?<\/li>\n<li>사용후배터리법에서 보험(또는 공제) 가입 의무가 생기는 사업자는?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사용후배터리법 2026.4.23 본회의 통과<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://www.heraldk.com/article/2026042302202453419\">헤럴드K<\/a>, <a href=\"https://www.jipyong.com/newsletter/legislation_policy/54_2605_2/index.html\">법무법인 지평<\/a><\/td>\n<\/tr>\n<tr>\n<td>공포 후 1년 뒤 시행<\/td>\n<td>⚠️ 보도<\/td>\n<td>연합뉴스 인용 보도. 정확한 공포일·시행일은 법제처 원문 미확인<\/td>\n<\/tr>\n<tr>\n<td>분리 전 성능·안전 평가, 재사용사업자 등록·보험(공제) 의무<\/td>\n<td>✅ 정부·로펌 자료<\/td>\n<td><a href=\"https://www.motir.go.kr/kor/article/ATCL3f49a5a8c/172091/view\">산업통상부<\/a>, <a href=\"https://www.daeryunlaw.com/trend/11883\">법무법인 대륜<\/a> — 보험 종류(배상책임 등)는 조문 미확인<\/td>\n<\/tr>\n<tr>\n<td>침수 전손차 폐차 의무(자동차관리법 26조)<\/td>\n<td>✅ 정부 자료<\/td>\n<td><a href=\"https://www.molit.go.kr/USR/law/m_46/dtl.jsp?r_id=8962\">국토교통부<\/a><\/td>\n<\/tr>\n<tr>\n<td>과태료 10일 이내 200만 원, 이후 하루 20만 원 (2024.7.31 시행)<\/td>\n<td>✅ 법 개정 자료<\/td>\n<td><a href=\"https://www.molit.go.kr/USR/law/m_46/dtl.jsp?r_id=8962\">국토교통부<\/a> — 상한액은 미확인이라 본문에서 생략<\/td>\n<\/tr>\n<tr>\n<td>분손·자차 미가입 차량 사각지대<\/td>\n<td>⚠️ 2022년 지적<\/td>\n<td><a href=\"https://v.daum.net/v/20220825160020656\">다음뉴스(국토부 방안)<\/a> — 이후 보완 여부 미확인<\/td>\n<\/tr>\n<tr>\n<td>자동차 재활용률 95% 목표, EcoAS 관리<\/td>\n<td>✅ 복수 출처<\/td>\n<td>1·2일차 자료, <a href=\"https://pubs.kist.re.kr/handle/201004/128582?mode=full\">KIST 논문<\/a><\/td>\n<\/tr>\n<tr>\n<td>재활용가능률 85% 등 제작자 의무 세부<\/td>\n<td>❓ 현행 조문 미확인<\/td>\n<td>본문에서 제외<\/td>\n<\/tr>\n<tr>\n<td>2021년 이전 보조금 전기차만 배터리 반납 의무<\/td>\n<td>✅ 보도<\/td>\n<td><a href=\"https://www.kukinews.com/article/view/kuk202601160121\">쿠키뉴스 2026.1<\/a><\/td>\n<\/tr>\n<tr>\n<td>2026.1 반납 의무 없는 배터리 민간 공급 시범사업<\/td>\n<td>✅ 보도<\/td>\n<td>같은 출처<\/td>\n<\/tr>\n<tr>\n<td>환경부 → 기후에너지환경부 (2025.10)<\/td>\n<td>✅ 보도<\/td>\n<td>기사 내 '기후에너지환경부', '기후부' 명칭 사용으로 확인<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용 (1일차 정정 포함)<\/strong>:\n- <strong>1일차 정정<\/strong>: \"2026년 3월 법사위 통과\"까지만 썼는데, 실제로는 <strong>2026년 4월 23일 본회의 통과<\/strong>까지 진행됨\n- <strong>1일차 정정<\/strong>: \"안전검사기관 배상책임보험 의무\"라고 썼는데, 오늘 확인한 자료는 <strong>재사용사업자의 보험 또는 공제 가입 의무<\/strong>를 명시함. 안전검사기관 관련 보험 의무는 원문 확인 전까지 ❓\n- 재활용가능률 85% 등 제작자 의무 수치는 현행 조문을 못 찾아 뺌\n- 침수차 과태료 상한액은 확인 못 해 생략<\/p>"}, {"day": 7, "title": "7일차 — 1주차 복습 퀴즈: 지금까지 배운 것 한 장으로 (2026-10-12)", "md": "<h1>7일차 — 1주차 복습 퀴즈: 지금까지 배운 것 한 장으로 (2026-10-12)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>200만 원<\/strong>. 그 뒤로는 하루 20만 원씩 늘어납니다.<\/li>\n<li><strong>2026년 4월 23일<\/strong> 국회 본회의 통과.<\/li>\n<li><strong>재사용사업자<\/strong>. 다 쓴 전기차 배터리를 ESS 같은 다른 용도로 다시 쓰는 사업자입니다.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 15분 (퀴즈 포함) · 오늘의 한 줄: <strong>\"폐차 한 대에는 '자원(부품·고철)', '돈(보상금·환급·잔존물)', '위험(화재·오염·사기)'이 함께 있다. 보험은 이 셋 모두에 이미 발을 담그고 있다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 1주차를 3줄로<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>어느 날 배웠나<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>폐차는 <strong>5단계<\/strong>(입고·말소 → 유해물질 제거 → 부품 떼기 → 파쇄 → 소재 분리)를 거치고, 차의 약 95%를 다시 쓸 수 있다<\/td>\n<td>1·2일차<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>나라마다 관리 방식이 다르다: <strong>유럽은 규정으로 설계부터 폐차까지<\/strong>, <strong>일본은 요금을 미리<\/strong>, <strong>미국은 기록을 남겨서<\/strong>, <strong>한국은 법 3개로 나눠서<\/strong><\/td>\n<td>4·5·6일차<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>보험은 <strong>수리(부품)<\/strong>, <strong>전손(잔존물)<\/strong>, <strong>사업장 위험(화재·배터리)<\/strong> 세 곳에서 이미 폐차 산업과 연결돼 있다<\/td>\n<td>1·3일차, 매일 '보험 포인트'<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 한 장 지도: 폐차의 일생과 보험 접점<\/h2>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>무슨 일이 일어나나<\/th>\n<th>보험이 닿는 곳<\/th>\n<th>배운 날<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사고 → 수리<\/td>\n<td>순정·대체(품질인증)·중고·재제조 부품 중 선택<\/td>\n<td>대체부품 사용 시 <strong>순정 가격 25% 환급<\/strong>, 친환경부품 특약(인지도 18%)<\/td>\n<td>3일차<\/td>\n<\/tr>\n<tr>\n<td>사고 → 전손<\/td>\n<td>수리비가 차값보다 크면 차값으로 보상, 차는 보험사 소유(잔존물)<\/td>\n<td>잔존물을 <strong>등록 폐차장·경매<\/strong>로 넘김. 침수 전손차는 <strong>폐차 의무<\/strong><\/td>\n<td>2·6일차<\/td>\n<\/tr>\n<tr>\n<td>폐차장 입고·말소<\/td>\n<td>등록 폐차장만 폐차인수증명서 발급 → 말소<\/td>\n<td>말소 후 <strong>남은 보험료 환급<\/strong>, 무등록 업체 주의<\/td>\n<td>2일차<\/td>\n<\/tr>\n<tr>\n<td>해체·파쇄<\/td>\n<td>유해물질 제거, 부품 판매, 고철 판매<\/td>\n<td>폐차장 <strong>화재·배상책임·산재<\/strong> 보험<\/td>\n<td>2일차<\/td>\n<\/tr>\n<tr>\n<td>배터리<\/td>\n<td>성능·안전 평가 → 재사용(ESS) 또는 재활용<\/td>\n<td>사용후배터리법: <strong>재사용사업자 보험(공제) 의무<\/strong><\/td>\n<td>6일차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. 나라별 비교 다시 보기<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>한국<\/th>\n<th>일본<\/th>\n<th>미국<\/th>\n<th>유럽<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>한 단어로<\/td>\n<td><strong>법 3개 분담<\/strong><\/td>\n<td><strong>선납<\/strong><\/td>\n<td><strong>기록<\/strong><\/td>\n<td><strong>설계부터 규정<\/strong><\/td>\n<\/tr>\n<tr>\n<td>핵심 장치<\/td>\n<td>등록 폐차장, 재활용률 95%, 사용후배터리법<\/td>\n<td>새 차 살 때 재활용 요금 예탁(JARC 보관)<\/td>\n<td>NMVTIS에 보험사 전손 보고<\/td>\n<td>규정 (EU) 2026/1738, 디지털 순환 여권(2032)<\/td>\n<\/tr>\n<tr>\n<td>보험사 역할<\/td>\n<td>전손·침수차 처리, 대체부품 환급<\/td>\n<td>재활용 부품 권장, 폐차 부품 회수<\/td>\n<td>전손 보고, 경매(Copart·IAA) 공급<\/td>\n<td>폐차 판정 부담 논쟁(기술적 vs 경제적 전손)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 1주차 복습 퀴즈 15문항 (정답은 맨 아래)<\/h2>\n<p><strong>[기초] 폐차가 뭔가요?<\/strong>\n1. 차 한 대 중 다시 쓸 수 있는 비율은 대략 몇 %인가?\n2. 폐차 5단계 중, 대충 하면 땅과 물이 오염되는 단계는?\n3. 파쇄 후 끝까지 남는 찌꺼기를 영어 약자 3글자로?\n4. 폐차 보상금을 가장 크게 좌우하는 것은? (차 색깔 / 차 무게 / 주행거리)<\/p>\n<p><strong>[부품] 3일차<\/strong>\n5. 품질인증부품은 '재활용 부품'인가, '새 부품'인가?\n6. 2025년 8월 개편 후에도 순정부품만 쓰는 경우 2가지는?\n7. 헌 부품을 분해·세척·수리·재조립해 원래 성능으로 되살린 부품의 이름은?<\/p>\n<p><strong>[세계] 4·5일차<\/strong>\n8. 유럽 새 폐차 규정이 발효된 날짜는?\n9. 유럽 보험업계가 \"이것만 폐차로 봐야 한다\"고 주장한 전손 종류는?\n10. 일본은 재활용 요금을 언제 내나?\n11. 미국에서 보험사가 전손 차량을 보고하는 전국 시스템 이름은?<\/p>\n<p><strong>[한국·보험] 2·6일차<\/strong>\n12. 무등록 업체에 폐차를 맡기면 어떤 문제가 생기나?\n13. 보험사가 폐차 산업의 '공급자'가 되는 이유는?\n14. 침수로 전손 처리된 차에 생기는 법적 의무는?\n15. 사용후배터리법에서 보험(또는 공제) 가입 의무가 있는 사업자는?<\/p>\n<blockquote>\n<p>채점 기준: 12개 이상 = 2주차로 바로 진행 / 8~11개 = 틀린 날 강의만 다시 보기 / 7개 이하 = 2일차와 6일차부터 다시 보기<\/p>\n<\/blockquote>\n<h2>5. [보험 포인트] 1주차에서 찾은 사업 기회 정리<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>기회<\/th>\n<th>누구에게<\/th>\n<th>근거<\/th>\n<th>난이도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>①<\/td>\n<td>폐차-말소-보험료 환급 원스톱 안내<\/td>\n<td>개인 고객<\/td>\n<td>말소 후 환급 발생, 무등록 업체 피해<\/td>\n<td>쉬움 (오늘부터 가능)<\/td>\n<\/tr>\n<tr>\n<td>②<\/td>\n<td>대체부품 25% 환급·친환경부품 특약 안내<\/td>\n<td>사고 고객<\/td>\n<td>특약 인지도 18% → 안내만 해도 차별화<\/td>\n<td>쉬움<\/td>\n<\/tr>\n<tr>\n<td>③<\/td>\n<td>침수 전손차 폐차 기한·과태료 안내<\/td>\n<td>침수 피해 고객<\/td>\n<td>늦으면 200만 원 + 하루 20만 원<\/td>\n<td>쉬움 (장마철 집중)<\/td>\n<\/tr>\n<tr>\n<td>④<\/td>\n<td>폐차장 화재·배상·산재 패키지<\/td>\n<td>폐차장 사장님<\/td>\n<td>배터리 보관 증가, 화재 위험<\/td>\n<td>중간 (19일차)<\/td>\n<\/tr>\n<tr>\n<td>⑤<\/td>\n<td>배터리 재사용사업자 의무보험<\/td>\n<td>재사용 업체<\/td>\n<td>사용후배터리법 시행(2027년 예상)<\/td>\n<td>어려움, 그러나 <strong>새 시장<\/strong> (20일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"①~⑤ 중 <strong>이번 달 안에 고객 한 명에게 실제로 말해볼 수 있는 것<\/strong>은 무엇인가? 그 고객은 누구인가?\"<\/p>\n<\/blockquote>\n<h2>6. 꼭 기억할 용어 5개 (1주차 최다 등장)<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전손<\/td>\n<td>고칠 수 없거나 수리비가 차값보다 커서 차값으로 보상하는 것<\/td>\n<\/tr>\n<tr>\n<td>잔존물<\/td>\n<td>보험금 지급 후 보험사 소유가 된 사고차<\/td>\n<\/tr>\n<tr>\n<td>말소등록<\/td>\n<td>자동차 등록원부에서 차를 지우는 것. 세금·의무보험이 끝남<\/td>\n<\/tr>\n<tr>\n<td>품질인증부품<\/td>\n<td>순정품이 아닌 회사가 만든 <strong>새<\/strong> 부품. 정부 지정기관 인증<\/td>\n<\/tr>\n<tr>\n<td>재사용사업자<\/td>\n<td>다 쓴 전기차 배터리를 다른 용도로 다시 쓰는 사업자. 보험 가입 의무<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에) — 2주차 맛보기<\/h2>\n<ol>\n<li>세계 자동차 재활용 시장 규모는 대략 얼마일까? (힌트: 1일차 '시장 크기')<\/li>\n<li>미국 사고차 경매 시장을 약 80% 차지하는 두 회사는?<\/li>\n<li>한국은 매년 대략 몇 대가 폐차될까?<\/li>\n<\/ol>\n<hr />\n<h2>복습 퀴즈 정답<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>정답<\/th>\n<th>배운 날<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>약 95%<\/td>\n<td>1일차<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>유해물질 제거(탈오염) 단계<\/td>\n<td>2일차<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>ASR (파쇄잔재물)<\/td>\n<td>2일차<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>차 무게 (고철 값이 대부분)<\/td>\n<td>2일차<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>새 부품<\/td>\n<td>3일차<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>출고 5년 이내 새 차, 안전 부품(브레이크·휠·조향장치 등)<\/td>\n<td>3일차<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>재제조부품<\/td>\n<td>3일차<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>2026년 8월 13일<\/td>\n<td>4일차<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>기술적 전손 (물리적으로 고칠 수 없는 차)<\/td>\n<td>4일차<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>새 차를 살 때 (예탁)<\/td>\n<td>5일차<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>NMVTIS<\/td>\n<td>5일차<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>말소등록이 안 돼서 자동차세·의무보험이 계속 붙음<\/td>\n<td>2일차<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>전손 보상 후 그 차의 소유권이 보험사로 넘어오기 때문<\/td>\n<td>1일차<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>정해진 기간 안에 폐차해야 함 (늦으면 과태료)<\/td>\n<td>6일차<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>재사용사업자<\/td>\n<td>6일차<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<p>오늘은 복습이라 새 주장은 거의 없습니다. 대신 <strong>지난 강의의 ❓ 항목을 다시 확인<\/strong>했습니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사용후배터리법 2026.5.20 국무회의 의결, 공포 후 1년 뒤 시행<\/td>\n<td>✅ 정부 발표<\/td>\n<td><a href=\"https://www.motir.go.kr/kor/article/ATCL3f49a5a8c/171852/view\">산업통상부<\/a> — 국회 통과 후 공포 절차. <strong>시행은 2027년 중반 무렵 예상(⚠️ 정확한 공포일은 법제처 원문 미확인)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>법사위 2026.3.30 수정 가결 → 4.23 본회의 통과<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://www.daeryunlaw.com/trend/11883\">법무법인 대륜<\/a>, 6일차 출처<\/td>\n<\/tr>\n<tr>\n<td>침수 전손차 과태료: 10일 이내 200만 원, 이후 하루 20만 원<\/td>\n<td>✅ 정부 자료<\/td>\n<td><a href=\"https://www.molit.go.kr/USR/law/m_46/dtl.jsp?r_id=9013\">국토교통부<\/a><\/td>\n<\/tr>\n<tr>\n<td>과태료 상한<\/td>\n<td>⚠️ 입법예고안 기준<\/td>\n<td>개정 전 300만 원 이하 → 2024년 입법예고안은 <strong>최대 1,000만 원<\/strong>. 2022년 발표안(2,000만 원)과 다름. 최종 시행 금액은 법령 원문 미확인 → 본문에 상한 미기재<\/td>\n<\/tr>\n<tr>\n<td>복습 문제의 정답 15개<\/td>\n<td>✅ 1~6일차 본문·자기점검표와 대조<\/td>\n<td>6일차까지의 정정 내용 반영(품질인증부품=새 부품, 본회의 통과, 재사용사업자 보험 의무)<\/td>\n<\/tr>\n<tr>\n<td>한국 연 폐차 대수, 세계 시장 규모<\/td>\n<td>⚠️ 범위<\/td>\n<td>1일차 범위(70만~90만 대, 890억~1,055억 달러) 그대로. 8일차에 최신 자료로 재확인 예정<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용<\/strong>:\n- 6일차의 \"공포일·시행일 미확인\"을 보완: 2026년 5월 20일 국무회의 의결을 확인, 시행은 \"2027년 예상\"으로 표기\n- 6일차에서 생략한 과태료 상한은 입법예고안(최대 1,000만 원)만 확인되어 이번에도 본문에는 넣지 않음\n- 1일차 '보험 포인트'의 \"안전검사기관 배상책임보험 의무\"는 6일차 정정대로 <strong>재사용사업자 보험(공제) 의무<\/strong>로 정리표에 반영<\/p>"}, {"day": 8, "title": "8일차 — 시장 규모: 숫자가 왜 기관마다 다를까? (2026-10-13)", "md": "<h1>8일차 — 시장 규모: 숫자가 왜 기관마다 다를까? (2026-10-13)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>약 890억~1,055억 달러(2025년)<\/strong>. 오늘 다시 확인했더니 같은 범위가 맞았습니다.<\/li>\n<li><strong>Copart, IAA<\/strong>.<\/li>\n<li><strong>연 70만~90만 대 안팎<\/strong>. 단, 최신 연간 공식 수치는 아직 확인하지 못했습니다(아래 자기점검 참고).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"시장 규모 숫자는 '정답'이 아니라 '어디까지를 시장으로 셌느냐'에 따라 달라지는 추정치다. 숫자 하나를 외우지 말고 '범위와 성장 이유'를 기억하자.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>세계 자동차 재활용 시장은 2025년 <strong>약 890억~1,055억 달러<\/strong>(약 120조~145조 원)<\/td>\n<td>조사회사 3곳의 숫자가 최대 약 1.2배 차이<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>앞으로의 성장률 전망은 <strong>연 6%~13%<\/strong> 로 2배 차이<\/td>\n<td>10년 뒤 숫자는 1,560억 달러 vs 3,300억 달러로 크게 벌어짐 → <strong>먼 미래 숫자는 믿지 말 것<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>성장 이유는 4가지: <strong>차가 늙고<\/strong>, <strong>전기차 배터리가 쏟아지고<\/strong>, <strong>규제가 세지고<\/strong>, <strong>원자재가 귀해진다<\/strong><\/td>\n<td>보험 입장에서는 \"물량이 늘고, 위험도 같이 늘어난다\"는 뜻<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 숫자가 기관마다 다른 이유<\/h2>\n<table>\n<thead>\n<tr>\n<th>이유<\/th>\n<th>예시<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>① 어디까지 '시장'으로 세나<\/strong><\/td>\n<td>고철만? 중고부품까지? 배터리 재활용까지? 포함 범위가 다르면 숫자가 달라짐<\/td>\n<\/tr>\n<tr>\n<td><strong>② 기준 연도가 다름<\/strong><\/td>\n<td>2023년 기준 vs 2025년 기준 숫자를 섞어 비교하면 틀림<\/td>\n<\/tr>\n<tr>\n<td><strong>③ 유료 보고서의 추정 방식<\/strong><\/td>\n<td>대부분 수백만 원짜리 보고서의 '요약'만 공개. 계산 방법은 비공개<\/td>\n<\/tr>\n<tr>\n<td><strong>④ 성장률 가정<\/strong><\/td>\n<td>연 6%로 가정하느냐 13%로 가정하느냐에 따라 10년 뒤 숫자가 2배 차이<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>세 회사 숫자 비교 (세계 자동차 재활용 시장)<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>조사회사<\/th>\n<th>2025년<\/th>\n<th>미래 전망<\/th>\n<th>연 성장률<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Global Market Insights<\/td>\n<td>888억 달러<\/td>\n<td>2035년 1,564억 달러<\/td>\n<td>6.1%<\/td>\n<\/tr>\n<tr>\n<td>Market.us<\/td>\n<td>975억 달러<\/td>\n<td>2035년 3,252억 달러<\/td>\n<td>12.8%<\/td>\n<\/tr>\n<tr>\n<td>IMARC<\/td>\n<td>1,055억 달러<\/td>\n<td>2034년 3,299억 달러<\/td>\n<td>12.8%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>연평균 성장률(CAGR)<\/strong> = 매년 평균 몇 %씩 커지는지. 6%면 약 12년에 2배, 12%면 약 6년에 2배가 됩니다.<\/p>\n<p>▶ 실전 팁: 고객이나 회사에 숫자를 말할 때는 <strong>\"조사기관마다 다르지만 대략 ○○~○○ 범위\"<\/strong> 라고 말하는 것이 가장 안전하고 신뢰를 얻습니다.<\/p>\n<\/blockquote>\n<h2>3. 시장이 커지는 4가지 이유<\/h2>\n<table>\n<thead>\n<tr>\n<th>이유<\/th>\n<th>근거<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 차가 늙는다<\/td>\n<td>미국 승용·경차 평균 차령 <strong>12.8년<\/strong>(2025년, 사상 최고). 승용차만 보면 14.5년<\/td>\n<td>오래 탄 차가 많을수록 나중에 폐차될 차도, 중고부품 수요도 많아짐<\/td>\n<\/tr>\n<tr>\n<td>② 전기차 배터리<\/td>\n<td>자동차 배터리 재활용 시장 2025년 약 262억 달러 → 2030년 약 434억 달러 전망 (MarketsandMarkets)<\/td>\n<td>전기차 1세대가 수명을 다하기 시작<\/td>\n<\/tr>\n<tr>\n<td>③ 규제 강화<\/td>\n<td>유럽 새 규정(4일차), 한국 사용후배터리법(6일차)<\/td>\n<td>법이 \"재활용하라\"고 요구하면 시장이 생김<\/td>\n<\/tr>\n<tr>\n<td>④ 원자재 가치<\/td>\n<td>철·알루미늄·리튬·니켈 등을 새로 캐는 것보다 다시 쓰는 것이 유리해지는 흐름<\/td>\n<td>폐차가 '도시 광산'이 됨<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 세계·한국 숫자 감 잡기<\/h2>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>숫자<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>세계 폐차 대수<\/td>\n<td>연 약 3,500만~4,000만 대<\/td>\n<td>1일차<\/td>\n<\/tr>\n<tr>\n<td>미국 운행 차량<\/td>\n<td>약 2억 8,900만 대, 연 폐차율 약 4.5%<\/td>\n<td>S&amp;P Global Mobility 2025<\/td>\n<\/tr>\n<tr>\n<td>재제조 부품 시장(세계)<\/td>\n<td>약 570억~850억 달러<\/td>\n<td>기준 연도·범위가 제각각(3일차와 같은 이유)<\/td>\n<\/tr>\n<tr>\n<td>한국 자동차 등록 대수<\/td>\n<td><strong>2,630만 대<\/strong>(2024년 말, 전년보다 1.3% 증가)<\/td>\n<td>국가지표체계<\/td>\n<\/tr>\n<tr>\n<td>한국 연간 폐차<\/td>\n<td>70만~90만 대 안팎<\/td>\n<td>최신 연간 공식 수치는 미확인. 조기폐차 지원이 몰린 분기에는 폐차가 30% 넘게 늘었다는 보도도 있음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ 한국은 <strong>등록 대수는 계속 늘고<\/strong>, 경유차 조기폐차 지원이 2026년으로 끝나는 지역이 많아 <strong>폐차 물량이 해마다 출렁입니다.<\/strong><\/p>\n<\/blockquote>\n<h2>5. [보험 포인트] 시장 숫자를 보험 사업으로 읽는 법<\/h2>\n<table>\n<thead>\n<tr>\n<th>시장 신호<\/th>\n<th>보험에서 의미<\/th>\n<th>사업 기회<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>차가 늙는다<\/td>\n<td>수리 청구 중 <strong>중고·재제조 부품<\/strong> 비중 증가<\/td>\n<td>친환경부품 특약 안내(3일차)<\/td>\n<\/tr>\n<tr>\n<td>배터리 재활용 시장 연 10%대 성장<\/td>\n<td>배터리 보관·운송·해체 사업장 늘어남 → <strong>화재 위험 증가<\/strong><\/td>\n<td>배터리 사업장 화재·배상 보험 (20일차)<\/td>\n<\/tr>\n<tr>\n<td>규제 강화<\/td>\n<td><strong>의무보험<\/strong>이 생기거나 보험 가입이 거래 조건이 됨<\/td>\n<td>사용후배터리법 재사용사업자 보험 (6일차)<\/td>\n<\/tr>\n<tr>\n<td>시장 규모 숫자가 기관마다 다름<\/td>\n<td>사업계획서에 숫자 하나만 쓰면 신뢰도가 떨어짐<\/td>\n<td><strong>범위 + 출처<\/strong>로 쓰는 습관 (29일차 사업계획서)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"전체 시장이 100조 원이 넘는다고 해서 내 사업이 커지는 것은 아니다. <strong>이 시장 안에서 보험료를 내는 사람은 누구인가?<\/strong> 폐차장? 부품업체? 배터리 업체? 개인 차주?\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>시장 규모<\/td>\n<td>1년 동안 그 시장에서 오가는 돈의 총액(추정치)<\/td>\n<\/tr>\n<tr>\n<td>CAGR(연평균 성장률)<\/td>\n<td>매년 평균 몇 %씩 커지는지<\/td>\n<\/tr>\n<tr>\n<td>평균 차령<\/td>\n<td>도로 위 차들의 평균 나이<\/td>\n<\/tr>\n<tr>\n<td>폐차율<\/td>\n<td>운행 중인 차 중 1년에 폐차되는 비율<\/td>\n<\/tr>\n<tr>\n<td>도시 광산<\/td>\n<td>버려진 제품(폐차·폐가전)에서 금속을 다시 뽑아내는 것<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>시장 규모 숫자가 조사기관마다 다른 이유 2가지는?<\/li>\n<li>2025년 미국 승용·경차 평균 차령은 몇 년인가?<\/li>\n<li>연 성장률 6%와 12%, 시장이 2배가 되는 데 걸리는 시간은 각각 대략 몇 년?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>세계 차량 재활용 시장 2025년 888억 달러, 2035년 1,564억, 6.1%<\/td>\n<td>⚠️ 유료 보고서 요약<\/td>\n<td><a href=\"https://www.gminsights.com/industry-analysis/vehicle-recycling-market\">Global Market Insights<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025년 1,055억 달러, 2034년 3,299억, 12.83%<\/td>\n<td>⚠️ 유료 보고서 요약<\/td>\n<td><a href=\"https://imarcgroup.com/global-vehicle-recycling-market\">IMARC<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025년 975억 달러, 2035년 3,252억, 12.8%<\/td>\n<td>⚠️ 유료 보고서 요약<\/td>\n<td><a href=\"https://market.us/report/vehicle-recycling-market/\">Market.us<\/a><\/td>\n<\/tr>\n<tr>\n<td>자동차 배터리 재활용 2025년 262억 → 2030년 434억 달러<\/td>\n<td>⚠️ 단일 조사기관<\/td>\n<td><a href=\"https://www.waste360.com/waste-recycling/automotive-battery-recycling-market-worth-43-42-billion-by-2030---exclusive-report-by-marketsandmarkets-\">MarketsandMarkets(Waste360)<\/a> — '전기차 배터리만'으로 좁히면 2025년 수십억 달러대로 훨씬 작음(범위 차이)<\/td>\n<\/tr>\n<tr>\n<td>미국 평균 차령 12.8년(2025, 사상 최고), 승용차 14.5년, 운행 2억 8,900만 대, 폐차율 4.5%<\/td>\n<td>✅ 원 조사기관<\/td>\n<td><a href=\"https://www.spglobal.com/automotive-insights/en/blogs/2025/05/average-age-of-vehicle-in-us\">S&amp;P Global Mobility<\/a>, <a href=\"https://www.noln.net/site-placement/latest-news/news/55292622/sp-global-mobility-analysis-us-vehicle-age-reaches-128-years\">NOLN<\/a><\/td>\n<\/tr>\n<tr>\n<td>재제조 부품 시장 570억~850억 달러<\/td>\n<td>⚠️ 기준 연도 제각각<\/td>\n<td><a href=\"https://www.gminsights.com/ko/industry-analysis/remanufactured-automotive-parts-market\">GMI(2024년 698억)<\/a>, <a href=\"https://giikorea.co.kr/report/sky1796443-automotive-remanufacturing-market-size-share.html\">SkyQuest(2023년 567억)<\/a><\/td>\n<\/tr>\n<tr>\n<td>한국 등록 2,630만 대(2024년 말, +1.3%)<\/td>\n<td>✅ 정부 지표<\/td>\n<td><a href=\"https://www.index.go.kr/unify/idx-info.do?idxCd=1257\">국가지표체계<\/a><\/td>\n<\/tr>\n<tr>\n<td>한국 연간 폐차 70만~90만 대<\/td>\n<td>⚠️ 과거 자료<\/td>\n<td>1일차 범위. 2024~2025년 연간 공식 수치 못 찾음<\/td>\n<\/tr>\n<tr>\n<td>조기폐차 지원 분기에 폐차 30% 이상 증가<\/td>\n<td>⚠️ 연도 불명확 보도<\/td>\n<td><a href=\"https://www.dt.co.kr/article/10849618\">디지털타임스<\/a> 등 — 연도 특정 불가라 숫자 없이 서술<\/td>\n<\/tr>\n<tr>\n<td>6%면 약 12년, 12%면 약 6년에 2배<\/td>\n<td>✅ 계산<\/td>\n<td>'72의 법칙'(72÷성장률)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용 (1일차 정정 포함)<\/strong>:\n- <strong>1일차 정정<\/strong>: \"미국 평균 차량 나이 약 14년\"이라고 썼는데, 전체 승용·경차 평균은 <strong>12.8년(2025년)<\/strong> 이고, 14.5년은 '승용차만'의 평균입니다\n- 한국 '분기 폐차 21만 대(+34.7%)' 보도는 연도가 불분명해 숫자를 빼고 \"30% 넘게 늘었다는 보도\"로만 표현\n- 전기차 배터리 재활용 시장은 조사기관별로 10배 가까이 달라(약 10억~115억 달러), 범위가 넓은 '자동차 배터리 재활용' 수치 하나만 쓰고 차이를 표시<\/p>"}, {"day": 9, "title": "9일차 — 대표 기업: LKQ·Copart·IAA, 보험사가 왜 이 회사들의 최대 고객인가? (2026-10-14)", "md": "<h1>9일차 — 대표 기업: LKQ·Copart·IAA, 보험사가 왜 이 회사들의 최대 고객인가? (2026-10-14)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>어디까지를 시장으로 세는지(범위)<\/strong>, <strong>기준 연도<\/strong>, <strong>추정 방식(유료 보고서)<\/strong>, <strong>성장률 가정<\/strong> 중 2가지.<\/li>\n<li><strong>12.8년<\/strong>(2025년, 사상 최고).<\/li>\n<li>6%는 <strong>약 12년<\/strong>, 12%는 <strong>약 6년<\/strong> (72 ÷ 성장률).<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"미국 폐차 산업의 거인들은 '보험사가 내놓는 사고차'를 먹고 자란다. 보험사는 이들의 최대 공급자이자, 동시에 이들 부품의 최대 구매자다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>Copart·IAA = 사고차 경매장<\/strong>. 보험사가 전손 처리한 차를 대신 팔아준다<\/td>\n<td>보험사의 '중고 사고차 판매 대행사'<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>LKQ = 중고·대체부품 유통 회사<\/strong>. 경매장에서 사고차를 사서 부품을 떼어 정비소에 판다<\/td>\n<td>보험 수리에 쓰이는 부품을 공급<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>그래서 보험사는 <strong>양쪽 끝에 다 있다<\/strong>: 사고차를 <strong>파는 쪽<\/strong>(경매장의 고객) + 수리 부품 값을 <strong>내는 쪽<\/strong>(LKQ 부품의 실질적 구매자)<\/td>\n<td>보험사가 없으면 이 산업은 돌아가지 않음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 돈과 차의 흐름 (미국)<\/h2>\n<pre><code>[사고 발생]\n    │\n    ▼\n[보험사] ── 전손 판정 → 차주에게 차값 보상, 차는 보험사 소유(잔존물)\n    │\n    ▼  (판매 위탁)\n[Copart / IAA 경매장] ── 온라인 경매 → 전 세계 구매자\n    │                         │\n    │                         ├─ 수리해서 다시 타려는 사람·수출업자\n    │                         └─ LKQ 같은 부품 회사·폐차장\n    ▼\n[보험사] ← 판매 대금(수수료 뺀 금액) 회수\n                              │\n                              ▼\n                [LKQ] 부품 떼어 판매 → 정비소 → 보험 수리비로 결제\n<\/code><\/pre>\n<h2>3. 세 회사 한눈에<\/h2>\n<table>\n<thead>\n<tr>\n<th>회사<\/th>\n<th>하는 일<\/th>\n<th>최근 숫자<\/th>\n<th>보험과의 관계<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Copart<\/strong><\/td>\n<td>온라인 사고차 경매 (미국·영국·캐나다 등 10여 개국)<\/td>\n<td>2025 회계연도(2025년 7월 결산) 매출 약 <strong>46.5억 달러<\/strong>(+9.7%), 판매 대수 +4.8%<\/td>\n<td>최대 판매자 그룹이 보험사. 단, 2025년 4분기에는 보험 물량이 약 2% 감소<\/td>\n<\/tr>\n<tr>\n<td><strong>IAA<\/strong><\/td>\n<td>온라인 사고차 경매. <strong>2023년 3월 RB Global(옛 Ritchie Bros.)에 인수됨<\/strong> (약 66억 달러)<\/td>\n<td>2025년 4분기 RB Global 매출 약 12억 달러(+5%)<\/td>\n<td>보험사 물량이 핵심. 2026년 '전손 예측(Total Loss Predictor)' 도구 출시 계획<\/td>\n<\/tr>\n<tr>\n<td><strong>LKQ<\/strong><\/td>\n<td>중고(재활용)·대체·재제조 부품 유통. 북미 최대 중고부품 공급사<\/td>\n<td>2025년 매출 약 <strong>136억~139억 달러<\/strong>(전년보다 소폭 감소), 사업 구조 재검토 착수<\/td>\n<td>보험사가 전손 처리한 차를 경매장에서 사 부품을 확보. 대형 보험사의 중고부품 '우선 공급사'로 지정된 사례(2019)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>판매 대수 기반 사업<\/strong>: Copart·IAA는 차를 직접 사는 게 아니라 <strong>대신 팔아주고 수수료<\/strong>를 받습니다. Copart 매출의 약 85%가 수수료(서비스) 매출입니다.<\/p>\n<\/blockquote>\n<h2>4. 왜 지금 이 회사들에게 유리한가: '전손 비율' 상승<\/h2>\n<table>\n<thead>\n<tr>\n<th>요인<\/th>\n<th>설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>수리비 상승<\/td>\n<td>차에 센서·카메라(첨단 운전보조장치)가 많아져 범퍼 하나 고쳐도 비쌈<\/td>\n<\/tr>\n<tr>\n<td>중고차 값<\/td>\n<td>중고차 값이 높으면 사고차도 비싸게 팔림 → 보험사가 전손 처리해도 회수액이 큼<\/td>\n<\/tr>\n<tr>\n<td>결과<\/td>\n<td>미국 보험 청구 중 전손 비율 <strong>약 24.2%<\/strong>(2025년, CCC 집계). 4건 중 1건꼴<\/td>\n<\/tr>\n<tr>\n<td>기상 재해<\/td>\n<td>허리케인·홍수 때 침수 전손차가 한꺼번에 쏟아짐 → 경매장 물량 급증<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 연결 고리: 4일차의 '경제적 전손'(수리비 &gt; 차값)이 늘수록, 경매장과 부품 회사가 커집니다.<\/p>\n<\/blockquote>\n<h2>5. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사고차 경매<\/td>\n<td>미국처럼 상장된 대형 전문 기업은 확인되지 않음. 일부 경매업체가 손보사로부터 전손차를 위탁받아 유통<\/td>\n<\/tr>\n<tr>\n<td>과거 문제<\/td>\n<td>2016년 상반기 전손차 2만 6,751대 중 약 15%(3,975대)가 <strong>등록 폐차장이 아닌 불법 경매업체<\/strong>로 유통됐다는 보도<\/td>\n<\/tr>\n<tr>\n<td>최근 지적<\/td>\n<td>손보업계 잔존물(보험동산) 거래에 불법·편법이 많다는 업계 보도 → 투명화 요구<\/td>\n<\/tr>\n<tr>\n<td>중고차 경매<\/td>\n<td>현대글로비스 '오토벨' 같은 대기업 중고차 경매는 있으나, 이것은 일반 중고차 중심<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>※ <strong>한국 기회<\/strong>: 미국은 \"보험사 → 대형 경매장 → 부품 회사\"가 <strong>투명하게 기록되는 구조<\/strong>. 한국은 아직 이 연결이 흩어져 있어, <strong>보험사·등록 폐차장·부품업체를 투명하게 잇는 역할<\/strong>에 빈자리가 있습니다. (단, 2일차에서 본 것처럼 무등록 중개는 불법)<\/p>\n<\/blockquote>\n<h2>6. [보험 포인트] 이 회사들에게서 배울 것<\/h2>\n<table>\n<thead>\n<tr>\n<th>배울 점<\/th>\n<th>미국 사례<\/th>\n<th>한국 보험 사업 힌트<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 보험사는 '판매자'<\/td>\n<td>보험사가 경매장의 최대 고객. 잔존물을 비싸게 팔수록 보험금 부담이 줄어듦<\/td>\n<td>잔존물 회수액을 높여주는 서비스 = 보험사가 돈을 낼 이유<\/td>\n<\/tr>\n<tr>\n<td>② 보험사는 '구매자'<\/td>\n<td>수리비를 줄이려 중고부품 공급사를 지정<\/td>\n<td>중고·재제조 부품 활용을 높이는 정비 네트워크 제안<\/td>\n<\/tr>\n<tr>\n<td>③ 데이터가 무기<\/td>\n<td>IAA의 전손 예측 도구, LKQ의 AI 사고차 평가(하루 1만 대 평가라는 업체 주장)<\/td>\n<td>\"이 차는 전손일까?\"를 빠르게 판단하는 데이터 = 보험사의 비용 절감 (23일차)<\/td>\n<\/tr>\n<tr>\n<td>④ 거래 위험<\/td>\n<td>경매·운송·보관 중 사고차 파손, 화재(특히 전기차)<\/td>\n<td>경매장·보관장 <strong>화재·보관자 배상책임보험<\/strong> (19·20일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"내가 한국에서 'Copart 같은 역할'을 직접 할 수는 없다. 그렇다면 <strong>보험 설계사로서 이 흐름의 어느 지점에 서면 보험사와 폐차장 모두에게 쓸모 있는 사람이 될까?<\/strong>\"<\/p>\n<\/blockquote>\n<h2>7. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사고차 경매(Salvage auction)<\/td>\n<td>보험사가 전손 처리한 차를 대신 팔아주는 경매<\/td>\n<\/tr>\n<tr>\n<td>위탁 판매<\/td>\n<td>물건을 직접 사지 않고 대신 팔아주고 수수료를 받는 방식<\/td>\n<\/tr>\n<tr>\n<td>전손 비율<\/td>\n<td>보험 청구 중 전손으로 처리되는 비율 (미국 약 24%)<\/td>\n<\/tr>\n<tr>\n<td>재활용 OEM 부품<\/td>\n<td>폐차에서 떼어낸 원래 제조사(순정) 부품<\/td>\n<\/tr>\n<tr>\n<td>잔존물 회수액<\/td>\n<td>보험사가 사고차를 팔아 되돌려 받는 돈<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>8. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>Copart·IAA는 사고차를 직접 사서 파나, 대신 팔아주고 수수료를 받나?<\/li>\n<li>IAA를 2023년에 인수한 회사는?<\/li>\n<li>보험사가 이 산업에서 '양쪽 끝'에 있다는 뜻은?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Copart FY2025 매출 약 46.5억 달러(+9.7%), 판매 +4.8%, 서비스 매출 85%<\/td>\n<td>✅ 회사 공시·실적발표<\/td>\n<td><a href=\"https://www.sec.gov/Archives/edgar/data/900075/000162828025042946/cprt-20250731.htm\">Copart 10-K FY2025<\/a>, <a href=\"https://www.marketbeat.com/earnings/reports/2025-9-4-copart-inc-stock\">MarketBeat 실적발표 요약<\/a><\/td>\n<\/tr>\n<tr>\n<td>Copart 보험 물량 FY2025 +4.5%, 4분기 약 −2%<\/td>\n<td>⚠️ 실적발표 요약(2차 자료)<\/td>\n<td>같은 출처<\/td>\n<\/tr>\n<tr>\n<td>IAA, 2023.3.20 RB Global 인수, 약 66억 달러(보도는 70억)<\/td>\n<td>✅ 회사 공시<\/td>\n<td><a href=\"https://www.sec.gov/Archives/edgar/data/1046102/000162828024007570/rba-20231231.htm\">RB Global 10-K FY2023<\/a><\/td>\n<\/tr>\n<tr>\n<td>RB Global 2025년 4분기 매출 약 12억 달러(+5%), 2026 전손 예측 도구<\/td>\n<td>⚠️ 2차 자료<\/td>\n<td><a href=\"https://finance.yahoo.com/news/rb-global-inc-q4-2025-133000447.html\">Yahoo Finance 실적 요약<\/a><\/td>\n<\/tr>\n<tr>\n<td>미국 전손 비율 24.2%(2025)<\/td>\n<td>⚠️ 업계 집계(CCC), 2차 인용<\/td>\n<td>같은 출처 — 2일차의 '약 23%'를 최신값으로 갱신<\/td>\n<\/tr>\n<tr>\n<td>LKQ 2025년 매출 약 136억~139억 달러<\/td>\n<td>⚠️ 집계 사이트 간 차이<\/td>\n<td><a href=\"https://www.sec.gov/Archives/edgar/data/1065696/000106569626000005/exhibit991.htm\">LKQ 8-K(4분기 33억 달러)<\/a>, <a href=\"https://www.alphaquery.com/stock/LKQ/fundamentals/annual/revenue\">AlphaQuery<\/a> — 연간 정확한 값은 원문 표 미확인이라 범위로<\/td>\n<\/tr>\n<tr>\n<td>LKQ 북미 최대 중고부품 공급사, 경매장·보험사에서 사고차 구매<\/td>\n<td>✅ 회사 자료<\/td>\n<td><a href=\"https://lkqcorp.com/?p=913\">LKQ 재활용 부품 소개<\/a>, <a href=\"https://tlimagazine.com/news/lkq-corp\">TLI Magazine<\/a><\/td>\n<\/tr>\n<tr>\n<td>LKQ 대형 보험사 우선 공급사 시범(2019)<\/td>\n<td>⚠️ 과거 자료<\/td>\n<td><a href=\"https://www.repairerdrivennews.com/?p=42402\">Repairer Driven News<\/a> — 현재 상태 미확인<\/td>\n<\/tr>\n<tr>\n<td>LKQ AI로 하루 1만 대 평가<\/td>\n<td>⚠️ 업체 홍보 자료<\/td>\n<td><a href=\"https://web-stg.tractable.ai/case-studies/lkq\">Tractable 사례<\/a><\/td>\n<\/tr>\n<tr>\n<td>Copart·IAA 미국 사고차 경매 약 80% 점유<\/td>\n<td>❓ 공식 수치 못 찾음<\/td>\n<td>1일차 내용. 오늘 근거 확인 실패 → 본문에서 뺌<\/td>\n<\/tr>\n<tr>\n<td>한국 2016년 전손차 15% 불법 경매 유통<\/td>\n<td>⚠️ 과거 보도<\/td>\n<td><a href=\"https://www.newstomato.com/RealTime/RealTimeDetail.aspx?no=699157\">뉴스토마토<\/a><\/td>\n<\/tr>\n<tr>\n<td>한국 잔존물 거래 불법·편법 지적<\/td>\n<td>⚠️ 업계 보도<\/td>\n<td><a href=\"https://sateconomy.co.kr/news/view/179589953827395\">시사경제<\/a> — \"연 1조 원 이상 보험료 인상 원인\" 주장은 검증 불가라 본문 제외<\/td>\n<\/tr>\n<tr>\n<td>한국 대형 사고차 전문 경매 기업<\/td>\n<td>❓ 확인 못 함<\/td>\n<td>본문에서 \"확인되지 않음\"으로 표현<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>수정한 내용 (1·2일차 정정 포함)<\/strong>:\n- <strong>1일차 정정<\/strong>: \"Copart·IAA가 약 80% 장악\"은 오늘 공식 근거를 찾지 못해 ❓로 내림. 두 회사가 미국 사고차 경매의 <strong>대표 2강<\/strong>이라는 것까지만 확실\n- <strong>2일차 갱신<\/strong>: 미국 전손 비율 '약 23%' → 최신 <strong>24.2%(2025년)<\/strong>\n- IAA는 독립 회사가 아니라 <strong>RB Global 소속<\/strong>이라는 점을 추가(1·5일차에는 빠져 있었음)\n- LKQ 연간 매출은 집계 사이트마다 달라 범위로 표기<\/p>"}, {"day": 10, "title": "10일차 — 전기차 폐배터리 재활용: 폐배터리가 왜 '도시 광산'인가? (2026-10-15)", "md": "<h1>10일차 — 전기차 폐배터리 재활용: 폐배터리가 왜 '도시 광산'인가? (2026-10-15)<\/h1>\n<h2>어제 퀴즈 정답<\/h2>\n<ol>\n<li><strong>대신 팔아주고 수수료를 받는다<\/strong>(위탁 판매). Copart 매출의 약 85%가 수수료입니다.<\/li>\n<li><strong>RB Global<\/strong>(옛 Ritchie Bros.), 2023년 3월.<\/li>\n<li>보험사는 사고차를 <strong>파는 쪽<\/strong>(경매장의 최대 판매자)이면서, 수리 부품 값을 <strong>내는 쪽<\/strong>(중고부품의 실질적 구매자)이라는 뜻.<\/li>\n<\/ol>\n<blockquote>\n<p>⏱ 읽는 시간 12분 · 오늘의 한 줄: <strong>\"다 쓴 전기차 배터리 안에는 리튬·니켈·코발트가 그대로 남아 있다. 땅을 파는 대신 배터리를 녹여 금속을 꺼내는 것, 그래서 '도시 광산'이다. 그리고 그 광산은 불이 잘 난다.\"<\/strong><\/p>\n<\/blockquote>\n<h2>1. 오늘 꼭 알아야 할 3가지<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>핵심<\/th>\n<th>쉬운 설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>폐배터리의 길은 <strong>두 갈래<\/strong>: 성능이 남았으면 <strong>재사용<\/strong>(ESS 등), 다 됐으면 <strong>재활용<\/strong>(금속 추출)<\/td>\n<td>옷으로 치면 '물려 입기' vs '실로 풀어서 새 옷 만들기'<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>물량이 <strong>본격적으로 쏟아지는 건 2030년 이후<\/strong>. 세계 폐전기차 2030년 약 411만 대 → 2040년 약 4,227만 대 전망<\/td>\n<td>지금은 '준비 기간'. 그래서 회사들이 망하기도, 사들이기도 함<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>유럽은 <strong>법으로 회수율·재생원료 비율<\/strong>을 정했다. 리튬 회수 2027년 말 50% → 2031년 말 80%<\/td>\n<td>배터리 재활용이 '선택'이 아니라 '의무'가 됨<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 폐배터리의 일생<\/h2>\n<ol>\n<li>전기차에서 배터리를 떼어냄 (6일차: 한국은 떼기 전 <strong>성능·안전 평가<\/strong> 의무화 예정)<\/li>\n<li>성능 검사 → 갈림길<\/li>\n<li><strong>재사용<\/strong>: 남은 용량이 충분하면 ESS(에너지 저장 장치), 캠핑용 전원 등으로 다시 씀 (11일차)<\/li>\n<li><strong>재활용<\/strong>: 남은 용량이 부족하면 분해 단계로<\/li>\n<li><strong>방전 → 분해 → 파쇄<\/strong> → 검은 가루 <strong>'블랙매스'<\/strong> 가 나옴<\/li>\n<li><strong>습식제련<\/strong>: 블랙매스를 약품에 녹여 리튬·니켈·코발트·망간을 하나씩 분리<\/li>\n<li>회수한 금속 → 새 배터리 원료로 (배터리 → 배터리, '닫힌 순환')<\/li>\n<\/ol>\n<blockquote>\n<p>※ <strong>블랙매스(Black mass)<\/strong> = 배터리를 잘게 부순 검은 가루. 금속이 잔뜩 섞여 있어 '광석'처럼 사고팔립니다.<\/p>\n<p>※ <strong>습식제련<\/strong> = 금속을 용액에 녹여서 분리하는 방법. 반대로 높은 온도로 녹이는 건 '건식제련'.<\/p>\n<\/blockquote>\n<h2>3. 세계는 어떻게 하나<\/h2>\n<table>\n<thead>\n<tr>\n<th>지역<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>유럽<\/strong> (배터리 규정)<\/td>\n<td>회수율: 리튬 2027년 말 50%, 2031년 말 80% / 코발트·니켈·구리 2027년 말 90%, 2031년 말 95%. 새 배터리에 재생 원료 의무: 리튬 2031년 6% → 2036년 12%, 니켈 6% → 15%. <strong>2027년 2월부터 전기차 배터리에 '디지털 배터리 여권'<\/strong>(QR 코드)<\/td>\n<\/tr>\n<tr>\n<td><strong>북미<\/strong><\/td>\n<td>대표 기업 Li-Cycle이 신규 공장 건설비 부담으로 <strong>2025년 5월 파산<\/strong>, 최대 채권자였던 원자재 기업 <strong>글렌코어가 2025년 8월 자산 인수<\/strong>. 정부 지원 축소 영향도 거론<\/td>\n<\/tr>\n<tr>\n<td><strong>교훈<\/strong><\/td>\n<td>물량이 본격화되기 전 '준비 기간'에 무리하게 투자한 회사는 버티지 못함 → 사업 위험이 큰 산업<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 연결 고리: 4일차의 '자동차 디지털 순환 여권(2032)'과 오늘의 '배터리 여권(2027)'은 같은 방향입니다. <strong>\"무엇이 들어 있는지 기록하라\"<\/strong>.<\/p>\n<\/blockquote>\n<h2>4. 한국은?<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>발생량<\/td>\n<td>국내 전기차 폐배터리 연 약 2천 개(2024년) → 2029년 약 2만 개로 10배 증가 전망(환경부). 단, 다른 추정(2029년 약 7만 9천 개)도 있어 기준에 따라 차이 큼<\/td>\n<\/tr>\n<tr>\n<td>대표 기업<\/td>\n<td><strong>성일하이텍<\/strong>: 블랙매스를 습식제련해 배터리 원료 생산(새만금 공장). 에코프로·배터리 3사도 재활용 사업 확대 중<\/td>\n<\/tr>\n<tr>\n<td>제도<\/td>\n<td>사용후배터리법(6일차): 떼기 전 성능·안전 평가, <strong>재사용사업자 보험(공제) 의무<\/strong>, 시행은 2027년 예상<\/td>\n<\/tr>\n<tr>\n<td>현재 문제<\/td>\n<td>반납 의무가 없는 2021년 이후 등록 전기차의 배터리가 <strong>폐차장에 쌓이는 중<\/strong>(6일차)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. [보험 포인트] 도시 광산은 '불이 나는 광산'<\/h2>\n<table>\n<thead>\n<tr>\n<th>위험<\/th>\n<th>실제로 일어나는 일<\/th>\n<th>보험 기회<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 보관·처리장 화재<\/td>\n<td>미국·캐나다 재활용·폐기물 시설 화재: 2016년 272건 → 2024년 430건(+58%), 2025년 448건(업계 집계). 찌그러지거나 구멍 난 배터리가 발화<\/td>\n<td>재활용·보관 사업장 <strong>화재보험<\/strong>. 단, 보험사들이 손을 떼는 중 → <strong>화재 안전 설비를 갖춘 업체만 가입 가능<\/strong>해지는 흐름<\/td>\n<\/tr>\n<tr>\n<td>② 높아지는 자기부담금<\/td>\n<td>미국 재활용 시설 재산보험 자기부담금이 5만~10만 달러 → <strong>25만 달러 이상<\/strong>이 보통이 됨(보험 중개사 발언)<\/td>\n<td>여러 보험사가 나눠 받는 구조가 일반화 → <strong>위험 관리 컨설팅 + 보험 설계<\/strong>를 같이 해주는 사람이 필요<\/td>\n<\/tr>\n<tr>\n<td>③ 운송 중 사고<\/td>\n<td>폐배터리는 위험물이라 운송 중 화재·누출 위험<\/td>\n<td>운송·적재물 배상책임보험<\/td>\n<\/tr>\n<tr>\n<td>④ 사업 실패 위험<\/td>\n<td>Li-Cycle 파산처럼 투자 회수 실패<\/td>\n<td>거래 상대방 신용·보증 관련 보험(참고용)<\/td>\n<\/tr>\n<tr>\n<td>⑤ 의무보험<\/td>\n<td>사용후배터리법 재사용사업자 보험(공제) 의무<\/td>\n<td>법 시행 전 <strong>대상 업체 명단 확보<\/strong> (6일차와 연결)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>▶ 오늘의 생각거리: \"보험사가 '화재 위험 때문에 안 받겠다'고 하는 폐배터리 보관업체가 있다면, 나는 그 회사에 무엇을 먼저 제안해야 보험 가입이 가능해질까? (힌트: 보험사가 원하는 것은 '증거')\"<\/p>\n<\/blockquote>\n<h2>6. 오늘의 용어 5개<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>재사용 vs 재활용<\/td>\n<td>재사용 = 배터리째 다른 용도로 / 재활용 = 녹여서 금속을 꺼냄<\/td>\n<\/tr>\n<tr>\n<td>블랙매스<\/td>\n<td>배터리를 부순 검은 가루. 금속이 섞여 있는 '광석'<\/td>\n<\/tr>\n<tr>\n<td>습식제련<\/td>\n<td>약품에 녹여 금속을 하나씩 분리하는 방법<\/td>\n<\/tr>\n<tr>\n<td>회수율<\/td>\n<td>폐배터리 속 금속 중 실제로 다시 뽑아낸 비율<\/td>\n<\/tr>\n<tr>\n<td>배터리 여권<\/td>\n<td>배터리의 성분·이력을 담은 디지털 기록(QR 코드). 유럽 2027년 2월<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 1분 퀴즈 (답은 내일 강의 맨 위에)<\/h2>\n<ol>\n<li>폐배터리를 부숴서 나오는 '금속이 섞인 검은 가루'를 뭐라고 하나?<\/li>\n<li>유럽이 정한 리튬 회수율 목표는 2027년 말 몇 %, 2031년 말 몇 %?<\/li>\n<li>2025년에 파산하고 글렌코어에 인수된 북미 배터리 재활용 회사는?<\/li>\n<\/ol>\n<hr />\n<h2>✅ 자기점검 결과 (발송 전 확인)<\/h2>\n<table>\n<thead>\n<tr>\n<th>주장<\/th>\n<th>신뢰도<\/th>\n<th>출처 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>유럽: 리튬 회수 2027년 말 50%, 2031년 말 80% / 코발트·니켈·구리 90%→95%<\/td>\n<td>✅ 복수 출처<\/td>\n<td><a href=\"https://www.iea.org/policies/16763-eu-sustainable-batteries-regulation\">IEA<\/a>, <a href=\"https://eur-lex.europa.eu/summary/EN/LEGISSUM:4704179\">EUR-Lex 요약<\/a><\/td>\n<\/tr>\n<tr>\n<td>재생원료 의무 리튬 6%(2031)→12%(2036), 니켈 6%→15%<\/td>\n<td>⚠️ 2차 요약<\/td>\n<td><a href=\"https://www.arianee.com/en/blog/battery-passport-timeline-2027-2036\">Arianee 타임라인<\/a> — 위임법령에 따라 날짜 변동 가능<\/td>\n<\/tr>\n<tr>\n<td>배터리 여권·QR 코드 2027년 2월<\/td>\n<td>⚠️ 2차 요약 + 의회 요약<\/td>\n<td><a href=\"https://oeil.europarl.europa.eu/oeil/en/document-summary?id=1754181\">유럽의회 요약<\/a>, Arianee<\/td>\n<\/tr>\n<tr>\n<td>세계 폐전기차 2030년 411만 대, 2040년 4,227만 대<\/td>\n<td>⚠️ 조사기관 전망(SNE리서치)<\/td>\n<td><a href=\"https://www.etoday.co.kr/news/view/2267205\">이투데이<\/a><\/td>\n<\/tr>\n<tr>\n<td>국내 폐배터리 2024년 2,058개 → 2029년 약 2만 개<\/td>\n<td>⚠️ 정부 전망 인용 보도<\/td>\n<td><a href=\"https://mobile.newsis.com/view/NISX20250904_0003315446\">뉴시스 2025.9<\/a> — 다른 추정(7만 9천 개, 2023년 기사)과 크게 다름<\/td>\n<\/tr>\n<tr>\n<td>Li-Cycle 2025년 5월 파산, 8월 글렌코어 인수<\/td>\n<td>✅ 복수 보도<\/td>\n<td><a href=\"https://www.canarymedia.com/articles/recycling-renewables/li-cycles-quest-to-recycle-lithium-ion-batteries-ends-in-bankruptcy\">Canary Media<\/a>, <a href=\"https://www.wastedive.com/news/glencore-
