<title>폐차와 보험 공부방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽 강의 목차 레일 + 오른쪽 읽기 영역, 폰에서는 위아래로 쌓임 */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2621; --muted:#5d6b63; --line:#d6ddd8;
  --accent:#2f6b4f; --accent-soft:#e2eee7; --warn:#a0621a;
  --display:"Gowun Batang",Georgia,serif; --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c241f; --fg:#e5ece7; --muted:#9aaba1; --line:#2f3a34;
  --accent:#7cc39d; --accent-soft:#233a2d; --warn:#e0a35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c241f; --fg:#e5ece7; --muted:#9aaba1; --line:#2f3a34;
  --accent:#7cc39d; --accent-soft:#233a2d; --warn:#e0a35a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1100px;margin:0 auto 20px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
header.top h1{font-family:var(--display);font-size:1.9rem;margin:0;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
nav{display:flex;flex-direction:column;gap:6px;min-width:0}
nav .label{font-size:.75rem;letter-spacing:.08em;color:var(--muted);margin-top:10px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--fg);font-size:.93rem;line-height:1.4}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent);color:var(--bg);font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{font-size:.85rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
article{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px clamp(18px,4vw,44px);min-width:0}
article h1{font-family:var(--display);font-size:1.6rem;line-height:1.35;margin-top:0;text-wrap:balance}
article h2{font-size:1.15rem;margin-top:2em;padding-top:.6em;border-top:1px solid var(--line)}
article blockquote{margin:1em 0;padding:12px 16px;background:var(--accent-soft);border-radius:8px}
article blockquote p{margin:.3em 0}
article .tbl{overflow-x:auto;margin:1em 0}
article table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
article th,article td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
article th{color:var(--muted);font-weight:600;font-size:.82rem;letter-spacing:.03em}
article pre{overflow-x:auto;background:var(--bg);padding:14px;border-radius:8px;font-size:.82rem;line-height:1.5}
article a{color:var(--accent)}
article hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.empty{color:var(--muted)}
</style>

<header class="top">
  <h1>폐차와 보험 공부방</h1>
  <p>자동차 재활용(친환경) 산업을 보험 비즈니스 관점에서 30일간 공부합니다. 매일 아침 8시에 새 강의가 추가됩니다.</p>
</header>
<div class="wrap">
  <nav id="nav" aria-label="강의 목록"></nav>
  <article id="view"><p class="empty">강의를 불러오는 중입니다.</p></article>
</div>

<script>
const DATA = __DATA__;
const nav = document.getElementById('nav'), view = document.getElementById('view');
const items = [
  ...DATA.lessons.slice().reverse().map(l => ({id:'day'+String(l.day).padStart(2,'0'), label:l.title.replace(/^[^\w가-힣]*/,''), md:l.md, group:'강의'})),
  {id:'curriculum', label:'30일 커리큘럼', md:DATA.curriculum, group:'안내'},
  {id:'selfcheck', label:'자기점검 원칙', md:DATA.selfcheck, group:'안내'}
];
function render(id){
  const it = items.find(i => i.id === id) || items[0];
  let html = it.md;
  html = html.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  view.innerHTML = html;
  view.querySelectorAll('a[href^="./"]').forEach(a => a.removeAttribute('href'));
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.id === it.id));
  try { localStorage.setItem('last', it.id); } catch(e) {}
  window.scrollTo({top:0});
}
const done = DATA.lessons.length;
nav.innerHTML = `<div class="progress">진도 ${done} / 30일<div class="bar"><i style="width:${Math.min(100,done/30*100)}%"></i></div></div>`;
let g = '';
items.forEach(it => {
  if (it.group !== g) { g = it.group; nav.insertAdjacentHTML('beforeend', `<div class="label">${g}</div>`); }
  const b = document.createElement('button'); b.textContent = it.label; b.dataset.id = it.id;
  b.onclick = () => render(it.id); nav.appendChild(b);
});
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem('last'); } catch(e) {} }
render(start || items[0].id);
</script>
