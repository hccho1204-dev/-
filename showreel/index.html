<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLESS Showreel</title>
<style>
  @font-face { font-family: "BHS"; src: url("fonts/BlackHanSans.ttf"); }
  @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
  @font-face { font-family: "Serif"; src: url("fonts/InstrumentSerif-Italic.ttf"); }
  :root { --bg: #0a0a0a; --fg: #f5f5f0; --pk: #ff2d95; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "BHS", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  canvas { max-width: 100%; max-height: calc(100vh - 90px); background: #000; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-size: 15px; padding: 8px 16px; border: 0; border-radius: 999px; cursor: pointer; background: #222; color: var(--fg); }
  button.on { background: var(--pk); color: #000; }
  body.render { padding: 0; display: block; }
  body.render .bar { display: none; }
  body.render canvas { max-width: none; max-height: none; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="play">▶ 재생</button>
  <button data-ar="16x9" class="on">가로 16:9</button>
  <button data-ar="9x16">세로 9:16</button>
</div>
<audio id="music" src="out/music.wav" preload="auto"></audio>
<script>
/* =====================================================================
   BLESS CREATIVE 쇼릴 — 20초 / 144BPM (1비트 = 0.4167초, 총 48비트)
   포트폴리오: ① 키네틱 모션그래픽 영상  ② 리크루팅 블로그 글 11편  ③ AI 작업 방식
   ===================================================================== */
const BK = "#0a0a0a", WH = "#f5f5f0", PK = "#ff2d95", BL = "#2f4bff";
const B = 60 / 144, DUR = 20;
const KR = "BHS", EN = "Anton", SF = "Serif";
const INSTA = new URLSearchParams(location.search).get("insta") || "@incarvip_bless";

// 실제 블로그 글 제목 (posts/ 폴더)
const POSTS = [
  "40대 재취업, 보험설계사로 시작해도 늦지 않을까?",
  "간호사가 보험설계사로 이직하면 좋은 이유",
  "간호조무사 이직 추천 직업, 보험설계사가 답인 이유",
  "경력단절 여성이 보험설계사로 재취업할 수 있을까?",
  "보험설계사 DB영업이란? 지인영업과 뭐가 다른가요",
  "보험설계사 수입 현실은? 초봉부터 3년차까지",
  "보험설계사 자격증 준비 방법과 기간",
  "보험설계사 초기 정착 성공하려면? 5가지",
  "보험설계사 하루 일과는 어떤가요?",
  "손해보험 경력직 설계사, 조직 옮길 때 3가지",
  "요양보호사가 보험설계사로 전환하면?",
];

const params = new URLSearchParams(location.search);
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W, H, U, P;
function setSize(ar) {
  [W, H] = ar === "9x16" ? [1080, 1920] : [1920, 1080];
  cv.width = W; cv.height = H; U = Math.min(W, H) / 100; P = H > W;
}
setSize(params.get("ar") || "16x9");
if (params.has("render")) document.body.classList.add("render");

/* ---------- 이미지 (키네틱 영상에서 뽑은 장면) ---------- */
const IMG = {};
const loadImg = n => new Promise(r => { const i = new Image(); i.onload = () => { IMG[n] = i; r(); }; i.src = `assets/${n}.jpg`; });
const imgsReady = Promise.all([...Array(10)].flatMap((_, i) => [loadImg("w" + (i + 1)), loadImg("t" + (i + 1))]));

/* ---------- 수학 / 이징 ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outExpo = k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const outCubic = k => 1 - Math.pow(1 - k, 3);
const outBack = k => { const c = 2.2; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const inOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const inExpo = k => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10));
const pulse = (t, d = 0.1) => Math.exp(-((((t % B) + B) % B) / d));
const bt = n => n * B;   // 비트 → 초
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- 그리기 도우미 ---------- */
const cx = () => W / 2, cy = () => H / 2;
function bg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function measure(s, size, font = KR, sp = 0) { ctx.font = `${size}px ${font}`; ctx.letterSpacing = `${sp * size}px`; const w = ctx.measureText(s).width; ctx.letterSpacing = "0px"; return w; }
function fit(s, font, maxW, maxSize, sp = 0) { const w = measure(s, maxSize, font, sp); return w > maxW ? maxSize * maxW / w : maxSize; }
function text(s, x, y, size, o = {}) {
  const { color = WH, font = KR, align = "center", alpha = 1, rot = 0, sx = 1, sy = 1, stroke = null, lw = 0, sp = 0, base = "middle" } = o;
  if (alpha <= 0 || sx <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy);
  ctx.font = `${size}px ${font}`; ctx.letterSpacing = `${sp * size}px`; ctx.textAlign = align; ctx.textBaseline = base;
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || size * 0.025; ctx.lineJoin = "round"; ctx.strokeText(s, 0, 0); }
  else { ctx.fillStyle = color; ctx.fillText(s, 0, 0); }
  ctx.restore();
}
function circle(x, y, r, fill, stroke, lw) {
  if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke && lw > 0) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function rrect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke && lw > 0) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
// 둥근 모서리 + 그림자가 있는 이미지 프레임 (cover 방식으로 꽉 채움)
function frame(name, x, y, w, h, o = {}) {
  const im = IMG[name]; if (!im) return;
  const { rot = 0, s = 1, alpha = 1, r = U * 1.2, border = null } = o;
  if (s <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = U * 3; ctx.shadowOffsetY = U * 1.2;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r); ctx.fillStyle = "#000"; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.clip();
  const k = Math.max(w / im.width, h / im.height);
  ctx.drawImage(im, -im.width * k / 2, -im.height * k / 2, im.width * k, im.height * k);
  ctx.restore();
  if (border) { ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); rrect(0, 0, w, h, r, null, border, U * 0.4); ctx.restore(); }
}
function wrap(s, size, maxW, font = KR) {
  const words = s.split(" "), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (measure(t, size, font) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
// 블로그 카드
function blogCard(i, x, y, w, rot = 0, s = 1) {
  const h = w * 0.62;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = "rgba(0,0,0,0.18)"; ctx.shadowBlur = U * 2; ctx.shadowOffsetY = U;
  rrect(0, 0, w, h, w * 0.04, "#fff"); ctx.shadowColor = "transparent";
  rrect(0, 0, w, h, w * 0.04, null, BK, w * 0.006);
  const pad = w * 0.07;
  rrect(-w / 2 + pad + w * 0.08, -h / 2 + pad + w * 0.03, w * 0.16, w * 0.06, w * 0.03, i % 3 === 0 ? PK : BK);
  text("BLOG", -w / 2 + pad + w * 0.08, -h / 2 + pad + w * 0.032, w * 0.035, { font: EN, color: WH, sp: 0.1 });
  text(String(i + 1).padStart(2, "0"), w / 2 - pad, -h / 2 + pad + w * 0.03, w * 0.05, { font: EN, color: "#bbb", align: "right" });
  const fs = w * 0.068, lines = wrap(POSTS[i % POSTS.length], fs, w - pad * 2).slice(0, 3);
  lines.forEach((l, j) => text(l, -w / 2 + pad, -h / 2 + pad + w * 0.14 + j * fs * 1.25, fs, { color: BK, align: "left" }));
  ctx.fillStyle = "#e5e5e5"; ctx.fillRect(-w / 2 + pad, h / 2 - pad - w * 0.05, w - pad * 2, w * 0.004);
  text("BLESS INSIGHT · AEO", -w / 2 + pad, h / 2 - pad - w * 0.012, w * 0.035, { font: EN, color: "#999", align: "left", sp: 0.08 });
  ctx.restore();
}
// 아이콘 (선으로 그린 단순 기호)
function icon(type, x, y, s, color, lw = s * 0.09) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = ctx.lineJoin = "round";
  const h = s / 2;
  ctx.beginPath();
  if (type === "play") { ctx.moveTo(-h * 0.4, -h * 0.55); ctx.lineTo(h * 0.6, 0); ctx.lineTo(-h * 0.4, h * 0.55); ctx.closePath(); ctx.fill(); }
  else if (type === "chat") { ctx.roundRect(-h * 0.8, -h * 0.65, h * 1.6, h * 1.1, h * 0.3); ctx.moveTo(-h * 0.3, h * 0.45); ctx.lineTo(-h * 0.5, h * 0.85); ctx.lineTo(0, h * 0.45); ctx.stroke(); ctx.beginPath(); [-0.4, 0, 0.4].forEach(d => ctx.arc(h * d, -h * 0.1, lw * 0.6, 0, 7)); ctx.fill(); }
  else if (type === "pen") { ctx.moveTo(-h * 0.6, h * 0.6); ctx.lineTo(h * 0.5, -h * 0.5); ctx.lineTo(h * 0.7, -h * 0.3); ctx.lineTo(-h * 0.4, h * 0.8); ctx.lineTo(-h * 0.7, h * 0.85); ctx.closePath(); ctx.stroke(); }
  else if (type === "chart") { [[-0.55, 0.2], [-0.1, -0.2], [0.35, -0.6]].forEach(([px, py]) => { ctx.rect(h * px, h * py, h * 0.3, h * (0.75 - py)); }); ctx.fill(); ctx.beginPath(); ctx.moveTo(-h * 0.8, h * 0.8); ctx.lineTo(h * 0.85, h * 0.8); ctx.stroke(); }
  else if (type === "spark") { for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.lineTo(Math.cos(a) * h * 0.9, Math.sin(a) * h * 0.9); ctx.lineTo(Math.cos(a + Math.PI / 4) * h * 0.25, Math.sin(a + Math.PI / 4) * h * 0.25); } ctx.closePath(); ctx.fill(); }
  else if (type === "camera") { ctx.roundRect(-h * 0.75, -h * 0.75, h * 1.5, h * 1.5, h * 0.4); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, h * 0.33, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(h * 0.42, -h * 0.42, lw * 0.6, 0, 7); ctx.fill(); }
  else if (type === "doc") { ctx.roundRect(-h * 0.6, -h * 0.8, h * 1.2, h * 1.6, h * 0.15); ctx.stroke(); ctx.beginPath(); [-0.35, 0, 0.35].forEach(d => { ctx.moveTo(-h * 0.3, h * d); ctx.lineTo(h * 0.3, h * d); }); ctx.stroke(); }
  else if (type === "star") { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? h * 0.42 : h; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
// 둥근 배지 안의 아이콘
function badge(type, x, y, r, s, bgc = WH, fg = PK) {
  if (s <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = "rgba(0,0,0,0.3)"; ctx.shadowBlur = U * 2; circle(0, 0, r, bgc); ctx.shadowColor = "transparent";
  icon(type, 0, 0, r * 1.05, fg);
  ctx.restore();
}
function label(num, name, t, t0, dark = true, fade = 1) {
  const k = outExpo(prog(t, t0, t0 + 0.4)) * fade;
  const x = P ? U * 7 : U * 6, y = P ? U * 12 : U * 8;
  text(num, x - (1 - k) * U * 10, y, U * 7, { font: EN, stroke: dark ? WH : BK, lw: U * 0.25, align: "left", alpha: k });
  text(name, x + U * 11 - (1 - k) * U * 10, y + U * 0.5, U * 5, { font: SF, color: dark ? WH : BK, align: "left", alpha: k });
}

// 필름 그레인
const grain = document.createElement("canvas"); grain.width = grain.height = 256;
{ const g = grain.getContext("2d"), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 12; } g.putImageData(d, 0, 0); }
function drawGrain(f) { ctx.save(); ctx.fillStyle = ctx.createPattern(grain, "repeat"); ctx.translate(-(rand(f) * 256) | 0, -(rand(f + 9) * 256) | 0); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore(); }

/* =====================================================================
   장면
   ===================================================================== */
const scenes = [
  // ① 인트로 b0~6 : SHOW / REEL / 2026
  [0, bt(6), t => {
    bg(BK);
    // 가이드 라인
    ctx.strokeStyle = "#222"; ctx.lineWidth = 1;
    for (let i = 1; i < 6; i++) { const k = outExpo(prog(t, i * 0.05, 0.6 + i * 0.05)); ctx.beginPath(); ctx.moveTo(0, H * i / 6); ctx.lineTo(W * k, H * i / 6); ctx.stroke(); }
    const sweep = outExpo(prog(t, 0, 0.5));
    ctx.fillStyle = PK; ctx.fillRect(0, cy() - U * 0.3, W * sweep, U * 0.6);
    const zoom = 1 + inExpo(prog(t, bt(4.5), bt(6))) * 9;
    ctx.save(); ctx.translate(cx(), cy()); ctx.scale(zoom, zoom); ctx.translate(-cx(), -cy());
    const big = P ? fit("SHOW", EN, W * 0.8, U * 60) : fit("SHOWREEL", EN, W * 0.8, U * 40, 0.02);
    const slide = (t0) => (1 - outExpo(prog(t, t0, t0 + 0.35)));
    // 마스크 안에서 위로 솟는 글자
    const drawMasked = (s, x, y, size, color, t0, align) => {
      const w = measure(s, size, EN, 0.02);
      const left = align === "left" ? x : align === "right" ? x - w : x - w / 2;
      ctx.save(); ctx.beginPath(); ctx.rect(left - U, y - size * 0.62, w + U * 2, size * 1.2); ctx.clip();
      text(s, x, y + slide(t0) * size * 1.2, size, { font: EN, color, align, sp: 0.02 });
      ctx.restore();
    };
    if (P) {
      drawMasked("SHOW", cx(), cy() - big * 0.5, big, WH, bt(1), "center");
      drawMasked("REEL", cx(), cy() + big * 0.5, big, PK, bt(2), "center");
    } else {
      const ws = measure("SHOW", big, EN, 0.02);
      const total = measure("SHOWREEL", big, EN, 0.02);
      drawMasked("SHOW", cx() - total / 2, cy(), big, WH, bt(1), "left");
      drawMasked("REEL", cx() - total / 2 + ws, cy(), big, PK, bt(2), "left");
    }
    const yr = P ? cy() + big * 1.15 : cy() + big * 0.62;
    text("2026", P ? cx() : cx() + measure("SHOWREEL", big, EN, 0.02) / 2, yr, U * 9, { font: SF, color: WH, align: P ? "center" : "right", alpha: prog(t, bt(3), bt(3.4)) });
    text("BLESS CREATIVE  ·  조홍철", P ? cx() : cx() - measure("SHOWREEL", big, EN, 0.02) / 2, P ? cy() - big * 1.25 : cy() - big * 0.62, U * 3.4, { color: "#aaa", align: P ? "center" : "left", sp: 0.2, alpha: prog(t, bt(3.5), bt(3.9)) });
    ctx.restore();
    // 핑크 원으로 화면 전환
    circle(cx(), cy(), Math.hypot(W, H) * 0.55 * inOut(prog(t, bt(5), bt(6))), PK);
  }],

  // ② 01 모션 그래픽 b6~16 : 장면들이 포물선을 그리며 날아와 콜라주
  [bt(6), bt(16), t => {
    bg(PK);
    const lt = t - bt(6);
    // 배경 줄무늬
    for (let i = -10; i < 30; i++) { const x = ((i * U * 8 + lt * U * 12) % (W + U * 80)) - U * 40; ctx.fillStyle = "rgba(0,0,0,0.06)"; ctx.fillRect(x, 0, U * 3, H); }
    const fw = P ? W * 0.62 : W * 0.3, fh = fw * 9 / 16;
    const spots = P
      ? [[0.3, 0.3, -0.1], [0.72, 0.38, 0.08], [0.28, 0.62, 0.06], [0.72, 0.7, -0.07], [0.5, 0.82, 0.04], [0.5, 0.5, 0]]
      : [[0.2, 0.3, -0.09], [0.8, 0.28, 0.07], [0.2, 0.72, 0.06], [0.8, 0.74, -0.06], [0.5, 0.2, 0.03], [0.5, 0.52, 0]];
    const imgs = ["w2", "w4", "w5", "w7", "w3", "w9"];
    // 마지막 비트들: 가운데 프레임으로 카메라 줌인
    const zk = inOut(prog(lt, bt(7.5), bt(10)));
    const target = Math.max(W / fw, H / fh) * 1.02;
    const zs = lerp(1, target, inExpo(zk) * 0.15 + zk * 0.85);
    const fx = spots[5][0] * W, fy = spots[5][1] * H;
    ctx.save();
    ctx.translate(lerp(cx(), cx(), zk), cy()); ctx.scale(zs, zs); ctx.translate(-lerp(cx(), fx, zk), -lerp(cy(), fy, zk));
    spots.forEach(([nx, ny, r], i) => {
      const t0 = bt(i), k = outCubic(prog(lt, t0, t0 + B * 1.4));
      if (k <= 0) return;
      const dir = nx < 0.5 ? -1 : 1;
      const x0 = nx * W - dir * W * 0.45, y0 = H + fh;
      const x = lerp(x0, nx * W, k);
      const y = lerp(y0, ny * H, k) - Math.sin(k * Math.PI) * H * 0.35;   // 포물선
      const rot = lerp(dir * 1.2, r, k) * (i === 5 ? 1 - zk : 1);
      const beat = 1 + 0.025 * pulse(lt) * (1 - zk);
      frame(imgs[i], x, y, fw, fh, { rot, s: beat, border: i === 5 ? WH : null });
    });
    ctx.restore();
    label("01", "Motion Graphics", lt, 0.05, false, 1 - zk);
    text("KINETIC TYPOGRAPHY · BEAT SYNC · 16:9 / 9:16", P ? cx() : W - U * 6, H - U * 6, U * 2.6, { font: EN, color: BK, align: P ? "center" : "right", sp: 0.15, alpha: prog(lt, bt(2), bt(3)) * (1 - zk) });
  }],

  // ③ 02 AEO 콘텐츠 b16~26 : 블로그 카드 벽 + 11 카운터
  [bt(16), bt(26), t => {
    bg(WH);
    const lt = t - bt(16);
    const cols = P ? 3 : 5, cw = P ? W * 0.42 : W * 0.24, chh = cw * 0.62 + U * 3;
    ctx.save(); ctx.translate(cx(), cy()); ctx.rotate(-0.14); ctx.translate(-cx(), -cy());
    const intro = outExpo(prog(lt, 0, 0.6));
    for (let c = 0; c < cols; c++) {
      const x = cx() + (c - (cols - 1) / 2) * (cw + U * 3);
      const speed = (c % 2 ? 1 : -1) * U * 14;
      for (let r = -4; r < 5; r++) {
        const total = chh * 9;
        let y = cy() + r * chh + ((lt * speed) % total);
        y = ((y + total * 10 - cy() + total / 2) % total) + cy() - total / 2;
        y += (1 - intro) * (c % 2 ? -1 : 1) * H;
        blogCard((c * 3 + r + 40) % 11, x, y, cw);
      }
    }
    ctx.restore();
    // 가운데 카운터 패널
    const k = outBack(prog(lt, bt(2), bt(3)));
    const pw = P ? W * 0.78 : W * 0.4, ph = P ? H * 0.3 : H * 0.5;
    if (k > 0) {
      ctx.save(); ctx.translate(cx(), cy()); ctx.scale(k, k);
      ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = U * 4; rrect(0, 0, pw, ph, U * 2, BK); ctx.shadowColor = "transparent";
      const n = Math.round(11 * outExpo(prog(lt, bt(2.5), bt(5))));
      const big = ph * 0.55, p2 = 1 + 0.05 * pulse(lt);
      text(String(n), -pw * 0.08, -ph * 0.08, big, { font: EN, color: PK, sx: p2, sy: p2 });
      text("ARTICLES", pw * 0.18, -ph * 0.18, ph * 0.12, { font: EN, color: WH, align: "left", sp: 0.05 });
      text("written", pw * 0.18, -ph * 0.02, ph * 0.12, { font: SF, color: WH, align: "left" });
      text("리크루팅 블로그 시리즈 · 검색 최적화(AEO)", 0, ph * 0.33, ph * 0.065, { color: "#bbb", sp: 0.05 });
      ctx.restore();
    }
    label("02", "AEO Content", lt, 0.05, false);
  }],

  // ④ 03 AI 네이티브 b26~36 : 폰 목업 + 아이콘 궤도 + 단어 교체 (b32~ 빌드업)
  [bt(26), bt(36), t => {
    const lt = t - bt(26);
    const strobe = lt > bt(8) && Math.floor(lt / (B / 2)) % 2 === 1;
    bg(strobe ? BK : BL);
    const shake = prog(lt, bt(6), bt(10)) * U * 0.7;
    const sx = (rand(Math.floor(t * 30)) - 0.5) * shake, sy = (rand(Math.floor(t * 30) + 3) - 0.5) * shake;
    // 동심원
    for (let i = 1; i < 7; i++) circle(cx(), cy(), U * i * 11 * (1 + 0.04 * pulse(lt)), null, "rgba(255,255,255,0.12)", U * 0.2);
    // 폰
    const phw = P ? W * 0.42 : H * 0.36, phh = phw * 16 / 9 * 1.0;
    const kp = outBack(prog(lt, 0, 0.4));
    const shot = "t" + (1 + (Math.floor(lt / (B * 2)) * 2 + 3) % 10);
    ctx.save(); ctx.translate(cx() + sx, cy() + sy); ctx.rotate(Math.sin(lt * 1.5) * 0.04); ctx.scale(kp, kp);
    rrect(0, 0, phw + U * 2.2, phh + U * 2.2, U * 4.5, BK);
    frame(shot, 0, 0, phw, phh, { r: U * 3.5 });
    rrect(0, -phh / 2 + U * 2.2, phw * 0.3, U * 2, U, BK);
    ctx.restore();
    // 아이콘 궤도: 비트마다 하나씩 팝
    const types = ["chat", "pen", "play", "chart", "camera", "doc"];
    const R = P ? W * 0.4 : H * 0.42;
    types.forEach((ty, i) => {
      const a = i * Math.PI / 3 - Math.PI / 2 + lt * (0.5 + prog(lt, bt(6), bt(10)) * 2.5);
      const s = outBack(prog(lt, bt(i), bt(i) + 0.3)) * (1 + 0.12 * pulse(lt - bt(i)));
      badge(ty, cx() + Math.cos(a) * R * (P ? 1 : 1.0) + sx, cy() + Math.sin(a) * R * (P ? 1.05 : 1) + sy, U * (P ? 6.5 : 5), s, WH, i % 2 ? BL : PK);
    });
    // 단어 교체
    const words = ["WRITE", "DESIGN", "MOTION", "AUTOMATE", "CREATE"];
    const wi = Math.min(4, Math.floor(lt / (B * 2)));
    const kw = outBack(prog(lt - wi * B * 2, 0, 0.18));
    const wsz = P ? fit(words[wi], EN, W * 0.8, U * 20, 0.04) : fit("AUTOMATE", EN, W * 0.2, U * 22, 0.04);
    const wx = P ? cx() : U * 6, wy = P ? H * 0.88 : cy() + U * 4;
    text("AI-powered", wx, wy - wsz * 0.78, U * 6, { font: SF, color: WH, align: P ? "center" : "left" });
    text(words[wi], wx, wy + wsz * 0.04, wsz, { font: EN, color: WH, align: P ? "center" : "left", sp: 0.04, sx: lerp(1.3, 1, kw), sy: lerp(1.3, 1, kw) });
    label("03", "AI Native Workflow", lt, 0.05);
    if (!P) text("Claude × BLESS", W - U * 6, H - U * 6, U * 4, { font: SF, color: WH, align: "right" });
  }],

  // ⑤ 드롭 몽타주 b36~42 : 반 비트마다 컷
  [bt(36), bt(42), t => {
    const lt = t - bt(36);
    const cut = Math.floor(lt / (B / 2));
    const cl = lt - cut * B / 2;
    const z = 1.08 - 0.08 * outExpo(cl / (B / 2));
    const kind = cut % 3;
    ctx.save(); ctx.translate(cx(), cy()); ctx.scale(z, z); ctx.translate(-cx(), -cy());
    if (kind === 2) {
      bg(cut % 2 ? PK : BK);
      const ty = ["spark", "play", "star", "chat"][cut % 4];
      icon(ty, cx(), cy(), U * 40, cut % 2 ? BK : PK);
    } else if (kind === 1) {
      bg("#eee");
      blogCard(cut % 11, cx(), cy(), P ? W * 0.85 : W * 0.55, (rand(cut) - 0.5) * 0.15);
    } else {
      const im = (P ? "t" : "w") + (1 + (cut * 3) % 10);
      frame(im, cx(), cy(), W, H, { r: 0 });
    }
    ctx.restore();
    // 오버레이 텍스트 (외곽선, 좌우로 흐름)
    const word = ["CREATE", "DESIGN", "MOVE", "GROW"][Math.floor(lt / (B * 1.5)) % 4];
    const s = fit(word, EN, W * 1.1, H * 0.5);
    text(word, cx() + (lt % (B * 1.5) / (B * 1.5) - 0.5) * U * 20, cy() + s * 0.04, s, { font: EN, stroke: kind === 1 ? PK : WH, lw: U * 0.6 });
    // 레터박스 + 타임코드
    ctx.fillStyle = BK; const lb = U * 5; ctx.fillRect(0, 0, W, lb); ctx.fillRect(0, H - lb, W, lb);
    const tc = `00:00:${String(Math.floor(t)).padStart(2, "0")}:${String(Math.floor((t % 1) * 30)).padStart(2, "0")}`;
    text("● REC  " + tc, U * 4, lb / 2, U * 2.4, { font: EN, color: PK, align: "left", sp: 0.1 });
    text("BLESS CREATIVE", W - U * 4, H - lb / 2, U * 2.4, { font: EN, color: WH, align: "right", sp: 0.2 });
  }],

  // ⑥ 엔딩 b42~48 : 비트마다 요소가 팡! 팡!
  [bt(42), DUR + 0.01, t => {
    const lt = t - bt(42);
    bg(BK);
    const fin = pulse(t - bt(47), 0.15) * (t >= bt(47) ? 1 : 0);
    // 최종 비트 링
    if (t >= bt(47)) { const k = outExpo(prog(t, bt(47), bt(47) + 0.8)); circle(cx(), cy(), Math.hypot(W, H) * 0.5 * k, null, PK, U * 2 * (1 - k)); }
    const s1 = fit("LET'S CREATE", EN, W * 0.84, P ? U * 22 : U * 26, 0.02);
    const k1 = outBack(prog(lt, 0, 0.25));
    const y1 = cy() - (P ? H * 0.06 : H * 0.1);
    text("LET'S CREATE", cx(), y1, s1, { font: EN, color: WH, sp: 0.02, sx: k1 * (1 + 0.04 * fin), sy: k1 * (1 + 0.04 * fin) });
    const k2 = outBack(prog(lt, bt(1), bt(1) + 0.25));
    text("together", cx() + s1 * (P ? 0.2 : 0.9), y1 + s1 * 0.55, s1 * 0.55, { font: SF, color: PK, sx: k2, sy: k2, rot: -0.08 });
    // 비트마다 튀어나오는 요소들
    const pops = P
      ? [["star", 0.2, 0.14, PK], ["circle", 0.8, 0.12, BL], ["play", 0.84, 0.29, WH], ["spark", 0.16, 0.3, WH], ["chat", 0.2, 0.84, PK], ["camera", 0.8, 0.84, WH]]
      : [["star", 0.12, 0.2, PK], ["circle", 0.88, 0.18, BL], ["play", 0.9, 0.62, WH], ["spark", 0.08, 0.62, WH], ["chat", 0.24, 0.86, PK], ["camera", 0.76, 0.86, WH]];
    pops.forEach(([ty, nx, ny, c], i) => {
      const t0 = bt(i * 0.8 + 0.5);
      const s = outBack(prog(lt, t0, t0 + 0.28)) * (1 + 0.15 * fin);
      if (s <= 0) return;
      const r = U * (P ? 6 : 5.5);
      const x = nx * W, y = ny * H + Math.sin(t * 3 + i) * U * 0.8;
      if (ty === "circle") circle(x, y, r * 0.9 * s, c);
      else if (ty === "star" || ty === "spark") { ctx.save(); ctx.translate(x, y); ctx.rotate(t * (i % 2 ? 1 : -1)); icon(ty, 0, 0, r * 2.2 * s, c); ctx.restore(); }
      else badge(ty, x, y, r, s, c, c === WH ? PK : WH);
    });
    // 인스타 알약
    const ki = prog(lt, bt(2), bt(2) + 0.3);
    if (ki > 0) {
      const fs = U * (P ? 5 : 4.4), tw = measure(INSTA, fs, EN, 0.04), ic = fs * 1.1, padX = fs * 0.8, gap = fs * 0.5;
      const pw = padX * 2 + ic + gap + tw, ph = fs * 2;
      const py = y1 + s1 * (P ? 1.35 : 1.2) + (1 - outBack(ki)) * U * 6;
      ctx.save(); ctx.globalAlpha = clamp(ki * 2);
      rrect(cx(), py, pw, ph, ph / 2, PK);
      const ix = cx() - pw / 2 + padX + ic / 2;
      icon("camera", ix, py, ic * 1.15, WH, ic * 0.11);
      ctx.restore();
      text(INSTA, ix + ic / 2 + gap, py + fs * 0.04, fs, { font: EN, color: WH, align: "left", sp: 0.04, alpha: clamp(ki * 2) });
    }
    text("BLESS CREATIVE  ·  조홍철 본부장  ·  인카금융서비스", cx(), H - U * (P ? 7 : 5), U * (P ? 3.2 : 2.8), { color: "#999", sp: 0.12, alpha: prog(lt, bt(3), bt(3.5)) });
    ctx.fillStyle = `rgba(0,0,0,${prog(t, DUR - 0.25, DUR)})`; ctx.fillRect(0, 0, W, H);
  }],
];

function renderFrame(t) {
  t = clamp(t, 0, DUR - 1e-4);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const sc = scenes.find(s => t >= s[0] && t < s[1]) || scenes[scenes.length - 1];
  const z = 1 + 0.01 * pulse(t, 0.08);
  ctx.save(); ctx.translate(cx(), cy()); ctx.scale(z, z); ctx.translate(-cx(), -cy());
  sc[2](t);
  ctx.restore();
  const since = t - sc[0];
  if (sc[0] > 0 && since < 0.07) { ctx.fillStyle = `rgba(255,255,255,${0.45 * (1 - since / 0.07)})`; ctx.fillRect(0, 0, W, H); }
  drawGrain(Math.floor(t * 30));
}
window.renderFrame = renderFrame;
window.ready = Promise.all([imgsReady, document.fonts.load(`10px ${KR}`), document.fonts.load(`10px ${EN}`), document.fonts.load(`10px ${SF}`)]).then(() => document.fonts.ready);

/* ---------- 미리보기 플레이어 ---------- */
const audio = document.getElementById("music");
let playing = false, t0 = 0;
function loop() {
  if (!playing) return;
  const t = audio.currentTime || (performance.now() - t0) / 1000;
  renderFrame(t);
  if (t >= DUR) { playing = false; document.getElementById("play").textContent = "▶ 재생"; return; }
  requestAnimationFrame(loop);
}
document.getElementById("play").onclick = () => {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "■ 정지" : "▶ 재생";
  if (playing) { audio.currentTime = 0; t0 = performance.now(); audio.play().catch(() => {}); loop(); } else audio.pause();
};
document.querySelectorAll("[data-ar]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-ar]").forEach(x => x.classList.toggle("on", x === b));
  setSize(b.dataset.ar); renderFrame(audio.currentTime || 0);
});
window.ready.then(() => renderFrame(params.has("t") ? +params.get("t") : 1.6));
</script>
</body>
