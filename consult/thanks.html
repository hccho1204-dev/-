<style>
:root{
  --bg:#fbfaf7; --bg-soft:#f3f0ea; --bg-card:#ffffff; --line:#e4ded3;
  --text:#161a22; --text-soft:#565d6a; --text-mute:#8a8f99;
  --ink:#0e1624; --ink-2:#18233a; --on-ink:#f3efe6; --on-ink-soft:#b9bfcc;
  --gold:#a88a55; --gold-2:#c9ad7a; --gold-soft:#f1e9da;
  --warn-bg:#faf6ee; --warn-line:#e6d8bb;
  --radius:4px; --radius-lg:10px;
  --shadow:0 1px 2px rgba(14,22,36,.04), 0 18px 40px -18px rgba(14,22,36,.18);
  --maxw:1120px;
  --serif:'Nanum Myeongjo','AppleMyungjo','Noto Serif KR','Batang',serif;
  --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1019; --bg-soft:#101724; --bg-card:#131b2a; --line:#253046;
    --text:#ece8df; --text-soft:#aeb4c1; --text-mute:#7f8797;
    --ink:#070b12; --ink-2:#0e1624; --gold:#cdb07c; --gold-2:#dcc393; --gold-soft:#231f17;
    --warn-bg:#16161a; --warn-line:#3a3326;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -18px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1019; --bg-soft:#101724; --bg-card:#131b2a; --line:#253046;
  --text:#ece8df; --text-soft:#aeb4c1; --text-mute:#7f8797;
  --ink:#070b12; --ink-2:#0e1624; --gold:#cdb07c; --gold-2:#dcc393; --gold-soft:#231f17;
  --warn-bg:#16161a; --warn-line:#3a3326;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:76px}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:16px; line-height:1.75; letter-spacing:-.01em; word-break:keep-all;
  -webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 22px}
section{padding:clamp(64px,9vw,120px) 0}
.alt{background:var(--bg-soft)}
.serif{font-family:var(--serif)}
h1,h2,h3{font-family:var(--serif); font-weight:800; letter-spacing:-.02em; margin:0}
h1{font-size:clamp(32px,6vw,58px); line-height:1.28}
h2{font-size:clamp(26px,4vw,38px); line-height:1.35}
h3{font-size:clamp(18px,2.2vw,21px); line-height:1.45}
p{margin:0}
.eyebrow{display:inline-flex; align-items:center; gap:12px; font-size:12.5px; font-weight:600;
  letter-spacing:.28em; text-transform:uppercase; color:var(--gold)}
.eyebrow::before{content:""; width:28px; height:1px; background:currentColor}
.lead{font-size:clamp(15.5px,1.9vw,18px); color:var(--text-soft)}
.caption{font-size:13px; color:var(--text-mute)}
.head{max-width:640px; margin-bottom:clamp(36px,5vw,56px)}
.head h2{margin:16px 0 14px}
.grid{display:grid; gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}

/* 버튼 */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px;
  padding:0 28px; border-radius:var(--radius); font:600 15.5px/1 var(--sans); letter-spacing:.02em;
  text-decoration:none; border:1px solid transparent; cursor:pointer;
  transition:background .2s, color .2s, border-color .2s, transform .12s}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold); color:#fff}
.btn-gold:hover{background:var(--gold-2)}
.btn-line{background:transparent; color:var(--on-ink); border-color:rgba(243,239,230,.35)}
.btn-line:hover{border-color:var(--gold-2); color:var(--gold-2)}
.btn-lg{width:100%; min-height:58px; font-size:17px}

/* 헤더 */
.top{position:sticky; top:0; z-index:20; background:rgba(14,22,36,.92);
  backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid rgba(201,173,122,.18); padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex; align-items:center; justify-content:space-between; height:64px; gap:12px}
.logo{display:flex; align-items:baseline; gap:10px; color:var(--on-ink); text-decoration:none}
.logo b{font-family:var(--serif); font-size:21px; letter-spacing:.24em; color:var(--gold-2)}
.logo span{font-size:11px; letter-spacing:.22em; color:var(--on-ink-soft)}
.top nav{display:flex; align-items:center; gap:6px}
.top nav a.nl{color:var(--on-ink-soft); text-decoration:none; font-size:14px; padding:10px 12px}
.top nav a.nl:hover{color:var(--gold-2)}
.top .btn{min-height:40px; padding:0 16px; font-size:14px}
.icon-btn{width:44px; height:44px; border-radius:50%; border:1px solid rgba(243,239,230,.2);
  background:transparent; color:var(--on-ink-soft); cursor:pointer; font-size:16px}
@media (max-width:760px){ .top nav a.nl{display:none} .logo span{display:none} }

/* 히어로 */
.hero{position:relative; overflow:hidden; background:var(--ink); color:var(--on-ink);
  padding:clamp(80px,12vw,150px) 0 clamp(70px,10vw,120px)}
.hero::before{content:""; position:absolute; inset:0;
  background:
    radial-gradient(60% 70% at 85% 10%, rgba(201,173,122,.18), transparent 60%),
    radial-gradient(50% 60% at 0% 100%, rgba(40,62,104,.55), transparent 70%);
  pointer-events:none}
.hero::after{content:""; position:absolute; right:-120px; top:50%; width:520px; height:520px;
  transform:translateY(-50%); border:1px solid rgba(201,173,122,.16); border-radius:50%;
  box-shadow:0 0 0 60px rgba(201,173,122,.035), 0 0 0 130px rgba(201,173,122,.025); pointer-events:none}
.hero .wrap{position:relative; z-index:1}
.hero h1{margin:26px 0 24px; color:#fff}
.hero h1 em{font-style:normal; color:var(--gold-2)}
.hero .lead{color:var(--on-ink-soft); max-width:560px}
.hero .cta{display:flex; flex-wrap:wrap; gap:12px; margin-top:40px}
.promise{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));
  margin-top:clamp(56px,8vw,88px); border-top:1px solid rgba(201,173,122,.22)}
.promise div{padding:24px 22px 0 0}
.promise b{display:block; font-family:var(--serif); font-size:17px; color:var(--gold-2); margin-bottom:6px}
.promise span{font-size:14px; color:var(--on-ink-soft)}

/* 상담 분야 카드 */
.card{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:34px 28px 30px; box-shadow:var(--shadow); position:relative; transition:transform .25s, border-color .25s}
.card:hover{transform:translateY(-3px); border-color:var(--gold)}
.card .no{font-family:var(--serif); font-size:13px; letter-spacing:.2em; color:var(--gold)}
.card h3{margin:18px 0 10px}
.card p{color:var(--text-soft); font-size:15px}
.card ul{margin:18px 0 0; padding:18px 0 0; border-top:1px solid var(--line); list-style:none;
  font-size:14px; color:var(--text-soft)}
.card li{padding-left:16px; position:relative; margin-bottom:4px}
.card li::before{content:""; position:absolute; left:0; top:.8em; width:6px; height:1px; background:var(--gold)}

/* 원칙 */
.split{display:grid; gap:clamp(36px,6vw,80px); grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); align-items:start}
.quote{font-family:var(--serif); font-size:clamp(22px,3vw,30px); line-height:1.55; margin-top:22px}
.quote em{font-style:normal; color:var(--gold)}
.principles{display:grid; gap:0}
.pr{display:grid; grid-template-columns:56px 1fr; gap:6px 14px; padding:26px 0; border-bottom:1px solid var(--line)}
.pr:first-child{border-top:1px solid var(--line)}
.pr .n{font-family:var(--serif); font-size:26px; color:var(--gold); line-height:1.2}
.pr h3{font-size:18px}
.pr p{grid-column:2; color:var(--text-soft); font-size:15px}

/* 절차 */
.steps{display:grid; gap:0; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));
  border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--bg-card); overflow:hidden}
.step{padding:32px 26px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); margin:-1px -1px 0 0}
.step .n{font-family:var(--serif); font-size:13px; letter-spacing:.2em; color:var(--gold)}
.step h3{font-size:18px; margin:12px 0 8px}
.step p{font-size:14.5px; color:var(--text-soft)}

/* 상담사 */
.advisor{background:var(--ink); color:var(--on-ink); border-radius:var(--radius-lg); overflow:hidden;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.advisor .pic{min-height:320px; background:
  linear-gradient(160deg, #1d2a44 0%, #0e1624 70%); position:relative; display:grid; place-items:center}
.advisor .pic .mono{font-family:var(--serif); font-size:88px; color:var(--gold-2); opacity:.9; line-height:1}
.advisor .pic .ring{position:absolute; width:220px; height:220px; border:1px solid rgba(201,173,122,.3); border-radius:50%}
.advisor .body{padding:clamp(32px,5vw,56px)}
.advisor h3{font-size:clamp(24px,3vw,30px); color:#fff; margin:14px 0 4px}
.advisor .role{color:var(--gold-2); font-size:14px; letter-spacing:.06em}
.advisor p.desc{color:var(--on-ink-soft); margin-top:20px; font-size:15.5px}
.advisor dl{display:grid; grid-template-columns:auto 1fr; gap:10px 18px; margin:26px 0 0; font-size:14.5px}
.advisor dt{color:var(--gold-2)} .advisor dd{margin:0; color:var(--on-ink)}

/* 폼 */
.form-box{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:clamp(26px,4vw,44px); box-shadow:var(--shadow)}
.row{display:grid; gap:0 16px; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.field{margin-bottom:18px}
.field label,.field .lbl{display:block; font-weight:600; font-size:14px; margin-bottom:8px}
.req{color:#b5462f}
input,select,textarea{width:100%; padding:14px 15px; font-size:16px; font-family:inherit;
  border:1px solid var(--line); border-radius:var(--radius); background:var(--bg); color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold); outline-offset:0; border-color:transparent}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips label{margin:0; font-weight:500; font-size:14.5px; cursor:pointer}
.chips input{position:absolute; opacity:0; width:1px; height:1px}
.chips span{display:inline-flex; align-items:center; min-height:44px; padding:0 16px;
  border:1px solid var(--line); border-radius:999px; background:var(--bg); transition:.15s}
.chips input:checked + span{border-color:var(--gold); background:var(--gold-soft); color:var(--text)}
.chips input:focus-visible + span{outline:2px solid var(--gold)}
.agree{display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--text-soft); margin-top:4px}
.agree input{width:20px; height:20px; margin-top:2px; flex:0 0 auto; accent-color:var(--gold)}
.hp{position:absolute; left:-9999px; opacity:0; height:0; overflow:hidden}
.side h2{margin:16px 0 16px}
.side .contact{margin-top:32px; display:grid; gap:12px}
.side .contact a{display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:60px;
  padding:0 20px; border:1px solid var(--line); border-radius:var(--radius); text-decoration:none; background:var(--bg-card)}
.side .contact a:hover{border-color:var(--gold)}
.side .contact small{color:var(--text-mute); font-size:12.5px; letter-spacing:.1em}
.side .contact b{font-family:var(--serif); font-size:17px}

/* FAQ */
.faq{border-bottom:1px solid var(--line); padding:22px 0}
.faq:first-of-type{border-top:1px solid var(--line)}
.faq summary{font-family:var(--serif); font-weight:700; font-size:17.5px; cursor:pointer; list-style:none;
  display:flex; justify-content:space-between; gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; color:var(--gold); font-family:var(--sans); font-weight:300; font-size:24px; line-height:1}
.faq[open] summary::after{content:"−"}
.faq p{margin-top:12px; color:var(--text-soft); font-size:15px}

.notice{background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:var(--radius-lg);
  padding:22px 24px; font-size:14px; color:var(--text-soft)}
.notice strong{color:var(--text)}
.notice ul{margin:10px 0 0; padding-left:18px}

/* 푸터 */
footer{background:var(--ink); color:var(--on-ink-soft); padding:64px 0 40px; font-size:14px}
footer .brand{font-family:var(--serif); color:var(--gold-2); font-size:22px; letter-spacing:.24em}
footer .cols{display:grid; gap:24px; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); margin-top:22px}
footer a{color:var(--on-ink); text-decoration:none}
footer .legal{margin-top:40px; padding-top:24px; border-top:1px solid rgba(201,173,122,.18);
  font-size:12.5px; line-height:1.8; color:#8e95a4}

/* 모바일 하단 고정 CTA */
.sticky{display:none}
@media (max-width:760px){
  body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .sticky{display:grid; grid-template-columns:1fr 1.6fr; gap:8px; position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); background:rgba(14,22,36,.96);
    border-top:1px solid rgba(201,173,122,.25)}
  .sticky .btn{min-height:52px}
}

/* 등장 애니메이션 */
.reveal{opacity:0; transform:translateY(18px); transition:opacity .8s ease, transform .8s ease}
.reveal.on{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){ .reveal{opacity:1; transform:none; transition:none} html{scroll-behavior:auto} }
</style>
</head>
