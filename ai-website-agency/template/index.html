<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가게 홈페이지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
/* =====================================================================
   ✏️ 여기만 바꾸세요 — 가게 정보 (따옴표 안의 글자만 수정)
   ===================================================================== */
const SITE = {
  preview: true,                     // 계약 전 미리보기면 true (검색 차단 + 안내 띠 표시), 정식 오픈 시 false
  name: "온기 베이커리",
  category: "동네 빵집 · 카페",
  tagline: "매일 새벽 4시, 버터 향으로 문을 엽니다",
  intro: "15년 경력 제빵사가 국산 밀과 프랑스산 버터로 매일 아침 직접 굽습니다. 갓 나온 소금빵을 드시러 멀리서도 찾아오시는 동네 빵집입니다.",
  color: "#c8743a",                  // 메인 색상 (hex 코드)
  phone: "02-123-4567",
  address: "서울시 마포구 연남로 00, 1층",
  hours: [
    ["화–금", "08:00 – 20:00"],
    ["토–일", "09:00 – 19:00"],
    ["월요일", "정기 휴무"]
  ],
  menu: [
    { name: "시그니처 소금빵", price: "3,500원", desc: "겉은 바삭, 속은 버터가 촉촉하게" },
    { name: "크루아상", price: "4,200원", desc: "72시간 저온 숙성 반죽" },
    { name: "무화과 캄파뉴", price: "7,500원", desc: "통밀과 건무화과를 듬뿍" },
    { name: "바닐라 까눌레", price: "3,800원", desc: "마다가스카르 바닐라빈" },
    { name: "아인슈페너", price: "5,500원", desc: "직접 만든 크림을 올린 커피" },
    { name: "단체 주문 박스", price: "문의", desc: "회사·모임용 10인 이상" }
  ],
  reviews: [
    { text: "소금빵 먹으러 일부러 버스 타고 와요. 오픈런 할 가치 있어요.", who: "방문자 리뷰" },
    { text: "사장님이 너무 친절하시고 빵이 매일 따끈해요.", who: "방문자 리뷰" },
    { text: "회사 간식으로 단체 주문했는데 포장까지 완벽했어요.", who: "블로그 리뷰" }
  ],
  links: {
    reserve: "",                     // 네이버 예약 주소 (없으면 비워두기 → 전화로 연결)
    instagram: "https://instagram.com/",
    kakao: "",                       // 카카오톡 채널 주소
    naverMap: "https://map.naver.com/p/search/",   // 끝에 자동으로 가게 이름이 붙습니다
    kakaoMap: "https://map.kakao.com/?q="
  }
};
/* ===================================================================== */
if (SITE.preview) document.write('<meta name="robots" content="noindex, nofollow">');
</script>
<style>
:root{
  --brand:#c8743a; --bg:#fbf8f4; --surface:#ffffff; --ink:#1d1a17; --muted:#6b635b; --line:#e9e2d9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141210; --surface:#1e1b18; --ink:#f3eee8; --muted:#a79e94; --line:#2f2a25; }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:76px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* 미리보기 안내 띠 */
.preview-bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#111;color:#fff;font-size:12px;text-align:center;padding:6px 12px;opacity:.9}

/* ---------- HERO (3D) ---------- */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;perspective:1000px;
  background:radial-gradient(120% 90% at 50% 10%, color-mix(in srgb,var(--brand) 28%,var(--bg)) 0%, var(--bg) 70%)}
#stars{position:absolute;inset:0;width:100%;height:100%}
.scene{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .2s ease-out}
.shape{position:absolute;border-radius:28%;transform-style:preserve-3d;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 85%,#fff),var(--brand));
  box-shadow:0 30px 60px -20px color-mix(in srgb,var(--brand) 60%,transparent), inset 0 2px 8px rgba(255,255,255,.5);
  animation:float 9s ease-in-out infinite}
.shape.ring{background:none;border:14px solid color-mix(in srgb,var(--brand) 70%,#fff);border-radius:50%;box-shadow:0 20px 40px -10px color-mix(in srgb,var(--brand) 50%,transparent)}
.shape.glass{background:color-mix(in srgb,var(--surface) 35%,transparent);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,#fff 50%,transparent)}
.s1{width:170px;height:170px;left:8%;top:18%;--z:120px;--r:18deg}
.s2{width:110px;height:110px;right:10%;top:22%;--z:220px;--r:-24deg;animation-delay:-3s}
.s3{width:220px;height:220px;right:14%;bottom:10%;--z:40px;--r:10deg;animation-delay:-5s}
.s4{width:90px;height:90px;left:16%;bottom:16%;--z:260px;--r:-12deg;animation-delay:-1.5s}
.s5{width:140px;height:140px;left:44%;top:8%;--z:-80px;--r:30deg;animation-delay:-7s}
@keyframes float{
  0%,100%{transform:translateZ(var(--z)) rotateX(var(--r)) rotateY(var(--r)) translateY(0)}
  50%{transform:translateZ(var(--z)) rotateX(calc(var(--r)*-1)) rotateY(calc(var(--r) + 25deg)) translateY(-24px)}
}
.hero-copy{position:relative;z-index:2;text-align:center;padding:0 20px;transform:translateZ(0)}
.eyebrow{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--brand);
  background:color-mix(in srgb,var(--brand) 12%,var(--surface));padding:6px 14px;border-radius:999px;margin-bottom:18px}
.hero h1{font-size:clamp(44px,10vw,104px);font-weight:800;letter-spacing:-.04em;line-height:1.02;
  text-shadow:0 18px 40px color-mix(in srgb,var(--brand) 25%,transparent)}
.hero p.tag{font-size:clamp(17px,2.6vw,22px);color:var(--muted);margin:18px auto 32px;max-width:32ch}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 26px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .2s, box-shadow .2s}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 12px 28px -8px color-mix(in srgb,var(--brand) 70%,transparent)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn:hover{transform:translateY(-2px)}
.scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);z-index:2;animation:bob 2s infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}

/* ---------- SECTIONS ---------- */
section.block{padding:96px 0}
.label{font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.1em;margin-bottom:10px}
h2{font-size:clamp(28px,4.5vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-bottom:18px}
.lead{font-size:18px;color:var(--muted);max-width:60ch}
.reveal{opacity:0;transform:translateY(40px) rotateX(8deg);transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

.about{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.photo{aspect-ratio:4/5;border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 30%,var(--surface)),var(--surface));
  display:grid;place-items:center;color:var(--muted);font-size:14px;border:1px solid var(--line);transform-style:preserve-3d;transition:transform .3s}

.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px;perspective:900px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;transform-style:preserve-3d;transition:transform .25s, box-shadow .25s}
.card:hover{box-shadow:0 24px 50px -24px color-mix(in srgb,var(--brand) 60%,transparent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{font-size:18px;font-weight:700}
.card .price{font-weight:800;color:var(--brand);white-space:nowrap}
.card p{color:var(--muted);font-size:15px;margin-top:8px}

.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
.review{background:color-mix(in srgb,var(--brand) 7%,var(--surface));border-radius:20px;padding:28px;position:relative}
.review::before{content:"“";position:absolute;top:6px;left:18px;font-size:64px;color:var(--brand);opacity:.35;line-height:1}
.review p{font-size:17px;font-weight:500;margin-top:18px}
.review span{display:block;margin-top:14px;font-size:13px;color:var(--muted)}
.stars{color:var(--brand);letter-spacing:2px}

.visit{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.hours li{list-style:none;display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.hours li:last-child{border:0}
.map-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

.cta{text-align:center;border-radius:28px;padding:64px 24px;color:#fff;
  background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 60%,#000))}
.cta h2{color:#fff}
.cta .btn.ghost{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}

footer{padding:40px 0 30px;color:var(--muted);font-size:13px;text-align:center}

/* 하단 고정 버튼 (모바일) */
.dock{position:fixed;left:12px;right:12px;bottom:12px;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:8px;
  box-shadow:0 16px 40px -16px rgba(0,0,0,.35)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:600}
.dock a:first-child{background:var(--brand);color:#fff}
.dock svg{width:20px;height:20px}
@media(min-width:900px){.dock{left:auto;right:24px;bottom:24px;width:320px}}

@media(max-width:820px){
  .about,.visit{grid-template-columns:1fr}
  .menu-grid,.reviews{grid-template-columns:1fr}
  .photo{aspect-ratio:16/10}
  section.block{padding:72px 0}
  .s3{width:150px;height:150px}.s1{width:110px;height:110px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="preview-bar" id="previewBar" hidden>제안용 미리보기입니다 — 가게 공식 사이트가 아닙니다</div>

<header class="hero" id="hero">
  <canvas id="stars"></canvas>
  <div class="scene" id="scene">
    <div class="shape s1"></div>
    <div class="shape ring s2"></div>
    <div class="shape glass s3"></div>
    <div class="shape s4"></div>
    <div class="shape ring s5"></div>
  </div>
  <div class="hero-copy">
    <span class="eyebrow" data-f="category"></span>
    <h1 data-f="name"></h1>
    <p class="tag" data-f="tagline"></p>
    <div class="btns">
      <a class="btn primary" data-href="tel">📞 전화하기</a>
      <a class="btn ghost" data-href="reserve">예약·문의하기</a>
    </div>
  </div>
  <div class="scroll-cue">아래로 스크롤 ↓</div>
</header>

<main>
  <section class="block">
    <div class="wrap about">
      <div class="reveal">
        <div class="label">ABOUT</div>
        <h2>우리 가게 이야기</h2>
        <p class="lead" data-f="intro"></p>
      </div>
      <div class="photo reveal tilt">매장 사진</div>
    </div>
  </section>

  <section class="block" style="padding-top:0">
    <div class="wrap">
      <div class="reveal">
        <div class="label">MENU</div>
        <h2>대표 메뉴</h2>
      </div>
      <div class="menu-grid" id="menu"></div>
    </div>
  </section>

  <section class="block" style="padding-top:0">
    <div class="wrap">
      <div class="reveal">
        <div class="label">REVIEWS</div>
        <h2>손님들이 남긴 이야기</h2>
      </div>
      <div class="reviews" id="reviews"></div>
    </div>
  </section>

  <section class="block" style="padding-top:0">
    <div class="wrap">
      <div class="reveal">
        <div class="label">VISIT</div>
        <h2>영업시간 · 오시는 길</h2>
      </div>
      <div class="visit">
        <div class="panel reveal"><ul class="hours" id="hours"></ul></div>
        <div class="panel reveal">
          <p style="font-weight:700;font-size:18px" data-f="address"></p>
          <p style="color:var(--muted);margin-top:6px">전화 <a data-href="tel" data-f="phone" style="color:var(--brand);font-weight:700"></a></p>
          <div class="map-btns">
            <a class="btn ghost" data-href="naverMap" target="_blank" rel="noopener">네이버 지도</a>
            <a class="btn ghost" data-href="kakaoMap" target="_blank" rel="noopener">카카오맵</a>
            <a class="btn ghost" data-href="instagram" target="_blank" rel="noopener">인스타그램</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="block" style="padding-top:0">
    <div class="wrap">
      <div class="cta reveal">
        <h2>오늘 들러 주세요</h2>
        <p style="opacity:.85;margin-bottom:26px" data-f="tagline"></p>
        <div class="btns">
          <a class="btn ghost" data-href="tel">📞 전화하기</a>
          <a class="btn ghost" data-href="reserve">예약·문의하기</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <p><strong data-f="name"></strong> · <span data-f="address"></span> · <span data-f="phone"></span></p>
  <p style="margin-top:6px">© <span id="yr"></span> <span data-f="name"></span></p>
</footer>

<nav class="dock">
  <a data-href="tel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>전화</a>
  <a data-href="naverMap" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>길찾기</a>
  <a data-href="reserve"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>예약</a>
</nav>

<script>
(function(){
  const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // 색상·제목
  document.documentElement.style.setProperty('--brand', SITE.color);
  document.title = SITE.name + ' | ' + SITE.category;
  if (SITE.preview) $('#previewBar').hidden = false;

  // 텍스트 채우기
  $$('[data-f]').forEach(el => { el.textContent = SITE[el.dataset.f] ?? ''; });

  // 링크 연결
  const q = encodeURIComponent(SITE.name + ' ' + SITE.address);
  const tel = 'tel:' + SITE.phone.replace(/[^0-9+]/g, '');
  const L = {
    tel,
    reserve: SITE.links.reserve || SITE.links.kakao || tel,
    naverMap: SITE.links.naverMap + q,
    kakaoMap: SITE.links.kakaoMap + q,
    instagram: SITE.links.instagram
  };
  $$('[data-href]').forEach(a => {
    const url = L[a.dataset.href];
    if (url) a.href = url; else a.style.display = 'none';
  });

  // 메뉴·리뷰·영업시간
  $('#menu').innerHTML = SITE.menu.map(m => `
    <article class="card reveal tilt"><div class="top"><h3>${esc(m.name)}</h3><span class="price">${esc(m.price)}</span></div><p>${esc(m.desc)}</p></article>`).join('');
  $('#reviews').innerHTML = SITE.reviews.map(r => `
    <blockquote class="review reveal"><div class="stars">★★★★★</div><p>${esc(r.text)}</p><span>— ${esc(r.who)}</span></blockquote>`).join('');
  $('#hours').innerHTML = SITE.hours.map(h => `<li><span>${esc(h[0])}</span><strong>${esc(h[1])}</strong></li>`).join('');
  $('#yr').textContent = new Date().getFullYear();

  // 스크롤 등장 애니메이션
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15 });
  $$('.reveal').forEach((el, i) => { el.style.transitionDelay = (i % 3) * 90 + 'ms'; io.observe(el); });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  // 3D 시차 효과 (마우스 / 휴대폰 기울기)
  const scene = $('#scene');
  const tiltScene = (x, y) => { scene.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg)`; };
  addEventListener('pointermove', e => tiltScene(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));
  addEventListener('deviceorientation', e => { if (e.gamma != null) tiltScene(e.gamma / 60, (e.beta - 45) / 60); });
  addEventListener('scroll', () => { scene.style.translate = `0 ${scrollY * .35}px`; }, { passive: true });

  // 카드 3D 기울기
  $$('.tilt').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.transform = `perspective(700px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateZ(8px)`;
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  });

  // 반짝이는 입자 배경
  const c = $('#stars'), ctx = c.getContext('2d');
  let W, H, pts;
  const resize = () => {
    W = c.width = c.offsetWidth * devicePixelRatio; H = c.height = c.offsetHeight * devicePixelRatio;
    pts = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 1 + .2, v: Math.random() * .4 + .1 }));
  };
  resize(); addEventListener('resize', resize);
  (function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = SITE.color;
    for (const p of pts) {
      p.y -= p.v * p.z * devicePixelRatio; if (p.y < 0) { p.y = H; p.x = Math.random() * W; }
      ctx.globalAlpha = .15 + p.z * .35;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.z * 2.4 * devicePixelRatio, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
</html>
