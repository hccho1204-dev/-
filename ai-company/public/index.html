<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 회사 관리실</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🏢</span><b id="companyName">AI 회사</b><span id="modeBadge" class="badge"></span></div>
  <div class="top-right"><span id="liveDot" class="dot"></span><span class="sub">실시간</span></div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on">👑 CEO 홈</button>
  <button data-tab="messenger">💬 메신저</button>
  <button data-tab="queue">📋 작업 큐</button>
  <button data-tab="strategy">♟️ 전략 검토</button>
  <button data-tab="publish">🚀 발행 큐</button>
  <button data-tab="memory">🧠 회사 기억</button>
  <button data-tab="standards">✅ 완료 기준</button>
  <button data-tab="social">🔗 소셜·설정</button>
</nav>
<main id="view"></main>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><b id="modalTitle"></b><button data-action="close-modal" class="ghost">닫기 ✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
